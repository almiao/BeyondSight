<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>见仙 · 山门·第二剑</title><style>body{background:#171a20;color:#e9e5db;font:17px/1.8 system-ui,sans-serif;margin:0}main{max-width:800px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;color:#b6aea1;font-size:14px}h1{font-size:30px}h2{font-size:23px;margin:16px 0}.setting{color:#b6aea1}.visual{color:#d7cebb;background:#242932;border-left:3px solid #b79c6d;padding:14px;margin:18px 0;white-space:pre-wrap}.line{margin:12px 0}.speaker{color:#e5bf83;font-weight:bold}button{font:inherit;color:#e9e5db;background:#323a46;border:1px solid #697484;border-radius:8px;padding:10px 15px;cursor:pointer;margin:6px 0;text-align:left}button:hover{background:#414c5c}button:disabled{opacity:.45;cursor:default}.options button{display:block;width:100%}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}small{color:#b6aea1}dt{color:#e5bf83;margin-top:12px}dd{margin-left:0}#progress{font-size:13px;color:#b6aea1}</style><main><header><span>见仙 · 文字样片</span><span id="progress"></span></header><h1 id="title"></h1><div id="body"></div><div class="options" id="options"></div><nav><button id="back">上一段</button><button id="restart">重新开始</button></nav><small>独立非正典文字原型 · 无视频生成 · 手动推进</small></main><script>const story={"format":"beyondsight.text-story","version":1,"id":"mountain.m01_m03","title":"山门·第二剑","status":"draft_text_prototype","start":"m01.name","acts":[{"id":1,"title":"山门之下"},{"id":2,"title":"断桥与开目"},{"id":3,"title":"第二剑"}],"nodes":[{"id":"m01.name","type":"scene","act":1,"title":"跪下，这堂课就是你的","setting":"重明宗山下，开山礼清晨。","beats":[{"visual":"特写：两枚灵石砸在一张写着陆寻姓名的候补牌上。值事将牌翻面，改写严承。陆寻攥着五十六工分的旧牌，周野一步挡住柜台。窗外仙剑划破云海。","dialogue":[{"speaker":"周野","text":"他排了三个月，你凭什么换人？"},{"speaker":"严承","text":"两块灵石。你俩干一个月也就这么多。"},{"speaker":"陆寻","text":"我没说卖。"},{"speaker":"严承","text":"跪下求我，我就带你进去旁听。"}],"seconds":22},{"visual":"陆寻看向柜台后的教习席位，又看向周野。周野鞋底开裂，却从怀里掏出一张器坊学徒见习申请。他也在等一个名额。陆寻拿回原候补凭条，不跪。值事催他们去云阶坪搬货，额外四工分。","dialogue":[{"speaker":"陆寻","text":"走。总有一天，我从正门进去。"},{"speaker":"周野","text":"到时候别忘带我。"}],"seconds":17},{"visual":"两人扛箱走过外门月例柜台：十二块灵石装入一只袋中。护具摊上普通护臂标价五石，陆寻的工分连三石都不足。堂内教习演示基础引气，陆寻边走边默念，却听不到第三息的后半句。","dialogue":[],"seconds":13}],"next":"m01.fire"},{"id":"m01.fire","type":"scene","act":1,"title":"七峰的火，照到山下","setting":"云阶坪开山礼。","beats":[{"visual":"七座浮空铜环逐一被赤焰点燃。秦晚红衣立于高台，抬手间火焰化作长虹。最后一道火环正要亮起，外围角兽冲破低阶兽栏，货道上的工役被困。严承退往高台石阶，陆寻看见一个年老工役被倒车堵住。","dialogue":[],"seconds":20},{"visual":"秦晚骤然收火，最后一环熄灭，赤焰化作隔开妖兽的细长火幕。陆寻与周野将载货板架过隔栏，以固定绳轮拉开堵门货车。老工役爬出来，陆寻掌背擦伤。巡守随后接管兽栏，秦晚收火落地。","dialogue":[{"speaker":"秦晚","text":"下面的人，走侧闸！"},{"speaker":"陆寻","text":"周野，压住板！"}],"seconds":25},{"visual":"秦晚从高台径直走到满身泥水的陆寻面前。严承抢着向巡守说自己指挥工役撤离。秦晚把他的手拨开，看向老工役；老人指向陆寻和周野。她撕下一截干净布带递给陆寻。","dialogue":[{"speaker":"秦晚","text":"你指挥的？我刚才怎么只看见你往上跑？"},{"speaker":"严承","text":"师姐，我也是为了……"},{"speaker":"秦晚","text":"别挡着。"},{"speaker":"秦晚","text":"你叫什么？"},{"speaker":"陆寻","text":"陆寻。"}],"seconds":24},{"visual":"负责开山礼的教习确认两名杂役救援贡献，各给二十工分；另有一张可由二人共同决定受领者的预备训练推荐。陆寻亮出旧凭条，教习确认原候补席尚未交割，但须陆寻本人到堂核验，今日午钟前截止。周野的器坊见习招募同一时刻截止，须有人陪他携旧工图参加现场测验；原推荐可以用于他的见习。周野把申请纸塞回去。","dialogue":[{"speaker":"周野","text":"你去拿你的课。我的事不急。"},{"speaker":"秦晚","text":"我可以替你们证明救援，但两边的教习都要见本人。你们得决定。"}],"seconds":25}],"next":"m01.choice"},{"id":"m01.choice","type":"choice","act":1,"prompt":"原候补席今日必须本人核验；周野的器坊见习也在午钟截止。两人只有一张救援推荐，周野把选择留给你。","choices":[{"id":"claim","text":"先夺回属于我的席位，推荐留给自己。","next":"m01.claim"},{"id":"brother","text":"把推荐交给周野，陪他去器坊。","next":"m01.brother"}]},{"id":"m01.claim","type":"scene","act":1,"title":"从正门进去","setting":"公开课堂，午钟前。","beats":[{"visual":"陆寻带着旧凭条与救援登记来到教习席前。严承正坐在第一排，发现秦晚作为救援见证也在门外。负责名额的教习核对候补记录，撤销未交割的违规替换。严承被请出座位。","dialogue":[{"speaker":"严承","text":"你拿救援功劳来压我？"},{"speaker":"陆寻","text":"不是。救人的功劳我另领。这张牌，本来就是我的。"}],"seconds":23},{"visual":"陆寻坐上第一排，终于看见教习完整演示第三息；救援推荐用于随后三次预备训练。他回头望向门外，秦晚冲他点了一下头。周野错过本期器坊见习，却没有怨言，晚间把自己留存的二十工分用作下期准备。","dialogue":[{"speaker":"秦晚","text":"陆寻，不是别人赏你的。"},{"speaker":"周野","text":"记牢了，回来教我。"}],"seconds":22},{"visual":"短蒙太奇：陆寻反复练习引气与简单卸力，第三息仍不稳定；账牌从五十六经加运四分、奖励二十变成八十。护臂仍买不起。他在下一张采药告示前停住：完成可得四十工分。","dialogue":[],"seconds":15}],"next":"m02.bridge.claim"},{"id":"m01.brother","type":"scene","act":1,"title":"今天我陪你进去","setting":"铸星峰外场，午钟前。","beats":[{"visual":"陆寻把推荐递给周野，二人抬着旧工图冲进器坊。见习教习拿出一套坏掉的牵引器，要求申请者说明它为何卡死。周野用多年工役经验指出磨损处，亲手换下经许可更换的低阶部件；牵引器恢复运转。","dialogue":[{"speaker":"周野","text":"你真不要那堂课了？"},{"speaker":"陆寻","text":"你不也等了三个月？快去。"}],"seconds":25},{"visual":"铜铃响。周野成为本期器坊见习生，尚非正式外门；他拿到一张可参加公开工具训练的牌。陆寻的旧候补席因未按时核验而错过，本期不补发。秦晚在器坊门口等着二人，她知道陆寻放弃了机会。","dialogue":[{"speaker":"秦晚","text":"你俩还真有意思。"},{"speaker":"周野","text":"师姐，我以后给你打最好的法器！"},{"speaker":"秦晚","text":"行。先把手上这件做完。"}],"seconds":20},{"visual":"秦晚邀请陆寻在公开火术练习坪观看一次普通基础引气示范，不越权授秘法；陆寻靠已有半课与公开示范练成基础引气，仍未掌握系统卸力，第三息不稳定。周野借出救援二十工分，陆寻凑足一百买护臂，欠款记账。采药告示出现。","dialogue":[{"speaker":"秦晚","text":"下次你想学什么，先开口。别总隔着门听。"},{"speaker":"陆寻","text":"好。"}],"seconds":20}],"next":"m02.bridge.brother"},{"id":"m02.bridge.claim","type":"scene","act":2,"title":"这桥只够一个人过","setting":"数日后，青崖谷开放采区与封苑外围运输岔道。","beats":[{"visual":"青崖谷外围告示：普通赤纹芝任务两人四十工分，严承临时领队。相邻高处另有镇山堂封物转运道，普通工役不得进入；一辆有巡守护送的封物车沿高处栈道通过。两条路之间有岩壁和废弃牵引架，开场全景明确位置。陆寻、周野只在采区。","dialogue":[],"seconds":18},{"visual":"严承从三人共同发现的岩缝割走赤纹芝，把药篓塞进自己的袋中。岩猞循异常气味冲来。严承先过绳桥，回头看见陆寻与周野还在谷内，故意割索。","dialogue":[{"speaker":"周野","text":"三个人找到的！"},{"speaker":"严承","text":"四十工分就值得你们这么计较？"},{"speaker":"陆寻","text":"严承！"},{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊。"}],"seconds":24},{"visual":"周野把陆寻拽离断口，自己肩背撞岩，右手被碎石压住。陆寻用此前练过的卸力避开岩猞爪势，将周野拖到石凹；前臂擦伤。","dialogue":[],"seconds":20},{"visual":"高处转运道突然响起警钟，封物车所在的石台受陌生外力冲击，车身翻倒，内封外壳破损。巡守迎敌，碎石沿已有岩沟落入低处采区；一枚带瞳纹的内芯随碎石滚到陆寻近旁。兽道被震落的隔栏堵住，但残余低阶牵引阵开始反复震动。严承已经离开，不能被误认为袭击者。","dialogue":[],"seconds":20},{"visual":"陆寻试拉固定绳轮，残阵回力使支架再度下沉，周野被困在岩凹出口；他拾起随阵纹闪烁的内芯，以为是转运车上的测阵器，送入极少自身灵力试探。封物脱离供能后短暂可迁移，原感知结构沿主动接触一次性转入陆寻，内芯失活。陆寻眼前一黑。","dialogue":[],"seconds":23},{"visual":"再睁眼：两层灵力在石壁间流动。表层熄灭时，深层尚在回冲。陆寻第一次试拉便看到支架震颤，立刻停手。远处冷白剑光封住岩猞兽道，裴照雪率巡守抵达上方完整栈道。她看不清遮挡后的局部回力，只能先封兽。陆寻发现自己可以准确指出短暂退力窗口；另一边还有此前可见的备用牵引架，能绕开主支架，但要放掉挂在架上的原任务记录袋。","dialogue":[{"speaker":"裴照雪","text":"下面谁还活着？"},{"speaker":"陆寻","text":"两个人！"},{"speaker":"裴照雪","text":"别乱动，我找路。"}],"seconds":25}],"next":"m02.choice.claim"},{"id":"m02.choice.claim","type":"choice","act":2,"prompt":"裴照雪能从上方协助，但你必须让她知道自己看见了阵力间隔；也可以保守秘密，借备用牵引架撤离，不过原任务记录袋会掉进谷底。两种办法都需要真实救援协作。","choices":[{"id":"tell","text":"告诉裴照雪我看见了什么，请她按间隔协助。","next":"m02.tell.claim"},{"id":"hide","text":"暂不透露异常视野，走备用牵引架撤离。","next":"m02.hide.claim"}]},{"id":"m02.tell.claim","type":"scene","act":2,"title":"我信你这一息","setting":"青崖谷石凹与上方栈道。","beats":[{"visual":"陆寻大声说出两层回力的时序。裴照雪先以一枚普通测阵石验证表层退力，发现陆寻所说的深层余震与实际支架震动相符。她选择信任这名杂役，按他的口令用剑气切断已扭曲的低阶牵引销；巡守拉绳，陆寻垫住支架。","dialogue":[{"speaker":"陆寻","text":"表面灭了，里面还在走！等我喊。"},{"speaker":"裴照雪","text":"好。"},{"speaker":"陆寻","text":"现在！"}],"seconds":26},{"visual":"支架抬起，周野被救出；巡守同时取回尚在近旁的原任务记录袋，袋中有原分工和严承领队签名，不能自动证明放符。下一轮回力使原支架撞向空岩凹。裴照雪望向陆寻，第一次认真端详他的眼睛。","dialogue":[{"speaker":"裴照雪","text":"你到底看见了什么？"},{"speaker":"陆寻","text":"两层。我自己也不知道为什么。"},{"speaker":"裴照雪","text":"先治伤。我会如实记下来，不在这里声张。"}],"seconds":24},{"visual":"正式医修接管。巡守收集失活内芯，登记陆寻触碰碎片及眼痛；裴照雪将异常视觉写入限制查阅的补充记录。苏禾守住真实伤情，不签严承带来的擅离认责单。","dialogue":[{"speaker":"严承","text":"他们不是都活着回来了吗？"},{"speaker":"苏禾","text":"他的手以后能不能拿稳炼器锤，你替他担吗？"},{"speaker":"陆寻","text":"严承，这笔账还没完。"}],"seconds":25},{"visual":"数周后，医修确认周野可恢复日常活动，但右手经脉伤影响精细控灵；普通治疗可改善日常功能，难以恢复原有精细操作。苏禾指出养脉玉髓可以针对这种损伤进行专业修复，但极稀缺。陆寻看到百草峰公开同境试剑悬赏：首位得一份养脉玉髓及三十块灵石，只有经基础考核确认的炼气修士可报名，不限学籍。严承已被停领队、限制危险差事，本场不参赛。","dialogue":[{"speaker":"周野","text":"别把钱全花我身上。你先修。"},{"speaker":"苏禾","text":"他还能做很多事，但这只手的事，不能当没发生。"}],"seconds":24}],"next":"m03.train.claim.tell"},{"id":"m03.train.claim.tell","type":"scene","act":3,"title":"别人一剑，我为什么不能有第二剑","setting":"数周内，公开低阶练习坪。","beats":[{"visual":"陆寻经医修许可恢复训练，报名同境悬赏。他并非刚开目就会剑术；先在基础考核中用公开引气法完成规定动作，获准参赛。秦晚作为公开练习坪值勤火修，见他重复练一式基础引气剑，主动停下。","dialogue":[{"speaker":"秦晚","text":"你这剑，一天练多少次？"},{"speaker":"陆寻","text":"练到它不再漏掉第三息。"}],"seconds":20},{"visual":"秦晚以自己已经掌握的低阶火线做演示：第一道火焰消散前，第二道力已接上，火线不断。灵目主观画面中，陆寻看见她实际运行的先后关系，并与自己剑式的散力对照。他不复制火术，而尝试让同一基础剑式的两次引气衔接。连续数次失败，剑身震颤，他停下恢复。","dialogue":[{"speaker":"秦晚","text":"别硬学我的火。你的剑是你的剑。"},{"speaker":"陆寻","text":"我想试试，第一剑没散完，第二剑能不能接上。"}],"seconds":28},{"visual":"陆寻用完整公开课中的卸力和引气练习建立基础，秦晚只纠正危险姿势。","dialogue":[{"speaker":"周野","text":"我这只手不行，脑子又没坏。"},{"speaker":"陆寻","text":"那你看着。"}],"seconds":20},{"visual":"数周短蒙太奇：一次、十次、石靶上浅痕逐渐连成一道深痕。最后陆寻闭眼，不借灵目，第一次稳定打出前后两道相连的低阶剑势。秦晚抬手以规定低阶火幕试接，第二道剑势穿过第一道火幕边缘，击中后方试靶。她愣了一下，随后笑出声。","dialogue":[{"speaker":"秦晚","text":"再来。刚才那一下，我没看够。"}],"seconds":24},{"visual":"裴照雪依先前受限记录复核陆寻的异常所见与实际练成的术式；她确认这是独立修成的低阶剑式，而非凭眼操纵高阶法。她不替他作弊，提醒公开出手将引来关注。","dialogue":[],"seconds":13}],"next":"m03.duel.claim.tell"},{"id":"m03.duel.claim.tell","type":"scene","act":3,"title":"让他们看见第二剑","setting":"百草峰旁公开试剑台，悬赏终轮。","beats":[{"visual":"木案上放着一枚透出淡青光的养脉玉髓和三十块下品灵石。苏禾作为医修学徒协助登记奖品用途：玉髓只够一次完整治疗或一次自身养脉，需正式医修施用；不能分成两份达到同样效果。周野在台下，右手仍不稳。终轮对手韩峥是同境外门弟子，家学剑术熟练；他并非严承，胜负有真实实力基础。","dialogue":[],"seconds":20},{"visual":"韩峥此前连续赢下其他同境修士。他看陆寻的杂役袍，将自己剑尖垂下。","dialogue":[{"speaker":"韩峥","text":"你想拿玉髓？先接得住我三剑。"},{"speaker":"陆寻","text":"我接。"},{"speaker":"秦晚","text":"陆寻，别看台下。看你的剑。"}],"seconds":16},{"visual":"第一轮，韩峥以熟练的连续剑势逼陆寻退到边线；陆寻以已经练熟的基础步法守住，不凭灵目现场复制。第二轮，陆寻试图衔接两道剑势，被韩峥提前截断，虎口震痛。韩峥认定他只有这一式，第三轮主动抢攻。","dialogue":[{"speaker":"韩峥","text":"就这一招？"}],"seconds":23},{"visual":"陆寻没有再盯对手的剑尖。他把第一道剑势留在原处，以已经练成的第二道引气从同一式中接续；韩峥挡住第一剑，第二道剑势沿其已偏开的防线击中护具判定区。铜铃响，裁判判胜。韩峥的剑停在半空。","dialogue":[],"seconds":22},{"visual":"全场安静片刻。原本看不起杂役的弟子转头询问教习；教习复核合规，宣布胜者陆寻。秦晚第一个站起来，朝他扬起手。周野用左手拍着栏杆。苏禾将封存玉髓交给正式医修，奖励归陆寻。","dialogue":[{"speaker":"教习","text":"胜者，陆寻。三十石，养脉玉髓一份。"},{"speaker":"韩峥","text":"你到底练了什么？"},{"speaker":"陆寻","text":"你刚才挡住的，是第一剑。"}],"seconds":20},{"visual":"严承从观众席外看见陆寻领走三十块灵石与玉髓，脸色阴沉。他的断桥责任仍在调查；任务记录袋已经回收，领队事实可独立核对。没有将其突然送进本场斗法。秦晚走下观礼台，替陆寻挡住追问的人群。","dialogue":[{"speaker":"秦晚","text":"以前你在下面搬箱子。"},{"speaker":"陆寻","text":"记得。"},{"speaker":"秦晚","text":"现在轮到他们问你叫什么了。"}],"seconds":17},{"visual":"济生院。正式医修说明：玉髓能修复周野精细控灵所需的受损经脉，也能用于陆寻自身养脉，提高其随后低阶修炼的稳定性；二者不能兼得。周野拒绝替陆寻决定，他可以继续普通康复，未来转向设计、材料与器坊记录，但精细器作道路会变窄。苏禾提醒这是珍贵机会，不要求陆寻必须让出。","dialogue":[{"speaker":"周野","text":"你自己赢来的，别一转身又给我。"},{"speaker":"苏禾","text":"你们两个都不许替对方做决定。"},{"speaker":"陆寻","text":"我想清楚了。"}],"seconds":24}],"next":"m03.choice.claim.tell"},{"id":"m03.choice.claim.tell","type":"choice","act":3,"prompt":"玉髓仅够一次完整养脉。周野不需要它才能活下去，但精细炼器道路会受影响；陆寻使用则能巩固自己刚取得的剑术优势。","choices":[{"id":"self","text":"留下玉髓，巩固自己的修炼道路。","next":"m03.self.claim.tell"},{"id":"share","text":"请医修用玉髓治疗周野的手。","next":"m03.share.claim.tell"}]},{"id":"m03.self.claim.tell","type":"scene","act":3,"title":"这一剑我要自己走","setting":"济生院与练习坪，随后数周。","beats":[{"visual":"陆寻向周野说明决定。周野点头，主动拿出自己已画好的器坊设计图。他没有被抛弃或自动痊愈：普通康复继续，精细器作受限，他选择把重心转向设计与材料鉴别。正式医修为陆寻施用玉髓。","dialogue":[{"speaker":"陆寻","text":"我想先把这条剑路走稳。"},{"speaker":"周野","text":"好。我的路我自己找。"},{"speaker":"陆寻","text":"咱俩还是一起走。"}],"seconds":25},{"visual":"数周后，陆寻在获准恢复训练时闭眼连续施展两道剑势，过去第三轮便失稳，此时能稳定完成更多轮；不跳境界。秦晚站在试靶旁，以自己限定低阶火术验证，主动邀他共同研究下一式。周野用左手递来改良剑柄草图。","dialogue":[{"speaker":"秦晚","text":"下次别一个人练。我要看看第三剑。"},{"speaker":"周野","text":"先试试我这个柄。"}],"seconds":25},{"visual":"陆寻领到的三十石归本人；从中支付本次已核定药散二石、购买新护臂五石。无需偿还护臂借款，余二十三石。周野原有二十工分与下期器坊准备保留。未验收青崖四十工分不发。苏禾给陆寻正式药费凭据，并收起自己的医修培养申请。","dialogue":[{"speaker":"苏禾","text":"这回你不欠药钱了。"},{"speaker":"陆寻","text":"你那张申请，也别再压在药单底下。"}],"seconds":18},{"visual":"镜头切至镇山堂封物复核室。失活内芯置于检测盘，原记录写明高处封物车遭袭，内芯已收回却失去原结构。裴照雪的受限记录与接触者登记被并列，尚未确认古仙神通。一名负责复核的长老停在陆寻姓名前。","dialogue":[{"speaker":"长老","text":"东西回来了。"},{"speaker":"长老","text":"里面的东西，去了哪里？"}],"seconds":15}],"next":"end.claim.tell.self"},{"id":"end.claim.tell.self","type":"end","title":"剑路初成·有证","summary":"前三幕阶段结局，陆寻已凭灵目辅助练成独立剑式并赢得同境悬赏。M04–M06尚未完成，不冒充全剧终局。","outcomes":{"immediate":"追回旧课席，周野错过本期见习。裴照雪知异常视野，原任务记录袋回收。陆寻赢得30石与一份玉髓。","short":"玉髓由陆寻使用，实际稳定剑势；周野普通康复并转向设计与材料。陆寻购护臂、付药散，余23石。","mid":"M04/M05须继承实际师友经历、伤势、玉髓归属、剑式、裴照雪的受限记录与原任务袋。周野未获本期见习。","long":"M06未写；必须明确两人修炼道路、三女主关系、严承责任与遗目追查的最终阶段结果。"}},{"id":"m03.share.claim.tell","type":"scene","act":3,"title":"这次，我要你亲手拿起锤子","setting":"济生院与练习坪，随后数周。","beats":[{"visual":"陆寻将玉髓交给正式医修，请他先治疗周野。周野沉默许久，要求陆寻留下三十石的主要收益供自己修炼，不把全部资源让出。医修确认玉髓适配后施治；陆寻永久失去这份自身养脉机会。","dialogue":[{"speaker":"陆寻","text":"我已经赢了一次。你也该有一次。"},{"speaker":"周野","text":"你别后悔。"},{"speaker":"陆寻","text":"那就别让我白给。"}],"seconds":25},{"visual":"数周后，周野在医修批准下第一次用恢复的右手稳住一枚轻型炼器零件，细小灵力线不再剧烈颤动。他没有立即成为器修，继续训练；陆寻仍靠原本练成的两道剑势，不享受玉髓自身收益。秦晚看见兄弟二人，主动提出下一次共同练习。","dialogue":[{"speaker":"周野","text":"陆寻，你看。"},{"speaker":"陆寻","text":"稳住了。"},{"speaker":"周野","text":"以后你的剑，我来打。"},{"speaker":"秦晚","text":"那我可要排在他前面试。"}],"seconds":25},{"visual":"陆寻领到的三十石归本人；从中支付本次已核定药散二石、购买新护臂五石。无需偿还护臂借款，余二十三石。周野原有二十工分与下期器坊准备保留。未验收青崖四十工分不发。苏禾给陆寻正式药费凭据，并收起自己的医修培养申请。","dialogue":[{"speaker":"苏禾","text":"这回你不欠药钱了。"},{"speaker":"陆寻","text":"你那张申请，也别再压在药单底下。"}],"seconds":18},{"visual":"镜头切至镇山堂封物复核室。失活内芯置于检测盘，原记录写明高处封物车遭袭，内芯已收回却失去原结构。裴照雪的受限记录与接触者登记被并列，尚未确认古仙神通。一名负责复核的长老停在陆寻姓名前。","dialogue":[{"speaker":"长老","text":"东西回来了。"},{"speaker":"长老","text":"里面的东西，去了哪里？"}],"seconds":15}],"next":"end.claim.tell.share"},{"id":"end.claim.tell.share","type":"end","title":"兄弟同心·有证","summary":"前三幕阶段结局，陆寻已凭灵目辅助练成独立剑式并赢得同境悬赏。M04–M06尚未完成，不冒充全剧终局。","outcomes":{"immediate":"追回旧课席，周野错过本期见习。裴照雪知异常视野，原任务记录袋回收。陆寻赢得30石与一份玉髓。","short":"玉髓由周野使用，精细控灵开始恢复；陆寻永久失去自身养脉收益。陆寻购护臂、付药散，余23石。","mid":"M04/M05须继承实际师友经历、伤势、玉髓归属、剑式、裴照雪的受限记录与原任务袋。周野未获本期见习。","long":"M06未写；必须明确两人修炼道路、三女主关系、严承责任与遗目追查的最终阶段结果。"}},{"id":"m02.hide.claim","type":"scene","act":2,"title":"我先把你带回去","setting":"青崖谷石凹与上方栈道。","beats":[{"visual":"陆寻不再碰受回力的主支架，沿备用牵引架已有的安全方向引出绳索，请周野用尚能活动的左手指认卡扣。陆寻利用课上学的卸力稳定身体。巡守从上方接应。旧记录袋随卸下的悬挂架坠谷，二人不得为取回它重新冒险。","dialogue":[{"speaker":"周野","text":"记录袋还在上面……"},{"speaker":"陆寻","text":"命比纸贵。走！"}],"seconds":26},{"visual":"备用绳轮将周野送上安全岩台，原记录袋消失在谷底。原支架随后被回力撞碎。裴照雪确认两人活着，未看到陆寻异常视觉；她只知道二人熟悉工役器械。","dialogue":[{"speaker":"周野","text":"咱俩活着。"},{"speaker":"陆寻","text":"嗯。这次换我拉你。"}],"seconds":24},{"visual":"正式医修接管。巡守收集失活内芯，登记陆寻触碰碎片及眼痛；陆寻只主动报告接触、伤情及备用牵引救援经过；无正式专项询问时未主动描述异常视野。苏禾守住真实伤情，不签严承带来的擅离认责单。","dialogue":[{"speaker":"严承","text":"他们不是都活着回来了吗？"},{"speaker":"苏禾","text":"他的手以后能不能拿稳炼器锤，你替他担吗？"},{"speaker":"陆寻","text":"严承，这笔账还没完。"}],"seconds":25},{"visual":"数周后，医修确认周野可恢复日常活动，但右手经脉伤影响精细控灵；普通治疗可改善日常功能，难以恢复原有精细操作。苏禾指出养脉玉髓可以针对这种损伤进行专业修复，但极稀缺。陆寻看到百草峰公开同境试剑悬赏：首位得一份养脉玉髓及三十块灵石，只有经基础考核确认的炼气修士可报名，不限学籍。严承已被停领队、限制危险差事，本场不参赛。","dialogue":[{"speaker":"周野","text":"别把钱全花我身上。你先修。"},{"speaker":"苏禾","text":"他还能做很多事，但这只手的事，不能当没发生。"}],"seconds":24}],"next":"m03.train.claim.hide"},{"id":"m03.train.claim.hide","type":"scene","act":3,"title":"别人一剑，我为什么不能有第二剑","setting":"数周内，公开低阶练习坪。","beats":[{"visual":"陆寻经医修许可恢复训练，报名同境悬赏。他并非刚开目就会剑术；先在基础考核中用公开引气法完成规定动作，获准参赛。秦晚作为公开练习坪值勤火修，见他重复练一式基础引气剑，主动停下。","dialogue":[{"speaker":"秦晚","text":"你这剑，一天练多少次？"},{"speaker":"陆寻","text":"练到它不再漏掉第三息。"}],"seconds":20},{"visual":"秦晚以自己已经掌握的低阶火线做演示：第一道火焰消散前，第二道力已接上，火线不断。灵目主观画面中，陆寻看见她实际运行的先后关系，并与自己剑式的散力对照。他不复制火术，而尝试让同一基础剑式的两次引气衔接。连续数次失败，剑身震颤，他停下恢复。","dialogue":[{"speaker":"秦晚","text":"别硬学我的火。你的剑是你的剑。"},{"speaker":"陆寻","text":"我想试试，第一剑没散完，第二剑能不能接上。"}],"seconds":28},{"visual":"陆寻用完整公开课中的卸力和引气练习建立基础，秦晚只纠正危险姿势。","dialogue":[{"speaker":"周野","text":"我这只手不行，脑子又没坏。"},{"speaker":"陆寻","text":"那你看着。"}],"seconds":20},{"visual":"数周短蒙太奇：一次、十次、石靶上浅痕逐渐连成一道深痕。最后陆寻闭眼，不借灵目，第一次稳定打出前后两道相连的低阶剑势。秦晚抬手以规定低阶火幕试接，第二道剑势穿过第一道火幕边缘，击中后方试靶。她愣了一下，随后笑出声。","dialogue":[{"speaker":"秦晚","text":"再来。刚才那一下，我没看够。"}],"seconds":24},{"visual":"陆寻没有将异常视觉告诉裴照雪；秦晚只见他反复练成两道剑势，未获灵目秘密。他报名时只登记实际掌握的低阶剑式。","dialogue":[],"seconds":13}],"next":"m03.duel.claim.hide"},{"id":"m03.duel.claim.hide","type":"scene","act":3,"title":"让他们看见第二剑","setting":"百草峰旁公开试剑台，悬赏终轮。","beats":[{"visual":"木案上放着一枚透出淡青光的养脉玉髓和三十块下品灵石。苏禾作为医修学徒协助登记奖品用途：玉髓只够一次完整治疗或一次自身养脉，需正式医修施用；不能分成两份达到同样效果。周野在台下，右手仍不稳。终轮对手韩峥是同境外门弟子，家学剑术熟练；他并非严承，胜负有真实实力基础。","dialogue":[],"seconds":20},{"visual":"韩峥此前连续赢下其他同境修士。他看陆寻的杂役袍，将自己剑尖垂下。","dialogue":[{"speaker":"韩峥","text":"你想拿玉髓？先接得住我三剑。"},{"speaker":"陆寻","text":"我接。"},{"speaker":"秦晚","text":"陆寻，别看台下。看你的剑。"}],"seconds":16},{"visual":"第一轮，韩峥以熟练的连续剑势逼陆寻退到边线；陆寻以已经练熟的基础步法守住，不凭灵目现场复制。第二轮，陆寻试图衔接两道剑势，被韩峥提前截断，虎口震痛。韩峥认定他只有这一式，第三轮主动抢攻。","dialogue":[{"speaker":"韩峥","text":"就这一招？"}],"seconds":23},{"visual":"陆寻没有再盯对手的剑尖。他把第一道剑势留在原处，以已经练成的第二道引气从同一式中接续；韩峥挡住第一剑，第二道剑势沿其已偏开的防线击中护具判定区。铜铃响，裁判判胜。韩峥的剑停在半空。","dialogue":[],"seconds":22},{"visual":"全场安静片刻。原本看不起杂役的弟子转头询问教习；教习复核合规，宣布胜者陆寻。秦晚第一个站起来，朝他扬起手。周野用左手拍着栏杆。苏禾将封存玉髓交给正式医修，奖励归陆寻。","dialogue":[{"speaker":"教习","text":"胜者，陆寻。三十石，养脉玉髓一份。"},{"speaker":"韩峥","text":"你到底练了什么？"},{"speaker":"陆寻","text":"你刚才挡住的，是第一剑。"}],"seconds":20},{"visual":"严承从观众席外看见陆寻领走三十块灵石与玉髓，脸色阴沉。他的断桥责任仍在调查；任务记录袋遗失，领队事实仍有原登记与证词，但细节证据更少。没有将其突然送进本场斗法。秦晚走下观礼台，替陆寻挡住追问的人群。","dialogue":[{"speaker":"秦晚","text":"以前你在下面搬箱子。"},{"speaker":"陆寻","text":"记得。"},{"speaker":"秦晚","text":"现在轮到他们问你叫什么了。"}],"seconds":17},{"visual":"济生院。正式医修说明：玉髓能修复周野精细控灵所需的受损经脉，也能用于陆寻自身养脉，提高其随后低阶修炼的稳定性；二者不能兼得。周野拒绝替陆寻决定，他可以继续普通康复，未来转向设计、材料与器坊记录，但精细器作道路会变窄。苏禾提醒这是珍贵机会，不要求陆寻必须让出。","dialogue":[{"speaker":"周野","text":"你自己赢来的，别一转身又给我。"},{"speaker":"苏禾","text":"你们两个都不许替对方做决定。"},{"speaker":"陆寻","text":"我想清楚了。"}],"seconds":24}],"next":"m03.choice.claim.hide"},{"id":"m03.choice.claim.hide","type":"choice","act":3,"prompt":"玉髓仅够一次完整养脉。周野不需要它才能活下去，但精细炼器道路会受影响；陆寻使用则能巩固自己刚取得的剑术优势。","choices":[{"id":"self","text":"留下玉髓，巩固自己的修炼道路。","next":"m03.self.claim.hide"},{"id":"share","text":"请医修用玉髓治疗周野的手。","next":"m03.share.claim.hide"}]},{"id":"m03.self.claim.hide","type":"scene","act":3,"title":"这一剑我要自己走","setting":"济生院与练习坪，随后数周。","beats":[{"visual":"陆寻向周野说明决定。周野点头，主动拿出自己已画好的器坊设计图。他没有被抛弃或自动痊愈：普通康复继续，精细器作受限，他选择把重心转向设计与材料鉴别。正式医修为陆寻施用玉髓。","dialogue":[{"speaker":"陆寻","text":"我想先把这条剑路走稳。"},{"speaker":"周野","text":"好。我的路我自己找。"},{"speaker":"陆寻","text":"咱俩还是一起走。"}],"seconds":25},{"visual":"数周后，陆寻在获准恢复训练时闭眼连续施展两道剑势，过去第三轮便失稳，此时能稳定完成更多轮；不跳境界。秦晚站在试靶旁，以自己限定低阶火术验证，主动邀他共同研究下一式。周野用左手递来改良剑柄草图。","dialogue":[{"speaker":"秦晚","text":"下次别一个人练。我要看看第三剑。"},{"speaker":"周野","text":"先试试我这个柄。"}],"seconds":25},{"visual":"陆寻领到的三十石归本人；从中支付本次已核定药散二石、购买新护臂五石。无需偿还护臂借款，余二十三石。周野原有二十工分与下期器坊准备保留。未验收青崖四十工分不发。苏禾给陆寻正式药费凭据，并收起自己的医修培养申请。","dialogue":[{"speaker":"苏禾","text":"这回你不欠药钱了。"},{"speaker":"陆寻","text":"你那张申请，也别再压在药单底下。"}],"seconds":18},{"visual":"镜头切至镇山堂封物复核室。失活内芯置于检测盘，原记录写明高处封物车遭袭，内芯已收回却失去原结构。接触者登记与公开试剑结果被并列，尚无异常视野的直接报告。一名负责复核的长老停在陆寻姓名前。","dialogue":[{"speaker":"长老","text":"东西回来了。"},{"speaker":"长老","text":"里面的东西，去了哪里？"}],"seconds":15}],"next":"end.claim.hide.self"},{"id":"end.claim.hide.self","type":"end","title":"剑路初成·藏目","summary":"前三幕阶段结局，陆寻已凭灵目辅助练成独立剑式并赢得同境悬赏。M04–M06尚未完成，不冒充全剧终局。","outcomes":{"immediate":"追回旧课席，周野错过本期见习。异常视野未告知裴，记录袋遗失。陆寻赢得30石与一份玉髓。","short":"玉髓由陆寻使用，实际稳定剑势；周野普通康复并转向设计与材料。陆寻购护臂、付药散，余23石。","mid":"M04/M05须继承实际师友经历、伤势、玉髓归属、剑式、无共同秘密及原任务袋遗失。周野未获本期见习。","long":"M06未写；必须明确两人修炼道路、三女主关系、严承责任与遗目追查的最终阶段结果。"}},{"id":"m03.share.claim.hide","type":"scene","act":3,"title":"这次，我要你亲手拿起锤子","setting":"济生院与练习坪，随后数周。","beats":[{"visual":"陆寻将玉髓交给正式医修，请他先治疗周野。周野沉默许久，要求陆寻留下三十石的主要收益供自己修炼，不把全部资源让出。医修确认玉髓适配后施治；陆寻永久失去这份自身养脉机会。","dialogue":[{"speaker":"陆寻","text":"我已经赢了一次。你也该有一次。"},{"speaker":"周野","text":"你别后悔。"},{"speaker":"陆寻","text":"那就别让我白给。"}],"seconds":25},{"visual":"数周后，周野在医修批准下第一次用恢复的右手稳住一枚轻型炼器零件，细小灵力线不再剧烈颤动。他没有立即成为器修，继续训练；陆寻仍靠原本练成的两道剑势，不享受玉髓自身收益。秦晚看见兄弟二人，主动提出下一次共同练习。","dialogue":[{"speaker":"周野","text":"陆寻，你看。"},{"speaker":"陆寻","text":"稳住了。"},{"speaker":"周野","text":"以后你的剑，我来打。"},{"speaker":"秦晚","text":"那我可要排在他前面试。"}],"seconds":25},{"visual":"陆寻领到的三十石归本人；从中支付本次已核定药散二石、购买新护臂五石。无需偿还护臂借款，余二十三石。周野原有二十工分与下期器坊准备保留。未验收青崖四十工分不发。苏禾给陆寻正式药费凭据，并收起自己的医修培养申请。","dialogue":[{"speaker":"苏禾","text":"这回你不欠药钱了。"},{"speaker":"陆寻","text":"你那张申请，也别再压在药单底下。"}],"seconds":18},{"visual":"镜头切至镇山堂封物复核室。失活内芯置于检测盘，原记录写明高处封物车遭袭，内芯已收回却失去原结构。接触者登记与公开试剑结果被并列，尚无异常视野的直接报告。一名负责复核的长老停在陆寻姓名前。","dialogue":[{"speaker":"长老","text":"东西回来了。"},{"speaker":"长老","text":"里面的东西，去了哪里？"}],"seconds":15}],"next":"end.claim.hide.share"},{"id":"end.claim.hide.share","type":"end","title":"兄弟同心·藏目","summary":"前三幕阶段结局，陆寻已凭灵目辅助练成独立剑式并赢得同境悬赏。M04–M06尚未完成，不冒充全剧终局。","outcomes":{"immediate":"追回旧课席，周野错过本期见习。异常视野未告知裴，记录袋遗失。陆寻赢得30石与一份玉髓。","short":"玉髓由周野使用，精细控灵开始恢复；陆寻永久失去自身养脉收益。陆寻购护臂、付药散，余23石。","mid":"M04/M05须继承实际师友经历、伤势、玉髓归属、剑式、无共同秘密及原任务袋遗失。周野未获本期见习。","long":"M06未写；必须明确两人修炼道路、三女主关系、严承责任与遗目追查的最终阶段结果。"}},{"id":"m02.bridge.brother","type":"scene","act":2,"title":"这桥只够一个人过","setting":"数日后，青崖谷开放采区与封苑外围运输岔道。","beats":[{"visual":"青崖谷外围告示：普通赤纹芝任务两人四十工分，严承临时领队。相邻高处另有镇山堂封物转运道，普通工役不得进入；一辆有巡守护送的封物车沿高处栈道通过。两条路之间有岩壁和废弃牵引架，开场全景明确位置。陆寻、周野只在采区。","dialogue":[],"seconds":18},{"visual":"严承从三人共同发现的岩缝割走赤纹芝，把药篓塞进自己的袋中。岩猞循异常气味冲来。严承先过绳桥，回头看见陆寻与周野还在谷内，故意割索。","dialogue":[{"speaker":"周野","text":"三个人找到的！"},{"speaker":"严承","text":"四十工分就值得你们这么计较？"},{"speaker":"陆寻","text":"严承！"},{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊。"}],"seconds":24},{"visual":"周野利用器坊见习学到的牵引架用法，先把陆寻拽离断口，自己肩背撞岩、右手被压伤；陆寻用新护臂挡住掠过的兽爪，护臂裂开，将周野拖入石凹。","dialogue":[],"seconds":20},{"visual":"高处转运道突然响起警钟，封物车所在的石台受陌生外力冲击，车身翻倒，内封外壳破损。巡守迎敌，碎石沿已有岩沟落入低处采区；一枚带瞳纹的内芯随碎石滚到陆寻近旁。兽道被震落的隔栏堵住，但残余低阶牵引阵开始反复震动。严承已经离开，不能被误认为袭击者。","dialogue":[],"seconds":20},{"visual":"陆寻试拉固定绳轮，残阵回力使支架再度下沉，周野被困在岩凹出口；他拾起随阵纹闪烁的内芯，以为是转运车上的测阵器，送入极少自身灵力试探。封物脱离供能后短暂可迁移，原感知结构沿主动接触一次性转入陆寻，内芯失活。陆寻眼前一黑。","dialogue":[],"seconds":23},{"visual":"再睁眼：两层灵力在石壁间流动。表层熄灭时，深层尚在回冲。陆寻第一次试拉便看到支架震颤，立刻停手。远处冷白剑光封住岩猞兽道，裴照雪率巡守抵达上方完整栈道。她看不清遮挡后的局部回力，只能先封兽。陆寻发现自己可以准确指出短暂退力窗口；另一边还有此前可见的备用牵引架，能绕开主支架，但要放掉挂在架上的原任务记录袋。","dialogue":[{"speaker":"裴照雪","text":"下面谁还活着？"},{"speaker":"陆寻","text":"两个人！"},{"speaker":"裴照雪","text":"别乱动，我找路。"}],"seconds":25}],"next":"m02.choice.brother"},{"id":"m02.choice.brother","type":"choice","act":2,"prompt":"裴照雪能从上方协助，但你必须让她知道自己看见了阵力间隔；也可以保守秘密，借备用牵引架撤离，不过原任务记录袋会掉进谷底。两种办法都需要真实救援协作。","choices":[{"id":"tell","text":"告诉裴照雪我看见了什么，请她按间隔协助。","next":"m02.tell.brother"},{"id":"hide","text":"暂不透露异常视野，走备用牵引架撤离。","next":"m02.hide.brother"}]},{"id":"m02.tell.brother","type":"scene","act":2,"title":"我信你这一息","setting":"青崖谷石凹与上方栈道。","beats":[{"visual":"陆寻大声说出两层回力的时序。裴照雪先以一枚普通测阵石验证表层退力，发现陆寻所说的深层余震与实际支架震动相符。她选择信任这名杂役，按他的口令用剑气切断已扭曲的低阶牵引销；巡守拉绳，陆寻垫住支架。","dialogue":[{"speaker":"陆寻","text":"表面灭了，里面还在走！等我喊。"},{"speaker":"裴照雪","text":"好。"},{"speaker":"陆寻","text":"现在！"}],"seconds":26},{"visual":"支架抬起，周野被救出；巡守同时取回尚在近旁的原任务记录袋，袋中有原分工和严承领队签名，不能自动证明放符。下一轮回力使原支架撞向空岩凹。裴照雪望向陆寻，第一次认真端详他的眼睛。","dialogue":[{"speaker":"裴照雪","text":"你到底看见了什么？"},{"speaker":"陆寻","text":"两层。我自己也不知道为什么。"},{"speaker":"裴照雪","text":"先治伤。我会如实记下来，不在这里声张。"}],"seconds":24},{"visual":"正式医修接管。巡守收集失活内芯，登记陆寻触碰碎片及眼痛；裴照雪将异常视觉写入限制查阅的补充记录。苏禾守住真实伤情，不签严承带来的擅离认责单。","dialogue":[{"speaker":"严承","text":"他们不是都活着回来了吗？"},{"speaker":"苏禾","text":"他的手以后能不能拿稳炼器锤，你替他担吗？"},{"speaker":"陆寻","text":"严承，这笔账还没完。"}],"seconds":25},{"visual":"数周后，医修确认周野可恢复日常活动，但右手经脉伤影响精细控灵；普通治疗可改善日常功能，难以恢复原有精细操作。苏禾指出养脉玉髓可以针对这种损伤进行专业修复，但极稀缺。陆寻看到百草峰公开同境试剑悬赏：首位得一份养脉玉髓及三十块灵石，只有经基础考核确认的炼气修士可报名，不限学籍。严承已被停领队、限制危险差事，本场不参赛。","dialogue":[{"speaker":"周野","text":"别把钱全花我身上。你先修。"},{"speaker":"苏禾","text":"他还能做很多事，但这只手的事，不能当没发生。"}],"seconds":24}],"next":"m03.train.brother.tell"},{"id":"m03.train.brother.tell","type":"scene","act":3,"title":"别人一剑，我为什么不能有第二剑","setting":"数周内，公开低阶练习坪。","beats":[{"visual":"陆寻经医修许可恢复训练，报名同境悬赏。他并非刚开目就会剑术；先在基础考核中用公开引气法完成规定动作，获准参赛。秦晚作为公开练习坪值勤火修，见他重复练一式基础引气剑，主动停下。","dialogue":[{"speaker":"秦晚","text":"你这剑，一天练多少次？"},{"speaker":"陆寻","text":"练到它不再漏掉第三息。"}],"seconds":20},{"visual":"秦晚以自己已经掌握的低阶火线做演示：第一道火焰消散前，第二道力已接上，火线不断。灵目主观画面中，陆寻看见她实际运行的先后关系，并与自己剑式的散力对照。他不复制火术，而尝试让同一基础剑式的两次引气衔接。连续数次失败，剑身震颤，他停下恢复。","dialogue":[{"speaker":"秦晚","text":"别硬学我的火。你的剑是你的剑。"},{"speaker":"陆寻","text":"我想试试，第一剑没散完，第二剑能不能接上。"}],"seconds":28},{"visual":"周野用左手画出器坊见习中学到的受力方向，秦晚帮助陆寻在公开练习中核对低阶动作；陆寻补练自己的不足。","dialogue":[{"speaker":"周野","text":"我这只手不行，脑子又没坏。"},{"speaker":"陆寻","text":"那你看着。"}],"seconds":20},{"visual":"数周短蒙太奇：一次、十次、石靶上浅痕逐渐连成一道深痕。最后陆寻闭眼，不借灵目，第一次稳定打出前后两道相连的低阶剑势。秦晚抬手以规定低阶火幕试接，第二道剑势穿过第一道火幕边缘，击中后方试靶。她愣了一下，随后笑出声。","dialogue":[{"speaker":"秦晚","text":"再来。刚才那一下，我没看够。"}],"seconds":24},{"visual":"裴照雪依先前受限记录复核陆寻的异常所见与实际练成的术式；她确认这是独立修成的低阶剑式，而非凭眼操纵高阶法。她不替他作弊，提醒公开出手将引来关注。","dialogue":[],"seconds":13}],"next":"m03.duel.brother.tell"},{"id":"m03.duel.brother.tell","type":"scene","act":3,"title":"让他们看见第二剑","setting":"百草峰旁公开试剑台，悬赏终轮。","beats":[{"visual":"木案上放着一枚透出淡青光的养脉玉髓和三十块下品灵石。苏禾作为医修学徒协助登记奖品用途：玉髓只够一次完整治疗或一次自身养脉，需正式医修施用；不能分成两份达到同样效果。周野在台下，右手仍不稳。终轮对手韩峥是同境外门弟子，家学剑术熟练；他并非严承，胜负有真实实力基础。","dialogue":[],"seconds":20},{"visual":"韩峥此前连续赢下其他同境修士。他看陆寻的杂役袍，将自己剑尖垂下。","dialogue":[{"speaker":"韩峥","text":"你想拿玉髓？先接得住我三剑。"},{"speaker":"陆寻","text":"我接。"},{"speaker":"秦晚","text":"陆寻，别看台下。看你的剑。"}],"seconds":16},{"visual":"第一轮，韩峥以熟练的连续剑势逼陆寻退到边线；陆寻以已经练熟的基础步法守住，不凭灵目现场复制。第二轮，陆寻试图衔接两道剑势，被韩峥提前截断，虎口震痛。韩峥认定他只有这一式，第三轮主动抢攻。","dialogue":[{"speaker":"韩峥","text":"就这一招？"}],"seconds":23},{"visual":"陆寻没有再盯对手的剑尖。他把第一道剑势留在原处，以已经练成的第二道引气从同一式中接续；韩峥挡住第一剑，第二道剑势沿其已偏开的防线击中护具判定区。铜铃响，裁判判胜。韩峥的剑停在半空。","dialogue":[],"seconds":22},{"visual":"全场安静片刻。原本看不起杂役的弟子转头询问教习；教习复核合规，宣布胜者陆寻。秦晚第一个站起来，朝他扬起手。周野用左手拍着栏杆。苏禾将封存玉髓交给正式医修，奖励归陆寻。","dialogue":[{"speaker":"教习","text":"胜者，陆寻。三十石，养脉玉髓一份。"},{"speaker":"韩峥","text":"你到底练了什么？"},{"speaker":"陆寻","text":"你刚才挡住的，是第一剑。"}],"seconds":20},{"visual":"严承从观众席外看见陆寻领走三十块灵石与玉髓，脸色阴沉。他的断桥责任仍在调查；任务记录袋已经回收，领队事实可独立核对。没有将其突然送进本场斗法。秦晚走下观礼台，替陆寻挡住追问的人群。","dialogue":[{"speaker":"秦晚","text":"以前你在下面搬箱子。"},{"speaker":"陆寻","text":"记得。"},{"speaker":"秦晚","text":"现在轮到他们问你叫什么了。"}],"seconds":17},{"visual":"济生院。正式医修说明：玉髓能修复周野精细控灵所需的受损经脉，也能用于陆寻自身养脉，提高其随后低阶修炼的稳定性；二者不能兼得。周野拒绝替陆寻决定，他可以继续普通康复，未来转向设计、材料与器坊记录，但精细器作道路会变窄。苏禾提醒这是珍贵机会，不要求陆寻必须让出。","dialogue":[{"speaker":"周野","text":"你自己赢来的，别一转身又给我。"},{"speaker":"苏禾","text":"你们两个都不许替对方做决定。"},{"speaker":"陆寻","text":"我想清楚了。"}],"seconds":24}],"next":"m03.choice.brother.tell"},{"id":"m03.choice.brother.tell","type":"choice","act":3,"prompt":"玉髓仅够一次完整养脉。周野不需要它才能活下去，但精细炼器道路会受影响；陆寻使用则能巩固自己刚取得的剑术优势。","choices":[{"id":"self","text":"留下玉髓，巩固自己的修炼道路。","next":"m03.self.brother.tell"},{"id":"share","text":"请医修用玉髓治疗周野的手。","next":"m03.share.brother.tell"}]},{"id":"m03.self.brother.tell","type":"scene","act":3,"title":"这一剑我要自己走","setting":"济生院与练习坪，随后数周。","beats":[{"visual":"陆寻向周野说明决定。周野点头，主动拿出自己已画好的器坊设计图。他没有被抛弃或自动痊愈：普通康复继续，精细器作受限，他选择把重心转向设计与材料鉴别。正式医修为陆寻施用玉髓。","dialogue":[{"speaker":"陆寻","text":"我想先把这条剑路走稳。"},{"speaker":"周野","text":"好。我的路我自己找。"},{"speaker":"陆寻","text":"咱俩还是一起走。"}],"seconds":25},{"visual":"数周后，陆寻在获准恢复训练时闭眼连续施展两道剑势，过去第三轮便失稳，此时能稳定完成更多轮；不跳境界。秦晚站在试靶旁，以自己限定低阶火术验证，主动邀他共同研究下一式。周野用左手递来改良剑柄草图。","dialogue":[{"speaker":"秦晚","text":"下次别一个人练。我要看看第三剑。"},{"speaker":"周野","text":"先试试我这个柄。"}],"seconds":25},{"visual":"陆寻领到的三十石归本人；从中支付本次已核定药散二石、购买新护臂五石。另偿还周野一石旧借款，余二十二石；周野保留本期见习身份及还款。未验收青崖四十工分不发。苏禾给陆寻正式药费凭据，并收起自己的医修培养申请。","dialogue":[{"speaker":"苏禾","text":"这回你不欠药钱了。"},{"speaker":"陆寻","text":"你那张申请，也别再压在药单底下。"}],"seconds":18},{"visual":"镜头切至镇山堂封物复核室。失活内芯置于检测盘，原记录写明高处封物车遭袭，内芯已收回却失去原结构。裴照雪的受限记录与接触者登记被并列，尚未确认古仙神通。一名负责复核的长老停在陆寻姓名前。","dialogue":[{"speaker":"长老","text":"东西回来了。"},{"speaker":"长老","text":"里面的东西，去了哪里？"}],"seconds":15}],"next":"end.brother.tell.self"},{"id":"end.brother.tell.self","type":"end","title":"剑路初成·有证","summary":"前三幕阶段结局，陆寻已凭灵目辅助练成独立剑式并赢得同境悬赏。M04–M06尚未完成，不冒充全剧终局。","outcomes":{"immediate":"周野取得器坊见习，陆寻错过旧课席。裴照雪知异常视野，原任务记录袋回收。陆寻赢得30石与一份玉髓。","short":"玉髓由陆寻使用，实际稳定剑势；周野普通康复并转向设计与材料。陆寻购护臂、付药散，还1石欠款后余22石。","mid":"M04/M05须继承实际师友经历、伤势、玉髓归属、剑式、裴照雪的受限记录与原任务袋。周野已有本期见习。","long":"M06未写；必须明确两人修炼道路、三女主关系、严承责任与遗目追查的最终阶段结果。"}},{"id":"m03.share.brother.tell","type":"scene","act":3,"title":"这次，我要你亲手拿起锤子","setting":"济生院与练习坪，随后数周。","beats":[{"visual":"陆寻将玉髓交给正式医修，请他先治疗周野。周野沉默许久，要求陆寻留下三十石的主要收益供自己修炼，不把全部资源让出。医修确认玉髓适配后施治；陆寻永久失去这份自身养脉机会。","dialogue":[{"speaker":"陆寻","text":"我已经赢了一次。你也该有一次。"},{"speaker":"周野","text":"你别后悔。"},{"speaker":"陆寻","text":"那就别让我白给。"}],"seconds":25},{"visual":"数周后，周野在医修批准下第一次用恢复的右手稳住一枚轻型炼器零件，细小灵力线不再剧烈颤动。他没有立即成为器修，继续训练；陆寻仍靠原本练成的两道剑势，不享受玉髓自身收益。秦晚看见兄弟二人，主动提出下一次共同练习。","dialogue":[{"speaker":"周野","text":"陆寻，你看。"},{"speaker":"陆寻","text":"稳住了。"},{"speaker":"周野","text":"以后你的剑，我来打。"},{"speaker":"秦晚","text":"那我可要排在他前面试。"}],"seconds":25},{"visual":"陆寻领到的三十石归本人；从中支付本次已核定药散二石、购买新护臂五石。另偿还周野一石旧借款，余二十二石；周野保留本期见习身份及还款。未验收青崖四十工分不发。苏禾给陆寻正式药费凭据，并收起自己的医修培养申请。","dialogue":[{"speaker":"苏禾","text":"这回你不欠药钱了。"},{"speaker":"陆寻","text":"你那张申请，也别再压在药单底下。"}],"seconds":18},{"visual":"镜头切至镇山堂封物复核室。失活内芯置于检测盘，原记录写明高处封物车遭袭，内芯已收回却失去原结构。裴照雪的受限记录与接触者登记被并列，尚未确认古仙神通。一名负责复核的长老停在陆寻姓名前。","dialogue":[{"speaker":"长老","text":"东西回来了。"},{"speaker":"长老","text":"里面的东西，去了哪里？"}],"seconds":15}],"next":"end.brother.tell.share"},{"id":"end.brother.tell.share","type":"end","title":"兄弟同心·有证","summary":"前三幕阶段结局，陆寻已凭灵目辅助练成独立剑式并赢得同境悬赏。M04–M06尚未完成，不冒充全剧终局。","outcomes":{"immediate":"周野取得器坊见习，陆寻错过旧课席。裴照雪知异常视野，原任务记录袋回收。陆寻赢得30石与一份玉髓。","short":"玉髓由周野使用，精细控灵开始恢复；陆寻永久失去自身养脉收益。陆寻购护臂、付药散，还1石欠款后余22石。","mid":"M04/M05须继承实际师友经历、伤势、玉髓归属、剑式、裴照雪的受限记录与原任务袋。周野已有本期见习。","long":"M06未写；必须明确两人修炼道路、三女主关系、严承责任与遗目追查的最终阶段结果。"}},{"id":"m02.hide.brother","type":"scene","act":2,"title":"我先把你带回去","setting":"青崖谷石凹与上方栈道。","beats":[{"visual":"陆寻不再碰受回力的主支架，沿备用牵引架已有的安全方向引出绳索，请周野用尚能活动的左手指认卡扣。周野的器坊见习让他能明确辨出卡扣，陆寻按他说的位置稳住牵引架。巡守从上方接应。旧记录袋随卸下的悬挂架坠谷，二人不得为取回它重新冒险。","dialogue":[{"speaker":"周野","text":"记录袋还在上面……"},{"speaker":"陆寻","text":"命比纸贵。走！"}],"seconds":26},{"visual":"备用绳轮将周野送上安全岩台，原记录袋消失在谷底。原支架随后被回力撞碎。裴照雪确认两人活着，未看到陆寻异常视觉；她只知道二人熟悉工役器械。","dialogue":[{"speaker":"周野","text":"咱俩活着。"},{"speaker":"陆寻","text":"嗯。这次换我拉你。"}],"seconds":24},{"visual":"正式医修接管。巡守收集失活内芯，登记陆寻触碰碎片及眼痛；陆寻只主动报告接触、伤情及备用牵引救援经过；无正式专项询问时未主动描述异常视野。苏禾守住真实伤情，不签严承带来的擅离认责单。","dialogue":[{"speaker":"严承","text":"他们不是都活着回来了吗？"},{"speaker":"苏禾","text":"他的手以后能不能拿稳炼器锤，你替他担吗？"},{"speaker":"陆寻","text":"严承，这笔账还没完。"}],"seconds":25},{"visual":"数周后，医修确认周野可恢复日常活动，但右手经脉伤影响精细控灵；普通治疗可改善日常功能，难以恢复原有精细操作。苏禾指出养脉玉髓可以针对这种损伤进行专业修复，但极稀缺。陆寻看到百草峰公开同境试剑悬赏：首位得一份养脉玉髓及三十块灵石，只有经基础考核确认的炼气修士可报名，不限学籍。严承已被停领队、限制危险差事，本场不参赛。","dialogue":[{"speaker":"周野","text":"别把钱全花我身上。你先修。"},{"speaker":"苏禾","text":"他还能做很多事，但这只手的事，不能当没发生。"}],"seconds":24}],"next":"m03.train.brother.hide"},{"id":"m03.train.brother.hide","type":"scene","act":3,"title":"别人一剑，我为什么不能有第二剑","setting":"数周内，公开低阶练习坪。","beats":[{"visual":"陆寻经医修许可恢复训练，报名同境悬赏。他并非刚开目就会剑术；先在基础考核中用公开引气法完成规定动作，获准参赛。秦晚作为公开练习坪值勤火修，见他重复练一式基础引气剑，主动停下。","dialogue":[{"speaker":"秦晚","text":"你这剑，一天练多少次？"},{"speaker":"陆寻","text":"练到它不再漏掉第三息。"}],"seconds":20},{"visual":"秦晚以自己已经掌握的低阶火线做演示：第一道火焰消散前，第二道力已接上，火线不断。灵目主观画面中，陆寻看见她实际运行的先后关系，并与自己剑式的散力对照。他不复制火术，而尝试让同一基础剑式的两次引气衔接。连续数次失败，剑身震颤，他停下恢复。","dialogue":[{"speaker":"秦晚","text":"别硬学我的火。你的剑是你的剑。"},{"speaker":"陆寻","text":"我想试试，第一剑没散完，第二剑能不能接上。"}],"seconds":28},{"visual":"周野用左手画出器坊见习中学到的受力方向，秦晚帮助陆寻在公开练习中核对低阶动作；陆寻补练自己的不足。","dialogue":[{"speaker":"周野","text":"我这只手不行，脑子又没坏。"},{"speaker":"陆寻","text":"那你看着。"}],"seconds":20},{"visual":"数周短蒙太奇：一次、十次、石靶上浅痕逐渐连成一道深痕。最后陆寻闭眼，不借灵目，第一次稳定打出前后两道相连的低阶剑势。秦晚抬手以规定低阶火幕试接，第二道剑势穿过第一道火幕边缘，击中后方试靶。她愣了一下，随后笑出声。","dialogue":[{"speaker":"秦晚","text":"再来。刚才那一下，我没看够。"}],"seconds":24},{"visual":"陆寻没有将异常视觉告诉裴照雪；秦晚只见他反复练成两道剑势，未获灵目秘密。他报名时只登记实际掌握的低阶剑式。","dialogue":[],"seconds":13}],"next":"m03.duel.brother.hide"},{"id":"m03.duel.brother.hide","type":"scene","act":3,"title":"让他们看见第二剑","setting":"百草峰旁公开试剑台，悬赏终轮。","beats":[{"visual":"木案上放着一枚透出淡青光的养脉玉髓和三十块下品灵石。苏禾作为医修学徒协助登记奖品用途：玉髓只够一次完整治疗或一次自身养脉，需正式医修施用；不能分成两份达到同样效果。周野在台下，右手仍不稳。终轮对手韩峥是同境外门弟子，家学剑术熟练；他并非严承，胜负有真实实力基础。","dialogue":[],"seconds":20},{"visual":"韩峥此前连续赢下其他同境修士。他看陆寻的杂役袍，将自己剑尖垂下。","dialogue":[{"speaker":"韩峥","text":"你想拿玉髓？先接得住我三剑。"},{"speaker":"陆寻","text":"我接。"},{"speaker":"秦晚","text":"陆寻，别看台下。看你的剑。"}],"seconds":16},{"visual":"第一轮，韩峥以熟练的连续剑势逼陆寻退到边线；陆寻以已经练熟的基础步法守住，不凭灵目现场复制。第二轮，陆寻试图衔接两道剑势，被韩峥提前截断，虎口震痛。韩峥认定他只有这一式，第三轮主动抢攻。","dialogue":[{"speaker":"韩峥","text":"就这一招？"}],"seconds":23},{"visual":"陆寻没有再盯对手的剑尖。他把第一道剑势留在原处，以已经练成的第二道引气从同一式中接续；韩峥挡住第一剑，第二道剑势沿其已偏开的防线击中护具判定区。铜铃响，裁判判胜。韩峥的剑停在半空。","dialogue":[],"seconds":22},{"visual":"全场安静片刻。原本看不起杂役的弟子转头询问教习；教习复核合规，宣布胜者陆寻。秦晚第一个站起来，朝他扬起手。周野用左手拍着栏杆。苏禾将封存玉髓交给正式医修，奖励归陆寻。","dialogue":[{"speaker":"教习","text":"胜者，陆寻。三十石，养脉玉髓一份。"},{"speaker":"韩峥","text":"你到底练了什么？"},{"speaker":"陆寻","text":"你刚才挡住的，是第一剑。"}],"seconds":20},{"visual":"严承从观众席外看见陆寻领走三十块灵石与玉髓，脸色阴沉。他的断桥责任仍在调查；任务记录袋遗失，领队事实仍有原登记与证词，但细节证据更少。没有将其突然送进本场斗法。秦晚走下观礼台，替陆寻挡住追问的人群。","dialogue":[{"speaker":"秦晚","text":"以前你在下面搬箱子。"},{"speaker":"陆寻","text":"记得。"},{"speaker":"秦晚","text":"现在轮到他们问你叫什么了。"}],"seconds":17},{"visual":"济生院。正式医修说明：玉髓能修复周野精细控灵所需的受损经脉，也能用于陆寻自身养脉，提高其随后低阶修炼的稳定性；二者不能兼得。周野拒绝替陆寻决定，他可以继续普通康复，未来转向设计、材料与器坊记录，但精细器作道路会变窄。苏禾提醒这是珍贵机会，不要求陆寻必须让出。","dialogue":[{"speaker":"周野","text":"你自己赢来的，别一转身又给我。"},{"speaker":"苏禾","text":"你们两个都不许替对方做决定。"},{"speaker":"陆寻","text":"我想清楚了。"}],"seconds":24}],"next":"m03.choice.brother.hide"},{"id":"m03.choice.brother.hide","type":"choice","act":3,"prompt":"玉髓仅够一次完整养脉。周野不需要它才能活下去，但精细炼器道路会受影响；陆寻使用则能巩固自己刚取得的剑术优势。","choices":[{"id":"self","text":"留下玉髓，巩固自己的修炼道路。","next":"m03.self.brother.hide"},{"id":"share","text":"请医修用玉髓治疗周野的手。","next":"m03.share.brother.hide"}]},{"id":"m03.self.brother.hide","type":"scene","act":3,"title":"这一剑我要自己走","setting":"济生院与练习坪，随后数周。","beats":[{"visual":"陆寻向周野说明决定。周野点头，主动拿出自己已画好的器坊设计图。他没有被抛弃或自动痊愈：普通康复继续，精细器作受限，他选择把重心转向设计与材料鉴别。正式医修为陆寻施用玉髓。","dialogue":[{"speaker":"陆寻","text":"我想先把这条剑路走稳。"},{"speaker":"周野","text":"好。我的路我自己找。"},{"speaker":"陆寻","text":"咱俩还是一起走。"}],"seconds":25},{"visual":"数周后，陆寻在获准恢复训练时闭眼连续施展两道剑势，过去第三轮便失稳，此时能稳定完成更多轮；不跳境界。秦晚站在试靶旁，以自己限定低阶火术验证，主动邀他共同研究下一式。周野用左手递来改良剑柄草图。","dialogue":[{"speaker":"秦晚","text":"下次别一个人练。我要看看第三剑。"},{"speaker":"周野","text":"先试试我这个柄。"}],"seconds":25},{"visual":"陆寻领到的三十石归本人；从中支付本次已核定药散二石、购买新护臂五石。另偿还周野一石旧借款，余二十二石；周野保留本期见习身份及还款。未验收青崖四十工分不发。苏禾给陆寻正式药费凭据，并收起自己的医修培养申请。","dialogue":[{"speaker":"苏禾","text":"这回你不欠药钱了。"},{"speaker":"陆寻","text":"你那张申请，也别再压在药单底下。"}],"seconds":18},{"visual":"镜头切至镇山堂封物复核室。失活内芯置于检测盘，原记录写明高处封物车遭袭，内芯已收回却失去原结构。接触者登记与公开试剑结果被并列，尚无异常视野的直接报告。一名负责复核的长老停在陆寻姓名前。","dialogue":[{"speaker":"长老","text":"东西回来了。"},{"speaker":"长老","text":"里面的东西，去了哪里？"}],"seconds":15}],"next":"end.brother.hide.self"},{"id":"end.brother.hide.self","type":"end","title":"剑路初成·藏目","summary":"前三幕阶段结局，陆寻已凭灵目辅助练成独立剑式并赢得同境悬赏。M04–M06尚未完成，不冒充全剧终局。","outcomes":{"immediate":"周野取得器坊见习，陆寻错过旧课席。异常视野未告知裴，记录袋遗失。陆寻赢得30石与一份玉髓。","short":"玉髓由陆寻使用，实际稳定剑势；周野普通康复并转向设计与材料。陆寻购护臂、付药散，还1石欠款后余22石。","mid":"M04/M05须继承实际师友经历、伤势、玉髓归属、剑式、无共同秘密及原任务袋遗失。周野已有本期见习。","long":"M06未写；必须明确两人修炼道路、三女主关系、严承责任与遗目追查的最终阶段结果。"}},{"id":"m03.share.brother.hide","type":"scene","act":3,"title":"这次，我要你亲手拿起锤子","setting":"济生院与练习坪，随后数周。","beats":[{"visual":"陆寻将玉髓交给正式医修，请他先治疗周野。周野沉默许久，要求陆寻留下三十石的主要收益供自己修炼，不把全部资源让出。医修确认玉髓适配后施治；陆寻永久失去这份自身养脉机会。","dialogue":[{"speaker":"陆寻","text":"我已经赢了一次。你也该有一次。"},{"speaker":"周野","text":"你别后悔。"},{"speaker":"陆寻","text":"那就别让我白给。"}],"seconds":25},{"visual":"数周后，周野在医修批准下第一次用恢复的右手稳住一枚轻型炼器零件，细小灵力线不再剧烈颤动。他没有立即成为器修，继续训练；陆寻仍靠原本练成的两道剑势，不享受玉髓自身收益。秦晚看见兄弟二人，主动提出下一次共同练习。","dialogue":[{"speaker":"周野","text":"陆寻，你看。"},{"speaker":"陆寻","text":"稳住了。"},{"speaker":"周野","text":"以后你的剑，我来打。"},{"speaker":"秦晚","text":"那我可要排在他前面试。"}],"seconds":25},{"visual":"陆寻领到的三十石归本人；从中支付本次已核定药散二石、购买新护臂五石。另偿还周野一石旧借款，余二十二石；周野保留本期见习身份及还款。未验收青崖四十工分不发。苏禾给陆寻正式药费凭据，并收起自己的医修培养申请。","dialogue":[{"speaker":"苏禾","text":"这回你不欠药钱了。"},{"speaker":"陆寻","text":"你那张申请，也别再压在药单底下。"}],"seconds":18},{"visual":"镜头切至镇山堂封物复核室。失活内芯置于检测盘，原记录写明高处封物车遭袭，内芯已收回却失去原结构。接触者登记与公开试剑结果被并列，尚无异常视野的直接报告。一名负责复核的长老停在陆寻姓名前。","dialogue":[{"speaker":"长老","text":"东西回来了。"},{"speaker":"长老","text":"里面的东西，去了哪里？"}],"seconds":15}],"next":"end.brother.hide.share"},{"id":"end.brother.hide.share","type":"end","title":"兄弟同心·藏目","summary":"前三幕阶段结局，陆寻已凭灵目辅助练成独立剑式并赢得同境悬赏。M04–M06尚未完成，不冒充全剧终局。","outcomes":{"immediate":"周野取得器坊见习，陆寻错过旧课席。异常视野未告知裴，记录袋遗失。陆寻赢得30石与一份玉髓。","short":"玉髓由周野使用，精细控灵开始恢复；陆寻永久失去自身养脉收益。陆寻购护臂、付药散，还1石欠款后余22石。","mid":"M04/M05须继承实际师友经历、伤势、玉髓归属、剑式、无共同秘密及原任务袋遗失。周野已有本期见习。","long":"M06未写；必须明确两人修炼道路、三女主关系、严承责任与遗目追查的最终阶段结果。"}}]};const nodes=Object.fromEntries(story.nodes.map(n=>[n.id,n]));let id=story.start,beat=0,trail=[],seen=new Set();const el=x=>document.getElementById(x);function add(parent,tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;parent.append(n);return n}function advance(next,nextBeat=0){trail.push({id,beat});id=next;beat=nextBeat;render()}function btn(text,fn){const n=add(el("options"),"button",text);n.onclick=fn;return n}function render(){const n=nodes[id],body=el("body");body.replaceChildren();el("options").replaceChildren();el("progress").textContent="已发现阶段结果 "+seen.size+"/"+story.nodes.filter(n=>n.type==="end").length;el("back").disabled=trail.length===0;el("title").textContent=n.type==="end"?n.title:"第"+n.act+"幕 · "+story.acts.find(a=>a.id===n.act).title;if(n.type==="scene"){add(body,"h2",n.title);add(body,"div",n.setting,"setting");const b=n.beats[beat];add(body,"div",b.visual,"visual");for(const d of b.dialogue){const line=add(body,"div","","line");add(line,"span",d.speaker+"：","speaker");add(line,"span",d.text)}add(body,"small","场内段落 "+(beat+1)+"/"+n.beats.length);btn("继续",()=>beat+1<n.beats.length?advance(id,beat+1):advance(n.next));}else if(n.type==="choice"){add(body,"h2","你的决定");add(body,"p",n.prompt);for(const x of n.choices)btn(x.text,()=>advance(x.next))}else{seen.add(id);el("progress").textContent="已发现阶段结果 "+seen.size+"/"+story.nodes.filter(n=>n.type==="end").length;add(body,"p",n.summary);const dl=add(body,"dl","");for(const [k,t] of [["immediate","当下"],["short","短期"],["mid","后续回收"],["long","全剧终局（未完成）"]]){add(dl,"dt",t);add(dl,"dd",n.outcomes[k])}btn("从头体验另一条路线",reset)}}function reset(){id=story.start;beat=0;trail=[];render()}el("restart").onclick=reset;el("back").onclick=()=>{if(trail.length){const p=trail.pop();id=p.id;beat=p.beat;render()}};render();</script></html>
