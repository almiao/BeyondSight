<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>见仙 · 山门·灰纹与第二剑</title><style>body{background:#171a20;color:#e9e5db;font:17px/1.8 system-ui,sans-serif;margin:0}main{max-width:800px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;color:#b6aea1;font-size:14px}h1{font-size:30px}h2{font-size:23px;margin:16px 0}.setting{color:#b6aea1}.visual{color:#d7cebb;background:#242932;border-left:3px solid #b79c6d;padding:14px;margin:18px 0;white-space:pre-wrap}.line{margin:12px 0}.speaker{color:#e5bf83;font-weight:bold}button{font:inherit;color:#e9e5db;background:#323a46;border:1px solid #697484;border-radius:8px;padding:10px 15px;cursor:pointer;margin:6px 0;text-align:left}button:hover{background:#414c5c}button:disabled{opacity:.45;cursor:default}.options button{display:block;width:100%}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}small{color:#b6aea1}dt{color:#e5bf83;margin-top:12px}dd{margin-left:0}#progress{font-size:13px;color:#b6aea1}</style><main><header><span>见仙 · 文字样片</span><span id="progress"></span></header><h1 id="title"></h1><div id="body"></div><div class="options" id="options"></div><nav><button id="back">上一段</button><button id="restart">重新开始</button></nav><small>独立非正典文字原型 · 无视频生成 · 手动推进</small></main><script>const story={"format":"beyondsight.text-story","version":1,"id":"mountain.m01_m03","title":"山门·灰纹与第二剑","status":"draft_text_prototype","start":"m01.gate","acts":[{"id":1,"title":"山门之下"},{"id":2,"title":"断桥与开目"},{"id":3,"title":"第二剑"}],"nodes":[{"id":"m01.gate","type":"scene","act":1,"title":"一块灵石","setting":"重明宗山脚，清晨。","beats":[{"visual":"一只木箱从肩头滑落。陆寻急忙用膝盖顶住箱底，破袖下的手臂渗出血。严承站在石阶上，脚边摆着一副刚买来的五石护臂。远处御剑弟子穿过云海，山门在晨光中高悬。","dialogue":[],"seconds":12},{"visual":"周野跑来接住箱子。值事取出一张原本写着陆寻、周野姓名的轻役牌，交给严承；原来轻役今日能在开山礼前旁听一堂吐纳课，重役却必须整天搬货。严承的父亲替器坊供货，值事私下将两人的轻役位置换给他和同伴。","dialogue":[{"speaker":"周野","text":"这轻役是昨天抽签抽中的，你凭什么换？"},{"speaker":"值事","text":"严家今日送来一批灵材，要人照应。你们两个去搬货。"},{"speaker":"严承","text":"一堂课罢了。你们连护臂都买不起，还想学什么仙法？"},{"speaker":"陆寻","text":"把我们的牌还回来。"},{"speaker":"值事","text":"再不去，今日工钱也没有。"}],"seconds":27},{"visual":"陆寻看着自己仅有的五十六工分，低头把箱子扛稳。周野愤愤跟上。经过月例柜，一名外门弟子领十二石；杂役月例折四十工分，即两石。护臂标价五石，陆寻停了一瞬。","dialogue":[{"speaker":"周野","text":"杂役一个月才两块灵石。人家换副护臂，咱们两个半月的月例都得搭进去。"},{"speaker":"陆寻","text":"先活着进外门。"},{"speaker":"周野","text":"你进外门，我进铸星峰。以后你的剑，我给你打。"}],"seconds":22},{"visual":"货车抵达云阶坪下层。苏禾正在百草峰摊位协助医师准备开山礼的药箱。她认出两人，拿出一小条药布，熟练缠住陆寻旧伤。周野看见她袖里夹着医修培养申请，笑问何时当上医师。 货箱交齐后，值事按加运清单在陆寻和周野的工分牌各记四分；陆寻现有六十。","dialogue":[{"speaker":"苏禾","text":"你们从小就这样，一个惹事，一个替他瞒。"},{"speaker":"陆寻","text":"今天没惹事。"},{"speaker":"苏禾","text":"那你手上是什么？"},{"speaker":"周野","text":"等你成了医修，我们看病便宜点。"},{"speaker":"苏禾","text":"想得美，先把自己练好。"}],"seconds":25}],"next":"m01.fire"},{"id":"m01.fire","type":"scene","act":1,"title":"七环少了一环","setting":"七峰开山礼，云阶坪。","beats":[{"visual":"七座铜环悬在云海上。红衣秦晚立于高台，指尖燃起赤焰，六道火环次第点亮。第七道火即将出手，下层临时兽栏中的角兽突然撞向门闩，颈侧一道细小灰纹一闪而灭。货车翻倒，老工役困在侧闸。","dialogue":[],"seconds":20},{"visual":"秦晚骤然收火。第七环熄灭，原本冲向铜环的火焰压成细长火幕，将角兽逼离货道。陆寻认出绳轮可移开货车，周野把卸货板架成逃生坡。两人拉出老人；秦晚与赶来的巡守制住角兽。","dialogue":[{"speaker":"秦晚","text":"下面的人，走侧闸！"},{"speaker":"陆寻","text":"周野，板子！"}],"seconds":24},{"visual":"秦晚落下高台，先确认伤者都出来。严承从安全台阶挤过来，试图说自己指挥了救援。老工役指向陆寻和周野。秦晚看一眼严承干净的靴子，又看两人的泥手。","dialogue":[{"speaker":"严承","text":"师姐，是我叫他们开闸的。"},{"speaker":"秦晚","text":"是吗？你连闸在什么地方都没看一眼。"},{"speaker":"秦晚","text":"你们叫什么？"},{"speaker":"陆寻","text":"陆寻。他叫周野。"},{"speaker":"秦晚","text":"好，记住了。"}],"seconds":23},{"visual":"秦晚让巡守将两人救援赏各二十工分当场登记。巡守检查角兽颈侧，取出一片灰色符屑。负责兽栏的老工役想起昨夜有一名自称严家送货人的陌生修士带来数张灰纹驱兽符，声称能安抚角兽；他用过一张，反使角兽躁动。其余符随严家货物离开。巡守将此事和符屑登记。镇山堂的青崖地图上，驯养外场与一座旧封阵相邻；封阵用于隔离宗门多年前在谷底发现的来历不明古物，尚未安全拆解，不能随意搬走。近日守阵人也报告异常回响。","dialogue":[{"speaker":"老工役","text":"他说是驱兽符，我一用，角兽就开始撞栏。"},{"speaker":"巡守","text":"兽栏和封阵同一日出事？青崖内谷先封起来。"},{"speaker":"秦晚","text":"外谷也检查一遍再放人。"}],"seconds":24},{"visual":"山腰差事牌前，秦晚指给陆寻看两种合法工作：随她和巡守在外谷入口核对兽栏，或随采药工队进入已划定的安全采区。两路报酬均为每人二十工分；巡守先行检查后才允许进入。周野说自己熟悉搬运与药材路线，两人都能做。陆寻已有八十工分，完成任一路即可买护臂。","dialogue":[{"speaker":"秦晚","text":"你们熟悉货道。如果愿意来帮忙，我缺两个知道怎么开闸的人。"},{"speaker":"周野","text":"采药也是正经差事。苏禾刚说百草峰正缺赤纹芝。"},{"speaker":"陆寻","text":"两边都给二十？"},{"speaker":"秦晚","text":"对。你们自己挑。"}],"seconds":26}],"next":"m01.choice"},{"id":"m01.choice","type":"choice","act":1,"prompt":"青崖谷两项外谷差事都已公布，报酬一样。你可以协助秦晚查明角兽异动，也可以和周野去采药，积攒器坊实践经验。","choices":[{"id":"trace","text":"随秦晚检查兽栏，看看究竟是谁动了手脚。","next":"m01.trace"},{"id":"herb","text":"与周野去采药，替苏禾找足赤纹芝。","next":"m01.herb"}]},{"id":"m01.trace","type":"scene","act":1,"title":"她不只是会放火","setting":"翌日清晨，青崖外谷入口。","beats":[{"visual":"陆寻与周野跟随秦晚、巡守检查青崖外谷入口。栅栏下多了一根新木销，陆寻认出与昨天搬运时不同；周野用钩杆取出藏在木销后的第二片灰纹符。符背有一条与外谷药坡方向一致的低阶引兽标记，巡守收取证物。","dialogue":[{"speaker":"陆寻","text":"这块销昨天运货时还不是这个颜色。"},{"speaker":"秦晚","text":"你记得这么细？"},{"speaker":"周野","text":"他要是少记一笔工钱，半夜都睡不着。"},{"speaker":"秦晚","text":"那这回算你替我找对了一笔。"}],"seconds":26},{"visual":"巡守用检测石确认符屑与兽栏异常相符，将药坡一侧原有兽道封住，通知百草峰只开放另一侧药坡。秦晚提醒陆寻认清灰符，若再见到立即报告。高处报告封阵异常，她被召去协查；两人工分到账。","dialogue":[{"speaker":"秦晚","text":"别进封阵那边。我们要查的不是一只角兽。"},{"speaker":"陆寻","text":"师姐，小心。"},{"speaker":"秦晚","text":"你倒是先给自己买副护臂。"}],"seconds":21},{"visual":"两人回山腰器坊。陆寻用一百工分买下一副普通护臂，周野则用自己的报酬买练习器件，秦晚赠的只是正式差事机会，不是私人宝物。周野拿出下一张公开采药告示：百草峰已划定外谷安全采区，需要补足赤纹芝，报酬另计。","dialogue":[{"speaker":"周野","text":"这回不用借我的钱了。"},{"speaker":"陆寻","text":"再干一趟，给咱俩攒点修炼的钱。"}],"seconds":19}],"next":"m02.depart.trace"},{"id":"m02.depart.trace","type":"scene","act":2,"title":"外谷的第三个人","setting":"次日，青崖谷外谷。","beats":[{"visual":"采药告示写明两人合计四十工分，临时领队严承，药材由百草峰验收。镇山堂已封闭内谷，并将外谷入口与安全岩台标出。陆寻见严承姓名，停下。","dialogue":[{"speaker":"周野","text":"又是他。"},{"speaker":"陆寻","text":"百草峰缺药，巡守划了路，药也不是交给他。我们走自己的分工。"},{"speaker":"周野","text":"说好，谁让咱俩往禁线走，咱俩就回头。"}],"seconds":23},{"visual":"三人过登记亭。绳桥连接山门端与药坡；北侧旧药棚旁是备用牵引索和安全岩台，药棚后为镇山堂巡检门，门内封着尚未拆解的古物。巡守正在检查入口附近的异常回响。严承趁两人走在前面，从行囊取出一枚灰纹符；闪回早晨严家送货人递给他符纸，说可驱开小兽，严承付了一块灵石。送货人袖口有同样灰纹，严承并不知道其真实身份。","dialogue":[],"seconds":22},{"visual":"陆寻认出药坡边灰纹与昨天发现的符相似，立即吹响入口发放的短哨；远处巡守听见，开始向药坡靠近。严承没有意识到已有人接近。","dialogue":[{"speaker":"陆寻","text":"采完这株就走。"},{"speaker":"严承","text":"怕什么？你们难道还想白领工钱？"}],"seconds":16},{"visual":"严承抢先割走灵芝，把灰符捏亮，符光沿岩缝扩散。他以为可驱走近处低阶妖兽，想让兄弟在混乱中退出，自己留药独占收益。灰符实际引来更多岩猞；兽群撞响外围警示阵。严承惊慌，催两人跑。","dialogue":[{"speaker":"周野","text":"你在干什么？"},{"speaker":"严承","text":"走！回桥！"}],"seconds":24}],"next":"m02.crisis.trace"},{"id":"m02.crisis.trace","type":"scene","act":2,"title":"他割断了桥","setting":"青崖谷绳桥与北侧岩台。","beats":[{"visual":"岩猞冲出兽道，三人奔向绳桥。严承抢先过桥，回头看见陆寻和周野还差数步。他怕妖兽追到自己，也怕两人回来揭发引兽，拔刀割断承重索。桥面坠下，周野伸手将陆寻拽离断口，自己右臂撞岩。陆寻用护臂挡住追来的兽爪，护臂裂开。","dialogue":[{"speaker":"陆寻","text":"别割！"},{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊！"},{"speaker":"周野","text":"陆寻，北边！"}],"seconds":26},{"visual":"兄弟沿北侧旧路撤往药棚。切高处：蒙面人观察兽群引起的警示阵动静，趁巡守分兵救援潜入封阵巡检门，另一人用灰纹令牌破坏外层警示阵。陆寻先前吹哨引来的巡守已到外谷，裴照雪能及时抽身截击。镜头清楚显示：敌方主动借兽群混乱进入封物所在地，并非正好路过。","dialogue":[],"seconds":21},{"visual":"药棚旁，受损门阵的反冲堵住撤离口。周野右手无法抓绳，陆寻将他扶上石台。先前赶来的巡守从北侧保护药工，陆寻将灰纹符所见告诉他们，巡守及时将一枚新掉落符片封存。裴照雪以白剑截断袭向巡守的暗光，敌人退进巡检门。她留下两人保护伤员，自己带队追入。","dialogue":[{"speaker":"裴照雪","text":"伤者先走！别碰那扇门！"},{"speaker":"陆寻","text":"这边的牵引索卡住了！"}],"seconds":23},{"visual":"蒙面人从巡检门内冲出，怀里是一件破损的封物外壳。他试图以灰纹令牌打开外层撤路，却被裴照雪一剑逼退。外壳撞在岩壁上裂开，一枚带瞳纹的内芯从缺口滑落到药棚石台。蒙面人见空壳脱手，转身逃向北侧旧路。裴照雪不得不先挡住他反击巡守的暗光。","dialogue":[],"seconds":22},{"visual":"石台下的低阶牵引阵反冲加剧，周野与另一名受伤药工困在石台，绳索只要受力就被阵力猛拽。陆寻曾见过测阵石，发现瞳纹内芯与残阵明灭同频，误以为能帮助判断牵引阵；拾起没有反应，他试送一丝自身灵力。内芯瞳纹亮起，随后失光。陆寻捂住眼睛跪倒。","dialogue":[{"speaker":"周野","text":"别管我，先叫人！"},{"speaker":"陆寻","text":"等一下……这是测阵的？"}],"seconds":24},{"visual":"再睁眼，陆寻看见牵引阵的两层实际回流。表面暗下，深处仍在反冲。他试拉一次，绳索猛震，立即松手。第二次，他等两层退去，喊巡守拉绳；自己扶住周野和药工。两名巡守共同拉起绳索，将两人转移至安全岩台。下一次回力击碎空绳轮。","dialogue":[{"speaker":"陆寻","text":"先别拉！里面还有力……现在！"},{"speaker":"巡守","text":"上来了！两个都上来了！"},{"speaker":"周野","text":"你……怎么看出来的？"},{"speaker":"陆寻","text":"我也不知道。"}],"seconds":30},{"visual":"裴照雪从巡检门返回，白衣剑尖染灰。她看见陆寻准确喊出退力时间。北侧旧路有蒙面人逃离的灰纹灵流残迹，仍在一枚被丢下的低阶符片上运行；另一侧，封阵外门仍受反冲，伤者已经脱险，但巡守需要尽快封住门外低阶泄口，防止余力波及外谷。裴可以追敌，巡守也能处理泄口；陆寻能提供更精细的实际运行信息，但说出来会暴露自己的异常视野。","dialogue":[{"speaker":"裴照雪","text":"你刚才看见了什么？"},{"speaker":"陆寻","text":"……"},{"speaker":"巡守","text":"师姐，北边还有人逃，门边的阵力也没停！"}],"seconds":25}],"next":"m02.choice.trace"},{"id":"m02.choice.trace","type":"choice","act":2,"prompt":"周野和药工已经脱险。你发现逃敌留下的符片仍有微弱灵流，也看见封门外泄口的回力。裴照雪可以追敌，巡守可以封门。你准备怎样参与？","choices":[{"id":"pursue","text":"告诉裴照雪异常所见，请她追查灰符来源。","next":"m02.pursue.trace"},{"id":"seal","text":"留在封门外协助巡守撤离与封住泄口，暂不说明眼睛。","next":"m02.seal.trace"}]},{"id":"m02.pursue.trace","type":"scene","act":2,"title":"她回头等我说完","setting":"青崖谷安全岩台与封阵外门。","beats":[{"visual":"陆寻将实际看到的符片灵流方向指给裴照雪，说明自己刚才看见了残阵内部回力。裴以巡守检测石核对符片响应，确认它与逃敌使用的灰纹令牌相符；她让陆寻留在安全岩台，不带低阶伤员追敌，自己带一名巡守沿线追去。","dialogue":[{"speaker":"陆寻","text":"那片符还在动。和刚才他手上的令牌一样。"},{"speaker":"裴照雪","text":"你能看见？"},{"speaker":"陆寻","text":"能。刚刚才开始。"},{"speaker":"裴照雪","text":"好。你留在这，剩下的我来。"}],"seconds":25},{"visual":"画面切至北侧旧路：裴照雪截住受伤逃敌，剑尖击落其灰纹令牌，敌人以暗光掩护撤走；她没有贸然追入未知禁区。她带回实际令牌及符片，陆寻被登记为异常所见的线索提供者。","dialogue":[{"speaker":"裴照雪","text":"人走了，东西留下了。"},{"speaker":"陆寻","text":"能查到是谁吗？"},{"speaker":"裴照雪","text":"不能现在保证。但至少有东西可查。"}],"seconds":26},{"visual":"巡守收走失活内芯并封存。陆寻如实报告接触碎片、眼痛与救援经过。裴与协作巡守另记异常视觉及灰纹线索，限制查阅。回宗后，正式医修接手周野。苏禾一见两人，脸色变了。","dialogue":[{"speaker":"苏禾","text":"陆寻！你们怎么又把自己弄成这样？"},{"speaker":"陆寻","text":"他的手先治。"},{"speaker":"苏禾","text":"我知道。你也坐下。"}],"seconds":23},{"visual":"严承交验赤纹芝时被巡守当场拦下。断桥、领队独自返还、兄弟与药工证词、引兽符残留均已核对；严承承认使用购来的灰符，却坚称自己以为能驱兽。秦晚先前查得的第二片符与新残符比对相符，镇山堂要求严家交代送货人来源。镇山堂没收本次药功，暂停领队，责令其承担已核定治疗费；是否与蒙面人相识仍待查。","dialogue":[{"speaker":"严承","text":"我买的是驱兽符！我哪知道会引来这么多！"},{"speaker":"陆寻","text":"你不知道符会引兽。可你知道我们还没过桥。"},{"speaker":"巡守","text":"跟我们走。"}],"seconds":25},{"visual":"三周后，周野能下床，右手仍无法稳定控灵。医修说明普通康复能恢复日常功能，精细器作需要更珍贵的养脉材料。苏禾取来百草峰药籍，指出青崖内侧旧药窟长有养脉藤，成熟藤髓可用于医修配药。镇山堂此次修复封阵后将组织正式清查，百草峰需要收回受影响的药圃；低阶协作人员须通过基础训练与医师许可方可加入。","dialogue":[{"speaker":"周野","text":"我还能做图、认材料。你别因为我耽误修炼。"},{"speaker":"陆寻","text":"先问清楚那药在哪里。"},{"speaker":"苏禾","text":"这不是一个人去的地方。等宗门清查开放，我们可以一起报名。"}],"seconds":27}],"next":"m03.learn.trace.pursue"},{"id":"m03.learn.trace.pursue","type":"scene","act":3,"title":"眼睛不是剑","setting":"青崖清查开放前一个月，公开练习坪。","beats":[{"visual":"镇山堂发布青崖清查差事：药窟外层已安全核验，低阶协作工役需能自保，正式弟子负责守护；百草峰收取一半成熟养脉藤髓用于救治伤者，其余按事前登记的实际获取贡献分配，禁止私入深层。苏禾参与药材辨认，周野在山门准备轻型采具。陆寻报名，必须先完成基础引气剑和防身步法考查。","dialogue":[{"speaker":"陆寻","text":"我想进去采藤髓。"},{"speaker":"教习","text":"会引气，不等于会用剑。先过这个靶。"}],"seconds":25},{"visual":"夜里，陆寻开启灵目观察自己的吐纳，发现第二息的余流尚未散尽便急接第三息。几次验证后，他第一次完整走完三息；闭眼复现。次日木剑训练，他仍被同境练习者击退。秦晚路过，认出陆寻。","dialogue":[{"speaker":"秦晚","text":"怎么从搬货改练剑了？"},{"speaker":"陆寻","text":"青崖那一趟，周野的手伤了。我也不想下次只会跑。"},{"speaker":"秦晚","text":"那先给我打一剑看看。"}],"seconds":25},{"visual":"秦晚用一线低阶火演示前一缕尚未散完，下一缕已接上。陆寻从实际灵流看到：第二次引气可在体内前一股余势尚存时准备，但不能增加总灵力。他尝试以基础引气剑衔接，木剑震动，第一道剑势乱掉。","dialogue":[{"speaker":"秦晚","text":"我这是火，你练的是剑。别照搬。"},{"speaker":"陆寻","text":"我不是要学火。我想让第二剑不必从头引气。"}],"seconds":27},{"visual":"数周短切。陆寻夜练、白日做工，周野用左手修整木剑柄，秦晚在公开训练时偶尔试接。陆寻终于闭眼发出前后两道剑势；秦晚第一次没接住第二道，第二次提前封住固定间隔。","dialogue":[{"speaker":"秦晚","text":"你看，第二剑再快，出剑时间一样，也会被人等着。"},{"speaker":"陆寻","text":"那就换个时间。"}],"seconds":23},{"visual":"陆寻先将第二股灵力留在体内，过早会撞乱，过晚则第一股余势完全消失。他失败三次，停下休息。再练时，秦晚提前举火幕；他延后一瞬再发第二剑，火幕已经偏移，第二剑命中后方试靶。秦晚收手笑起来。","dialogue":[{"speaker":"秦晚","text":"这回我没猜着。"},{"speaker":"陆寻","text":"只成了一次，再练。"},{"speaker":"秦晚","text":"行，我陪你。"}],"seconds":24},{"visual":"一个月后，教习考查通过。裴照雪核对之前异常视觉记录，确认陆寻实际闭眼复现术式，并提醒不要随意公开能力；她将灰纹令牌留给镇山堂继续追查。苏禾带药材辨识册来到集合点，周野用左手将修好的采具交给两人，自己留在安全区做轻役。","dialogue":[{"speaker":"周野","text":"给你们修好了。别把命赔进去。"},{"speaker":"苏禾","text":"放心，我知道哪株能采。"},{"speaker":"陆寻","text":"等我们回来。"}],"seconds":20}],"next":"m03.cave.trace.pursue"},{"id":"m03.cave.trace.pursue","type":"scene","act":3,"title":"药窟里的人","setting":"清查当天，青崖内侧旧药窟外层。","beats":[{"visual":"巡守开启已核验的外层药窟通道。正式弟子韩峥带队护送低阶采药人员，苏禾与陆寻跟随。韩峥炼气中段，陆寻亦为已有多年基础吐纳的炼气中段，过去缺少资源和完整指导，剑术仍远不及韩峥熟练。韩峥曾守住低阶岩猞通道。医师在入口告知成熟藤髓可采；若发现稀有玉髓，先清除危险，再由实际发现及参与者按事前约定分配，宗门收取的药材与额外玉髓分开。","dialogue":[{"speaker":"韩峥","text":"藤髓够就出来。别碰深处。"},{"speaker":"苏禾","text":"我只取成熟的，伤了根明年就没药。"}],"seconds":25},{"visual":"陆寻开启灵目，看到成熟藤根的实际灵力向石缝聚集。苏禾翻药籍，对照外露结晶，认出养脉玉髓：老藤吸纳地脉灵力后形成的罕见结晶，比普通藤髓更浓，且可分割成两份；份量不同，养脉改善程度不同。她先采足周野的成熟藤髓，送洞口医师确认并装入百草峰登记药囊。","dialogue":[{"speaker":"苏禾","text":"够了！周野那一份够了，剩下才是额外机缘。"},{"speaker":"陆寻","text":"先送回去。"}],"seconds":25},{"visual":"洞内突然传来兽吼。一只受灰纹残符刺激的同境低阶岩猞从侧缝冲出，守住玉髓所在石台。韩峥挡住第一爪，却被狭窄岩壁限制出剑角度。陆寻用练成的第一剑逼兽抬爪，延后第二剑击中旁边石靶般的松动石片，石片落下隔开兽爪；韩峥趁机以自己的剑势击退岩猞。两人合力守住撤离口，实际修炼成果兑现。","dialogue":[{"speaker":"韩峥","text":"刚才那第二剑，是你打的？"},{"speaker":"陆寻","text":"是。它下一次还会冲。"}],"seconds":28},{"visual":"岩猞退入侧缝。巡守确认普通药材已撤出，但玉髓石台只能再开放一轮清查；他们会先在洞口安全试坪核对两人的自愿采掘协议。韩峥提出合作：他负责引兽，陆寻协作取玉，按贡献平分。陆寻若要独取，可与他比试三式决定优先权；但一旦输掉，就必须退出此次额外玉髓争夺，不能再要求五五分。独取获胜也须由巡守先封侧缝、医师监督采出。","dialogue":[{"speaker":"韩峥","text":"合作，稳妥些。五五分。"},{"speaker":"韩峥","text":"想独取，就比三式。输的让出这一轮，不再分玉髓。"},{"speaker":"苏禾","text":"周野的药已经够了。这份机缘你自己拿主意。"}],"seconds":28}],"next":"m03.choice.trace.pursue"},{"id":"m03.choice.trace.pursue","type":"choice","act":3,"prompt":"周野的药已取得。与韩峥合作，双方都有真实所得；单独比试可能赢得整份玉髓，也可能空手而归。输掉后不能回头选合作。","choices":[{"id":"duel","text":"接受三式比试，冒失去整份机缘的风险。","next":"m03.duel.trace.pursue"},{"id":"join","text":"与韩峥合作，合力取玉髓，各得一半。","next":"m03.join.trace.pursue"}]},{"id":"m03.duel.trace.pursue","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"韩峥和陆寻到洞口安全试坪，巡守见证两人自愿比试。统一低阶练习器，点到即止；优先采掘只对额外玉髓有效，不影响百草峰药材。第一式韩峥把陆寻逼退；第二式他准确封住陆寻习惯的第二剑间隔。","dialogue":[{"speaker":"韩峥","text":"刚才在洞里我就看见了。你第二剑只快那么一点。"},{"speaker":"陆寻","text":"再来。"}],"seconds":25}],"next":"m03.duel.decision.trace.pursue"},{"id":"m03.duel.decision.trace.pursue","type":"choice","act":3,"prompt":"韩峥已经封住你的固定第二剑，虎口发麻。你还可以继续第三式，尝试自己练过但尚不熟练的变间隔；也可以认输保住手，放弃本轮玉髓。","choices":[{"id":"continue","text":"继续第三式，相信自己练成的剑术。","next":"m03.duel.win.trace.pursue"},{"id":"withdraw","text":"收剑认输，不为这次机缘硬撑。","next":"m03.duel.withdraw.trace.pursue"}]},{"id":"m03.duel.win.trace.pursue","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"第三式，韩峥提前截向固定间隔。陆寻将第二股灵力留在体内，先以第一剑护住身前，等韩峥压剑落空后再接出第二剑。剑势击亮韩峥肩前判定护具。韩峥停手，承认这次输了。巡守见证陆寻获得优先采掘权。","dialogue":[{"speaker":"韩峥","text":"你什么时候把第二剑变慢了？"},{"speaker":"陆寻","text":"你挡得太早。"},{"speaker":"韩峥","text":"好。你先采。"}],"seconds":28},{"visual":"巡守封住侧缝后，医师监督陆寻从已确认可采的石缝取出整枚玉髓。韩峥不再争夺，但他只承诺本次守通道，不建立后续共同历练关系。陆寻取得整份玉髓，独自拥有后续养脉机会。","dialogue":[{"speaker":"韩峥","text":"杂役能练成这样……下次外门见。"},{"speaker":"陆寻","text":"好。"}],"seconds":24},{"visual":"回宗后，苏禾将先前取得的成熟藤髓交正式医师配药。数周后，周野右手的低阶精细控灵逐步恢复，终于稳住一枚轻型练习零件，教习核验合格。陆寻在旁看着，周野把自己做的练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。你俩谁也别再逞强。"}],"seconds":25},{"visual":"陆寻在医师监督下使用整份玉髓，数周后能连续三次稳定复现衔接剑势；秦晚看完主动邀他再练，陆寻获得真实个人修炼优势。","dialogue":[{"speaker":"秦晚","text":"这回轮到我想看看你的第三剑了。"},{"speaker":"陆寻","text":"还没练成。"},{"speaker":"秦晚","text":"那我等着。"}],"seconds":25},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上有裴照雪追回的灰纹令牌与异常视觉记录。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.pursue.duel"},{"id":"end.trace.pursue.duel","type":"end","title":"独得玉髓·灰纹令牌","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野接受成熟藤髓配药治疗，右手精细控灵逐步恢复；陆寻独得整份玉髓，三轮衔接剑势稳定；无韩峥后续同行约定。","mid":"M04/M05须继承：秦晚共同查兽与提前吹哨、双处灰符比对的证据、灰纹令牌及裴/巡守知情、整份玉髓及个人术式优势。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.duel.withdraw.trace.pursue","type":"scene","act":3,"title":"收剑","setting":"药窟外试坪与回宗后。","beats":[{"visual":"陆寻虎口仍在发麻。他收起练习剑，向韩峥认输。巡守见证韩峥取得本轮优先采掘资格。韩峥没有继续出剑，也没有把约定之外的玉髓送给陆寻。","dialogue":[{"speaker":"陆寻","text":"这一轮，你赢。"},{"speaker":"韩峥","text":"好。下次再比。"}],"seconds":24},{"visual":"医师监督韩峥取出玉髓，陆寻在出口看着他将整份玉髓收起。苏禾把已取得的普通藤髓药囊交给陆寻，提醒他原本来这里的目的已经做到。","dialogue":[{"speaker":"苏禾","text":"周野的药还在。"},{"speaker":"陆寻","text":"我知道。我这剑，还得练。"}],"seconds":24},{"visual":"回宗后正式医师配药。数周后，周野右手低阶控灵逐步恢复，亲手完成轻型练习零件，把练习剑柄递给陆寻。陆寻继续练习原有两道剑势，第三轮仍需停歇，没有玉髓改善。秦晚看见他虎口已恢复，主动邀请继续练剑。","dialogue":[{"speaker":"周野","text":"你没拿到玉髓？"},{"speaker":"陆寻","text":"没拿到。下回我再赢回来。"},{"speaker":"周野","text":"那你的剑柄，我先给你打。"}],"seconds":28},{"visual":"镇山堂复核室，失活内芯仍无回应。灰纹令牌和陆寻异常所见记录并列。长老停在陆寻名字上。","dialogue":[{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.pursue.withdraw"},{"id":"end.trace.pursue.withdraw","type":"end","title":"收剑再来","summary":"周野的普通藤髓治疗已兑现，陆寻主动认输，失去本轮额外玉髓；保留已练成的第二剑。M04–M06尚未写。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野治疗后精细控灵逐步恢复；陆寻认输失去玉髓，没有额外养脉改善，未获得韩峥同行约定。","mid":"M04/M05须继承：秦晚共同查兽与提前吹哨、双处灰符比对的证据、灰纹令牌及裴/巡守知情、无玉髓、已练成第二剑及主动收剑经历。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.join.trace.pursue","type":"scene","act":3,"title":"这一次，剑不是一个人的","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"韩峥带陆寻回到石台外，巡守允许在已标定低阶范围内协同驱兽；苏禾在洞口保管药囊。韩峥先用剑势引兽离开玉髓石缝，陆寻观察岩猞实际蓄力，发现它每次扑击后会短暂停顿。","dialogue":[{"speaker":"韩峥","text":"你那第二剑能不能慢半息？"},{"speaker":"陆寻","text":"练过。你先退。"}],"seconds":25},{"visual":"岩猞扑向韩峥。陆寻第一剑截住其侧向扑势，韩峥后撤，陆寻没有立刻释放第二剑，待岩猞实际转向后才将体内准备好的第二股灵力送出，击落岩侧浮石，封住兽道。韩峥趁窗口将玉髓从经医师确认的可采位置完整取出，二人及时撤出；不是陆寻越级击杀妖兽。","dialogue":[{"speaker":"韩峥","text":"现在！"},{"speaker":"陆寻","text":"退！"},{"speaker":"韩峥","text":"拿到了！走！"}],"seconds":28},{"visual":"医师确认玉髓可分为两份相同品质的小块，但每份养脉效用有限。陆寻与韩峥按约各取一半，韩峥主动留下自己的传信牌，邀陆寻以后参加外门低阶同行试炼；双方不是永久师徒。","dialogue":[{"speaker":"韩峥","text":"你若以后进外门，来找我。"},{"speaker":"陆寻","text":"这次的账，五五。"},{"speaker":"韩峥","text":"说到做到。"}],"seconds":24},{"visual":"回宗后，苏禾将先前取得的成熟藤髓交正式医师配药。数周后，周野右手的低阶精细控灵逐步恢复，终于稳住一枚轻型练习零件，教习核验合格。陆寻在旁看着，周野把自己做的练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。你俩谁也别再逞强。"}],"seconds":25},{"visual":"陆寻使用自己半份玉髓，修炼稳定性有所改善，但第三轮剑势仍需停歇；韩峥来练习坪与他对剑，两人将共同取得的药窟经验用于实际练习。秦晚见他带来新同伴，笑着要求下一回三人同练。","dialogue":[{"speaker":"秦晚","text":"你还真交了个会用剑的朋友。"},{"speaker":"韩峥","text":"他那第二剑，得慢慢看。"},{"speaker":"秦晚","text":"好啊。下次带我一个。"}],"seconds":25},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上有裴照雪追回的灰纹令牌与异常视觉记录。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.pursue.join"},{"id":"end.trace.pursue.join","type":"end","title":"并肩取玉·灰纹令牌","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野接受成熟藤髓配药治疗，右手精细控灵逐步恢复；陆寻与韩峥各得半份玉髓，第三轮仍需停歇；取得韩峥真实同行邀约。","mid":"M04/M05须继承：秦晚共同查兽与提前吹哨、双处灰符比对的证据、灰纹令牌及裴/巡守知情、半份玉髓及韩峥同盟机会。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m02.seal.trace","type":"scene","act":2,"title":"留下来的那个人","setting":"青崖谷安全岩台与封阵外门。","beats":[{"visual":"陆寻不主动说眼睛，只向巡守指出自己刚才实际观察到绳索震动的规律，协助撤离最后一批药工。巡守按正常程序关闭低阶泄口；陆寻负责将备用挡板移到指定位置，不操纵高阶封阵。裴照雪则独立追向北侧旧路。","dialogue":[{"speaker":"巡守","text":"挡板送过来！别越线！"},{"speaker":"陆寻","text":"周野，你别动，等我。"}],"seconds":25},{"visual":"陆寻与巡守搬动挡板，在退力窗口合上外侧低阶护闸。余震停止，药棚旁一具被冲歪的普通采药柜完好保住，柜内有当日救护药材。裴照雪追至岔路时失去敌人踪迹，只带回普通破损符片，未取得令牌。","dialogue":[{"speaker":"巡守","text":"关上了！药材还能用。"},{"speaker":"周野","text":"你还真是闲不住。"},{"speaker":"陆寻","text":"都到这了，总得把人送回去。"}],"seconds":26},{"visual":"巡守收走失活内芯并封存。陆寻如实报告接触碎片、眼痛与救援经过。陆寻未主动描述异常视觉，裴只知他参与正常救援；外侧药材和工役完整撤回。回宗后，正式医修接手周野。苏禾一见两人，脸色变了。","dialogue":[{"speaker":"苏禾","text":"陆寻！你们怎么又把自己弄成这样？"},{"speaker":"陆寻","text":"他的手先治。"},{"speaker":"苏禾","text":"我知道。你也坐下。"}],"seconds":23},{"visual":"严承交验赤纹芝时被巡守当场拦下。断桥、领队独自返还、兄弟与药工证词、引兽符残留均已核对；严承承认使用购来的灰符，却坚称自己以为能驱兽。秦晚先前查得的第二片符与新残符比对相符，镇山堂要求严家交代送货人来源。镇山堂没收本次药功，暂停领队，责令其承担已核定治疗费；是否与蒙面人相识仍待查。","dialogue":[{"speaker":"严承","text":"我买的是驱兽符！我哪知道会引来这么多！"},{"speaker":"陆寻","text":"你不知道符会引兽。可你知道我们还没过桥。"},{"speaker":"巡守","text":"跟我们走。"}],"seconds":25},{"visual":"三周后，周野能下床，右手仍无法稳定控灵。医修说明普通康复能恢复日常功能，精细器作需要更珍贵的养脉材料。苏禾取来百草峰药籍，指出青崖内侧旧药窟长有养脉藤，成熟藤髓可用于医修配药。镇山堂此次修复封阵后将组织正式清查，百草峰需要收回受影响的药圃；低阶协作人员须通过基础训练与医师许可方可加入。","dialogue":[{"speaker":"周野","text":"我还能做图、认材料。你别因为我耽误修炼。"},{"speaker":"陆寻","text":"先问清楚那药在哪里。"},{"speaker":"苏禾","text":"这不是一个人去的地方。等宗门清查开放，我们可以一起报名。"}],"seconds":27}],"next":"m03.learn.trace.seal"},{"id":"m03.learn.trace.seal","type":"scene","act":3,"title":"眼睛不是剑","setting":"青崖清查开放前一个月，公开练习坪。","beats":[{"visual":"镇山堂发布青崖清查差事：药窟外层已安全核验，低阶协作工役需能自保，正式弟子负责守护；百草峰收取一半成熟养脉藤髓用于救治伤者，其余按事前登记的实际获取贡献分配，禁止私入深层。苏禾参与药材辨认，周野在山门准备轻型采具。陆寻报名，必须先完成基础引气剑和防身步法考查。","dialogue":[{"speaker":"陆寻","text":"我想进去采藤髓。"},{"speaker":"教习","text":"会引气，不等于会用剑。先过这个靶。"}],"seconds":25},{"visual":"夜里，陆寻开启灵目观察自己的吐纳，发现第二息的余流尚未散尽便急接第三息。几次验证后，他第一次完整走完三息；闭眼复现。次日木剑训练，他仍被同境练习者击退。秦晚路过，认出陆寻。","dialogue":[{"speaker":"秦晚","text":"怎么从搬货改练剑了？"},{"speaker":"陆寻","text":"青崖那一趟，周野的手伤了。我也不想下次只会跑。"},{"speaker":"秦晚","text":"那先给我打一剑看看。"}],"seconds":25},{"visual":"秦晚用一线低阶火演示前一缕尚未散完，下一缕已接上。陆寻从实际灵流看到：第二次引气可在体内前一股余势尚存时准备，但不能增加总灵力。他尝试以基础引气剑衔接，木剑震动，第一道剑势乱掉。","dialogue":[{"speaker":"秦晚","text":"我这是火，你练的是剑。别照搬。"},{"speaker":"陆寻","text":"我不是要学火。我想让第二剑不必从头引气。"}],"seconds":27},{"visual":"数周短切。陆寻夜练、白日做工，周野用左手修整木剑柄，秦晚在公开训练时偶尔试接。陆寻终于闭眼发出前后两道剑势；秦晚第一次没接住第二道，第二次提前封住固定间隔。","dialogue":[{"speaker":"秦晚","text":"你看，第二剑再快，出剑时间一样，也会被人等着。"},{"speaker":"陆寻","text":"那就换个时间。"}],"seconds":23},{"visual":"陆寻先将第二股灵力留在体内，过早会撞乱，过晚则第一股余势完全消失。他失败三次，停下休息。再练时，秦晚提前举火幕；他延后一瞬再发第二剑，火幕已经偏移，第二剑命中后方试靶。秦晚收手笑起来。","dialogue":[{"speaker":"秦晚","text":"这回我没猜着。"},{"speaker":"陆寻","text":"只成了一次，再练。"},{"speaker":"秦晚","text":"行，我陪你。"}],"seconds":24},{"visual":"一个月后，教习考查通过。陆寻只登记实际练成的引气剑和防身动作，裴照雪不知灵目。苏禾带药材辨识册来到集合点，周野用左手将修好的采具交给两人，自己留在安全区做轻役。","dialogue":[{"speaker":"周野","text":"给你们修好了。别把命赔进去。"},{"speaker":"苏禾","text":"放心，我知道哪株能采。"},{"speaker":"陆寻","text":"等我们回来。"}],"seconds":20}],"next":"m03.cave.trace.seal"},{"id":"m03.cave.trace.seal","type":"scene","act":3,"title":"药窟里的人","setting":"清查当天，青崖内侧旧药窟外层。","beats":[{"visual":"巡守开启已核验的外层药窟通道。正式弟子韩峥带队护送低阶采药人员，苏禾与陆寻跟随。韩峥炼气中段，陆寻亦为已有多年基础吐纳的炼气中段，过去缺少资源和完整指导，剑术仍远不及韩峥熟练。韩峥曾守住低阶岩猞通道。医师在入口告知成熟藤髓可采；若发现稀有玉髓，先清除危险，再由实际发现及参与者按事前约定分配，宗门收取的药材与额外玉髓分开。","dialogue":[{"speaker":"韩峥","text":"藤髓够就出来。别碰深处。"},{"speaker":"苏禾","text":"我只取成熟的，伤了根明年就没药。"}],"seconds":25},{"visual":"陆寻开启灵目，看到成熟藤根的实际灵力向石缝聚集。苏禾翻药籍，对照外露结晶，认出养脉玉髓：老藤吸纳地脉灵力后形成的罕见结晶，比普通藤髓更浓，且可分割成两份；份量不同，养脉改善程度不同。她先采足周野的成熟藤髓，送洞口医师确认并装入百草峰登记药囊。","dialogue":[{"speaker":"苏禾","text":"够了！周野那一份够了，剩下才是额外机缘。"},{"speaker":"陆寻","text":"先送回去。"}],"seconds":25},{"visual":"洞内突然传来兽吼。一只受灰纹残符刺激的同境低阶岩猞从侧缝冲出，守住玉髓所在石台。韩峥挡住第一爪，却被狭窄岩壁限制出剑角度。陆寻用练成的第一剑逼兽抬爪，延后第二剑击中旁边石靶般的松动石片，石片落下隔开兽爪；韩峥趁机以自己的剑势击退岩猞。两人合力守住撤离口，实际修炼成果兑现。","dialogue":[{"speaker":"韩峥","text":"刚才那第二剑，是你打的？"},{"speaker":"陆寻","text":"是。它下一次还会冲。"}],"seconds":28},{"visual":"岩猞退入侧缝。巡守确认普通药材已撤出，但玉髓石台只能再开放一轮清查；他们会先在洞口安全试坪核对两人的自愿采掘协议。韩峥提出合作：他负责引兽，陆寻协作取玉，按贡献平分。陆寻若要独取，可与他比试三式决定优先权；但一旦输掉，就必须退出此次额外玉髓争夺，不能再要求五五分。独取获胜也须由巡守先封侧缝、医师监督采出。","dialogue":[{"speaker":"韩峥","text":"合作，稳妥些。五五分。"},{"speaker":"韩峥","text":"想独取，就比三式。输的让出这一轮，不再分玉髓。"},{"speaker":"苏禾","text":"周野的药已经够了。这份机缘你自己拿主意。"}],"seconds":28}],"next":"m03.choice.trace.seal"},{"id":"m03.choice.trace.seal","type":"choice","act":3,"prompt":"周野的药已取得。与韩峥合作，双方都有真实所得；单独比试可能赢得整份玉髓，也可能空手而归。输掉后不能回头选合作。","choices":[{"id":"duel","text":"接受三式比试，冒失去整份机缘的风险。","next":"m03.duel.trace.seal"},{"id":"join","text":"与韩峥合作，合力取玉髓，各得一半。","next":"m03.join.trace.seal"}]},{"id":"m03.duel.trace.seal","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"韩峥和陆寻到洞口安全试坪，巡守见证两人自愿比试。统一低阶练习器，点到即止；优先采掘只对额外玉髓有效，不影响百草峰药材。第一式韩峥把陆寻逼退；第二式他准确封住陆寻习惯的第二剑间隔。","dialogue":[{"speaker":"韩峥","text":"刚才在洞里我就看见了。你第二剑只快那么一点。"},{"speaker":"陆寻","text":"再来。"}],"seconds":25}],"next":"m03.duel.decision.trace.seal"},{"id":"m03.duel.decision.trace.seal","type":"choice","act":3,"prompt":"韩峥已经封住你的固定第二剑，虎口发麻。你还可以继续第三式，尝试自己练过但尚不熟练的变间隔；也可以认输保住手，放弃本轮玉髓。","choices":[{"id":"continue","text":"继续第三式，相信自己练成的剑术。","next":"m03.duel.win.trace.seal"},{"id":"withdraw","text":"收剑认输，不为这次机缘硬撑。","next":"m03.duel.withdraw.trace.seal"}]},{"id":"m03.duel.win.trace.seal","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"第三式，韩峥提前截向固定间隔。陆寻将第二股灵力留在体内，先以第一剑护住身前，等韩峥压剑落空后再接出第二剑。剑势击亮韩峥肩前判定护具。韩峥停手，承认这次输了。巡守见证陆寻获得优先采掘权。","dialogue":[{"speaker":"韩峥","text":"你什么时候把第二剑变慢了？"},{"speaker":"陆寻","text":"你挡得太早。"},{"speaker":"韩峥","text":"好。你先采。"}],"seconds":28},{"visual":"巡守封住侧缝后，医师监督陆寻从已确认可采的石缝取出整枚玉髓。韩峥不再争夺，但他只承诺本次守通道，不建立后续共同历练关系。陆寻取得整份玉髓，独自拥有后续养脉机会。","dialogue":[{"speaker":"韩峥","text":"杂役能练成这样……下次外门见。"},{"speaker":"陆寻","text":"好。"}],"seconds":24},{"visual":"回宗后，苏禾将先前取得的成熟藤髓交正式医师配药。数周后，周野右手的低阶精细控灵逐步恢复，终于稳住一枚轻型练习零件，教习核验合格。陆寻在旁看着，周野把自己做的练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。你俩谁也别再逞强。"}],"seconds":25},{"visual":"陆寻在医师监督下使用整份玉髓，数周后能连续三次稳定复现衔接剑势；秦晚看完主动邀他再练，陆寻获得真实个人修炼优势。","dialogue":[{"speaker":"秦晚","text":"这回轮到我想看看你的第三剑了。"},{"speaker":"陆寻","text":"还没练成。"},{"speaker":"秦晚","text":"那我等着。"}],"seconds":25},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上只有破损灰符与接触者记录，尚无异常视觉的直接报告。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.seal.duel"},{"id":"end.trace.seal.duel","type":"end","title":"独得玉髓·守住外门","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野接受成熟藤髓配药治疗，右手精细控灵逐步恢复；陆寻独得整份玉髓，三轮衔接剑势稳定；无韩峥后续同行约定。","mid":"M04/M05须继承：秦晚共同查兽与提前吹哨、双处灰符比对的证据、未追回令牌及无裴共同秘密、整份玉髓及个人术式优势。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.duel.withdraw.trace.seal","type":"scene","act":3,"title":"收剑","setting":"药窟外试坪与回宗后。","beats":[{"visual":"陆寻虎口仍在发麻。他收起练习剑，向韩峥认输。巡守见证韩峥取得本轮优先采掘资格。韩峥没有继续出剑，也没有把约定之外的玉髓送给陆寻。","dialogue":[{"speaker":"陆寻","text":"这一轮，你赢。"},{"speaker":"韩峥","text":"好。下次再比。"}],"seconds":24},{"visual":"医师监督韩峥取出玉髓，陆寻在出口看着他将整份玉髓收起。苏禾把已取得的普通藤髓药囊交给陆寻，提醒他原本来这里的目的已经做到。","dialogue":[{"speaker":"苏禾","text":"周野的药还在。"},{"speaker":"陆寻","text":"我知道。我这剑，还得练。"}],"seconds":24},{"visual":"回宗后正式医师配药。数周后，周野右手低阶控灵逐步恢复，亲手完成轻型练习零件，把练习剑柄递给陆寻。陆寻继续练习原有两道剑势，第三轮仍需停歇，没有玉髓改善。秦晚看见他虎口已恢复，主动邀请继续练剑。","dialogue":[{"speaker":"周野","text":"你没拿到玉髓？"},{"speaker":"陆寻","text":"没拿到。下回我再赢回来。"},{"speaker":"周野","text":"那你的剑柄，我先给你打。"}],"seconds":28},{"visual":"镇山堂复核室，失活内芯仍无回应。破损灰符及接触者登记并列。长老停在陆寻名字上。","dialogue":[{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.seal.withdraw"},{"id":"end.trace.seal.withdraw","type":"end","title":"收剑再来","summary":"周野的普通藤髓治疗已兑现，陆寻主动认输，失去本轮额外玉髓；保留已练成的第二剑。M04–M06尚未写。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野治疗后精细控灵逐步恢复；陆寻认输失去玉髓，没有额外养脉改善，未获得韩峥同行约定。","mid":"M04/M05须继承：秦晚共同查兽与提前吹哨、双处灰符比对的证据、未追回令牌及无裴共同秘密、无玉髓、已练成第二剑及主动收剑经历。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.join.trace.seal","type":"scene","act":3,"title":"这一次，剑不是一个人的","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"韩峥带陆寻回到石台外，巡守允许在已标定低阶范围内协同驱兽；苏禾在洞口保管药囊。韩峥先用剑势引兽离开玉髓石缝，陆寻观察岩猞实际蓄力，发现它每次扑击后会短暂停顿。","dialogue":[{"speaker":"韩峥","text":"你那第二剑能不能慢半息？"},{"speaker":"陆寻","text":"练过。你先退。"}],"seconds":25},{"visual":"岩猞扑向韩峥。陆寻第一剑截住其侧向扑势，韩峥后撤，陆寻没有立刻释放第二剑，待岩猞实际转向后才将体内准备好的第二股灵力送出，击落岩侧浮石，封住兽道。韩峥趁窗口将玉髓从经医师确认的可采位置完整取出，二人及时撤出；不是陆寻越级击杀妖兽。","dialogue":[{"speaker":"韩峥","text":"现在！"},{"speaker":"陆寻","text":"退！"},{"speaker":"韩峥","text":"拿到了！走！"}],"seconds":28},{"visual":"医师确认玉髓可分为两份相同品质的小块，但每份养脉效用有限。陆寻与韩峥按约各取一半，韩峥主动留下自己的传信牌，邀陆寻以后参加外门低阶同行试炼；双方不是永久师徒。","dialogue":[{"speaker":"韩峥","text":"你若以后进外门，来找我。"},{"speaker":"陆寻","text":"这次的账，五五。"},{"speaker":"韩峥","text":"说到做到。"}],"seconds":24},{"visual":"回宗后，苏禾将先前取得的成熟藤髓交正式医师配药。数周后，周野右手的低阶精细控灵逐步恢复，终于稳住一枚轻型练习零件，教习核验合格。陆寻在旁看着，周野把自己做的练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。你俩谁也别再逞强。"}],"seconds":25},{"visual":"陆寻使用自己半份玉髓，修炼稳定性有所改善，但第三轮剑势仍需停歇；韩峥来练习坪与他对剑，两人将共同取得的药窟经验用于实际练习。秦晚见他带来新同伴，笑着要求下一回三人同练。","dialogue":[{"speaker":"秦晚","text":"你还真交了个会用剑的朋友。"},{"speaker":"韩峥","text":"他那第二剑，得慢慢看。"},{"speaker":"秦晚","text":"好啊。下次带我一个。"}],"seconds":25},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上只有破损灰符与接触者记录，尚无异常视觉的直接报告。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.seal.join"},{"id":"end.trace.seal.join","type":"end","title":"并肩取玉·守住外门","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野接受成熟藤髓配药治疗，右手精细控灵逐步恢复；陆寻与韩峥各得半份玉髓，第三轮仍需停歇；取得韩峥真实同行邀约。","mid":"M04/M05须继承：秦晚共同查兽与提前吹哨、双处灰符比对的证据、未追回令牌及无裴共同秘密、半份玉髓及韩峥同盟机会。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m01.herb","type":"scene","act":1,"title":"不是所有杂役都只会搬箱子","setting":"翌日清晨，青崖外谷临时药圃。","beats":[{"visual":"陆寻与周野跟随百草峰药工来到入口旁已清查的药圃，苏禾在医师指导下辨认药株。严承的同伴随手拔了几株未成熟的赤纹芝，苏禾将药筐推回。陆寻按她教的方法识别成熟叶纹，周野用旧牵引器将药筐从岩坡吊上来。","dialogue":[{"speaker":"苏禾","text":"别连根拔！下个月还要采呢。"},{"speaker":"陆寻","text":"这株叶背有三道赤纹，是不是你要的？"},{"speaker":"苏禾","text":"对。你们俩总算有一回不是来找我包扎的。"}],"seconds":25},{"visual":"药工称量，合格赤纹芝超过原计划。苏禾把其中一株送医师制备安抚药，正式登记两人完成差事，各领二十工分。她拿出自己的医修申请：下月公开培养考评，她正在准备，不想永远只替人包扎。 苏禾另将一小包经医师核准的赤纹芝安抚粉交给药工，教陆寻辨认用药标记：如遇岩猞，不可主动接近，先撤退，并由巡守使用安抚粉。","dialogue":[{"speaker":"苏禾","text":"我想自己学会治经脉伤。现在只能跟着医师做。"},{"speaker":"陆寻","text":"等你过考评，我请你吃饭。"},{"speaker":"苏禾","text":"记着。别又拿两个馒头糊弄我。"}],"seconds":23},{"visual":"两人回山腰器坊。陆寻用一百工分买下护臂；周野保留自己的报酬用于器坊见习。百草峰补采告示出现：外谷另一处岩坡的赤纹芝仍未收齐，巡守已开放路线。两人熟悉药株与工具，决定再接这项差事。","dialogue":[{"speaker":"周野","text":"咱们今天总算靠本事赚了一次。"},{"speaker":"陆寻","text":"再攒点，不能一辈子只够买护臂。"}],"seconds":18}],"next":"m02.depart.herb"},{"id":"m02.depart.herb","type":"scene","act":2,"title":"外谷的第三个人","setting":"次日，青崖谷外谷。","beats":[{"visual":"采药告示写明两人合计四十工分，临时领队严承，药材由百草峰验收。镇山堂已封闭内谷，并将外谷入口与安全岩台标出。陆寻见严承姓名，停下。","dialogue":[{"speaker":"周野","text":"又是他。"},{"speaker":"陆寻","text":"百草峰缺药，巡守划了路，药也不是交给他。我们走自己的分工。"},{"speaker":"周野","text":"说好，谁让咱俩往禁线走，咱俩就回头。"}],"seconds":23},{"visual":"三人过登记亭。绳桥连接山门端与药坡；北侧旧药棚旁是备用牵引索和安全岩台，药棚后为镇山堂巡检门，门内封着尚未拆解的古物。巡守正在检查入口附近的异常回响。严承趁两人走在前面，从行囊取出一枚灰纹符；闪回早晨严家送货人递给他符纸，说可驱开小兽，严承付了一块灵石。送货人袖口有同样灰纹，严承并不知道其真实身份。","dialogue":[],"seconds":22},{"visual":"苏禾前日教过如何辨认成熟赤纹芝。周野先发现三纹叶背，陆寻找到岩缝中完整的一株。陆寻同时看到兽道的新鲜足迹，提醒严承尽快离开。","dialogue":[{"speaker":"陆寻","text":"采完这株就走。"},{"speaker":"严承","text":"怕什么？你们难道还想白领工钱？"}],"seconds":16},{"visual":"严承抢先割走灵芝，把灰符捏亮，符光沿岩缝扩散。他以为可驱走近处低阶妖兽，想让兄弟在混乱中退出，自己留药独占收益。灰符实际引来更多岩猞；兽群撞响外围警示阵。严承惊慌，催两人跑。","dialogue":[{"speaker":"周野","text":"你在干什么？"},{"speaker":"严承","text":"走！回桥！"}],"seconds":24}],"next":"m02.crisis.herb"},{"id":"m02.crisis.herb","type":"scene","act":2,"title":"他割断了桥","setting":"青崖谷绳桥与北侧岩台。","beats":[{"visual":"岩猞冲出兽道，三人奔向绳桥。严承抢先过桥，回头看见陆寻和周野还差数步。他怕妖兽追到自己，也怕两人回来揭发引兽，拔刀割断承重索。桥面坠下，周野伸手将陆寻拽离断口，自己右臂撞岩。陆寻用护臂挡住追来的兽爪，护臂裂开。","dialogue":[{"speaker":"陆寻","text":"别割！"},{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊！"},{"speaker":"周野","text":"陆寻，北边！"}],"seconds":26},{"visual":"兄弟沿北侧旧路撤往药棚。切高处：蒙面人观察兽群引起的警示阵动静，趁巡守分兵救援潜入封阵巡检门，另一人用灰纹令牌破坏外层警示阵。巡守闻警赶来，裴照雪率先一剑封兽道。镜头清楚显示：敌方主动借兽群混乱进入封物所在地，并非正好路过。","dialogue":[],"seconds":21},{"visual":"药棚旁，受损门阵的反冲堵住撤离口。周野右手无法抓绳，陆寻将他扶上石台。陆寻认出随队药工带来的安抚粉，按苏禾教过的标记请巡守取出使用；低阶岩猞暂缓扑势，药工撤入岩台。裴照雪以白剑截断袭向巡守的暗光，敌人退进巡检门。她留下两人保护伤员，自己带队追入。","dialogue":[{"speaker":"裴照雪","text":"伤者先走！别碰那扇门！"},{"speaker":"陆寻","text":"这边的牵引索卡住了！"}],"seconds":23},{"visual":"蒙面人从巡检门内冲出，怀里是一件破损的封物外壳。他试图以灰纹令牌打开外层撤路，却被裴照雪一剑逼退。外壳撞在岩壁上裂开，一枚带瞳纹的内芯从缺口滑落到药棚石台。蒙面人见空壳脱手，转身逃向北侧旧路。裴照雪不得不先挡住他反击巡守的暗光。","dialogue":[],"seconds":22},{"visual":"石台下的低阶牵引阵反冲加剧，周野与另一名受伤药工困在石台，绳索只要受力就被阵力猛拽。陆寻曾见过测阵石，发现瞳纹内芯与残阵明灭同频，误以为能帮助判断牵引阵；拾起没有反应，他试送一丝自身灵力。内芯瞳纹亮起，随后失光。陆寻捂住眼睛跪倒。","dialogue":[{"speaker":"周野","text":"别管我，先叫人！"},{"speaker":"陆寻","text":"等一下……这是测阵的？"}],"seconds":24},{"visual":"再睁眼，陆寻看见牵引阵的两层实际回流。表面暗下，深处仍在反冲。他试拉一次，绳索猛震，立即松手。第二次，他等两层退去，喊巡守拉绳；自己扶住周野和药工。两名巡守共同拉起绳索，将两人转移至安全岩台。下一次回力击碎空绳轮。","dialogue":[{"speaker":"陆寻","text":"先别拉！里面还有力……现在！"},{"speaker":"巡守","text":"上来了！两个都上来了！"},{"speaker":"周野","text":"你……怎么看出来的？"},{"speaker":"陆寻","text":"我也不知道。"}],"seconds":30},{"visual":"裴照雪从巡检门返回，白衣剑尖染灰。她看见陆寻准确喊出退力时间。北侧旧路有蒙面人逃离的灰纹灵流残迹，仍在一枚被丢下的低阶符片上运行；另一侧，封阵外门仍受反冲，伤者已经脱险，但巡守需要尽快封住门外低阶泄口，防止余力波及外谷。裴可以追敌，巡守也能处理泄口；陆寻能提供更精细的实际运行信息，但说出来会暴露自己的异常视野。","dialogue":[{"speaker":"裴照雪","text":"你刚才看见了什么？"},{"speaker":"陆寻","text":"……"},{"speaker":"巡守","text":"师姐，北边还有人逃，门边的阵力也没停！"}],"seconds":25}],"next":"m02.choice.herb"},{"id":"m02.choice.herb","type":"choice","act":2,"prompt":"周野和药工已经脱险。你发现逃敌留下的符片仍有微弱灵流，也看见封门外泄口的回力。裴照雪可以追敌，巡守可以封门。你准备怎样参与？","choices":[{"id":"pursue","text":"告诉裴照雪异常所见，请她追查灰符来源。","next":"m02.pursue.herb"},{"id":"seal","text":"留在封门外协助巡守撤离与封住泄口，暂不说明眼睛。","next":"m02.seal.herb"}]},{"id":"m02.pursue.herb","type":"scene","act":2,"title":"她回头等我说完","setting":"青崖谷安全岩台与封阵外门。","beats":[{"visual":"陆寻将实际看到的符片灵流方向指给裴照雪，说明自己刚才看见了残阵内部回力。裴以巡守检测石核对符片响应，确认它与逃敌使用的灰纹令牌相符；她让陆寻留在安全岩台，不带低阶伤员追敌，自己带一名巡守沿线追去。","dialogue":[{"speaker":"陆寻","text":"那片符还在动。和刚才他手上的令牌一样。"},{"speaker":"裴照雪","text":"你能看见？"},{"speaker":"陆寻","text":"能。刚刚才开始。"},{"speaker":"裴照雪","text":"好。你留在这，剩下的我来。"}],"seconds":25},{"visual":"画面切至北侧旧路：裴照雪截住受伤逃敌，剑尖击落其灰纹令牌，敌人以暗光掩护撤走；她没有贸然追入未知禁区。她带回实际令牌及符片，陆寻被登记为异常所见的线索提供者。","dialogue":[{"speaker":"裴照雪","text":"人走了，东西留下了。"},{"speaker":"陆寻","text":"能查到是谁吗？"},{"speaker":"裴照雪","text":"不能现在保证。但至少有东西可查。"}],"seconds":26},{"visual":"巡守收走失活内芯并封存。陆寻如实报告接触碎片、眼痛与救援经过。裴与协作巡守另记异常视觉及灰纹线索，限制查阅。回宗后，正式医修接手周野。苏禾一见两人，脸色变了。","dialogue":[{"speaker":"苏禾","text":"陆寻！你们怎么又把自己弄成这样？"},{"speaker":"陆寻","text":"他的手先治。"},{"speaker":"苏禾","text":"我知道。你也坐下。"}],"seconds":23},{"visual":"严承交验赤纹芝时被巡守当场拦下。断桥、领队独自返还、兄弟与药工证词、引兽符残留均已核对；严承承认使用购来的灰符，却坚称自己以为能驱兽。苏禾前日采药登记及药工证词证明兄弟按许可路线采药，百草峰拒绝严承独占药功。镇山堂没收本次药功，暂停领队，责令其承担已核定治疗费；是否与蒙面人相识仍待查。","dialogue":[{"speaker":"严承","text":"我买的是驱兽符！我哪知道会引来这么多！"},{"speaker":"陆寻","text":"你不知道符会引兽。可你知道我们还没过桥。"},{"speaker":"巡守","text":"跟我们走。"}],"seconds":25},{"visual":"三周后，周野能下床，右手仍无法稳定控灵。医修说明普通康复能恢复日常功能，精细器作需要更珍贵的养脉材料。苏禾取来百草峰药籍，指出青崖内侧旧药窟长有养脉藤，成熟藤髓可用于医修配药。镇山堂此次修复封阵后将组织正式清查，百草峰需要收回受影响的药圃；低阶协作人员须通过基础训练与医师许可方可加入。","dialogue":[{"speaker":"周野","text":"我还能做图、认材料。你别因为我耽误修炼。"},{"speaker":"陆寻","text":"先问清楚那药在哪里。"},{"speaker":"苏禾","text":"这不是一个人去的地方。等宗门清查开放，我们可以一起报名。"}],"seconds":27}],"next":"m03.learn.herb.pursue"},{"id":"m03.learn.herb.pursue","type":"scene","act":3,"title":"眼睛不是剑","setting":"青崖清查开放前一个月，公开练习坪。","beats":[{"visual":"镇山堂发布青崖清查差事：药窟外层已安全核验，低阶协作工役需能自保，正式弟子负责守护；百草峰收取一半成熟养脉藤髓用于救治伤者，其余按事前登记的实际获取贡献分配，禁止私入深层。苏禾参与药材辨认，周野在山门准备轻型采具。陆寻报名，必须先完成基础引气剑和防身步法考查。","dialogue":[{"speaker":"陆寻","text":"我想进去采藤髓。"},{"speaker":"教习","text":"会引气，不等于会用剑。先过这个靶。"}],"seconds":25},{"visual":"夜里，陆寻开启灵目观察自己的吐纳，发现第二息的余流尚未散尽便急接第三息。几次验证后，他第一次完整走完三息；闭眼复现。次日木剑训练，他仍被同境练习者击退。秦晚路过，认出陆寻。","dialogue":[{"speaker":"秦晚","text":"怎么从搬货改练剑了？"},{"speaker":"陆寻","text":"青崖那一趟，周野的手伤了。我也不想下次只会跑。"},{"speaker":"秦晚","text":"那先给我打一剑看看。"}],"seconds":25},{"visual":"秦晚用一线低阶火演示前一缕尚未散完，下一缕已接上。陆寻从实际灵流看到：第二次引气可在体内前一股余势尚存时准备，但不能增加总灵力。他尝试以基础引气剑衔接，木剑震动，第一道剑势乱掉。","dialogue":[{"speaker":"秦晚","text":"我这是火，你练的是剑。别照搬。"},{"speaker":"陆寻","text":"我不是要学火。我想让第二剑不必从头引气。"}],"seconds":27},{"visual":"数周短切。陆寻夜练、白日做工，周野用左手修整木剑柄，秦晚在公开训练时偶尔试接。陆寻终于闭眼发出前后两道剑势；秦晚第一次没接住第二道，第二次提前封住固定间隔。","dialogue":[{"speaker":"秦晚","text":"你看，第二剑再快，出剑时间一样，也会被人等着。"},{"speaker":"陆寻","text":"那就换个时间。"}],"seconds":23},{"visual":"陆寻先将第二股灵力留在体内，过早会撞乱，过晚则第一股余势完全消失。他失败三次，停下休息。再练时，秦晚提前举火幕；他延后一瞬再发第二剑，火幕已经偏移，第二剑命中后方试靶。秦晚收手笑起来。","dialogue":[{"speaker":"秦晚","text":"这回我没猜着。"},{"speaker":"陆寻","text":"只成了一次，再练。"},{"speaker":"秦晚","text":"行，我陪你。"}],"seconds":24},{"visual":"一个月后，教习考查通过。裴照雪核对之前异常视觉记录，确认陆寻实际闭眼复现术式，并提醒不要随意公开能力；她将灰纹令牌留给镇山堂继续追查。苏禾带药材辨识册来到集合点，周野用左手将修好的采具交给两人，自己留在安全区做轻役。","dialogue":[{"speaker":"周野","text":"给你们修好了。别把命赔进去。"},{"speaker":"苏禾","text":"放心，我知道哪株能采。"},{"speaker":"陆寻","text":"等我们回来。"}],"seconds":20}],"next":"m03.cave.herb.pursue"},{"id":"m03.cave.herb.pursue","type":"scene","act":3,"title":"药窟里的人","setting":"清查当天，青崖内侧旧药窟外层。","beats":[{"visual":"巡守开启已核验的外层药窟通道。正式弟子韩峥带队护送低阶采药人员，苏禾与陆寻跟随。韩峥炼气中段，陆寻亦为已有多年基础吐纳的炼气中段，过去缺少资源和完整指导，剑术仍远不及韩峥熟练。韩峥曾守住低阶岩猞通道。医师在入口告知成熟藤髓可采；若发现稀有玉髓，先清除危险，再由实际发现及参与者按事前约定分配，宗门收取的药材与额外玉髓分开。","dialogue":[{"speaker":"韩峥","text":"藤髓够就出来。别碰深处。"},{"speaker":"苏禾","text":"我只取成熟的，伤了根明年就没药。"}],"seconds":25},{"visual":"陆寻开启灵目，看到成熟藤根的实际灵力向石缝聚集。苏禾翻药籍，对照外露结晶，认出养脉玉髓：老藤吸纳地脉灵力后形成的罕见结晶，比普通藤髓更浓，且可分割成两份；份量不同，养脉改善程度不同。她先采足周野的成熟藤髓，送洞口医师确认并装入百草峰登记药囊。","dialogue":[{"speaker":"苏禾","text":"够了！周野那一份够了，剩下才是额外机缘。"},{"speaker":"陆寻","text":"先送回去。"}],"seconds":25},{"visual":"洞内突然传来兽吼。一只受灰纹残符刺激的同境低阶岩猞从侧缝冲出，守住玉髓所在石台。韩峥挡住第一爪，却被狭窄岩壁限制出剑角度。陆寻用练成的第一剑逼兽抬爪，延后第二剑击中旁边石靶般的松动石片，石片落下隔开兽爪；韩峥趁机以自己的剑势击退岩猞。两人合力守住撤离口，实际修炼成果兑现。","dialogue":[{"speaker":"韩峥","text":"刚才那第二剑，是你打的？"},{"speaker":"陆寻","text":"是。它下一次还会冲。"}],"seconds":28},{"visual":"岩猞退入侧缝。巡守确认普通药材已撤出，但玉髓石台只能再开放一轮清查；他们会先在洞口安全试坪核对两人的自愿采掘协议。韩峥提出合作：他负责引兽，陆寻协作取玉，按贡献平分。陆寻若要独取，可与他比试三式决定优先权；但一旦输掉，就必须退出此次额外玉髓争夺，不能再要求五五分。独取获胜也须由巡守先封侧缝、医师监督采出。","dialogue":[{"speaker":"韩峥","text":"合作，稳妥些。五五分。"},{"speaker":"韩峥","text":"想独取，就比三式。输的让出这一轮，不再分玉髓。"},{"speaker":"苏禾","text":"周野的药已经够了。这份机缘你自己拿主意。"}],"seconds":28}],"next":"m03.choice.herb.pursue"},{"id":"m03.choice.herb.pursue","type":"choice","act":3,"prompt":"周野的药已取得。与韩峥合作，双方都有真实所得；单独比试可能赢得整份玉髓，也可能空手而归。输掉后不能回头选合作。","choices":[{"id":"duel","text":"接受三式比试，冒失去整份机缘的风险。","next":"m03.duel.herb.pursue"},{"id":"join","text":"与韩峥合作，合力取玉髓，各得一半。","next":"m03.join.herb.pursue"}]},{"id":"m03.duel.herb.pursue","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"韩峥和陆寻到洞口安全试坪，巡守见证两人自愿比试。统一低阶练习器，点到即止；优先采掘只对额外玉髓有效，不影响百草峰药材。第一式韩峥把陆寻逼退；第二式他准确封住陆寻习惯的第二剑间隔。","dialogue":[{"speaker":"韩峥","text":"刚才在洞里我就看见了。你第二剑只快那么一点。"},{"speaker":"陆寻","text":"再来。"}],"seconds":25}],"next":"m03.duel.decision.herb.pursue"},{"id":"m03.duel.decision.herb.pursue","type":"choice","act":3,"prompt":"韩峥已经封住你的固定第二剑，虎口发麻。你还可以继续第三式，尝试自己练过但尚不熟练的变间隔；也可以认输保住手，放弃本轮玉髓。","choices":[{"id":"continue","text":"继续第三式，相信自己练成的剑术。","next":"m03.duel.win.herb.pursue"},{"id":"withdraw","text":"收剑认输，不为这次机缘硬撑。","next":"m03.duel.withdraw.herb.pursue"}]},{"id":"m03.duel.win.herb.pursue","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"第三式，韩峥提前截向固定间隔。陆寻将第二股灵力留在体内，先以第一剑护住身前，等韩峥压剑落空后再接出第二剑。剑势击亮韩峥肩前判定护具。韩峥停手，承认这次输了。巡守见证陆寻获得优先采掘权。","dialogue":[{"speaker":"韩峥","text":"你什么时候把第二剑变慢了？"},{"speaker":"陆寻","text":"你挡得太早。"},{"speaker":"韩峥","text":"好。你先采。"}],"seconds":28},{"visual":"巡守封住侧缝后，医师监督陆寻从已确认可采的石缝取出整枚玉髓。韩峥不再争夺，但他只承诺本次守通道，不建立后续共同历练关系。陆寻取得整份玉髓，独自拥有后续养脉机会。","dialogue":[{"speaker":"韩峥","text":"杂役能练成这样……下次外门见。"},{"speaker":"陆寻","text":"好。"}],"seconds":24},{"visual":"回宗后，苏禾将先前取得的成熟藤髓交正式医师配药。数周后，周野右手的低阶精细控灵逐步恢复，终于稳住一枚轻型练习零件，教习核验合格。陆寻在旁看着，周野把自己做的练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。你俩谁也别再逞强。"}],"seconds":25},{"visual":"陆寻在医师监督下使用整份玉髓，数周后能连续三次稳定复现衔接剑势；秦晚看完主动邀他再练，陆寻获得真实个人修炼优势。","dialogue":[{"speaker":"秦晚","text":"这回轮到我想看看你的第三剑了。"},{"speaker":"陆寻","text":"还没练成。"},{"speaker":"秦晚","text":"那我等着。"}],"seconds":25},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上有裴照雪追回的灰纹令牌与异常视觉记录。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.pursue.duel"},{"id":"end.herb.pursue.duel","type":"end","title":"独得玉髓·灰纹令牌","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野接受成熟藤髓配药治疗，右手精细控灵逐步恢复；陆寻独得整份玉髓，三轮衔接剑势稳定；无韩峥后续同行约定。","mid":"M04/M05须继承：苏禾共同采药、安抚粉救援与药工证词、医修申请、灰纹令牌及裴/巡守知情、整份玉髓及个人术式优势。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.duel.withdraw.herb.pursue","type":"scene","act":3,"title":"收剑","setting":"药窟外试坪与回宗后。","beats":[{"visual":"陆寻虎口仍在发麻。他收起练习剑，向韩峥认输。巡守见证韩峥取得本轮优先采掘资格。韩峥没有继续出剑，也没有把约定之外的玉髓送给陆寻。","dialogue":[{"speaker":"陆寻","text":"这一轮，你赢。"},{"speaker":"韩峥","text":"好。下次再比。"}],"seconds":24},{"visual":"医师监督韩峥取出玉髓，陆寻在出口看着他将整份玉髓收起。苏禾把已取得的普通藤髓药囊交给陆寻，提醒他原本来这里的目的已经做到。","dialogue":[{"speaker":"苏禾","text":"周野的药还在。"},{"speaker":"陆寻","text":"我知道。我这剑，还得练。"}],"seconds":24},{"visual":"回宗后正式医师配药。数周后，周野右手低阶控灵逐步恢复，亲手完成轻型练习零件，把练习剑柄递给陆寻。陆寻继续练习原有两道剑势，第三轮仍需停歇，没有玉髓改善。秦晚看见他虎口已恢复，主动邀请继续练剑。","dialogue":[{"speaker":"周野","text":"你没拿到玉髓？"},{"speaker":"陆寻","text":"没拿到。下回我再赢回来。"},{"speaker":"周野","text":"那你的剑柄，我先给你打。"}],"seconds":28},{"visual":"镇山堂复核室，失活内芯仍无回应。灰纹令牌和陆寻异常所见记录并列。长老停在陆寻名字上。","dialogue":[{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.pursue.withdraw"},{"id":"end.herb.pursue.withdraw","type":"end","title":"收剑再来","summary":"周野的普通藤髓治疗已兑现，陆寻主动认输，失去本轮额外玉髓；保留已练成的第二剑。M04–M06尚未写。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野治疗后精细控灵逐步恢复；陆寻认输失去玉髓，没有额外养脉改善，未获得韩峥同行约定。","mid":"M04/M05须继承：苏禾共同采药、安抚粉救援与药工证词、医修申请、灰纹令牌及裴/巡守知情、无玉髓、已练成第二剑及主动收剑经历。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.join.herb.pursue","type":"scene","act":3,"title":"这一次，剑不是一个人的","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"韩峥带陆寻回到石台外，巡守允许在已标定低阶范围内协同驱兽；苏禾在洞口保管药囊。韩峥先用剑势引兽离开玉髓石缝，陆寻观察岩猞实际蓄力，发现它每次扑击后会短暂停顿。","dialogue":[{"speaker":"韩峥","text":"你那第二剑能不能慢半息？"},{"speaker":"陆寻","text":"练过。你先退。"}],"seconds":25},{"visual":"岩猞扑向韩峥。陆寻第一剑截住其侧向扑势，韩峥后撤，陆寻没有立刻释放第二剑，待岩猞实际转向后才将体内准备好的第二股灵力送出，击落岩侧浮石，封住兽道。韩峥趁窗口将玉髓从经医师确认的可采位置完整取出，二人及时撤出；不是陆寻越级击杀妖兽。","dialogue":[{"speaker":"韩峥","text":"现在！"},{"speaker":"陆寻","text":"退！"},{"speaker":"韩峥","text":"拿到了！走！"}],"seconds":28},{"visual":"医师确认玉髓可分为两份相同品质的小块，但每份养脉效用有限。陆寻与韩峥按约各取一半，韩峥主动留下自己的传信牌，邀陆寻以后参加外门低阶同行试炼；双方不是永久师徒。","dialogue":[{"speaker":"韩峥","text":"你若以后进外门，来找我。"},{"speaker":"陆寻","text":"这次的账，五五。"},{"speaker":"韩峥","text":"说到做到。"}],"seconds":24},{"visual":"回宗后，苏禾将先前取得的成熟藤髓交正式医师配药。数周后，周野右手的低阶精细控灵逐步恢复，终于稳住一枚轻型练习零件，教习核验合格。陆寻在旁看着，周野把自己做的练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。你俩谁也别再逞强。"}],"seconds":25},{"visual":"陆寻使用自己半份玉髓，修炼稳定性有所改善，但第三轮剑势仍需停歇；韩峥来练习坪与他对剑，两人将共同取得的药窟经验用于实际练习。秦晚见他带来新同伴，笑着要求下一回三人同练。","dialogue":[{"speaker":"秦晚","text":"你还真交了个会用剑的朋友。"},{"speaker":"韩峥","text":"他那第二剑，得慢慢看。"},{"speaker":"秦晚","text":"好啊。下次带我一个。"}],"seconds":25},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上有裴照雪追回的灰纹令牌与异常视觉记录。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.pursue.join"},{"id":"end.herb.pursue.join","type":"end","title":"并肩取玉·灰纹令牌","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野接受成熟藤髓配药治疗，右手精细控灵逐步恢复；陆寻与韩峥各得半份玉髓，第三轮仍需停歇；取得韩峥真实同行邀约。","mid":"M04/M05须继承：苏禾共同采药、安抚粉救援与药工证词、医修申请、灰纹令牌及裴/巡守知情、半份玉髓及韩峥同盟机会。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m02.seal.herb","type":"scene","act":2,"title":"留下来的那个人","setting":"青崖谷安全岩台与封阵外门。","beats":[{"visual":"陆寻不主动说眼睛，只向巡守指出自己刚才实际观察到绳索震动的规律，协助撤离最后一批药工。巡守按正常程序关闭低阶泄口；陆寻负责将备用挡板移到指定位置，不操纵高阶封阵。裴照雪则独立追向北侧旧路。","dialogue":[{"speaker":"巡守","text":"挡板送过来！别越线！"},{"speaker":"陆寻","text":"周野，你别动，等我。"}],"seconds":25},{"visual":"陆寻与巡守搬动挡板，在退力窗口合上外侧低阶护闸。余震停止，药棚旁一具被冲歪的普通采药柜完好保住，柜内有当日救护药材。裴照雪追至岔路时失去敌人踪迹，只带回普通破损符片，未取得令牌。","dialogue":[{"speaker":"巡守","text":"关上了！药材还能用。"},{"speaker":"周野","text":"你还真是闲不住。"},{"speaker":"陆寻","text":"都到这了，总得把人送回去。"}],"seconds":26},{"visual":"巡守收走失活内芯并封存。陆寻如实报告接触碎片、眼痛与救援经过。陆寻未主动描述异常视觉，裴只知他参与正常救援；外侧药材和工役完整撤回。回宗后，正式医修接手周野。苏禾一见两人，脸色变了。","dialogue":[{"speaker":"苏禾","text":"陆寻！你们怎么又把自己弄成这样？"},{"speaker":"陆寻","text":"他的手先治。"},{"speaker":"苏禾","text":"我知道。你也坐下。"}],"seconds":23},{"visual":"严承交验赤纹芝时被巡守当场拦下。断桥、领队独自返还、兄弟与药工证词、引兽符残留均已核对；严承承认使用购来的灰符，却坚称自己以为能驱兽。苏禾前日采药登记及药工证词证明兄弟按许可路线采药，百草峰拒绝严承独占药功。镇山堂没收本次药功，暂停领队，责令其承担已核定治疗费；是否与蒙面人相识仍待查。","dialogue":[{"speaker":"严承","text":"我买的是驱兽符！我哪知道会引来这么多！"},{"speaker":"陆寻","text":"你不知道符会引兽。可你知道我们还没过桥。"},{"speaker":"巡守","text":"跟我们走。"}],"seconds":25},{"visual":"三周后，周野能下床，右手仍无法稳定控灵。医修说明普通康复能恢复日常功能，精细器作需要更珍贵的养脉材料。苏禾取来百草峰药籍，指出青崖内侧旧药窟长有养脉藤，成熟藤髓可用于医修配药。镇山堂此次修复封阵后将组织正式清查，百草峰需要收回受影响的药圃；低阶协作人员须通过基础训练与医师许可方可加入。","dialogue":[{"speaker":"周野","text":"我还能做图、认材料。你别因为我耽误修炼。"},{"speaker":"陆寻","text":"先问清楚那药在哪里。"},{"speaker":"苏禾","text":"这不是一个人去的地方。等宗门清查开放，我们可以一起报名。"}],"seconds":27}],"next":"m03.learn.herb.seal"},{"id":"m03.learn.herb.seal","type":"scene","act":3,"title":"眼睛不是剑","setting":"青崖清查开放前一个月，公开练习坪。","beats":[{"visual":"镇山堂发布青崖清查差事：药窟外层已安全核验，低阶协作工役需能自保，正式弟子负责守护；百草峰收取一半成熟养脉藤髓用于救治伤者，其余按事前登记的实际获取贡献分配，禁止私入深层。苏禾参与药材辨认，周野在山门准备轻型采具。陆寻报名，必须先完成基础引气剑和防身步法考查。","dialogue":[{"speaker":"陆寻","text":"我想进去采藤髓。"},{"speaker":"教习","text":"会引气，不等于会用剑。先过这个靶。"}],"seconds":25},{"visual":"夜里，陆寻开启灵目观察自己的吐纳，发现第二息的余流尚未散尽便急接第三息。几次验证后，他第一次完整走完三息；闭眼复现。次日木剑训练，他仍被同境练习者击退。秦晚路过，认出陆寻。","dialogue":[{"speaker":"秦晚","text":"怎么从搬货改练剑了？"},{"speaker":"陆寻","text":"青崖那一趟，周野的手伤了。我也不想下次只会跑。"},{"speaker":"秦晚","text":"那先给我打一剑看看。"}],"seconds":25},{"visual":"秦晚用一线低阶火演示前一缕尚未散完，下一缕已接上。陆寻从实际灵流看到：第二次引气可在体内前一股余势尚存时准备，但不能增加总灵力。他尝试以基础引气剑衔接，木剑震动，第一道剑势乱掉。","dialogue":[{"speaker":"秦晚","text":"我这是火，你练的是剑。别照搬。"},{"speaker":"陆寻","text":"我不是要学火。我想让第二剑不必从头引气。"}],"seconds":27},{"visual":"数周短切。陆寻夜练、白日做工，周野用左手修整木剑柄，秦晚在公开训练时偶尔试接。陆寻终于闭眼发出前后两道剑势；秦晚第一次没接住第二道，第二次提前封住固定间隔。","dialogue":[{"speaker":"秦晚","text":"你看，第二剑再快，出剑时间一样，也会被人等着。"},{"speaker":"陆寻","text":"那就换个时间。"}],"seconds":23},{"visual":"陆寻先将第二股灵力留在体内，过早会撞乱，过晚则第一股余势完全消失。他失败三次，停下休息。再练时，秦晚提前举火幕；他延后一瞬再发第二剑，火幕已经偏移，第二剑命中后方试靶。秦晚收手笑起来。","dialogue":[{"speaker":"秦晚","text":"这回我没猜着。"},{"speaker":"陆寻","text":"只成了一次，再练。"},{"speaker":"秦晚","text":"行，我陪你。"}],"seconds":24},{"visual":"一个月后，教习考查通过。陆寻只登记实际练成的引气剑和防身动作，裴照雪不知灵目。苏禾带药材辨识册来到集合点，周野用左手将修好的采具交给两人，自己留在安全区做轻役。","dialogue":[{"speaker":"周野","text":"给你们修好了。别把命赔进去。"},{"speaker":"苏禾","text":"放心，我知道哪株能采。"},{"speaker":"陆寻","text":"等我们回来。"}],"seconds":20}],"next":"m03.cave.herb.seal"},{"id":"m03.cave.herb.seal","type":"scene","act":3,"title":"药窟里的人","setting":"清查当天，青崖内侧旧药窟外层。","beats":[{"visual":"巡守开启已核验的外层药窟通道。正式弟子韩峥带队护送低阶采药人员，苏禾与陆寻跟随。韩峥炼气中段，陆寻亦为已有多年基础吐纳的炼气中段，过去缺少资源和完整指导，剑术仍远不及韩峥熟练。韩峥曾守住低阶岩猞通道。医师在入口告知成熟藤髓可采；若发现稀有玉髓，先清除危险，再由实际发现及参与者按事前约定分配，宗门收取的药材与额外玉髓分开。","dialogue":[{"speaker":"韩峥","text":"藤髓够就出来。别碰深处。"},{"speaker":"苏禾","text":"我只取成熟的，伤了根明年就没药。"}],"seconds":25},{"visual":"陆寻开启灵目，看到成熟藤根的实际灵力向石缝聚集。苏禾翻药籍，对照外露结晶，认出养脉玉髓：老藤吸纳地脉灵力后形成的罕见结晶，比普通藤髓更浓，且可分割成两份；份量不同，养脉改善程度不同。她先采足周野的成熟藤髓，送洞口医师确认并装入百草峰登记药囊。","dialogue":[{"speaker":"苏禾","text":"够了！周野那一份够了，剩下才是额外机缘。"},{"speaker":"陆寻","text":"先送回去。"}],"seconds":25},{"visual":"洞内突然传来兽吼。一只受灰纹残符刺激的同境低阶岩猞从侧缝冲出，守住玉髓所在石台。韩峥挡住第一爪，却被狭窄岩壁限制出剑角度。陆寻用练成的第一剑逼兽抬爪，延后第二剑击中旁边石靶般的松动石片，石片落下隔开兽爪；韩峥趁机以自己的剑势击退岩猞。两人合力守住撤离口，实际修炼成果兑现。","dialogue":[{"speaker":"韩峥","text":"刚才那第二剑，是你打的？"},{"speaker":"陆寻","text":"是。它下一次还会冲。"}],"seconds":28},{"visual":"岩猞退入侧缝。巡守确认普通药材已撤出，但玉髓石台只能再开放一轮清查；他们会先在洞口安全试坪核对两人的自愿采掘协议。韩峥提出合作：他负责引兽，陆寻协作取玉，按贡献平分。陆寻若要独取，可与他比试三式决定优先权；但一旦输掉，就必须退出此次额外玉髓争夺，不能再要求五五分。独取获胜也须由巡守先封侧缝、医师监督采出。","dialogue":[{"speaker":"韩峥","text":"合作，稳妥些。五五分。"},{"speaker":"韩峥","text":"想独取，就比三式。输的让出这一轮，不再分玉髓。"},{"speaker":"苏禾","text":"周野的药已经够了。这份机缘你自己拿主意。"}],"seconds":28}],"next":"m03.choice.herb.seal"},{"id":"m03.choice.herb.seal","type":"choice","act":3,"prompt":"周野的药已取得。与韩峥合作，双方都有真实所得；单独比试可能赢得整份玉髓，也可能空手而归。输掉后不能回头选合作。","choices":[{"id":"duel","text":"接受三式比试，冒失去整份机缘的风险。","next":"m03.duel.herb.seal"},{"id":"join","text":"与韩峥合作，合力取玉髓，各得一半。","next":"m03.join.herb.seal"}]},{"id":"m03.duel.herb.seal","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"韩峥和陆寻到洞口安全试坪，巡守见证两人自愿比试。统一低阶练习器，点到即止；优先采掘只对额外玉髓有效，不影响百草峰药材。第一式韩峥把陆寻逼退；第二式他准确封住陆寻习惯的第二剑间隔。","dialogue":[{"speaker":"韩峥","text":"刚才在洞里我就看见了。你第二剑只快那么一点。"},{"speaker":"陆寻","text":"再来。"}],"seconds":25}],"next":"m03.duel.decision.herb.seal"},{"id":"m03.duel.decision.herb.seal","type":"choice","act":3,"prompt":"韩峥已经封住你的固定第二剑，虎口发麻。你还可以继续第三式，尝试自己练过但尚不熟练的变间隔；也可以认输保住手，放弃本轮玉髓。","choices":[{"id":"continue","text":"继续第三式，相信自己练成的剑术。","next":"m03.duel.win.herb.seal"},{"id":"withdraw","text":"收剑认输，不为这次机缘硬撑。","next":"m03.duel.withdraw.herb.seal"}]},{"id":"m03.duel.win.herb.seal","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"第三式，韩峥提前截向固定间隔。陆寻将第二股灵力留在体内，先以第一剑护住身前，等韩峥压剑落空后再接出第二剑。剑势击亮韩峥肩前判定护具。韩峥停手，承认这次输了。巡守见证陆寻获得优先采掘权。","dialogue":[{"speaker":"韩峥","text":"你什么时候把第二剑变慢了？"},{"speaker":"陆寻","text":"你挡得太早。"},{"speaker":"韩峥","text":"好。你先采。"}],"seconds":28},{"visual":"巡守封住侧缝后，医师监督陆寻从已确认可采的石缝取出整枚玉髓。韩峥不再争夺，但他只承诺本次守通道，不建立后续共同历练关系。陆寻取得整份玉髓，独自拥有后续养脉机会。","dialogue":[{"speaker":"韩峥","text":"杂役能练成这样……下次外门见。"},{"speaker":"陆寻","text":"好。"}],"seconds":24},{"visual":"回宗后，苏禾将先前取得的成熟藤髓交正式医师配药。数周后，周野右手的低阶精细控灵逐步恢复，终于稳住一枚轻型练习零件，教习核验合格。陆寻在旁看着，周野把自己做的练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。你俩谁也别再逞强。"}],"seconds":25},{"visual":"陆寻在医师监督下使用整份玉髓，数周后能连续三次稳定复现衔接剑势；秦晚看完主动邀他再练，陆寻获得真实个人修炼优势。","dialogue":[{"speaker":"秦晚","text":"这回轮到我想看看你的第三剑了。"},{"speaker":"陆寻","text":"还没练成。"},{"speaker":"秦晚","text":"那我等着。"}],"seconds":25},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上只有破损灰符与接触者记录，尚无异常视觉的直接报告。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.seal.duel"},{"id":"end.herb.seal.duel","type":"end","title":"独得玉髓·守住外门","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野接受成熟藤髓配药治疗，右手精细控灵逐步恢复；陆寻独得整份玉髓，三轮衔接剑势稳定；无韩峥后续同行约定。","mid":"M04/M05须继承：苏禾共同采药、安抚粉救援与药工证词、医修申请、未追回令牌及无裴共同秘密、整份玉髓及个人术式优势。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.duel.withdraw.herb.seal","type":"scene","act":3,"title":"收剑","setting":"药窟外试坪与回宗后。","beats":[{"visual":"陆寻虎口仍在发麻。他收起练习剑，向韩峥认输。巡守见证韩峥取得本轮优先采掘资格。韩峥没有继续出剑，也没有把约定之外的玉髓送给陆寻。","dialogue":[{"speaker":"陆寻","text":"这一轮，你赢。"},{"speaker":"韩峥","text":"好。下次再比。"}],"seconds":24},{"visual":"医师监督韩峥取出玉髓，陆寻在出口看着他将整份玉髓收起。苏禾把已取得的普通藤髓药囊交给陆寻，提醒他原本来这里的目的已经做到。","dialogue":[{"speaker":"苏禾","text":"周野的药还在。"},{"speaker":"陆寻","text":"我知道。我这剑，还得练。"}],"seconds":24},{"visual":"回宗后正式医师配药。数周后，周野右手低阶控灵逐步恢复，亲手完成轻型练习零件，把练习剑柄递给陆寻。陆寻继续练习原有两道剑势，第三轮仍需停歇，没有玉髓改善。秦晚看见他虎口已恢复，主动邀请继续练剑。","dialogue":[{"speaker":"周野","text":"你没拿到玉髓？"},{"speaker":"陆寻","text":"没拿到。下回我再赢回来。"},{"speaker":"周野","text":"那你的剑柄，我先给你打。"}],"seconds":28},{"visual":"镇山堂复核室，失活内芯仍无回应。破损灰符及接触者登记并列。长老停在陆寻名字上。","dialogue":[{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.seal.withdraw"},{"id":"end.herb.seal.withdraw","type":"end","title":"收剑再来","summary":"周野的普通藤髓治疗已兑现，陆寻主动认输，失去本轮额外玉髓；保留已练成的第二剑。M04–M06尚未写。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野治疗后精细控灵逐步恢复；陆寻认输失去玉髓，没有额外养脉改善，未获得韩峥同行约定。","mid":"M04/M05须继承：苏禾共同采药、安抚粉救援与药工证词、医修申请、未追回令牌及无裴共同秘密、无玉髓、已练成第二剑及主动收剑经历。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.join.herb.seal","type":"scene","act":3,"title":"这一次，剑不是一个人的","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"韩峥带陆寻回到石台外，巡守允许在已标定低阶范围内协同驱兽；苏禾在洞口保管药囊。韩峥先用剑势引兽离开玉髓石缝，陆寻观察岩猞实际蓄力，发现它每次扑击后会短暂停顿。","dialogue":[{"speaker":"韩峥","text":"你那第二剑能不能慢半息？"},{"speaker":"陆寻","text":"练过。你先退。"}],"seconds":25},{"visual":"岩猞扑向韩峥。陆寻第一剑截住其侧向扑势，韩峥后撤，陆寻没有立刻释放第二剑，待岩猞实际转向后才将体内准备好的第二股灵力送出，击落岩侧浮石，封住兽道。韩峥趁窗口将玉髓从经医师确认的可采位置完整取出，二人及时撤出；不是陆寻越级击杀妖兽。","dialogue":[{"speaker":"韩峥","text":"现在！"},{"speaker":"陆寻","text":"退！"},{"speaker":"韩峥","text":"拿到了！走！"}],"seconds":28},{"visual":"医师确认玉髓可分为两份相同品质的小块，但每份养脉效用有限。陆寻与韩峥按约各取一半，韩峥主动留下自己的传信牌，邀陆寻以后参加外门低阶同行试炼；双方不是永久师徒。","dialogue":[{"speaker":"韩峥","text":"你若以后进外门，来找我。"},{"speaker":"陆寻","text":"这次的账，五五。"},{"speaker":"韩峥","text":"说到做到。"}],"seconds":24},{"visual":"回宗后，苏禾将先前取得的成熟藤髓交正式医师配药。数周后，周野右手的低阶精细控灵逐步恢复，终于稳住一枚轻型练习零件，教习核验合格。陆寻在旁看着，周野把自己做的练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。你俩谁也别再逞强。"}],"seconds":25},{"visual":"陆寻使用自己半份玉髓，修炼稳定性有所改善，但第三轮剑势仍需停歇；韩峥来练习坪与他对剑，两人将共同取得的药窟经验用于实际练习。秦晚见他带来新同伴，笑着要求下一回三人同练。","dialogue":[{"speaker":"秦晚","text":"你还真交了个会用剑的朋友。"},{"speaker":"韩峥","text":"他那第二剑，得慢慢看。"},{"speaker":"秦晚","text":"好啊。下次带我一个。"}],"seconds":25},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上只有破损灰符与接触者记录，尚无异常视觉的直接报告。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.seal.join"},{"id":"end.herb.seal.join","type":"end","title":"并肩取玉·守住外门","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"周野接受成熟藤髓配药治疗，右手精细控灵逐步恢复；陆寻与韩峥各得半份玉髓，第三轮仍需停歇；取得韩峥真实同行邀约。","mid":"M04/M05须继承：苏禾共同采药、安抚粉救援与药工证词、医修申请、未追回令牌及无裴共同秘密、半份玉髓及韩峥同盟机会。两人实际工分、护臂损坏、已取得藤髓与玉髓不可重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}}]};const nodes=Object.fromEntries(story.nodes.map(n=>[n.id,n]));let id=story.start,beat=0,trail=[],seen=new Set();const el=x=>document.getElementById(x);function add(parent,tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;parent.append(n);return n}function advance(next,nextBeat=0){trail.push({id,beat});id=next;beat=nextBeat;render()}function btn(text,fn){const n=add(el("options"),"button",text);n.onclick=fn;return n}function render(){const n=nodes[id],body=el("body");body.replaceChildren();el("options").replaceChildren();el("progress").textContent="已发现阶段结果 "+seen.size+"/"+story.nodes.filter(n=>n.type==="end").length;el("back").disabled=trail.length===0;el("title").textContent=n.type==="end"?n.title:"第"+n.act+"幕 · "+story.acts.find(a=>a.id===n.act).title;if(n.type==="scene"){add(body,"h2",n.title);add(body,"div",n.setting,"setting");const b=n.beats[beat];add(body,"div",b.visual,"visual");for(const d of b.dialogue){const line=add(body,"div","","line");add(line,"span",d.speaker+"：","speaker");add(line,"span",d.text)}add(body,"small","场内段落 "+(beat+1)+"/"+n.beats.length);btn("继续",()=>beat+1<n.beats.length?advance(id,beat+1):advance(n.next));}else if(n.type==="choice"){add(body,"h2","你的决定");add(body,"p",n.prompt);for(const x of n.choices)btn(x.text,()=>advance(x.next))}else{seen.add(id);el("progress").textContent="已发现阶段结果 "+seen.size+"/"+story.nodes.filter(n=>n.type==="end").length;add(body,"p",n.summary);const dl=add(body,"dl","");for(const [k,t] of [["immediate","当下"],["short","短期"],["mid","后续回收"],["long","全剧终局（未完成）"]]){add(dl,"dt",t);add(dl,"dd",n.outcomes[k])}btn("从头体验另一条路线",reset)}}function reset(){id=story.start;beat=0;trail=[];render()}el("restart").onclick=reset;el("back").onclick=()=>{if(trail.length){const p=trail.pop();id=p.id;beat=p.beat;render()}};render();</script></html>
