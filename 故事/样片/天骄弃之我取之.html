<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>见仙 · 天骄弃之，我取之</title><style>body{background:#171a20;color:#e9e5db;font:17px/1.8 system-ui,sans-serif;margin:0}main{max-width:800px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;color:#b6aea1;font-size:14px}h1{font-size:30px}h2{font-size:23px;margin:16px 0}.setting{color:#b6aea1}.visual{color:#d7cebb;background:#242932;border-left:3px solid #b79c6d;padding:14px;margin:18px 0;white-space:pre-wrap}.line{margin:12px 0}.speaker{color:#e5bf83;font-weight:bold}button{font:inherit;color:#e9e5db;background:#323a46;border:1px solid #697484;border-radius:8px;padding:10px 15px;cursor:pointer;margin:6px 0;text-align:left}button:hover{background:#414c5c}button:disabled{opacity:.45;cursor:default}.options button{display:block;width:100%}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}small{color:#b6aea1}dt{color:#e5bf83;margin-top:12px}dd{margin-left:0}#progress{font-size:13px;color:#b6aea1}</style><main><header><span>见仙 · 文字样片</span><span id="progress"></span></header><h1 id="title"></h1><div id="body"></div><div class="options" id="options"></div><nav><button id="back">上一段</button><button id="restart">重新开始</button></nav><small>独立非正典文字原型 · 无视频生成 · 手动推进</small></main><script>const story={"format":"beyondsight.text-story","version":1,"id":"demo.sword_gate","title":"天骄弃之，我取之","status":"noncanon_text_prototype","start":"a1.cliff","acts":[{"id":1,"title":"天骄拔剑，杂役拾环"},{"id":2,"title":"真正的机缘"},{"id":3,"title":"带着机缘活着出去"},{"id":4,"title":"一年后的选择"}],"nodes":[{"id":"a1.cliff","type":"scene","act":1,"title":"一百块灵石，买他一条命","setting":"黄昏，断剑秘境外层，悬在深渊上的石台。","beats":[{"visual":"冷开场。青铜古剑悬于祭台上空，三条锁链绷得笔直。严承一脚踩住周野的手背，周野半个身子悬在石台外，下面是看不见底的云海。陆寻冲到台边。远处秦晚正被另一段垮塌石道隔开。","dialogue":[],"seconds":9},{"visual":"严承从周野腰间扯下一枚带宗门印记的探路玉牌。那是外围工役按原定契约领取的报酬凭证。周野死死抓住台沿。","dialogue":[{"speaker":"严承","text":"玉牌给我，回去我给你们一百块灵石。"},{"speaker":"周野","text":"那是我俩的撤离牌！没它怎么出去？"},{"speaker":"严承","text":"你还真以为，我打算带你们出去？"}],"seconds":17},{"visual":"陆寻没有争辩，俯身抓住周野手腕。严承踢开他膝前的碎石，随即收回脚，转身奔向祭台；对他而言抢剑比再动手更紧迫。陆寻用双手和背带把周野拉上石台。周野的右手血肉模糊，左手还能活动。","dialogue":[{"speaker":"周野","text":"别管那牌了……剑台马上要开。"},{"speaker":"陆寻","text":"牌可以再拿。你只有一条命。"}],"seconds":17}],"next":"a1.sword"},{"id":"a1.sword","type":"scene","act":1,"title":"天骄取剑","setting":"同一时刻，断剑秘境外层祭台。","beats":[{"visual":"画面拉远：外围石台与中央祭台相连，祭台北侧是一条完整的回廊，秦晚从回廊绕来。四周立着古代剑修留下的试剑碑。古剑每一次震动，都有一道金色灵流从地面向剑身汇聚。数名外门弟子围在祭台外，不敢靠近。严承提前拿出自己家中购得的低阶护体玉符。","dialogue":[{"speaker":"围观弟子","text":"上品剑器！光这一柄，少说值上千灵石！"},{"speaker":"严承","text":"都让开。谁敢跟我抢？"}],"seconds":17},{"visual":"秦晚从回廊跃下，红衣在冷风中翻起。她先将周野扶进石柱后的安全凹处，用干净布条裹住他的手，并检查他清醒。她瞥见严承手中的双人撤离牌。","dialogue":[{"speaker":"秦晚","text":"严承！把他们的牌还回来。"},{"speaker":"严承","text":"师姐，这剑归我。我那份撤离牌，还能带一个人。你要是愿意……"},{"speaker":"秦晚","text":"你留着给自己收尸吧。"}],"seconds":19},{"visual":"严承在护符庇护下拔出古剑。众人退开，金光冲上穹顶。祭台边缘一块不起眼的黑铁环从石座上松脱，滚到陆寻脚边。严承随手踢开它。","dialogue":[{"speaker":"严承","text":"陆寻，想要仙缘？捡去吧。赏你的。"}],"seconds":13},{"visual":"灵目主观画面：古剑上仍有耀眼灵光，但那股灵流正在从黑铁环断开；铁环内部三道细小回路仍在脉动，与远处剑碑同频。陆寻不能从所见直接得知名字或用途。他记起入境前看过的外层碑文：'以环承脉，剑为门引；环离其座，门将归寂。' 此刻碑文与实际灵流相符。他拾起黑环，没有冒险向其中输入大量灵力。","dialogue":[{"speaker":"周野","text":"你还真要他扔的东西？"},{"speaker":"陆寻","text":"他拿走的，是剑。"},{"speaker":"陆寻","text":"这东西，刚才在给那柄剑供力。"}],"seconds":24}],"next":"a1.reversal"},{"id":"a1.reversal","type":"scene","act":1,"title":"你拔的是门栓","setting":"祭台与北侧回廊交界。","beats":[{"visual":"严承挥剑，第一道剑光将一块石碑劈开。围观弟子惊呼。第二次催动时，剑光骤然黯淡；第三次，古剑只发出一声空鸣。严承愣住。与此同时，黑环在陆寻掌中发热。祭台深处原有的一扇封门显出完整阵纹。","dialogue":[],"seconds":16},{"visual":"陆寻把黑环靠近门侧碑文标出的环形凹槽。环中细流与门阵相接，门自行开启一线；陆寻没有强行破阵。裂缝中一柄又一柄光影剑浮起，沿石壁排成漫长的古剑谱。众人终于明白那柄金剑只是外门引剑，而内层传承另有入口。","dialogue":[{"speaker":"围观弟子","text":"那柄剑……是开门用的？"},{"speaker":"周野","text":"严承，你花那么多力气，拔了个门栓？"},{"speaker":"秦晚","text":"陆寻，把环收起来。"}],"seconds":20},{"visual":"严承脸上的笑意消失。他提着已失去阵力、仍然锋利的古剑走来，伸手向陆寻索环。秦晚挡在陆寻身前，掌中火焰升起。严承的家传护符尚有余力，秦晚不敢在伤员旁强行爆发。北廊尽头传来石钟低鸣：碑文规定内层门开启后，外层将在三次钟响内退出通道；持双人牌者可走东侧短阵，未持牌者可沿北廊等外层公用传送阵。第一声已经响过。","dialogue":[{"speaker":"严承","text":"环也是我先发现的。拿来。"},{"speaker":"陆寻","text":"你刚才不是赏给我了吗？"},{"speaker":"严承","text":"你敢拿我的东西？"},{"speaker":"秦晚","text":"在场的人都听见了。"}],"seconds":23},{"visual":"门内有可见的短廊与一道完整封印。碑上还有内层规则：持环者可开启一次内室；可自行进入，或在开启时将环交另一人。内室的传承分为一次可供自身修习的剑息种子与可留存的公开入门碑文；入口仍由黑环控制。外层撤离路径清楚，周野已坐稳，秦晚足以护他沿北廊撤离。严承正堵在东侧短阵前。","dialogue":[],"seconds":17}],"next":"choice1"},{"id":"choice1","type":"choice","act":1,"prompt":"黑环在你手中。严承想夺环，内室已经开启，撤离钟声正在逼近。你准备怎样反击？","choices":[{"id":"face","text":"不再退让。让严承当众交还撤离牌。","next":"a2.face"},{"id":"enter","text":"先进入内室。别让任何人夺走真正的传承。","next":"a2.enter"}]},{"id":"a2.face","type":"scene","act":2,"title":"我等的就是你拔剑","setting":"祭台北端，离周野所在凹处数步。","beats":[{"visual":"陆寻将黑环收进贴身布袋，走到秦晚旁边，指向严承腰间的撤离牌。秦晚没有离开伤员的保护范围。严承认为陆寻不敢动手，抢先提剑冲来。","dialogue":[{"speaker":"陆寻","text":"牌还我。你伤我兄弟的账，今天也该算了。"},{"speaker":"严承","text":"凭你？"},{"speaker":"秦晚","text":"陆寻，别硬接那柄剑！"}],"seconds":16},{"visual":"闪回两息：此前陆寻曾在普通试剑场反复练过低阶卸力剑式；灵目让他看见严承护符实际运转时外层灵力集中在迎击面，侧面随动作短暂失稳。他并非复制护符，只是在严承冲近时使用自己已经练成的卸力与步法。画面回到祭台：严承重斩落空，陆寻借石柱隔开剑锋，从侧面一剑击中对方持剑手的护符边缘。","dialogue":[],"seconds":17},{"visual":"护符亮了一瞬，随即因先前拔剑消耗与这一击叠加而碎裂。严承的古剑脱手，插进石缝。陆寻将他压倒在台边，剑尖抵住其肩前衣料，不伤要害。周野看着严承，忍着疼笑出声。","dialogue":[{"speaker":"严承","text":"你……你怎么知道我这符……"},{"speaker":"陆寻","text":"你身上那点本事，也配让我跪？"},{"speaker":"周野","text":"牌。我的牌。"}],"seconds":18},{"visual":"陆寻拿回双人撤离牌，秦晚检查其印记未损。严承试图再抢，秦晚以火幕隔断他的前路。围观弟子终于有人出声愿意作证；严承退到北廊，被其他弟子看守，随队走公用撤离阵。第二声钟响。陆寻有时间带秦晚进入门内短廊，周野由另一名愿作证的同门陪同先走北廊；三人明确约定出口会合。","dialogue":[{"speaker":"秦晚","text":"你刚才那一剑……不是以前的卸力式。"},{"speaker":"陆寻","text":"是。我只练熟了这一式。"},{"speaker":"秦晚","text":"那你以后，可别只给我看这一式。"}],"seconds":22}],"next":"a2.claim.face"},{"id":"a2.enter","type":"scene","act":2,"title":"门内有人等着你","setting":"内室短廊。","beats":[{"visual":"陆寻把黑环按进门侧凹槽，跨入短廊。秦晚先把周野交给愿意护送的两名同门，让他们沿北廊走公用撤离阵；随后她跟进内室，严承被门阵弹开，没有环无法入内。双人撤离牌暂仍在严承身上，周野并未靠它才能撤离。","dialogue":[{"speaker":"陆寻","text":"周野，出口见。"},{"speaker":"周野","text":"去吧！这回别捡一块石头就出来！"},{"speaker":"秦晚","text":"我去看看里面。你别自己乱碰。"}],"seconds":20},{"visual":"门内剑影如雨，却只沿两侧刻痕运行。尽头一座石案上浮着一缕银白剑息，旁边是刻有低阶入门法的碑。碑文记载：完整剑息须留在内室阵中完成承接，只有一人可取得；承接后短时间无法全力运功，必须由另一人护送。也可不承接，持环退出，待宗门长辈检查。","dialogue":[],"seconds":20},{"visual":"秦晚靠近石案，目光第一次真正停在陆寻身上。她问他刚才为何能认出黑环。陆寻没有交代灵目本源，只告诉她自己能看到某些灵力变化，其他原因还未弄清。秦晚伸手将他的衣领拉正，遮住他因灵目发热而泛红的眼角。","dialogue":[{"speaker":"秦晚","text":"这事别逢人就说。"},{"speaker":"陆寻","text":"师姐不问了？"},{"speaker":"秦晚","text":"你想告诉我时，自然会告诉我。"}],"seconds":19}],"next":"a2.claim.enter"},{"id":"a4.take.face","type":"scene","act":4,"title":"当初是谁赏我的","setting":"一个月后，重明宗外门演武场。","beats":[{"visual":"陆寻经过一月训练，已经能够让剑息参与低阶术式，但未跳过境界。严承夺牌伤人经证词与当场追回的撤离牌查实，受到处分、赔付周野并失去后续历练资格。陆寻在公开演武中以自己炼化出的短促剑势击败同阶领先者，围观者认出他就是当众夺回牌的人。","dialogue":[],"seconds":23},{"visual":"一年后，陆寻以连续实战成绩获得宗门正式剑道培养资格；周野凭器坊考评和历练记录晋升外门。秦晚坐在陆寻常练剑的石阶上，拿出当年在秘境用过的布带，笑着晃了晃。","dialogue":[{"speaker":"秦晚","text":"当初有人说捡破烂。现在那个破烂，值多少？"},{"speaker":"陆寻","text":"不卖。"},{"speaker":"秦晚","text":"那你这个人呢？我想借去历练几天。"},{"speaker":"陆寻","text":"借多久？"},{"speaker":"秦晚","text":"看你表现。"}],"seconds":26},{"visual":"山下有一名陌生修士递来邀约，问陆寻是否愿意展示如何识别古阵灵流。陆寻拒绝，收剑离开。公开取胜给他赢得声名，也使灵目秘密需要更谨慎地保护；此篇不假装后续危机已经解决。","dialogue":[],"seconds":13}],"next":"end.take.face"},{"id":"end.take.face","type":"end","title":"一剑夺运","summary":"公开反击严承、亲自承接剑息，以个人实力赢得声名。","outcomes":{"immediate":"夺回撤离牌、击败严承、承接剑息，秦晚护送脱险；周野获救。","short":"严承受查；陆寻承接后恢复，开始独立修炼剑息。","mid":"一个月后严承受处分并赔付，陆寻公开演武取胜；能力异常引人关注。","long":"一年后陆寻凭实战获正式剑道培养，周野独立升外门，秦晚主动同行邀约；公开名声带来被窥探风险。"}},{"id":"a4.take.enter","type":"scene","act":4,"title":"这一剑，只给你看","setting":"一个月后，山腰无人练剑坪。","beats":[{"visual":"陆寻与秦晚共同核验了剑息的初步炼化效果。他用已学术式引出一道银白短剑势，击断远处经允许用于训练的石靶；秦晚睁大眼睛，随后用自己的火术试探，与陆寻共同确认其仍受低阶灵力限制。","dialogue":[{"speaker":"秦晚","text":"你在外面可没说你能练到这种程度。"},{"speaker":"陆寻","text":"所以才叫你来看。"},{"speaker":"秦晚","text":"那我是不是第一个？"},{"speaker":"陆寻","text":"是。"}],"seconds":22},{"visual":"同一时间，严承夺牌伤人的证词经周野、秦晚和现场弟子核验，撤离牌由巡守追回，严承受处分并赔付；没有陆寻当众击倒他的事件，也没有那份公开战绩。陆寻按普通弟子身份继续历练，不主动展示异常识阵过程。","dialogue":[],"seconds":14},{"visual":"一年后，陆寻凭逐步炼化与正常历练取得正式剑道培养资格，选择保留山外行动自由。周野独立考评入外门。夜色中，秦晚在山门外等陆寻，两人的行囊靠在一起。她递给陆寻一枚自己制作的传信玉牌。","dialogue":[{"speaker":"秦晚","text":"上次你把手交给我，这次我把后背交给你。"},{"speaker":"陆寻","text":"去哪？"},{"speaker":"秦晚","text":"去看看山外还有多少人不识宝。"}],"seconds":25}],"next":"end.take.enter"},{"id":"end.take.enter","type":"end","title":"藏锋同行","summary":"先守住真正机缘，再与可信同伴共同成长，不以公开打脸换声名。","outcomes":{"immediate":"承接剑息、保存碑文；秦晚护送脱险，周野安全撤离，严承暂未被陆寻当众击败。","short":"陆寻恢复并秘密练剑，严承夺牌伤人接受调查。","mid":"一个月后严承受处分并赔付，陆寻只向秦晚展示初步剑息成果。","long":"一年后陆寻凭历练获正式剑道培养资格，周野独立晋升，秦晚与陆寻共同山外历练；没有公开取胜带来的额外名声。"}},{"id":"a2.claim.face","type":"scene","act":2,"title":"真正的传承","setting":"内室石案前，第二声钟响余音。","beats":[{"visual":"共通承接段。两人站在同一位置，黑环插在石案前的凹槽中。银白剑息持续运行，陆寻通过灵目看见它与入门碑上刻出的运转次序相合；这不是让他直接掌握高阶剑诀，而是一枚能在自身修炼中逐步消化的剑息种子。秦晚指出：门阵尚能维持一段时间，外层撤离阵不会因为选择不同而消失。","dialogue":[],"seconds":18},{"visual":"石案底部显出第二行文字：承接者须以自己的低阶灵力维持通路；成功后可带出剑息，却不能再把它交给宗门；不承接则能将黑环完整交出，宗门可在下一次开阵时检查并安排承接。碑文已可抄录，任何路线均能保存这份低阶公开法。陆寻抄下碑文，秦晚负责看守短廊。","dialogue":[{"speaker":"秦晚","text":"现在收，你就是第一个承接的人。但出来以后，你得靠我护着。"},{"speaker":"秦晚","text":"不收，我们把东西交给师父。你能争一个正式承接机会，不必现在赌。"},{"speaker":"陆寻","text":"你觉得呢？"},{"speaker":"秦晚","text":"机缘是你拿到的。你决定。"}],"seconds":25}],"next":"choice2.face"},{"id":"choice2.face","type":"choice","act":2,"prompt":"完整剑息只能由一人承接。现在承接能保住机缘，但会暂时虚弱；交回黑环则有宗门庇护，也失去独占权。","choices":[{"id":"take","text":"现在承接剑息，请秦晚护我出秘境。","next":"a3.take.face"},{"id":"return","text":"先不承接，把完整黑环交给宗门核验。","next":"a3.return.face"}]},{"id":"a3.take.face","type":"scene","act":3,"title":"别松手","setting":"内室与北廊出口。","beats":[{"visual":"陆寻坐在石案前，按照碑文逐段运行自己的灵力。银白剑息一点点没入经脉，最后凝成一枚尚未炼化的剑息种子。陆寻脸色发白，却没有昏迷。他收回已经失去内室钥匙功能的黑环，保留抄录碑文。第三声钟响。秦晚扶他起身。","dialogue":[{"speaker":"陆寻","text":"拿到了。"},{"speaker":"秦晚","text":"那就别逞强。手给我。"}],"seconds":21},{"visual":"两人沿北廊向外。石道轻颤，一块落石砸在他们前方。秦晚以火术护住头顶碎石，陆寻靠她的手臂站稳，认出回廊旁早先见过的侧行小道，带她绕行。画面从远景切到两人的手。","dialogue":[{"speaker":"秦晚","text":"以后再有这种事，先跟我说一声。"},{"speaker":"陆寻","text":"怕你不肯。"},{"speaker":"秦晚","text":"我怕的是你死在我没看见的地方。"}],"seconds":21},{"visual":"外层公用撤离阵前，周野坐在担架上，左手挥动。秦晚确认陆寻能站稳才松手。严承已被同门看守并交巡守，追回的撤离牌一并登记。陆寻向出口巡守报告内室承接事实与碑文，不公开灵目。","dialogue":[],"seconds":19}],"next":"a4.take.face"},{"id":"a2.claim.enter","type":"scene","ac ce(id,beat+1):advance(n.next));}else if(n.type==="choice"){add(body,"h2","你的决定");add(body,"p",n.prompt);for(const x of n.choices)btn(x.text,()=>advance(x.next))}else{seen.add(id);el("progress").textContent="已发现结局 "+seen.size+"/4";add(body,"p",n.summary);const dl=add(body,"dl","");for(const [k,t] of [["immediate","当下"],["short","短期"],["mid","一个月后"],["long","一年后"]]){add(dl,"dt",t);add(dl,"dd",n.outcomes[k])}btn("从头体验另一条路线",reset)}}function reset(){id=story.start;beat=0;trail=[];render()}el("restart").onclick=reset;el("back").onclick=()=>{if(trail.length){const p=trail.pop();id=p.id;beat=p.beat;render()}};render();</script></html>
