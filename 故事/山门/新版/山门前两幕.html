<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>见仙 · 山门·断桥与开目</title><style>body{background:#171a20;color:#e9e5db;font:17px/1.8 system-ui,sans-serif;margin:0}main{max-width:800px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;color:#b6aea1;font-size:14px}h1{font-size:30px}h2{font-size:23px;margin:16px 0}.setting{color:#b6aea1}.visual{color:#d7cebb;background:#242932;border-left:3px solid #b79c6d;padding:14px;margin:18px 0;white-space:pre-wrap}.line{margin:12px 0}.speaker{color:#e5bf83;font-weight:bold}button{font:inherit;color:#e9e5db;background:#323a46;border:1px solid #697484;border-radius:8px;padding:10px 15px;cursor:pointer;margin:6px 0;text-align:left}button:hover{background:#414c5c}button:disabled{opacity:.45;cursor:default}.options button{display:block;width:100%}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}small{color:#b6aea1}dt{color:#e5bf83;margin-top:12px}dd{margin-left:0}#progress{font-size:13px;color:#b6aea1}</style><main><header><span>见仙 · 文字样片</span><span id="progress"></span></header><h1 id="title"></h1><div id="body"></div><div class="options" id="options"></div><nav><button id="back">上一段</button><button id="restart">重新开始</button></nav><small>独立非正典文字原型 · 无视频生成 · 手动推进</small></main><script>const story={"format":"beyondsight.text-story","version":1,"id":"mountain.m01_m02","title":"山门·断桥与开目","status":"draft_text_prototype","start":"m01.hook","acts":[{"id":1,"title":"山门之下"},{"id":2,"title":"断桥与开目"}],"nodes":[{"id":"m01.hook","type":"scene","act":1,"title":"一块灵石，十天苦役","setting":"清晨，重明宗杂役院外，开山礼将启。","beats":[{"visual":"近景：陆寻把五石的护臂价牌翻过来，背面写着自己积攒的五十六工分。严承从柜台拿走一副同款护臂，拆下旧护臂，随手扔入废料筐。远处七峰浮空，剑光横过天际。陆寻低头看看自己磨破的袖口。","dialogue":[],"seconds":9},{"visual":"严承见陆寻望着废护臂，故意捡起来，试了一下扣带，又扔回废料筐。一块下品灵石从他的袖口滚落，他用靴子停住，随后让同伴捡起。柜台旁，外门弟子领取十二石月例；杂役月例折合两石。","dialogue":[{"speaker":"严承","text":"想要？这副早就坏了。你们杂役倒是不挑。"},{"speaker":"周野","text":"一块灵石，咱们得干十天。"},{"speaker":"陆寻","text":"走。别求他。"}],"seconds":18},{"visual":"工役告示前，陆寻的工分牌写着五十六，护臂需一百。今天加运一趟可得四分，却撞上基础吐纳公开课的后半段。堂内教习正说第三息如何续接。陆寻站在门外，听见值事催促开山礼搬运。","dialogue":[{"speaker":"周野","text":"你去听，我替你搬？"},{"speaker":"陆寻","text":"双人签的差事，你一个人搬要扣钱。走。"}],"seconds":20},{"visual":"两人抬着沉重木箱走过山门。陆寻回头时，堂门已经合上。镜头掠过他在掌心写下的半句口诀，后半截空着。周野把自己藏着的一块干饼掰开。","dialogue":[{"speaker":"周野","text":"等咱俩进了外门，你听课，我学炼器。"},{"speaker":"陆寻","text":"先把这箱子送到。"}],"seconds":13}],"next":"m01.fire"},{"id":"m01.fire","type":"scene","act":1,"title":"天骄收火","setting":"云阶坪，七峰开山礼。","beats":[{"visual":"七峰旗帜依次展开。秦晚一袭红衣站在高台，指尖赤焰化为一道长虹，掠过悬空铜环，七个火环依次点亮，观礼弟子欢呼。陆寻和周野在下层货道仰头，肩上的箱子还未放下。","dialogue":[],"seconds":17},{"visual":"一只受惊角兽撞开外围低阶兽栏，奔入载货道。秦晚原本要释放最后一轮火术，看到下方工役，手势骤变，漫天赤焰收束成一线，逼兽远离人群。侧闸却被沉重的货箱堵住。","dialogue":[{"speaker":"秦晚","text":"下面的人！往侧闸走！"},{"speaker":"周野","text":"侧闸卡死了！"}],"seconds":16},{"visual":"陆寻认出固定绳轮和卸货板。两人将载货板斜架在低矮隔栏上，推开堵住侧闸的木箱，让困住的工役越过货道。陆寻的掌背擦出一道血痕；周野在另一端压住板。秦晚收火后与镇山巡守合力制住角兽，未让火焰扫过工役。","dialogue":[],"seconds":24},{"visual":"火光散去。秦晚从高台走下来，裙摆沾上雨水和泥点。她走到两名杂役面前，蹲下看陆寻掌背。值事想把两人的贡献写成例行工役。秦晚将登记牌推回去。","dialogue":[{"speaker":"秦晚","text":"我挡住兽，他们开了逃路。少写一个字，我都不签。"},{"speaker":"值事","text":"这……"},{"speaker":"秦晚","text":"你叫什么？"},{"speaker":"陆寻","text":"陆寻。"},{"speaker":"周野","text":"周野。"},{"speaker":"秦晚","text":"好。我记住了。"}],"seconds":22},{"visual":"镇山值事确认两人完成原差事，四工分照付，另核定救援奖励：每人二十工分；陆寻另可将自己的二十工分救援奖励换成一张公开低阶训练场的三次入场券。两项只可择一，周野的奖励不受影响。训练场教习可补讲第三息与基础卸力；护臂价牌仍为一百工分。秦晚不是私下赏赐，而是让值事当面登记两种合法奖励。","dialogue":[{"speaker":"秦晚","text":"钱能救急，课也能救命。你自己选。"},{"speaker":"周野","text":"我的那份我拿工分，你别替我操心。"}],"seconds":23}],"next":"m01.choice"},{"id":"m01.choice","type":"choice","act":1,"prompt":"你已有六十工分。额外救援奖励可以换工分，也可以换三次正式训练机会。","choices":[{"id":"cash","text":"先拿二十工分，尽快买到护臂。","next":"m01.cash"},{"id":"lesson","text":"换三次训练机会，把没听完的课补回来。","next":"m01.lesson"}]},{"id":"m01.cash","type":"scene","act":1,"title":"还差一块","setting":"数日内，山腰器坊与公开训练场。","beats":[{"visual":"陆寻账牌变成八十工分，周野将自己的二十工分借给他。两人凑足一百，买下低阶护臂；陆寻在账纸写明欠周野二十。护臂只是普通防护器具，不是高阶法宝。","dialogue":[{"speaker":"周野","text":"欠我一块灵石，等你发财了还。"},{"speaker":"陆寻","text":"记着。"}],"seconds":24},{"visual":"庶务堂公布青崖谷采药差事：两人协作，完成可得四十工分，由同为杂役但有家学的严承临时领队。任务在开放的外围采区，不是已知禁区。陆寻与周野核对路线，接下差事。严承在远处看到他们，嘴角一扬。","dialogue":[{"speaker":"周野","text":"四十。干完这趟，咱们就喘口气。"},{"speaker":"严承","text":"放心，跟着我，有的是好处。"}],"seconds":15}],"next":"m02.bridge.cash"},{"id":"m02.bridge.cash","type":"scene","act":2,"title":"你们不是挺能干吗","setting":"数日后，青崖谷外围。","beats":[{"visual":"赤纹芝在岩缝间闪着微光。严承抢先割下药芝，把原定由自己搬的药篓推给周野；远处岩猞兽被异常气味引来。陆寻发现严承已经越过绳桥，招呼周野撤离。","dialogue":[{"speaker":"严承","text":"四十工分就值得你们这么计较？我换副护臂都不止这个数。"}],"seconds":18},{"visual":"严承站在山门端，看到两人尚在谷内，拔刀割断桥索，带着赤纹芝离去。桥面塌落，周野猛地把陆寻拽离断口，自己肩背撞在岩壁上。岩猞兽逼近。","dialogue":[{"speaker":"陆寻","text":"严承！"},{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊。"}],"seconds":19},{"visual":"陆寻以新买的护臂挡住一次掠过的兽爪，护臂开裂，手臂免于严重撕伤。他拖住周野向旧路退；周野的肩伤使他无法独自爬坡。","dialogue":[],"seconds":20},{"visual":"冷白剑光从谷口斩下，沿已有岩缝封住兽道。裴照雪持剑站在高处，白衣沾了山风中的细雨。她先令巡守把伤者带离危险，再截住追兽。收剑时右腕微微一颤，随即恢复平静。","dialogue":[{"speaker":"裴照雪","text":"伤者先走。"},{"speaker":"陆寻","text":"桥是严承割的！"},{"speaker":"裴照雪","text":"我听见了。等你们活着出去，再把话说完。"}],"seconds":21},{"visual":"济生院内，苏禾协助正式医修处理周野肩伤。严承递来一张写着擅自离队的认责单。苏禾把它按在桌外，原始伤情记录由正式医修签署。严承还想争辩。","dialogue":[{"speaker":"严承","text":"他们不是都活着回来了吗？"},{"speaker":"苏禾","text":"活着，不等于没受伤。"},{"speaker":"陆寻","text":"这账我记下了。"}],"seconds":20},{"visual":"时间经过数周。严承因擅离和断桥初步被停领队、限制危险差事；引兽来源仍待核验，不声称已判谋杀。周野获医修许可做轻役登记，不能负重；陆寻也已恢复普通搬运。两人未得到未验收的四十工分，药费先治疗后核责。镜头停在周野原本准备学炼器的报名纸上。","dialogue":[{"speaker":"周野","text":"别去找他拼命。咱们先活得比他好。"},{"speaker":"陆寻","text":"好。"}],"seconds":19}],"next":"m02.raid.cash"},{"id":"m02.raid.cash","type":"scene","act":2,"title":"封苑的那只眼","setting":"康复数周后，封苑外仓，夜。","beats":[{"visual":"两人接普通修阵材料交接差事。外仓可合法进入，内苑封物室隔墙禁止通行。固定绳轮、备用承重木墩和撤离口清楚可见。周野坐在登记桌旁核对轻物，陆寻推车。","dialogue":[],"seconds":13},{"visual":"警钟突响。内苑传来陌生暗光，巡守命外仓人员撤离。隔墙一段阵基破损，冲击传向外仓，一根旧梁偏移。周野发现陆寻正从梁下经过，猛推他一把，自己被倒梁压住。","dialogue":[{"speaker":"陆寻","text":"周野！"},{"speaker":"周野","text":"走……"}],"seconds":17},{"visual":"内苑封物室靠外仓的一角发生局部坍塌。封物外壳碎裂，一枚拇指大小的瞳纹内芯随碎石从实际破口滚入外仓，停在陆寻手边。镜头不展示敌人身份。陆寻试用绳轮抬梁，却发现梁上残阵忽明忽暗；贸然拉动可能再压伤周野。","dialogue":[],"seconds":18},{"visual":"陆寻拾起同步闪烁的内芯，以为是测阵器具，送入极少量自身灵力试探。内芯脱离供能后短暂处于可迁移状态，主动灵力接触触发原有感知结构一次性转入陆寻，内芯失去光泽；不是古仙选中他，也没有修为灌顶。陆寻捂眼跪倒。","dialogue":[],"seconds":20},{"visual":"重新睁眼。外仓画面分出肉眼看不见的两层灵流：表层熄灭后深层仍回流。陆寻第一次误判，梁震动，立即停手。他盯住下一次完整回流，发现梁的余力在两次间歇中短暂释放。绳轮与木墩已经在手边；他呼叫到场巡守协助，不凭眼睛抬梁。","dialogue":[{"speaker":"陆寻","text":"别拉！等一下……现在！"}],"seconds":22},{"visual":"巡守按他的指示拉绳，陆寻将木墩推入已抬起的梁下。周野被拖出，医修接手。第二根梁随下一轮回流坠落，砸在周野刚才的位置。陆寻眼角渗出泪，终于松开手。附近巡守震惊于一个杂役竟能辨出残阵退力间隔。","dialogue":[{"speaker":"陆寻","text":"这次……我拉住你了。"}],"seconds":20},{"visual":"裴照雪随镇山巡守来到外仓。她看到陆寻说出安全间隔后梁才被抬起，问他如何判断。失活内芯已经由巡守收集，接触记录与眼痛需要如实登记。她单独问陆寻有没有看见异常。正式医修正在为周野救治。","dialogue":[{"speaker":"裴照雪","text":"你刚才看见了什么？"},{"speaker":"陆寻","text":"……"},{"speaker":"裴照雪","text":"我只问你看见的，不问你不知道的。"}],"seconds":18}],"next":"m02.choice.cash"},{"id":"m02.choice.cash","type":"choice","act":2,"prompt":"你不知道眼睛发生了什么。裴照雪看到了异常救援。接触内芯和眼痛都必须如实登记；是否向她说明你看见的灵流？","choices":[{"id":"tell","text":"告诉裴照雪，我看见了两层灵流。","next":"m02.tell.cash"},{"id":"private","text":"先只报告接触碎片与眼痛，异常视野暂不向她透露。","next":"m02.private.cash"}]},{"id":"m02.tell.cash","type":"scene","act":2,"title":"她没有拔剑","setting":"封苑外仓至济生院。","beats":[{"visual":"陆寻用指尖在地上画出两层回流方向，说明自己也不知道为何看见。裴照雪先核对残阵记录，确认他说的是可观察的局部变化，不断言他得了神通。她以巡守身份在限制查阅的补充记录上写下真实所见，并提醒陆寻接受后续专项检查；她不替他销毁记录。","dialogue":[{"speaker":"陆寻","text":"表面灭了，里面还在走。我……能看见。"},{"speaker":"裴照雪","text":"这不是你该在这里说第二遍的事。先去治眼。"},{"speaker":"陆寻","text":"师姐信我？"},{"speaker":"裴照雪","text":"我信刚才那根梁。"}],"seconds":25},{"visual":"济生院，医修告知周野暂时脱离生命危险，仍须观察。苏禾拿来两份药单，陆寻下意识想说自己的眼睛没事。苏禾挡在他面前。","dialogue":[{"speaker":"苏禾","text":"你每次都说没事。周野差点回不来，你也想让我等在这里吗？"},{"speaker":"陆寻","text":"眼睛疼。还有重影。"},{"speaker":"苏禾","text":"好。那就治。"}],"seconds":18},{"visual":"十余日后，医修允许恢复低负荷训练。陆寻在床边观察自身浅层灵流，发现第三息之前一直有一缕未散尽的回流。数次轻负荷验证后，他调整等待时机，首次完整走完第三息。随后又过数周，陆寻获准正常练习；短蒙太奇里他把已学会的基础引气掌练到能闭眼复现。第三息使原本散失的一部分力量进入掌中，不是修为灌顶。","dialogue":[],"seconds":22},{"visual":"陆寻把已开裂的护臂放在床边，不能继续用于危险训练。周野醒来，看见账纸上二十工分欠款仍在。陆寻写下：药钱我出。","dialogue":[{"speaker":"周野","text":"我又不是死人，别什么都往自己身上揽。"},{"speaker":"陆寻","text":"等我赚回来，你就知道了。"}],"seconds":18}],"next":"m02.payoff.cash.tell"},{"id":"end.cash.tell","type":"end","title":"护臂·有人知晓","summary":"前两幕阶段结局：周野获救，陆寻获得灵目，首次完成第三息并凭实际练成的基础术式赢得五块灵石；支付两块药散，余三块。下一幕尚未编写。","outcomes":{"immediate":"取得护臂，挡兽后损坏，欠周野20工分。向裴照雪说明异常视觉，留下受限补充记录。","short":"周野脱险仍需康复；严承断桥初步受限，调查未结束；陆寻赢得五块灵石，支付两块药散，余三块。裴照雪已给正式复核预约牌，知异常视觉及实际试招表现。","mid":"已确定后续创作约束（未写M03–M05）：护臂损坏与欠款必须回收，不能再次免费获得训练经验。裴照雪可据共同事实提供一次正式复核机会，但调查记录可追溯。","long":"本部终局尚未创作，不能宣称确定；M06必须回收严承责任、周野前途、灵目知情与机缘去向。本阶段不是整部游戏结局。"}},{"id":"m02.private.cash","type":"scene","act":2,"title":"先把秘密留给自己","setting":"封苑外仓至济生院。","beats":[{"visual":"陆寻说明触碰碎片、眼痛、看到梁震动后等待间歇的真实经过，但暂不主动描述异常视觉。裴照雪没有逼问，也没有承诺替他隐藏什么；她记录救援过程。内芯接触事实仍登记，若正式专项询问必须如实回答。","dialogue":[{"speaker":"陆寻","text":"我碰了碎片，眼睛很疼。梁震的时候我等了一会儿。"},{"speaker":"裴照雪","text":"好。先治伤。以后想起什么，来找镇山堂。"}],"seconds":25},{"visual":"济生院，医修告知周野暂时脱离生命危险，仍须观察。苏禾拿来两份药单，陆寻下意识想说自己的眼睛没事。苏禾挡在他面前。","dialogue":[{"speaker":"苏禾","text":"你每次都说没事。周野差点回不来，你也想让我等在这里吗？"},{"speaker":"陆寻","text":"眼睛疼。还有重影。"},{"speaker":"苏禾","text":"好。那就治。"}],"seconds":18},{"visual":"十余日后，医修允许恢复低负荷训练。陆寻在床边观察自身浅层灵流，发现第三息之前一直有一缕未散尽的回流。数次轻负荷验证后，他调整等待时机，首次完整走完第三息。随后又过数周，陆寻获准正常练习；短蒙太奇里他把已学会的基础引气掌练到能闭眼复现。第三息使原本散失的一部分力量进入掌中，不是修为灌顶。","dialogue":[],"seconds":22},{"visual":"陆寻把已开裂的护臂放在床边，不能继续用于危险训练。周野醒来，看见账纸上二十工分欠款仍在。陆寻写下：药钱我出。","dialogue":[{"speaker":"周野","text":"我又不是死人，别什么都往自己身上揽。"},{"speaker":"陆寻","text":"等我赚回来，你就知道了。"}],"seconds":18}],"next":"m02.payoff.cash.private"},{"id":"end.cash.private","type":"end","title":"护臂·秘而未宣","summary":"前两幕阶段结局：周野获救，陆寻获得灵目，首次完成第三息并凭实际练成的基础术式赢得五块灵石；支付两块药散，余三块。下一幕尚未编写。","outcomes":{"immediate":"取得护臂，挡兽后损坏，欠周野20工分。未向裴照雪主动透露异常视觉，接触和伤情如实登记。","short":"周野脱险仍需康复；严承断桥初步受限，调查未结束；陆寻赢得五块灵石，支付两块药散，余三块。裴照雪不知道异常视觉，未给复核预约；教习仅知公开挑战成功。","mid":"已确定后续创作约束（未写M03–M05）：护臂损坏与欠款必须回收，不能再次免费获得训练经验。裴照雪不知道异常视觉，不得出现共同秘密对白；陆寻需自行寻求验证。","long":"本部终局尚未创作，不能宣称确定；M06必须回收严承责任、周野前途、灵目知情与机缘去向。本阶段不是整部游戏结局。"}},{"id":"m01.lesson","type":"scene","act":1,"title":"终于能从正门进去","setting":"数日内，山腰器坊与公开训练场。","beats":[{"visual":"陆寻领到三次入场券，工分仍为六十。三次训练的短蒙太奇：教习补完第三息，陆寻反复练习基础卸力，最后独自站稳。没有凭三堂课掌握高阶剑术。","dialogue":[{"speaker":"教习","text":"第三息别抢。先让前两息走完。"},{"speaker":"陆寻","text":"再来一次。"}],"seconds":24},{"visual":"庶务堂公布青崖谷采药差事：两人协作，完成可得四十工分，由同为杂役但有家学的严承临时领队。任务在开放的外围采区，不是已知禁区。陆寻与周野核对路线，接下差事。严承在远处看到他们，嘴角一扬。","dialogue":[{"speaker":"周野","text":"四十。干完这趟，咱们就喘口气。"},{"speaker":"严承","text":"放心，跟着我，有的是好处。"}],"seconds":15}],"next":"m02.bridge.lesson"},{"id":"m02.bridge.lesson","type":"scene","act":2,"title":"你们不是挺能干吗","setting":"数日后，青崖谷外围。","beats":[{"visual":"赤纹芝在岩缝间闪着微光。严承抢先割下药芝，把原定由自己搬的药篓推给周野；远处岩猞兽被异常气味引来。陆寻发现严承已经越过绳桥，招呼周野撤离。","dialogue":[{"speaker":"严承","text":"四十工分就值得你们这么计较？我换副护臂都不止这个数。"}],"seconds":18},{"visual":"严承站在山门端，看到两人尚在谷内，拔刀割断桥索，带着赤纹芝离去。桥面塌落，周野猛地把陆寻拽离断口，自己肩背撞在岩壁上。岩猞兽逼近。","dialogue":[{"speaker":"陆寻","text":"严承！"},{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊。"}],"seconds":19},{"visual":"陆寻用三次训练学会的基础卸力避开兽爪，仍被碎岩划伤前臂。他借地势稳住周野，拖着他向旧路退。不是战胜妖兽，只是争得撤退窗口。","dialogue":[],"seconds":20},{"visual":"冷白剑光从谷口斩下，沿已有岩缝封住兽道。裴照雪持剑站在高处，白衣沾了山风中的细雨。她先令巡守把伤者带离危险，再截住追兽。收剑时右腕微微一颤，随即恢复平静。","dialogue":[{"speaker":"裴照雪","text":"伤者先走。"},{"speaker":"陆寻","text":"桥是严承割的！"},{"speaker":"裴照雪","text":"我听见了。等你们活着出去，再把话说完。"}],"seconds":21},{"visual":"济生院内，苏禾协助正式医修处理周野肩伤。严承递来一张写着擅自离队的认责单。苏禾把它按在桌外，原始伤情记录由正式医修签署。严承还想争辩。","dialogue":[{"speaker":"严承","text":"他们不是都活着回来了吗？"},{"speaker":"苏禾","text":"活着，不等于没受伤。"},{"speaker":"陆寻","text":"这账我记下了。"}],"seconds":20},{"visual":"时间经过数周。严承因擅离和断桥初步被停领队、限制危险差事；引兽来源仍待核验，不声称已判谋杀。周野获医修许可做轻役登记，不能负重；陆寻也已恢复普通搬运。两人未得到未验收的四十工分，药费先治疗后核责。镜头停在周野原本准备学炼器的报名纸上。","dialogue":[{"speaker":"周野","text":"别去找他拼命。咱们先活得比他好。"},{"speaker":"陆寻","text":"好。"}],"seconds":19}],"next":"m02.raid.lesson"},{"id":"m02.raid.lesson","type":"scene","act":2,"title":"封苑的那只眼","setting":"康复数周后，封苑外仓，夜。","beats":[{"visual":"两人接普通修阵材料交接差事。外仓可合法进入，内苑封物室隔墙禁止通行。固定绳轮、备用承重木墩和撤离口清楚可见。周野坐在登记桌旁核对轻物，陆寻推车。","dialogue":[],"seconds":13},{"visual":"警钟突响。内苑传来陌生暗光，巡守命外仓人员撤离。隔墙一段阵基破损，冲击传向外仓，一根旧梁偏移。周野发现陆寻正从梁下经过，猛推他一把，自己被倒梁压住。","dialogue":[{"speaker":"陆寻","text":"周野！"},{"speaker":"周野","text":"走……"}],"seconds":17},{"visual":"内苑封物室靠外仓的一角发生局部坍塌。封物外壳碎裂，一枚拇指大小的瞳纹内芯随碎石从实际破口滚入外仓，停在陆寻手边。镜头不展示敌人身份。陆寻试用绳轮抬梁，却发现梁上残阵忽明忽暗；贸然拉动可能再压伤周野。","dialogue":[],"seconds":18},{"visual":"陆寻拾起同步闪烁的内芯，以为是测阵器具，送入极少量自身灵力试探。内芯脱离供能后短暂处于可迁移状态，主动灵力接触触发原有感知结构一次性转入陆寻，内芯失去光泽；不是古仙选中他，也没有修为灌顶。陆寻捂眼跪倒。","dialogue":[],"seconds":20},{"visual":"重新睁眼。外仓画面分出肉眼看不见的两层灵流：表层熄灭后深层仍回流。陆寻第一次误判，梁震动，立即停手。他盯住下一次完整回流，发现梁的余力在两次间歇中短暂释放。绳轮与木墩已经在手边；他呼叫到场巡守协助，不凭眼睛抬梁。","dialogue":[{"speaker":"陆寻","text":"别拉！等一下……现在！"}],"seconds":22},{"visual":"巡守按他的指示拉绳，陆寻将木墩推入已抬起的梁下。周野被拖出，医修接手。第二根梁随下一轮回流坠落，砸在周野刚才的位置。陆寻眼角渗出泪，终于松开手。附近巡守震惊于一个杂役竟能辨出残阵退力间隔。","dialogue":[{"speaker":"陆寻","text":"这次……我拉住你了。"}],"seconds":20},{"visual":"裴照雪随镇山巡守来到外仓。她看到陆寻说出安全间隔后梁才被抬起，问他如何判断。失活内芯已经由巡守收集，接触记录与眼痛需要如实登记。她单独问陆寻有没有看见异常。正式医修正在为周野救治。","dialogue":[{"speaker":"裴照雪","text":"你刚才看见了什么？"},{"speaker":"陆寻","text":"……"},{"speaker":"裴照雪","text":"我只问你看见的，不问你不知道的。"}],"seconds":18}],"next":"m02.choice.lesson"},{"id":"m02.choice.lesson","type":"choice","act":2,"prompt":"你不知道眼睛发生了什么。裴照雪看到了异常救援。接触内芯和眼痛都必须如实登记；是否向她说明你看见的灵流？","choices":[{"id":"tell","text":"告诉裴照雪，我看见了两层灵流。","next":"m02.tell.lesson"},{"id":"private","text":"先只报告接触碎片与眼痛，异常视野暂不向她透露。","next":"m02.private.lesson"}]},{"id":"m02.tell.lesson","type":"scene","act":2,"title":"她没有拔剑","setting":"封苑外仓至济生院。","beats":[{"visual":"陆寻用指尖在地上画出两层回流方向，说明自己也不知道为何看见。裴照雪先核对残阵记录，确认他说的是可观察的局部变化，不断言他得了神通。她以巡守身份在限制查阅的补充记录上写下真实所见，并提醒陆寻接受后续专项检查；她不替他销毁记录。","dialogue":[{"speaker":"陆寻","text":"表面灭了，里面还在走。我……能看见。"},{"speaker":"裴照雪","text":"这不是你该在这里说第二遍的事。先去治眼。"},{"speaker":"陆寻","text":"师姐信我？"},{"speaker":"裴照雪","text":"我信刚才那根梁。"}],"seconds":25},{"visual":"济生院，医修告知周野暂时脱离生命危险，仍须观察。苏禾拿来两份药单，陆寻下意识想说自己的眼睛没事。苏禾挡在他面前。","dialogue":[{"speaker":"苏禾","text":"你每次都说没事。周野差点回不来，你也想让我等在这里吗？"},{"speaker":"陆寻","text":"眼睛疼。还有重影。"},{"speaker":"苏禾","text":"好。那就治。"}],"seconds":18},{"visual":"十余日后，医修允许恢复低负荷训练。陆寻在床边观察自身浅层灵流，发现第三息之前一直有一缕未散尽的回流。数次轻负荷验证后，他调整等待时机，首次完整走完第三息。随后又过数周，陆寻获准正常练习；短蒙太奇里他把已学会的基础引气掌练到能闭眼复现。第三息使原本散失的一部分力量进入掌中，不是修为灌顶。","dialogue":[],"seconds":22},{"visual":"陆寻把用完的训练券夹入讲义，周野醒来，看到他终于补全了那半句口诀。陆寻写下：药钱我出。","dialogue":[{"speaker":"周野","text":"我又不是死人，别什么都往自己身上揽。"},{"speaker":"陆寻","text":"等我赚回来，你就知道了。"}],"seconds":18}],"next":"m02.payoff.lesson.tell"},{"id":"end.lesson.tell","type":"end","title":"半堂课·有人知晓","summary":"前两幕阶段结局：周野获救，陆寻获得灵目，首次完成第三息并凭实际练成的基础术式赢得五块灵石；支付两块药散，余三块。下一幕尚未编写。","outcomes":{"immediate":"完成三次训练，学会基础卸力，前臂划伤。向裴照雪说明异常视觉，留下受限补充记录。","short":"周野脱险仍需康复；严承断桥初步受限，调查未结束；陆寻赢得五块灵石，支付两块药散，余三块。裴照雪已给正式复核预约牌，知异常视觉及实际试招表现。","mid":"已确定后续创作约束（未写M03–M05）：实际训练经历可用于后续卸力动作，不凭空持有护臂。裴照雪可据共同事实提供一次正式复核机会，但调查记录可追溯。","long":"本部终局尚未创作，不能宣称确定；M06必须回收严承责任、周野前途、灵目知情与机缘去向。本阶段不是整部游戏结局。"}},{"id":"m02.private.lesson","type":"scene","act":2,"title":"先把秘密留给自己","setting":"封苑外仓至济生院。","beats":[{"visual":"陆寻说明触碰碎片、眼痛、看到梁震动后等待间歇的真实经过，但暂不主动描述异常视觉。裴照雪没有逼问，也没有承诺替他隐藏什么；她记录救援过程。内芯接触事实仍登记，若正式专项询问必须如实回答。","dialogue":[{"speaker":"陆寻","text":"我碰了碎片，眼睛很疼。梁震的时候我等了一会儿。"},{"speaker":"裴照雪","text":"好。先治伤。以后想起什么，来找镇山堂。"}],"seconds":25},{"visual":"济生院，医修告知周野暂时脱离生命危险，仍须观察。苏禾拿来两份药单，陆寻下意识想说自己的眼睛没事。苏禾挡在他面前。","dialogue":[{"speaker":"苏禾","text":"你每次都说没事。周野差点回不来，你也想让我等在这里吗？"},{"speaker":"陆寻","text":"眼睛疼。还有重影。"},{"speaker":"苏禾","text":"好。那就治。"}],"seconds":18},{"visual":"十余日后，医修允许恢复低负荷训练。陆寻在床边观察自身浅层灵流，发现第三息之前一直有一缕未散尽的回流。数次轻负荷验证后，他调整等待时机，首次完整走完第三息。随后又过数周，陆寻获准正常练习；短蒙太奇里他把已学会的基础引气掌练到能闭眼复现。第三息使原本散失的一部分力量进入掌中，不是修为灌顶。","dialogue":[],"seconds":22},{"visual":"陆寻把用完的训练券夹入讲义，周野醒来，看到他终于补全了那半句口诀。陆寻写下：药钱我出。","dialogue":[{"speaker":"周野","text":"我又不是死人，别什么都往自己身上揽。"},{"speaker":"陆寻","text":"等我赚回来，你就知道了。"}],"seconds":18}],"next":"m02.payoff.lesson.private"},{"id":"end.lesson.private","type":"end","title":"半堂课·秘而未宣","summary":"前两幕阶段结局：周野获救，陆寻获得灵目，首次完成第三息并凭实际练成的基础术式赢得五块灵石；支付两块药散，余三块。下一幕尚未编写。","outcomes":{"immediate":"完成三次训练，学会基础卸力，前臂划伤。未向裴照雪主动透露异常视觉，接触和伤情如实登记。","short":"周野脱险仍需康复；严承断桥初步受限，调查未结束；陆寻赢得五块灵石，支付两块药散，余三块。裴照雪不知道异常视觉，未给复核预约；教习仅知公开挑战成功。","mid":"已确定后续创作约束（未写M03–M05）：实际训练经历可用于后续卸力动作，不凭空持有护臂。裴照雪不知道异常视觉，不得出现共同秘密对白；陆寻需自行寻求验证。","long":"本部终局尚未创作，不能宣称确定；M06必须回收严承责任、周野前途、灵目知情与机缘去向。本阶段不是整部游戏结局。"}},{"id":"m02.payoff.cash.tell","type":"scene","act":2,"title":"五十天，只用了三掌","setting":"数周后，公开试掌场及济生院。","beats":[{"visual":"公开外场，镇山堂举行低阶招式演示悬赏：由外门试练弟子以规定低阶力量守一面试掌旗，杂役挑战者三次尝试内触到旗面，得五块下品灵石；守旗者若守住也有报酬。场上有监护教习，禁止法器、符箓、伤人。布告此前已公开，本场是训练悬赏而非身份考试。陆寻看见五块灵石摆在木盘中。","dialogue":[],"seconds":19},{"visual":"裴照雪依据之前的补充记录，在场边请教习允许陆寻按公开规则参加，并观察其正常术式，不给予高阶指点或额外权限。她知道陆寻的异常视觉，但不向旁人透露；陆寻仍须遵守同一悬赏规则。","dialogue":[{"speaker":"裴照雪","text":"只用你自己真正练会的东西。"},{"speaker":"陆寻","text":"我知道。"}],"seconds":16},{"visual":"陆寻走到场中。守旗弟子修为比他深，但按规则只能用低阶引气掌拦截。第一次尝试，陆寻被推退数步；第二次，他将第三息完整接入掌势，依旧只擦到旗杆。对手放松下来，认定他没有第三次机会。陆寻没有依赖对方犯规。","dialogue":[{"speaker":"守旗弟子","text":"回去再练两年吧。"}],"seconds":20},{"visual":"第三次。陆寻压住急于出手的冲动，完整走完自己反复练成的第三息。他以同一基础掌式接住规定力量的拦截，掌势比过去稳定许多，侧身擦过对手掌缘，手指触到旗面。","dialogue":[],"seconds":19},{"visual":"铜铃响起。教习宣布挑战成功，把五块灵石一块一块放进陆寻掌中。方才笑他的人停下说话。陆寻看着这些石头：这是以前要干五十天才能换来的资源。","dialogue":[{"speaker":"教习","text":"五块。你自己赢的。"},{"speaker":"陆寻","text":"谢谢。"}],"seconds":14},{"visual":"裴照雪等人群散开才走近，把一张正式复核预约牌递给陆寻。她可以作为巡守见证者协助他向镇山堂申请受限异常核验，不保证结果或隐瞒宗门。陆寻知道自己获得了一个可信的见证，也留下更清晰的追查线索。","dialogue":[{"speaker":"裴照雪","text":"你那天说的两层灵流，我想再确认一次。明日来镇山堂。"},{"speaker":"陆寻","text":"好。"}],"seconds":16},{"visual":"济生院。陆寻从五块灵石中取两块交作本次普通药散的费用，剩余三块自己保留；旧药费及责任赔付仍另核，不重复计入。周野看着剩下的三块灵石，伸手捏了一块，又放回陆寻掌中。","dialogue":[{"speaker":"周野","text":"你真赚的？"},{"speaker":"陆寻","text":"我自己赢的。"},{"speaker":"周野","text":"那以后，我也赢一次给你看。"}],"seconds":16},{"visual":"镜头切向封苑内苑。阵修将失活内芯置于检测盘，检测盘毫无回应。册页上列着包括陆寻在内的接触及伤员记录。","dialogue":[{"speaker":"阵修","text":"东西还在。"},{"speaker":"另一名值事","text":"那里面原来的东西呢？"}],"seconds":11}],"next":"end.cash.tell"},{"id":"m02.payoff.cash.private","type":"scene","act":2,"title":"五十天，只用了三掌","setting":"数周后，公开试掌场及济生院。","beats":[{"visual":"公开外场，镇山堂举行低阶招式演示悬赏：由外门试练弟子以规定低阶力量守一面试掌旗，杂役挑战者三次尝试内触到旗面，得五块下品灵石；守旗者若守住也有报酬。场上有监护教习，禁止法器、符箓、伤人。布告此前已公开，本场是训练悬赏而非身份考试。陆寻看见五块灵石摆在木盘中。","dialogue":[],"seconds":19},{"visual":"陆寻自行在公开报名处登记。裴照雪不在此场，没有共同秘密或特别推荐。几名外门弟子见他的杂役袍，嘲笑他是来看灵石的。","dialogue":[{"s
