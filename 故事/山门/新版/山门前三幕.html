<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>见仙 · 山门·灰纹与第二剑</title><style>body{background:#171a20;color:#e9e5db;font:17px/1.8 system-ui,sans-serif;margin:0}main{max-width:800px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;color:#b6aea1;font-size:14px}h1{font-size:30px}h2{font-size:23px;margin:16px 0}.setting{color:#b6aea1}.visual{color:#d7cebb;background:#242932;border-left:3px solid #b79c6d;padding:14px;margin:18px 0;white-space:pre-wrap}.line{margin:12px 0}.speaker{color:#e5bf83;font-weight:bold}button{font:inherit;color:#e9e5db;background:#323a46;border:1px solid #697484;border-radius:8px;padding:10px 15px;cursor:pointer;margin:6px 0;text-align:left}button:hover{background:#414c5c}button:disabled{opacity:.45;cursor:default}.options button{display:block;width:100%}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}small{color:#b6aea1}dt{color:#e5bf83;margin-top:12px}dd{margin-left:0}#progress{font-size:13px;color:#b6aea1}</style><main><header><span>见仙 · 文字样片</span><span id="progress"></span></header><h1 id="title"></h1><div id="body"></div><div class="options" id="options"></div><nav><button id="back">上一段</button><button id="restart">重新开始</button></nav><small>独立非正典文字原型 · 无视频生成 · 手动推进</small></main><script>const story={"format":"beyondsight.text-story","version":1,"id":"mountain.m01_m03","title":"山门·灰纹与第二剑","status":"draft_text_prototype","start":"m01.gate","acts":[{"id":1,"title":"山门之下"},{"id":2,"title":"断桥与开目"},{"id":3,"title":"第二剑"}],"nodes":[{"id":"m01.gate","type":"scene","act":1,"title":"他吃的是我的修炼机会","setting":"开山礼当日，清晨，重明宗山脚。","beats":[{"visual":"晨钟响。百草峰丹房外，陆寻踮脚望着木架上最后一只青瓷瓶，瓶签写着「凝气散，五枚下品灵石」。窗口旁挂着七日预留名册，他的名字正在最后一行。窗外试坪，一位外门弟子盘膝吐纳，掌中三缕灵光接续，凝成一团稳定白光。陆寻低头看自己的手：昨夜第三息散力留下的一道浅红印还未消。","dialogue":[],"seconds":18},{"visual":"丹房值事拿起药瓶。严承递过严家当日灵材交付凭据，又从钱袋取出五枚下品灵石。陆寻将自己的盖印预留凭条推到窗口：本批最后一瓶留给他七日，尚差四十四工分，原定做完开山礼和一项已公布的青崖采药差事便能补足；现在才第一日。值事把药瓶递给严承。","dialogue":[{"speaker":"陆寻","text":"王值事，我的预留期限还有六天。差事都接好了。"},{"speaker":"值事","text":"严家今日供了药材，又付了现钱。下批你再来。"},{"speaker":"周野","text":"他等了三个月，你一句下批就没了？"},{"speaker":"严承","text":"五块灵石而已。你们非得攒上几个月，怪谁？"}],"seconds":30},{"visual":"严承拿着药瓶走向丹房旁的公共修炼石台，倒出一小份凝气散服下，运转已经学会的吐纳法。三息接续，掌中灵光比先前充盈。瓶中余药收回袖中。陆寻隔着石栏看见这一幕，低头翻开自己那本缺少注解的入门吐纳诀。","dialogue":[{"speaker":"严承","text":"你慢慢攒。我今天还得练功。"},{"speaker":"周野","text":"陆寻，别看了。"},{"speaker":"陆寻","text":"我的名字还在名册上。这事不能就这么算了。"}],"seconds":22},{"visual":"陆寻收回自己的登记牌，五十六工分还在，药却没有了。周野将他拉开。两人经过月例柜，一名外门弟子领十二石；杂役月例折四十工分，即两石。牌上另写着外门秋选日期尚远；通过者可进入常规传习、领取外门月例。","dialogue":[{"speaker":"周野","text":"一瓶五块灵石，咱们两个半月的月例。他随手就买了。"},{"speaker":"陆寻","text":"我连第三息都续不上。再不把基础练稳，秋选又只能在下面看。"},{"speaker":"周野","text":"那就再找药。你进外门，我进铸星峰。以后你的剑，我给你打。"}],"seconds":25},{"visual":"两人领下开山礼搬运差事，额外四工分。货车到云阶坪，苏禾正在医师旁分装药材。她看见陆寻掌背旧伤，拿药布替他包住。陆寻问凝气散，苏禾指向药箱中贴着赤纹芝标签的一格：新一批丹药缺这味药。她拿过他手中的旧吐纳诀，指出药散只能补充练功消耗，第三息的具体运行仍得他自己练通。","dialogue":[{"speaker":"苏禾","text":"这药能让你多练几轮，可不能替你练通第三息。"},{"speaker":"陆寻","text":"知道。可我平时练几次就没力了。"},{"speaker":"周野","text":"等你当上医修，给他配点好药。"},{"speaker":"苏禾","text":"想得美。先把工钱挣够。"}],"seconds":25},{"visual":"苏禾袖中露出医修培养申请。陆寻帮她捡起落下的笔，递回去。两人交齐货物，值事各记四工分。陆寻的牌显示六十。高台上传来开山礼钟声。","dialogue":[{"speaker":"陆寻","text":"你也要考了？"},{"speaker":"苏禾","text":"嗯。我可不想一辈子只给人递药布。"},{"speaker":"陆寻","text":"那就一起考进去。"}],"seconds":18}],"next":"m01.fire"},{"id":"m01.fire","type":"scene","act":1,"title":"七环少了一环","setting":"七峰开山礼，云阶坪。","beats":[{"visual":"七座铜环悬在云海上。红衣秦晚立于高台，指尖燃起赤焰，六道火环次第点亮。秦晚从容引气，连续六次出火，中间没有明显停顿。第七道火即将出手，下层临时兽栏中的角兽突然撞向门闩，颈侧一道细小灰纹一闪而灭。货车翻倒，老工役困在侧闸。","dialogue":[],"seconds":20},{"visual":"秦晚骤然收火。第七环熄灭，原本冲向铜环的火焰压成细长火幕，将角兽逼离货道。陆寻认出绳轮可移开货车，周野把卸货板架成逃生坡。两人拉出老人；秦晚与赶来的巡守制住角兽。","dialogue":[{"speaker":"秦晚","text":"下面的人，走侧闸！"},{"speaker":"陆寻","text":"周野，板子！"}],"seconds":24},{"visual":"秦晚落下高台，先确认伤者都出来。严承从安全台阶挤过来，试图说自己指挥了救援。老工役指向陆寻和周野。秦晚看一眼严承干净的靴子，又看两人的泥手。 陆寻没有让严承就此离开，拿出丹房预留凭条。秦晚听完前因，只让负责救援登记的巡守确认现场所见，再请丹房医师亲自核对预留名册。","dialogue":[{"speaker":"严承","text":"师姐，是我叫他们开闸的。"},{"speaker":"秦晚","text":"是吗？你连闸在什么地方都没看一眼。"},{"speaker":"秦晚","text":"你们叫什么？"},{"speaker":"陆寻","text":"陆寻。他叫周野。"},{"speaker":"秦晚","text":"好，记住了。"},{"speaker":"秦晚","text":"陆寻，你刚才敢冲进去救人，胆子倒是不小。"},{"speaker":"陆寻","text":"师姐，刚才的功劳不能算他的。今早那瓶凝气散，也不能当我从来没有排到过。"}],"seconds":23},{"visual":"丹房医师来到救援台，核对盖印凭条和原名册，确认值事提前取消了预留。他在凭条上补写「下一批优先，原价不变」，盖上自己的印，不保证立即有药。严承站在旁边听见，脸色沉下来。随后秦晚让巡守登记两人救援赏各二十工分。巡守蹲在角兽旁，取出一片失效灰符。老工役低声说昨夜有人随严家送货车带来所谓驱兽符，他用过一张便引得角兽躁动。巡守封存符纸。","dialogue":[{"speaker":"医师","text":"这份是陆寻的预留。下一批先按原价留给他。"},{"speaker":"陆寻","text":"我不求多给，只求别再把我的拿走。"},{"speaker":"秦晚","text":"该是你的，就是你的。"},{"speaker":"老工役","text":"那符是跟严家送货车来的人给的……我一用，兽就开始撞栏。"},{"speaker":"巡守","text":"先封兽栏。"},{"speaker":"秦晚","text":"我去告诉师父。"}],"seconds":38}],"next":"m01.afterfire"},{"id":"m01.afterfire","type":"scene","act":1,"title":"六个火环之后","setting":"开山礼散场，当日傍晚至三日后。","beats":[{"visual":"开山礼散场。夜里陆寻将重新盖印的预留凭条夹进旧吐纳诀，开始练功。他勉强运转两息，第三息散掉，坐了半天才恢复。周野把工分牌递给他：六十加救援二十，八十。","dialogue":[{"speaker":"周野","text":"还差二十。药没了，钱还在。"},{"speaker":"陆寻","text":"下批得等赤纹芝。先把功法练着。"},{"speaker":"周野","text":"等你能进外门，就不用一天到晚替他们搬东西。"}],"seconds":24},{"visual":"两日过去。清晨两人继续做日常工役；黄昏陆寻练吐纳，周野在灯下拆旧绳轮。第三日，庶务堂外告示更新：青崖驯养外场暂封，内谷正在排查；经巡守核验的外谷入口与临时药圃分别招募熟悉器械和搬运的工役。青崖的地图与原来的兽栏位置印在告示旁。","dialogue":[],"seconds":22},{"visual":"陆寻在告示前遇到前来核对名单的秦晚。她说巡守近日还发现封阵有异常回响，内谷不让普通人进去。另一张百草峰告示招人采赤纹芝，为暂时安抚异动妖兽准备药材；苏禾恰好在帮忙登记。两边各给二十工分。 苏禾说百草峰还需补充赤纹芝制备凝气散及安抚药，下一批凝气散何时开炉，取决于药材能否安全运回。","dialogue":[{"speaker":"秦晚","text":"青崖入口有些旧闸要查，你们熟悉货道，愿不愿帮忙？"},{"speaker":"苏禾","text":"药圃也缺人。巡守划好了路，采来的赤纹芝一部分要送丹房。"},{"speaker":"周野","text":"两边都是二十工分？"},{"speaker":"秦晚","text":"对。"},{"speaker":"陆寻","text":"那就先攒够钱，等下一批开炉。"}],"seconds":28}],"next":"m01.choice"},{"id":"m01.choice","type":"choice","act":1,"prompt":"青崖两份差事都能挣到剩下的二十工分。你可协助秦晚追查灰符，或协助苏禾采集关系下一批凝气散的灵药。","choices":[{"id":"trace","text":"随秦晚检查兽栏，看看究竟是谁动了手脚。","next":"m01.trace"},{"id":"herb","text":"与周野去采药，替苏禾找足赤纹芝。","next":"m01.herb"}]},{"id":"m01.trace","type":"scene","act":1,"title":"她不只是会放火","setting":"开山礼第四日，青崖外谷入口。","beats":[{"visual":"陆寻与周野随秦晚、巡守抵达青崖入口。周野转动旧兽栏绳轮，发现一根木销颜色过新，陆寻俯身看见后面夹着灰纹符纸。他们没有直接取下，先叫来巡守；巡守以钩杆封存符纸。","dialogue":[{"speaker":"陆寻","text":"这里的木头新换过。后面还有东西。"},{"speaker":"秦晚","text":"先别碰。叫巡守过来。"},{"speaker":"周野","text":"你还真看得细。"},{"speaker":"秦晚","text":"要是这回没请你们来，我还得绕好几圈。"}],"seconds":26},{"visual":"巡守用检测石确认符屑与兽栏异常相符，将药坡一侧原有兽道封住，通知百草峰只开放另一侧药坡。秦晚提醒陆寻认清灰符，若再见到立即报告。高处报告封阵异常，她被召去协查；两人工分到账。","dialogue":[{"speaker":"秦晚","text":"再见到这种纹路，别自己碰，吹哨叫人。"},{"speaker":"陆寻","text":"师姐，你还要往里面去？"},{"speaker":"秦晚","text":"师父在等我。今天就到这里。"},{"speaker":"秦晚","text":"丹房的药材也卡在青崖。等这边查完，兴许就能开炉了。"}],"seconds":21},{"visual":"傍晚回到山腰。陆寻的工分牌终于满一百。丹房柜台尚无凝气散，值事给他盖上足额登记印，在开山礼医师补盖的优先凭条上登记足额，注明下一批可按原顺序领取。周野把自己的新报酬留作炼器入门材料。","dialogue":[{"speaker":"周野","text":"这回钱够了。谁再抢？"},{"speaker":"陆寻","text":"先把凭条收好。药没炼出来，还得等。"},{"speaker":"周野","text":"你练功，我帮你盯着丹房。"}],"seconds":22}],"next":"m02.before.trace"},{"id":"m02.before.trace","type":"scene","act":2,"title":"等药的七天","setting":"开山礼后第五日至第十二日，杂役院、山腰药房。","beats":[{"visual":"一周里，陆寻照常做工，夜间练习两息吐纳，把足额兑换凭条压在讲义下。每次练到第三息，他指间的灵光便散去。周野在院角修理旧牵引轮，陆寻把晚饭搁到他旁边。丹房木牌一直写着：缺赤纹芝，暂不开炉。","dialogue":[{"speaker":"周野","text":"你这练一次得歇半天。"},{"speaker":"陆寻","text":"没药也得练。等秋选可没人等我。"}],"seconds":23},{"visual":"一日傍晚，陆寻送货经过五灵峰外场，秦晚认出他。她说兽栏已加固，封阵异常仍未查清；经过复查，东侧药坡可重新采药。陆寻问丹房缺药的事，秦晚指给他看百草峰的补采告示。","dialogue":[{"speaker":"秦晚","text":"上次你帮我找的符，已经送镇山堂了。"},{"speaker":"陆寻","text":"丹房还说缺赤纹芝。东边能去了吗？"},{"speaker":"秦晚","text":"要等复查盖印。内谷绝对不能进。"}],"seconds":24},{"visual":"第十二日清晨。山腰告示上新增镇山堂盖印的开放路线：青崖外谷东药坡，内谷继续封闭；巡守值勤，采药差事两名工役合计四十工分。陆寻看着告示，回头招呼周野。","dialogue":[{"speaker":"陆寻","text":"东药坡开放了。采到赤纹芝，丹房就能开炉。"},{"speaker":"周野","text":"走，先看看领队是谁。"}],"seconds":15}],"next":"m02.depart.trace"},{"id":"m02.depart.trace","type":"scene","act":2,"title":"外谷的第三个人","setting":"开山礼后第十三日，清晨，青崖谷东药坡。","beats":[{"visual":"庶务堂窗口。值事将新差事的分工牌放到陆寻面前，旁边一张牌写着临时领队严承。陆寻没有立即签，先展开镇山堂盖印的安全路线图，确认路线只在开放药坡。周野指着入口巡守标记。画面切至山路，三人背着采药篓下山，半个时辰后抵达青崖登记亭。","dialogue":[{"speaker":"周野","text":"怎么又是他？"},{"speaker":"陆寻","text":"丹房还缺这一批药。镇山堂盖了印，只走开放药坡，交药给百草峰。他不能再把我们的东西拿走。"},{"speaker":"周野","text":"他要带咱俩往里面走，咱俩就回头。"},{"speaker":"陆寻","text":"好。"}],"seconds":28},{"visual":"三人过登记亭。绳桥连接山门端与药坡；北侧旧药棚旁是备用牵引索和安全岩台，药棚后为镇山堂巡检门，门内封着尚未拆解的古物。巡守正在检查入口附近的异常回响。严承趁两人走在前面，从行囊取出一枚灰纹符；闪回早晨严家送货人递给他符纸，说可驱开小兽，严承付了一块灵石。送货人袖口有同样灰纹，严承并不知道其真实身份。","dialogue":[],"seconds":22},{"visual":"药坡边，陆寻认出石标后有与前次符纸相似的灰纹。此处本是复查后的开放区，他立刻吹响登记亭发放的短哨，招呼周野沿原路回撤。严承听见哨声，急忙抢先割走眼前的赤纹芝。","dialogue":[{"speaker":"陆寻","text":"灰纹！周野，撤！"},{"speaker":"严承","text":"你们先走，这株药我拿。"}],"seconds":16},{"visual":"严承把刚割下的灵芝塞进药篓，见二人要撤，取出早晨买来的灰符。他想先驱开近处妖兽、独自留下采更好的药，便将符激发。灰光沿岩缝散开，远处兽群躁动起来，连着撞响外围警示阵。严承脸色骤变。","dialogue":[{"speaker":"严承","text":"你们先回去！剩下的我采。"},{"speaker":"周野","text":"你手里什么东西？"},{"speaker":"严承","text":"驱兽符！……不对，快走！回桥！"}],"seconds":24}],"next":"m02.crisis.trace"},{"id":"m02.crisis.trace","type":"scene","act":2,"title":"他割断了桥","setting":"青崖谷绳桥与北侧岩台。","beats":[{"visual":"岩猞冲出兽道，三人奔向绳桥。严承抢先过桥，回头看见陆寻和周野还差数步。他看一眼追来的妖兽，又望一眼药篓，拔刀割断承重索。桥面坠下，周野伸手将陆寻拽离断口，自己右臂撞岩。陆寻急忙引气击出一道浅白灵光，第三息散掉，灵光在兽爪前溃散。他拽着周野翻入岩侧，前臂被岩石划破。","dialogue":[{"speaker":"陆寻","text":"别割！"},{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊！"},{"speaker":"周野","text":"陆寻，北边！"},{"speaker":"陆寻","text":"走！我挡不住它！"}],"seconds":26},{"visual":"兄弟沿北侧旧路往药棚退。高处，两个蒙面人听见警示阵钟声，等巡守赶往兽道，一人取出灰纹令牌打开巡检门的外层通路，另一人掩护。陆寻先前吹哨引来的巡守已赶到外谷，裴照雪见有人闯门，立即抽剑截击。","dialogue":[],"seconds":21},{"visual":"药棚旁，受损门阵的反冲堵住撤离口。周野右手无法抓绳，陆寻将他扶上石台。先前赶来的巡守从北侧保护药工，陆寻将灰纹符所见告诉他们，巡守及时将一枚新掉落符片封存。裴照雪以白剑截断袭向巡守的暗光，敌人退进巡检门。她留下两人保护伤员，自己带队追入。","dialogue":[{"speaker":"裴照雪","text":"伤者先走！别碰那扇门！"},{"speaker":"陆寻","text":"这边的牵引索卡住了！"}],"seconds":23},{"visual":"蒙面人从巡检门内冲出，怀里是一件破损的封物外壳。他试图以灰纹令牌打开外层撤路，却被裴照雪一剑逼退。外壳撞在岩壁上裂开，一枚带瞳纹的内芯从缺口滑落到药棚石台。蒙面人见空壳脱手，转身逃向北侧旧路。裴照雪不得不先挡住他反击巡守的暗光。","dialogue":[],"seconds":22},{"visual":"石台下的低阶牵引阵反冲加剧，周野与另一名受伤药工困在石台，绳索只要受力就被阵力猛拽。陆寻曾见过测阵石，发现瞳纹内芯与残阵明灭同频，误以为能帮助判断牵引阵；拾起没有反应，他试送一丝自身灵力。内芯瞳纹亮起，随后失光。陆寻捂住眼睛跪倒。","dialogue":[{"speaker":"周野","text":"别管我，先叫人！"},{"speaker":"陆寻","text":"等一下……这是测阵的？"}],"seconds":24},{"visual":"再睁眼，陆寻看见牵引阵的两层实际回流。表面暗下，深处仍在反冲。他试拉一次，绳索猛震，立即松手。第二次，他等两层退去，喊巡守拉绳；自己扶住周野和药工。两名巡守共同拉起绳索，将两人转移至安全岩台。下一次回力击碎空绳轮。","dialogue":[{"speaker":"陆寻","text":"先别拉！里面还有力……现在！"},{"speaker":"巡守","text":"上来了！两个都上来了！"},{"speaker":"周野","text":"你……怎么看出来的？"},{"speaker":"陆寻","text":"我也不知道。"}],"seconds":30},{"visual":"伤者已被巡守转移到安全岩台。北侧旧路上一枚被逃敌丢下的低阶符片仍亮着，陆寻看见符中灵流与敌人令牌刚才的明灭相同。另一侧，门阵外泄的力量正沿石槽向药棚逼近，仍有两名药工和一车救护药材未完全撤出。巡守人手不足，裴照雪需要决定先追哪条岔路；陆寻若留在这儿，能凭搬运经验协助撤出药车。","dialogue":[{"speaker":"裴照雪","text":"北路有两条岔道，谁看清他走哪边了？"},{"speaker":"巡守","text":"师姐，药棚那边还有人！"},{"speaker":"陆寻","text":"……"}],"seconds":25}],"next":"m02.choice.trace"},{"id":"m02.choice.trace","type":"choice","act":2,"prompt":"周野已被救出。追敌的关键线索就在眼前，但说明异常视野会留下记录；药棚仍需人手。你要先向裴照雪提供线索，还是留下协助药工撤离？","choices":[{"id":"pursue","text":"告诉裴照雪异常所见，请她追查灰符来源。","next":"m02.pursue.trace"},{"id":"seal","text":"留在封门外协助巡守撤离与封住泄口，暂不说明眼睛。","next":"m02.seal.trace"}]},{"id":"m02.pursue.trace","type":"scene","act":2,"title":"她回头等我说完","setting":"青崖谷安全岩台与封阵外门。","beats":[{"visual":"陆寻将实际看到的符片灵流方向指给裴照雪，说明自己刚才看见了残阵内部回力。裴以巡守检测石核对符片响应，确认它与逃敌使用的灰纹令牌相符；她让陆寻留在安全岩台，不带低阶伤员追敌，自己带一名巡守沿线追去。","dialogue":[{"speaker":"陆寻","text":"那片符还在动。和刚才他手上的令牌一样。"},{"speaker":"裴照雪","text":"你能看见？"},{"speaker":"陆寻","text":"能。刚刚才开始。"},{"speaker":"裴照雪","text":"好。你留在这，剩下的我来。"}],"seconds":25},{"visual":"画面切至北侧旧路：裴照雪截住受伤逃敌，剑尖击落其灰纹令牌，敌人以暗光掩护撤走；她没有贸然追入未知禁区。她带回实际令牌及符片，陆寻被登记为异常所见的线索提供者。","dialogue":[{"speaker":"裴照雪","text":"人走了，东西留下了。"},{"speaker":"陆寻","text":"能查到是谁吗？"},{"speaker":"裴照雪","text":"不能现在保证。但至少有东西可查。"}],"seconds":26},{"visual":"夕阳落到青崖谷口。巡守封存失活内芯，登记陆寻接触碎片、眼痛及救援经过。裴照雪与同行巡守另记下他所述异常视觉，暂不对外公开。担架队沿山路返回宗门，苏禾提着药箱在济生院门口等伤者。她看见周野苍白的脸，马上叫来医师，抓住陆寻的左手查看伤口。","dialogue":[{"speaker":"苏禾","text":"陆寻！你们怎么又把自己弄成这样？"},{"speaker":"陆寻","text":"他的手先治。"},{"speaker":"苏禾","text":"我知道。你也坐下。"}],"seconds":23},{"visual":"当夜，严承交验药材时已被巡守带走。次日下午，镇山堂在济生院偏厅听取伤者证词。陆寻坐在椅子上，手臂仍缠着药布；严承站在另一侧，承认买来并使用灰符，却说自己不知道会引来兽群。巡守将前次兽栏符纸和本次残符并排放到桌上。镇山堂当场没收严承此次药功，暂停领队，先核定一部分治疗赔付；灰符卖家另查。","dialogue":[{"speaker":"严承","text":"我买的是驱兽符！我哪知道会引来这么多！"},{"speaker":"陆寻","text":"你不知道符会引兽。可你知道我们还没过桥。"},{"speaker":"巡守","text":"药功取消，领队牌交出来。伤者的药费先由你赔。"},{"speaker":"严承","text":"……"}],"seconds":25},{"visual":"事故第三日，苏禾为陆寻换药。周野仍在病床上睡着。陆寻翻出足额兑换凝气散的凭条，想起岩猞扑来时自己聚不起第三息，将凭条重新折好。窗外正式弟子持剑走过，他久久看着。","dialogue":[{"speaker":"苏禾","text":"今天眼睛还疼吗？"},{"speaker":"陆寻","text":"偶尔会。"},{"speaker":"苏禾","text":"别瞒我。医师说先歇几天。"},{"speaker":"陆寻","text":"知道了。"}],"seconds":18}],"next":"m02.recover.trace.pursue"},{"id":"m02.recover.trace.pursue","type":"scene","act":2,"title":"一只拿不稳的手","setting":"事故后第七日至第二十一日，济生院与杂役院。","beats":[{"visual":"一周后。周野终于能靠在床头，陆寻帮他把器坊练习册拿过来。他用左手翻页，右手去拿一只小木销，木销掉在被子上。他笑着换左手，又把那一页翻了过去。陆寻看在眼里，没有说话。","dialogue":[{"speaker":"周野","text":"等我好了，这东西我闭着眼都能装回去。"},{"speaker":"陆寻","text":"那就先别急。"}],"seconds":22},{"visual":"两周后，陆寻经医师许可恢复普通轻役。夜里他第一次主动尝试那只眼睛：灯下，自己指尖引起的微弱灵力有了清楚的前后流向；稍看久些，眼睛便发酸。他赶紧闭眼。次日他去济生院看周野，周野仍无法稳稳控制那枚小木销。 丹房贴出新告示：因青崖事故原定药材未交齐，凝气散开炉延期，已足额登记者继续保留兑换权。陆寻仍未取得药。他将预留凭条与吐纳诀一起夹好。","dialogue":[],"seconds":26},{"visual":"第三周复诊，医师让周野尝试一件低阶练习器件。右手灵力忽明忽暗，器件滑落。医师说明日常用手会逐渐恢复，精细控灵则可能长期受影响。周野沉默了一会儿，把原本准备报器坊见习的申请收进衣袋。","dialogue":[{"speaker":"周野","text":"那我以后还能炼器吗？"},{"speaker":"医师","text":"不是不能做器作。但要像从前那样精细控灵，普通药散不够。"},{"speaker":"陆寻","text":"有什么药能治？"},{"speaker":"医师","text":"养脉藤的成熟藤髓。先前在青崖旧药窟采过，如今那里还封着。"}],"seconds":27},{"visual":"苏禾把药籍翻到养脉藤一页，给陆寻看画着三层青叶的药图。她说药房里只剩别的伤药，旧药窟要等封阵修好才可开放。周野先开口，叫陆寻别冲动。","dialogue":[{"speaker":"苏禾","text":"我去问师父，有没有别处能找到。"},{"speaker":"周野","text":"先别惦记我。你这眼睛自己还没弄明白。"},{"speaker":"陆寻","text":"我不会现在去。等消息。"}],"seconds":23}],"next":"m03.wait.trace.pursue"},{"id":"m03.wait.trace.pursue","type":"scene","act":3,"title":"等一扇门打开","setting":"事故后第四周，山腰药房及训练坪。","beats":[{"visual":"七日后，镇山堂的封谷钟不再每日响起。告示上写着：外层药窟修缮完成，先由正式弟子与医修检查，随后开放有资格的低阶协作人员。苏禾在药房门口找到陆寻，拿出医师批准的采药名单。","dialogue":[{"speaker":"苏禾","text":"旧药窟能进了，不过要等下一批清查。医师说你若想跟去，得先会基本防身术。"},{"speaker":"陆寻","text":"多久开始？"},{"speaker":"苏禾","text":"约一个月。我们还有时间准备。"}],"seconds":24},{"visual":"陆寻站在公开练习坪外，看一名同境弟子将三道灵力稳稳送入剑身，想起自己在岩猞面前第三息溃散。丹药尚未到手，但新眼睛已经让他看见自身灵力运行的前后。他决定不能只等待药材，走进练习坪，向教习递上药窟协作报名牌。","dialogue":[{"speaker":"陆寻","text":"我想先把第三息练稳，再学一门能自保的剑术。"},{"speaker":"教习","text":"先说好，你会吐纳不代表会用剑。"},{"speaker":"陆寻","text":"我从头练。"}],"seconds":22}],"next":"m03.learn.trace.pursue"},{"id":"m03.learn.trace.pursue","type":"scene","act":3,"title":"一门功法，两种修法","setting":"清查开放前约一个月，杂役院与公开练习坪。","beats":[{"visual":"第一日，教习让陆寻翻开宗门公开的《引气诀》，在石靶前演示同一修法。陆寻炼气已有数年，能聚起一股灵力，却在第三息散掉；旁边同为炼气中段的外门弟子按教习口令完成三息，石靶长亮。教习示范：第一息纳气，第二息归拢，第三息将已炼成的灵力送入自身经脉循环。陆寻照做仍失败。","dialogue":[{"speaker":"教习","text":"你不是没灵力，是每次到第三息就散。先练这本，别贪别的。"},{"speaker":"陆寻","text":"我以前就卡在这儿。"}],"seconds":28},{"visual":"夜里，陆寻摊开旧《引气诀》，引动自己的灵力。灵目视野中，第二息的余流还未退尽，第三息一接便在经脉交汇处冲散。他对照诀文：原法只写「息定而进」，没有写每个人到底何时息定。陆寻第一次试着放慢，余力全散；第二次提早，又乱。连练三个夜晚，他终于在自己的余流刚退时接入第三息，掌心灵光稳住。他闭眼复现，继而完成原本三息闭合的一轮吐纳。丹药尚未开炉。","dialogue":[{"speaker":"陆寻","text":"原来书上说的息定，不是数到第三息。"},{"speaker":"陆寻","text":"是我自己的气，真的走完了。"}],"seconds":32},{"visual":"次日试坪，同一位外门弟子做完三轮后停下换气，陆寻用相同基础功法完成三轮，靶光终于长亮。教习让他闭眼复现，确认是实际掌握，不是外物助力。陆寻仍在炼气中段，但能将已有灵力用于持续训练。随后练基础引气剑，对手已经收剑，他却还在重新聚气；秦晚值勤经过，见他连续输了几次。","dialogue":[{"speaker":"教习","text":"这回三息都走完了。药拿到了？"},{"speaker":"陆寻","text":"还没。"},{"speaker":"秦晚","text":"你不是刚才赢了石靶吗？怎么一跟人打就输了？"},{"speaker":"陆寻","text":"我一剑出完，下一剑得从头引气。"}],"seconds":29},{"visual":"秦晚用公开的低阶火线演示：一股力尚未从体内退尽，另一股已准备好，火焰不断。陆寻看见这是真实的两次体内运转，而非凭空增加灵力。他将《引气诀》中三息运行与火线前后衔接画在纸上，尝试把体内余力退尽的时机与第二次引气协调。木剑猛震，第一次失败。他停手休息。","dialogue":[{"speaker":"秦晚","text":"剑和火不一样，你别拿自己的经脉试运气。"},{"speaker":"陆寻","text":"我不照搬火。只是想弄明白，两次出力之间为什么非得停。"},{"speaker":"秦晚","text":"好。那你先在木剑上试，我看着。"}],"seconds":29},{"visual":"十余日间，陆寻白日搬货，夜间将练习结果记在旧诀页边。周野用左手修整木剑柄。秦晚值勤时来试接：陆寻终于闭眼打出前后两道相连的剑势，第二道第一次绕开她的低阶火幕，下一回却被她提前挡住。他尝试调整第二次发力间隔，过早便冲散，过晚便接不上。又过数日，他将第二股力保留在体内，成功延后一瞬，击中后方石靶；闭眼连续验证两次，第三次力竭停手。","dialogue":[{"speaker":"秦晚","text":"第一回能打中不稀奇。第二回、第三回呢？"},{"speaker":"陆寻","text":"再试。"},{"speaker":"秦晚","text":"这回你倒比我还舍不得收剑。"},{"speaker":"陆寻","text":"我以前学不会。现在知道哪里错了，就不想停。"}],"seconds":38},{"visual":"月底。教习考查陆寻的基础引气剑和防身步法，准许加入药窟协作。秦晚将陆寻那张写满失败记号的旧纸翻过来，指着他自己改写的衔接方法。裴照雪按先前异常视野记录来复核，亲眼看见他闭眼复现剑式，确认他没有依赖外物；她仍不知古仙来源。","dialogue":[{"speaker":"秦晚","text":"你这不是师父教的第二剑。叫什么？"},{"speaker":"陆寻","text":"还没取名。先叫回息剑吧。"},{"speaker":"秦晚","text":"等你能把这两剑连成三剑，再来找我。"},{"speaker":"陆寻","text":"好。"}],"seconds":28}],"next":"m03.depart.trace.pursue"},{"id":"m03.depart.trace.pursue","type":"scene","act":3,"title":"这次带剑出门","setting":"次日清晨，山门至青崖药窟。","beats":[{"visual":"周野将修好的轻型采具交给陆寻，将修好的普通练习剑递给他，又看了眼页边写着「回息剑」的旧诀。医师只允许周野做轻役，他留在山门帮器坊整理材料。苏禾背着药囊与辨药图册赶来。","dialogue":[{"speaker":"周野","text":"采具我都检查过了。你俩别跟上回一样。"},{"speaker":"陆寻","text":"这回有人带路，我也练过了。"},{"speaker":"苏禾","text":"先回来再说。"}],"seconds":23},{"visual":"三人告别。陆寻和苏禾随外门弟子韩峥及巡守下山。路过昔日断桥处，新架的临时木桥上有镇山堂封检牌；旧药坡仍封闭。他们沿新开放的内侧药窟通路前行，远处可见修好的封门，入口有医师驻守。韩峥走在前面，途中以一剑逼退一只低阶岩猞，陆寻看得出自己剑术还不如他熟练。","dialogue":[{"speaker":"韩峥","text":"采药归采药，遇见兽先喊我。"},{"speaker":"陆寻","text":"知道。"},{"speaker":"苏禾","text":"前面就是药窟了。"}],"seconds":25}],"next":"m03.cave.trace.pursue"},{"id":"m03.cave.trace.pursue","type":"scene","act":3,"title":"药窟里的人","setting":"清查当天，青崖内侧旧药窟外层。","beats":[{"visual":"药窟入口，医师核对采药名单。洞内青色藤蔓沿石壁攀生，部分已经枯萎。韩峥指明今日只开放到石台，苏禾取出药图，陆寻紧跟在她身旁。医师提醒成熟藤髓用于伤者救治，若发现额外罕见结晶，先报告、清除危险，再按实际参与者事前协议分配。 入口木牌写明：额外稀有药材经医师核验、按约采回者，另有四石采掘报酬；玉髓可作个人修炼资源，不可直接承诺突破境界；普通救治药材不计入这笔报酬。","dialogue":[{"speaker":"韩峥","text":"藤髓够就出来。别碰深处。"},{"speaker":"苏禾","text":"我只取成熟的，伤了根明年就没药。"},{"speaker":"医师","text":"若真遇上稀有结晶，先报位置。采回另有四石，你们先说好怎么分。"}],"seconds":31},{"visual":"苏禾先采足周野所需的普通成熟藤髓。陆寻借灵目观察活藤运行，看见灵力反复进入被枯叶遮挡的石缝，却很少回到根部。苏禾顺着他所指扒开枯叶，在医师允许的采区露出一枚拇指长的青白结晶。她查药籍确认：养脉玉髓是老藤多年凝成的稀有灵材，可在医师监督下温养炼气修士反复承受灵力运行的经脉，尤其适合陆寻如今练成的连续施法；整枚可供一个人完整疗程，半枚只能完成较短疗程。两人先将周野的普通藤髓送洞口验收封存。","dialogue":[{"speaker":"苏禾","text":"养脉玉髓……去年百草峰找遍几处药圃，也没收上来一枚。"},{"speaker":"陆寻","text":"我现在每次连出两剑就得歇。这个能帮我继续练？"},{"speaker":"苏禾","text":"能让经脉更经得住反复施法。不过吃下去可不会直接筑基。"},{"speaker":"苏禾","text":"周野那份藤髓已经够了。先交回去，再说这枚。"}],"seconds":34},{"visual":"两人返回石台附近向巡守报告玉髓位置，低阶岩猞从侧缝冲出。韩峥举剑挡住首爪，受岩壁限制无法继续挥剑。陆寻先以已练成的引气剑挡住兽爪的侧向力量，随即停半息，让第二股体内灵力接续，从岩壁另一侧击落松动石片，逼岩猞抬头。韩峥借机以剑气击中兽肩，将其逼回侧缝。苏禾护着药囊退至洞口，陆寻虎口发痛但仍能收剑。","dialogue":[{"speaker":"韩峥","text":"你刚才明明收了剑，怎么又出一道？"},{"speaker":"陆寻","text":"没重新聚气。第二股力还在体内。"},{"speaker":"韩峥","text":"……你练的什么剑？"},{"speaker":"陆寻","text":"自己试出来的。先出去。"}],"seconds":28},{"visual":"洞口，巡守检查两人均无重伤，说明一刻后会封住侧缝，玉髓只能在本次开放内采出。韩峥认可陆寻发现玉髓的贡献，也认为自己守通道有份。两人提出先约定分配，再决定取玉方式。韩峥愿意用自己的外门护阵符协作驱兽，平分玉髓；若陆寻想独得，可以接受三式试剑决定优先采掘权，但胜者独得玉髓、全部四石额外采掘报酬归守路者，且独取路线由巡守封侧缝后单人采出。","dialogue":[{"speaker":"韩峥","text":"合作的话，我出护阵符，你我各一半。以后历练也可以一起。"},{"speaker":"韩峥","text":"若你想独拿，就比三式。赢了你先采，我守这条路，额外的四块灵石都归我。"},{"speaker":"苏禾","text":"周野的药已经验过。这份是额外机缘，别急着答应。"}],"seconds":30}],"next":"m03.choice.trace.pursue"},{"id":"m03.choice.trace.pursue","type":"choice","act":3,"prompt":"周野的药已经取得。你可与韩峥约定平分玉髓，获得真实同行关系；也可公开比试争取整份，独自承担采掘与守路报酬。两种取法都须经巡守确认安全。","choices":[{"id":"duel","text":"接受比试，争取独取玉髓，承担守路报酬。","next":"m03.duel.trace.pursue"},{"id":"join","text":"与韩峥合作，合力取玉髓，各得一半。","next":"m03.join.trace.pursue"}]},{"id":"m03.duel.trace.pursue","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"两人在洞口安全试坪依约比三式，使用统一低阶练习剑与护具。第一式韩峥将陆寻逼退，第二式他提前封住固定第二剑的间隔，陆寻虎口发麻。陆寻想起秦晚破解自己时的练习，重新稳住脚步。","dialogue":[{"speaker":"韩峥","text":"刚才在洞里我就看见了。你第二剑只快那么一点。"},{"speaker":"陆寻","text":"再来。"}],"seconds":25},{"visual":"第三式，韩峥按固定间隔抢先截剑。陆寻先用第一剑护住身前，将第二股灵力留在体内，等韩峥提前压剑落空才接出第二剑。剑势击亮肩前判定护具。韩峥收剑，巡守确认陆寻取得优先采掘权。","dialogue":[{"speaker":"韩峥","text":"你什么时候把第二剑变慢了？"},{"speaker":"陆寻","text":"你挡得太早。"},{"speaker":"韩峥","text":"好。你先采。"}],"seconds":28},{"visual":"巡守封住侧缝后，医师监督陆寻取出整枚玉髓。陆寻依先前协议，将本次额外采掘报酬中的全部四块灵石交给韩峥，作为独取时由他承担的守路报酬；宗门救治药材不参与分配。韩峥接过灵石，没有再争玉髓。","dialogue":[{"speaker":"韩峥","text":"我输了，玉归你。"},{"speaker":"陆寻","text":"守路的四块，按说好的给你。"},{"speaker":"韩峥","text":"好。下次外门见。"}],"seconds":25},{"visual":"当天傍晚回宗。苏禾将普通藤髓交正式医师配药。三日后周野开始用药，随后数周复诊，右手颤抖逐渐减轻。第一次能稳住轻型器件时，周野主动把陆寻叫到器坊外场，亲手将一只练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。今天别再练了。"}],"seconds":28},{"visual":"数周后，医师按疗程为陆寻用完整玉髓。他每日以《引气诀》温养经脉，不凭丹药强行冲境。恢复训练后，他在试坪连续施展三轮回息剑，第三轮仍能稳稳收剑。教习请此前练习中压制他的同境弟子与他对练；对方按旧间隔提前封剑，陆寻将第二股灵力延后一瞬，击中肩前护具。教习宣布点到为止。秦晚看完，主动拿来自己的练习剑，站到陆寻对面。","dialogue":[{"speaker":"教习","text":"上月你还练不完三息。今天这第二剑，倒是他先接不住了。"},{"speaker":"秦晚","text":"来。现在换我跟你练。"},{"speaker":"陆寻","text":"师姐不怕我赢？"},{"speaker":"秦晚","text":"你先追上我再说。"}],"seconds":38},{"visual":"再过数日，青崖药圃恢复常规供药，百草峰终于开炉。苏禾在丹房外叫住陆寻，将他带到原先那个窗口。医师核对开山礼补盖的优先凭条，扣除陆寻足额预留的一百工分，递出一只凝气散青瓷瓶。陆寻接过药，翻开自己写满批注的《引气诀》。远处严承来交剩余赔付，见陆寻领药，又见他背着练习剑，转身离去。陆寻没有立即吞药，把药瓶妥善收好，准备按实际修炼所需使用。","dialogue":[{"speaker":"苏禾","text":"你的药，终于轮到了。"},{"speaker":"陆寻","text":"我等了几个月。现在倒知道该怎么用了。"},{"speaker":"苏禾","text":"这回可别让人抢了。"},{"speaker":"陆寻","text":"不会了。"}],"seconds":26},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上有裴照雪追回的灰纹令牌与异常视觉记录。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.pursue.duel"},{"id":"end.trace.pursue.duel","type":"end","title":"独得玉髓·灰纹令牌","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"整份养脉玉髓已按疗程使用，连续三轮回息剑稳定并战胜此前压制自己的同境弟子；额外四石付韩峥，未获同行约定。周野普通藤髓治疗后逐步恢复精细控灵。原预留凝气散已领取，一百工分已扣除，药瓶尚未使用。","mid":"M04/M05须继承：秦晚共同查兽、提前吹哨及双处灰符证据；裴与巡守知情及追回灰纹令牌；独自养脉形成更强持续施法能力；回息剑是真正学成的低阶术式，不等于完整高阶功法。凝气散已兑领未服，玉髓已使用，不重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.join.trace.pursue","type":"scene","act":3,"title":"这一次，剑不是一个人的","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"陆寻与韩峥先在入口医师处约定平分玉髓及额外采掘报酬。韩峥取出自有低阶护阵符，在巡守指定位置布置临时防护。两人进入已标定区域；苏禾守在洞口。韩峥引开岩猞，陆寻观察它真实蓄力与扑击后的短暂停顿。","dialogue":[{"speaker":"韩峥","text":"你那第二剑能不能慢半息？"},{"speaker":"陆寻","text":"练过。你先退。"}],"seconds":25},{"visual":"岩猞扑向韩峥。陆寻第一剑截住其侧向扑势，韩峥后撤，陆寻没有立刻释放第二剑，待岩猞实际转向后才将体内准备好的第二股灵力送出，击落岩侧浮石，封住兽道。韩峥趁窗口将玉髓从经医师确认的可采位置完整取出，二人及时撤出；不是陆寻越级击杀妖兽。","dialogue":[{"speaker":"韩峥","text":"现在！"},{"speaker":"陆寻","text":"退！"},{"speaker":"韩峥","text":"拿到了！走！"}],"seconds":28},{"visual":"医师核验玉髓完整且可等分，两人各取一半；额外采掘报酬四石也各取两石。韩峥收起已经耗尽的护阵符，主动将传信牌递给陆寻。","dialogue":[{"speaker":"韩峥","text":"以后低阶同行试炼，缺人就来找我。"},{"speaker":"陆寻","text":"这次的账，五五。"},{"speaker":"韩峥","text":"说到做到。"}],"seconds":24},{"visual":"当天傍晚回宗。苏禾将普通藤髓交正式医师配药。三日后周野开始用药，随后数周复诊，右手颤抖逐渐减轻。第一次能稳住轻型器件时，周野主动把陆寻叫到器坊外场，亲手将一只练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。今天别再练了。"}],"seconds":28},{"visual":"数周后，医师为陆寻用半份玉髓，经脉承载改善，但三轮仍需停歇。韩峥按约来练习坪，教陆寻自己的公开低阶守剑法。陆寻也将回息剑的发力间隔与失败记号讲给韩峥，韩峥尝试数次，发现他原本修法不同，不能直接照搬，陆寻调整讲解，让他自己验证体内余力退去的时机。数日后韩峥终于以普通练习剑独立接出第二道低阶剑势，两人交换攻守，陆寻第一次靠改过的守势挡下韩峥的连续剑招。秦晚看到两人对练，笑着走来。","dialogue":[{"speaker":"韩峥","text":"还真能练出来。原来我不是非得从头聚气。"},{"speaker":"陆寻","text":"你那套守剑也不差。"},{"speaker":"秦晚","text":"你俩背着我练成了什么？"},{"speaker":"韩峥","text":"陆寻教我的。"},{"speaker":"秦晚","text":"那我是不是也得来请教陆师兄？"}],"seconds":38},{"visual":"再过数日，青崖药圃恢复常规供药，百草峰终于开炉。苏禾在丹房外叫住陆寻，将他带到原先那个窗口。医师核对开山礼补盖的优先凭条，扣除陆寻足额预留的一百工分，递出一只凝气散青瓷瓶。陆寻接过药，翻开自己写满批注的《引气诀》。远处严承来交剩余赔付，见陆寻领药，又见他背着练习剑，转身离去。陆寻没有立即吞药，把药瓶妥善收好，准备按实际修炼所需使用。","dialogue":[{"speaker":"苏禾","text":"你的药，终于轮到了。"},{"speaker":"陆寻","text":"我等了几个月。现在倒知道该怎么用了。"},{"speaker":"苏禾","text":"这回可别让人抢了。"},{"speaker":"陆寻","text":"不会了。"}],"seconds":26},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上有裴照雪追回的灰纹令牌与异常视觉记录。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.pursue.join"},{"id":"end.trace.pursue.join","type":"end","title":"并肩取玉·灰纹令牌","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"半份养脉玉髓已按疗程使用，两轮回息剑稳定；获得韩峥真实陪练、低阶守剑与两石额外报酬；韩峥在陆寻指导下亲自练成适配自身的衔接第二剑。周野普通藤髓治疗后逐步恢复精细控灵。原预留凝气散已领取，一百工分已扣除，药瓶尚未使用。","mid":"M04/M05须继承：秦晚共同查兽、提前吹哨及双处灰符证据；裴与巡守知情及追回灰纹令牌；韩峥独立学成衔接第二剑，陆寻实际掌握低阶守剑，同行关系；回息剑是真正学成的低阶术式，不等于完整高阶功法。凝气散已兑领未服，玉髓已使用，不重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m02.seal.trace","type":"scene","act":2,"title":"留下来的那个人","setting":"青崖谷安全岩台与封阵外门。","beats":[{"visual":"陆寻不主动说眼睛，只向巡守指出自己刚才实际观察到绳索震动的规律，协助撤离最后一批药工。巡守按正常程序关闭低阶泄口；陆寻负责将备用挡板移到指定位置，不操纵高阶封阵。裴照雪则独立追向北侧旧路。","dialogue":[{"speaker":"巡守","text":"挡板送过来！别越线！"},{"speaker":"陆寻","text":"周野，你别动，等我。"}],"seconds":25},{"visual":"陆寻与巡守搬动挡板，在退力窗口合上外侧低阶护闸。余震停止，药棚旁一具被冲歪的普通采药柜完好保住，柜内有当日救护药材。裴照雪追至岔路时失去敌人踪迹，只带回普通破损符片，未取得令牌。","dialogue":[{"speaker":"巡守","text":"关上了！药材还能用。"},{"speaker":"周野","text":"你还真是闲不住。"},{"speaker":"陆寻","text":"都到这了，总得把人送回去。"}],"seconds":26},{"visual":"夕阳落到青崖谷口。巡守封存失活内芯，登记陆寻接触碎片、眼痛及救援经过。陆寻如实登记接触与伤势，没有主动说明异常视觉。担架队沿山路返回宗门，苏禾提着药箱在济生院门口等伤者。她看见周野苍白的脸，马上叫来医师，抓住陆寻的左手查看伤口。","dialogue":[{"speaker":"苏禾","text":"陆寻！你们怎么又把自己弄成这样？"},{"speaker":"陆寻","text":"他的手先治。"},{"speaker":"苏禾","text":"我知道。你也坐下。"}],"seconds":23},{"visual":"当夜，严承交验药材时已被巡守带走。次日下午，镇山堂在济生院偏厅听取伤者证词。陆寻坐在椅子上，手臂仍缠着药布；严承站在另一侧，承认买来并使用灰符，却说自己不知道会引来兽群。巡守将前次兽栏符纸和本次残符并排放到桌上。镇山堂当场没收严承此次药功，暂停领队，先核定一部分治疗赔付；灰符卖家另查。","dialogue":[{"speaker":"严承","text":"我买的是驱兽符！我哪知道会引来这么多！"},{"speaker":"陆寻","text":"你不知道符会引兽。可你知道我们还没过桥。"},{"speaker":"巡守","text":"药功取消，领队牌交出来。伤者的药费先由你赔。"},{"speaker":"严承","text":"……"}],"seconds":25},{"visual":"事故第三日，苏禾为陆寻换药。周野仍在病床上睡着。陆寻翻出足额兑换凝气散的凭条，想起岩猞扑来时自己聚不起第三息，将凭条重新折好。窗外正式弟子持剑走过，他久久看着。","dialogue":[{"speaker":"苏禾","text":"今天眼睛还疼吗？"},{"speaker":"陆寻","text":"偶尔会。"},{"speaker":"苏禾","text":"别瞒我。医师说先歇几天。"},{"speaker":"陆寻","text":"知道了。"}],"seconds":18}],"next":"m02.recover.trace.seal"},{"id":"m02.recover.trace.seal","type":"scene","act":2,"title":"一只拿不稳的手","setting":"事故后第七日至第二十一日，济生院与杂役院。","beats":[{"visual":"一周后。周野终于能靠在床头，陆寻帮他把器坊练习册拿过来。他用左手翻页，右手去拿一只小木销，木销掉在被子上。他笑着换左手，又把那一页翻了过去。陆寻看在眼里，没有说话。","dialogue":[{"speaker":"周野","text":"等我好了，这东西我闭着眼都能装回去。"},{"speaker":"陆寻","text":"那就先别急。"}],"seconds":22},{"visual":"两周后，陆寻经医师许可恢复普通轻役。夜里他第一次主动尝试那只眼睛：灯下，自己指尖引起的微弱灵力有了清楚的前后流向；稍看久些，眼睛便发酸。他赶紧闭眼。次日他去济生院看周野，周野仍无法稳稳控制那枚小木销。 丹房贴出新告示：因青崖事故原定药材未交齐，凝气散开炉延期，已足额登记者继续保留兑换权。陆寻仍未取得药。他将预留凭条与吐纳诀一起夹好。","dialogue":[],"seconds":26},{"visual":"第三周复诊，医师让周野尝试一件低阶练习器件。右手灵力忽明忽暗，器件滑落。医师说明日常用手会逐渐恢复，精细控灵则可能长期受影响。周野沉默了一会儿，把原本准备报器坊见习的申请收进衣袋。","dialogue":[{"speaker":"周野","text":"那我以后还能炼器吗？"},{"speaker":"医师","text":"不是不能做器作。但要像从前那样精细控灵，普通药散不够。"},{"speaker":"陆寻","text":"有什么药能治？"},{"speaker":"医师","text":"养脉藤的成熟藤髓。先前在青崖旧药窟采过，如今那里还封着。"}],"seconds":27},{"visual":"苏禾把药籍翻到养脉藤一页，给陆寻看画着三层青叶的药图。她说药房里只剩别的伤药，旧药窟要等封阵修好才可开放。周野先开口，叫陆寻别冲动。","dialogue":[{"speaker":"苏禾","text":"我去问师父，有没有别处能找到。"},{"speaker":"周野","text":"先别惦记我。你这眼睛自己还没弄明白。"},{"speaker":"陆寻","text":"我不会现在去。等消息。"}],"seconds":23}],"next":"m03.wait.trace.seal"},{"id":"m03.wait.trace.seal","type":"scene","act":3,"title":"等一扇门打开","setting":"事故后第四周，山腰药房及训练坪。","beats":[{"visual":"七日后，镇山堂的封谷钟不再每日响起。告示上写着：外层药窟修缮完成，先由正式弟子与医修检查，随后开放有资格的低阶协作人员。苏禾在药房门口找到陆寻，拿出医师批准的采药名单。","dialogue":[{"speaker":"苏禾","text":"旧药窟能进了，不过要等下一批清查。医师说你若想跟去，得先会基本防身术。"},{"speaker":"陆寻","text":"多久开始？"},{"speaker":"苏禾","text":"约一个月。我们还有时间准备。"}],"seconds":24},{"visual":"陆寻站在公开练习坪外，看一名同境弟子将三道灵力稳稳送入剑身，想起自己在岩猞面前第三息溃散。丹药尚未到手，但新眼睛已经让他看见自身灵力运行的前后。他决定不能只等待药材，走进练习坪，向教习递上药窟协作报名牌。","dialogue":[{"speaker":"陆寻","text":"我想先把第三息练稳，再学一门能自保的剑术。"},{"speaker":"教习","text":"先说好，你会吐纳不代表会用剑。"},{"speaker":"陆寻","text":"我从头练。"}],"seconds":22}],"next":"m03.learn.trace.seal"},{"id":"m03.learn.trace.seal","type":"scene","act":3,"title":"一门功法，两种修法","setting":"清查开放前约一个月，杂役院与公开练习坪。","beats":[{"visual":"第一日，教习让陆寻翻开宗门公开的《引气诀》，在石靶前演示同一修法。陆寻炼气已有数年，能聚起一股灵力，却在第三息散掉；旁边同为炼气中段的外门弟子按教习口令完成三息，石靶长亮。教习示范：第一息纳气，第二息归拢，第三息将已炼成的灵力送入自身经脉循环。陆寻照做仍失败。","dialogue":[{"speaker":"教习","text":"你不是没灵力，是每次到第三息就散。先练这本，别贪别的。"},{"speaker":"陆寻","text":"我以前就卡在这儿。"}],"seconds":28},{"visual":"夜里，陆寻摊开旧《引气诀》，引动自己的灵力。灵目视野中，第二息的余流还未退尽，第三息一接便在经脉交汇处冲散。他对照诀文：原法只写「息定而进」，没有写每个人到底何时息定。陆寻第一次试着放慢，余力全散；第二次提早，又乱。连练三个夜晚，他终于在自己的余流刚退时接入第三息，掌心灵光稳住。他闭眼复现，继而完成原本三息闭合的一轮吐纳。丹药尚未开炉。","dialogue":[{"speaker":"陆寻","text":"原来书上说的息定，不是数到第三息。"},{"speaker":"陆寻","text":"是我自己的气，真的走完了。"}],"seconds":32},{"visual":"次日试坪，同一位外门弟子做完三轮后停下换气，陆寻用相同基础功法完成三轮，靶光终于长亮。教习让他闭眼复现，确认是实际掌握，不是外物助力。陆寻仍在炼气中段，但能将已有灵力用于持续训练。随后练基础引气剑，对手已经收剑，他却还在重新聚气；秦晚值勤经过，见他连续输了几次。","dialogue":[{"speaker":"教习","text":"这回三息都走完了。药拿到了？"},{"speaker":"陆寻","text":"还没。"},{"speaker":"秦晚","text":"你不是刚才赢了石靶吗？怎么一跟人打就输了？"},{"speaker":"陆寻","text":"我一剑出完，下一剑得从头引气。"}],"seconds":29},{"visual":"秦晚用公开的低阶火线演示：一股力尚未从体内退尽，另一股已准备好，火焰不断。陆寻看见这是真实的两次体内运转，而非凭空增加灵力。他将《引气诀》中三息运行与火线前后衔接画在纸上，尝试把体内余力退尽的时机与第二次引气协调。木剑猛震，第一次失败。他停手休息。","dialogue":[{"speaker":"秦晚","text":"剑和火不一样，你别拿自己的经脉试运气。"},{"speaker":"陆寻","text":"我不照搬火。只是想弄明白，两次出力之间为什么非得停。"},{"speaker":"秦晚","text":"好。那你先在木剑上试，我看着。"}],"seconds":29},{"visual":"十余日间，陆寻白日搬货，夜间将练习结果记在旧诀页边。周野用左手修整木剑柄。秦晚值勤时来试接：陆寻终于闭眼打出前后两道相连的剑势，第二道第一次绕开她的低阶火幕，下一回却被她提前挡住。他尝试调整第二次发力间隔，过早便冲散，过晚便接不上。又过数日，他将第二股力保留在体内，成功延后一瞬，击中后方石靶；闭眼连续验证两次，第三次力竭停手。","dialogue":[{"speaker":"秦晚","text":"第一回能打中不稀奇。第二回、第三回呢？"},{"speaker":"陆寻","text":"再试。"},{"speaker":"秦晚","text":"这回你倒比我还舍不得收剑。"},{"speaker":"陆寻","text":"我以前学不会。现在知道哪里错了，就不想停。"}],"seconds":38},{"visual":"月底。教习考查陆寻的基础引气剑和防身步法，准许加入药窟协作。秦晚将陆寻那张写满失败记号的旧纸翻过来，指着他自己改写的衔接方法。教习核对实际学成的剑式，陆寻没有主动告知裴照雪异常视觉。","dialogue":[{"speaker":"秦晚","text":"你这不是师父教的第二剑。叫什么？"},{"speaker":"陆寻","text":"还没取名。先叫回息剑吧。"},{"speaker":"秦晚","text":"等你能把这两剑连成三剑，再来找我。"},{"speaker":"陆寻","text":"好。"}],"seconds":28}],"next":"m03.depart.trace.seal"},{"id":"m03.depart.trace.seal","type":"scene","act":3,"title":"这次带剑出门","setting":"次日清晨，山门至青崖药窟。","beats":[{"visual":"周野将修好的轻型采具交给陆寻，将修好的普通练习剑递给他，又看了眼页边写着「回息剑」的旧诀。医师只允许周野做轻役，他留在山门帮器坊整理材料。苏禾背着药囊与辨药图册赶来。","dialogue":[{"speaker":"周野","text":"采具我都检查过了。你俩别跟上回一样。"},{"speaker":"陆寻","text":"这回有人带路，我也练过了。"},{"speaker":"苏禾","text":"先回来再说。"}],"seconds":23},{"visual":"三人告别。陆寻和苏禾随外门弟子韩峥及巡守下山。路过昔日断桥处，新架的临时木桥上有镇山堂封检牌；旧药坡仍封闭。他们沿新开放的内侧药窟通路前行，远处可见修好的封门，入口有医师驻守。韩峥走在前面，途中以一剑逼退一只低阶岩猞，陆寻看得出自己剑术还不如他熟练。","dialogue":[{"speaker":"韩峥","text":"采药归采药，遇见兽先喊我。"},{"speaker":"陆寻","text":"知道。"},{"speaker":"苏禾","text":"前面就是药窟了。"}],"seconds":25}],"next":"m03.cave.trace.seal"},{"id":"m03.cave.trace.seal","type":"scene","act":3,"title":"药窟里的人","setting":"清查当天，青崖内侧旧药窟外层。","beats":[{"visual":"药窟入口，医师核对采药名单。洞内青色藤蔓沿石壁攀生，部分已经枯萎。韩峥指明今日只开放到石台，苏禾取出药图，陆寻紧跟在她身旁。医师提醒成熟藤髓用于伤者救治，若发现额外罕见结晶，先报告、清除危险，再按实际参与者事前协议分配。 入口木牌写明：额外稀有药材经医师核验、按约采回者，另有四石采掘报酬；玉髓可作个人修炼资源，不可直接承诺突破境界；普通救治药材不计入这笔报酬。","dialogue":[{"speaker":"韩峥","text":"藤髓够就出来。别碰深处。"},{"speaker":"苏禾","text":"我只取成熟的，伤了根明年就没药。"},{"speaker":"医师","text":"若真遇上稀有结晶，先报位置。采回另有四石，你们先说好怎么分。"}],"seconds":31},{"visual":"苏禾先采足周野所需的普通成熟藤髓。陆寻借灵目观察活藤运行，看见灵力反复进入被枯叶遮挡的石缝，却很少回到根部。苏禾顺着他所指扒开枯叶，在医师允许的采区露出一枚拇指长的青白结晶。她查药籍确认：养脉玉髓是老藤多年凝成的稀有灵材，可在医师监督下温养炼气修士反复承受灵力运行的经脉，尤其适合陆寻如今练成的连续施法；整枚可供一个人完整疗程，半枚只能完成较短疗程。两人先将周野的普通藤髓送洞口验收封存。","dialogue":[{"speaker":"苏禾","text":"养脉玉髓……去年百草峰找遍几处药圃，也没收上来一枚。"},{"speaker":"陆寻","text":"我现在每次连出两剑就得歇。这个能帮我继续练？"},{"speaker":"苏禾","text":"能让经脉更经得住反复施法。不过吃下去可不会直接筑基。"},{"speaker":"苏禾","text":"周野那份藤髓已经够了。先交回去，再说这枚。"}],"seconds":34},{"visual":"两人返回石台附近向巡守报告玉髓位置，低阶岩猞从侧缝冲出。韩峥举剑挡住首爪，受岩壁限制无法继续挥剑。陆寻先以已练成的引气剑挡住兽爪的侧向力量，随即停半息，让第二股体内灵力接续，从岩壁另一侧击落松动石片，逼岩猞抬头。韩峥借机以剑气击中兽肩，将其逼回侧缝。苏禾护着药囊退至洞口，陆寻虎口发痛但仍能收剑。","dialogue":[{"speaker":"韩峥","text":"你刚才明明收了剑，怎么又出一道？"},{"speaker":"陆寻","text":"没重新聚气。第二股力还在体内。"},{"speaker":"韩峥","text":"……你练的什么剑？"},{"speaker":"陆寻","text":"自己试出来的。先出去。"}],"seconds":28},{"visual":"洞口，巡守检查两人均无重伤，说明一刻后会封住侧缝，玉髓只能在本次开放内采出。韩峥认可陆寻发现玉髓的贡献，也认为自己守通道有份。两人提出先约定分配，再决定取玉方式。韩峥愿意用自己的外门护阵符协作驱兽，平分玉髓；若陆寻想独得，可以接受三式试剑决定优先采掘权，但胜者独得玉髓、全部四石额外采掘报酬归守路者，且独取路线由巡守封侧缝后单人采出。","dialogue":[{"speaker":"韩峥","text":"合作的话，我出护阵符，你我各一半。以后历练也可以一起。"},{"speaker":"韩峥","text":"若你想独拿，就比三式。赢了你先采，我守这条路，额外的四块灵石都归我。"},{"speaker":"苏禾","text":"周野的药已经验过。这份是额外机缘，别急着答应。"}],"seconds":30}],"next":"m03.choice.trace.seal"},{"id":"m03.choice.trace.seal","type":"choice","act":3,"prompt":"周野的药已经取得。你可与韩峥约定平分玉髓，获得真实同行关系；也可公开比试争取整份，独自承担采掘与守路报酬。两种取法都须经巡守确认安全。","choices":[{"id":"duel","text":"接受比试，争取独取玉髓，承担守路报酬。","next":"m03.duel.trace.seal"},{"id":"join","text":"与韩峥合作，合力取玉髓，各得一半。","next":"m03.join.trace.seal"}]},{"id":"m03.duel.trace.seal","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"两人在洞口安全试坪依约比三式，使用统一低阶练习剑与护具。第一式韩峥将陆寻逼退，第二式他提前封住固定第二剑的间隔，陆寻虎口发麻。陆寻想起秦晚破解自己时的练习，重新稳住脚步。","dialogue":[{"speaker":"韩峥","text":"刚才在洞里我就看见了。你第二剑只快那么一点。"},{"speaker":"陆寻","text":"再来。"}],"seconds":25},{"visual":"第三式，韩峥按固定间隔抢先截剑。陆寻先用第一剑护住身前，将第二股灵力留在体内，等韩峥提前压剑落空才接出第二剑。剑势击亮肩前判定护具。韩峥收剑，巡守确认陆寻取得优先采掘权。","dialogue":[{"speaker":"韩峥","text":"你什么时候把第二剑变慢了？"},{"speaker":"陆寻","text":"你挡得太早。"},{"speaker":"韩峥","text":"好。你先采。"}],"seconds":28},{"visual":"巡守封住侧缝后，医师监督陆寻取出整枚玉髓。陆寻依先前协议，将本次额外采掘报酬中的全部四块灵石交给韩峥，作为独取时由他承担的守路报酬；宗门救治药材不参与分配。韩峥接过灵石，没有再争玉髓。","dialogue":[{"speaker":"韩峥","text":"我输了，玉归你。"},{"speaker":"陆寻","text":"守路的四块，按说好的给你。"},{"speaker":"韩峥","text":"好。下次外门见。"}],"seconds":25},{"visual":"当天傍晚回宗。苏禾将普通藤髓交正式医师配药。三日后周野开始用药，随后数周复诊，右手颤抖逐渐减轻。第一次能稳住轻型器件时，周野主动把陆寻叫到器坊外场，亲手将一只练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。今天别再练了。"}],"seconds":28},{"visual":"数周后，医师按疗程为陆寻用完整玉髓。他每日以《引气诀》温养经脉，不凭丹药强行冲境。恢复训练后，他在试坪连续施展三轮回息剑，第三轮仍能稳稳收剑。教习请此前练习中压制他的同境弟子与他对练；对方按旧间隔提前封剑，陆寻将第二股灵力延后一瞬，击中肩前护具。教习宣布点到为止。秦晚看完，主动拿来自己的练习剑，站到陆寻对面。","dialogue":[{"speaker":"教习","text":"上月你还练不完三息。今天这第二剑，倒是他先接不住了。"},{"speaker":"秦晚","text":"来。现在换我跟你练。"},{"speaker":"陆寻","text":"师姐不怕我赢？"},{"speaker":"秦晚","text":"你先追上我再说。"}],"seconds":38},{"visual":"再过数日，青崖药圃恢复常规供药，百草峰终于开炉。苏禾在丹房外叫住陆寻，将他带到原先那个窗口。医师核对开山礼补盖的优先凭条，扣除陆寻足额预留的一百工分，递出一只凝气散青瓷瓶。陆寻接过药，翻开自己写满批注的《引气诀》。远处严承来交剩余赔付，见陆寻领药，又见他背着练习剑，转身离去。陆寻没有立即吞药，把药瓶妥善收好，准备按实际修炼所需使用。","dialogue":[{"speaker":"苏禾","text":"你的药，终于轮到了。"},{"speaker":"陆寻","text":"我等了几个月。现在倒知道该怎么用了。"},{"speaker":"苏禾","text":"这回可别让人抢了。"},{"speaker":"陆寻","text":"不会了。"}],"seconds":26},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上只有破损灰符与接触者记录，尚无异常视觉的直接报告。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.seal.duel"},{"id":"end.trace.seal.duel","type":"end","title":"独得玉髓·守住外门","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"整份养脉玉髓已按疗程使用，连续三轮回息剑稳定并战胜此前压制自己的同境弟子；额外四石付韩峥，未获同行约定。周野普通藤髓治疗后逐步恢复精细控灵。原预留凝气散已领取，一百工分已扣除，药瓶尚未使用。","mid":"M04/M05须继承：秦晚共同查兽、提前吹哨及双处灰符证据；未追回令牌及无裴共同秘密；独自养脉形成更强持续施法能力；回息剑是真正学成的低阶术式，不等于完整高阶功法。凝气散已兑领未服，玉髓已使用，不重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.join.trace.seal","type":"scene","act":3,"title":"这一次，剑不是一个人的","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"陆寻与韩峥先在入口医师处约定平分玉髓及额外采掘报酬。韩峥取出自有低阶护阵符，在巡守指定位置布置临时防护。两人进入已标定区域；苏禾守在洞口。韩峥引开岩猞，陆寻观察它真实蓄力与扑击后的短暂停顿。","dialogue":[{"speaker":"韩峥","text":"你那第二剑能不能慢半息？"},{"speaker":"陆寻","text":"练过。你先退。"}],"seconds":25},{"visual":"岩猞扑向韩峥。陆寻第一剑截住其侧向扑势，韩峥后撤，陆寻没有立刻释放第二剑，待岩猞实际转向后才将体内准备好的第二股灵力送出，击落岩侧浮石，封住兽道。韩峥趁窗口将玉髓从经医师确认的可采位置完整取出，二人及时撤出；不是陆寻越级击杀妖兽。","dialogue":[{"speaker":"韩峥","text":"现在！"},{"speaker":"陆寻","text":"退！"},{"speaker":"韩峥","text":"拿到了！走！"}],"seconds":28},{"visual":"医师核验玉髓完整且可等分，两人各取一半；额外采掘报酬四石也各取两石。韩峥收起已经耗尽的护阵符，主动将传信牌递给陆寻。","dialogue":[{"speaker":"韩峥","text":"以后低阶同行试炼，缺人就来找我。"},{"speaker":"陆寻","text":"这次的账，五五。"},{"speaker":"韩峥","text":"说到做到。"}],"seconds":24},{"visual":"当天傍晚回宗。苏禾将普通藤髓交正式医师配药。三日后周野开始用药，随后数周复诊，右手颤抖逐渐减轻。第一次能稳住轻型器件时，周野主动把陆寻叫到器坊外场，亲手将一只练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。今天别再练了。"}],"seconds":28},{"visual":"数周后，医师为陆寻用半份玉髓，经脉承载改善，但三轮仍需停歇。韩峥按约来练习坪，教陆寻自己的公开低阶守剑法。陆寻也将回息剑的发力间隔与失败记号讲给韩峥，韩峥尝试数次，发现他原本修法不同，不能直接照搬，陆寻调整讲解，让他自己验证体内余力退去的时机。数日后韩峥终于以普通练习剑独立接出第二道低阶剑势，两人交换攻守，陆寻第一次靠改过的守势挡下韩峥的连续剑招。秦晚看到两人对练，笑着走来。","dialogue":[{"speaker":"韩峥","text":"还真能练出来。原来我不是非得从头聚气。"},{"speaker":"陆寻","text":"你那套守剑也不差。"},{"speaker":"秦晚","text":"你俩背着我练成了什么？"},{"speaker":"韩峥","text":"陆寻教我的。"},{"speaker":"秦晚","text":"那我是不是也得来请教陆师兄？"}],"seconds":38},{"visual":"再过数日，青崖药圃恢复常规供药，百草峰终于开炉。苏禾在丹房外叫住陆寻，将他带到原先那个窗口。医师核对开山礼补盖的优先凭条，扣除陆寻足额预留的一百工分，递出一只凝气散青瓷瓶。陆寻接过药，翻开自己写满批注的《引气诀》。远处严承来交剩余赔付，见陆寻领药，又见他背着练习剑，转身离去。陆寻没有立即吞药，把药瓶妥善收好，准备按实际修炼所需使用。","dialogue":[{"speaker":"苏禾","text":"你的药，终于轮到了。"},{"speaker":"陆寻","text":"我等了几个月。现在倒知道该怎么用了。"},{"speaker":"苏禾","text":"这回可别让人抢了。"},{"speaker":"陆寻","text":"不会了。"}],"seconds":26},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上只有破损灰符与接触者记录，尚无异常视觉的直接报告。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.trace.seal.join"},{"id":"end.trace.seal.join","type":"end","title":"并肩取玉·守住外门","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随秦晚查兽栏，取得第二片灰符证物。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"半份养脉玉髓已按疗程使用，两轮回息剑稳定；获得韩峥真实陪练、低阶守剑与两石额外报酬；韩峥在陆寻指导下亲自练成适配自身的衔接第二剑。周野普通藤髓治疗后逐步恢复精细控灵。原预留凝气散已领取，一百工分已扣除，药瓶尚未使用。","mid":"M04/M05须继承：秦晚共同查兽、提前吹哨及双处灰符证据；未追回令牌及无裴共同秘密；韩峥独立学成衔接第二剑，陆寻实际掌握低阶守剑，同行关系；回息剑是真正学成的低阶术式，不等于完整高阶功法。凝气散已兑领未服，玉髓已使用，不重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m01.herb","type":"scene","act":1,"title":"不是所有杂役都只会搬箱子","setting":"开山礼第四日，青崖外谷临时药圃。","beats":[{"visual":"陆寻与周野跟随百草峰药工来到入口旁已清查的药圃，苏禾在医师指导下辨认药株。严承的同伴随手拔了几株未成熟的赤纹芝，苏禾将药筐推回。陆寻按她教的方法识别成熟叶纹，周野用旧牵引器将药筐从岩坡吊上来。","dialogue":[{"speaker":"苏禾","text":"别连根拔！下个月还要采呢。"},{"speaker":"陆寻","text":"这株叶背有三道赤纹，是不是你要的？"},{"speaker":"苏禾","text":"对。你们俩总算有一回不是来找我包扎的。"}],"seconds":25},{"visual":"药工称量，合格赤纹芝超过原计划。苏禾把其中一株送医师制备安抚药，正式登记两人完成差事，各领二十工分。她拿出自己的医修申请：下月公开培养考评，她正在准备，不想永远只替人包扎。 苏禾将合格药株另分一部分送丹房备制凝气散，并将一小包经医师核准的赤纹芝安抚粉交给药工，教陆寻辨认用药标记：如遇岩猞，不可主动接近，先撤退，并由巡守使用安抚粉。","dialogue":[{"speaker":"苏禾","text":"我想自己学会治经脉伤。现在只能跟着医师做。"},{"speaker":"陆寻","text":"等你过考评，我请你吃饭。"},{"speaker":"苏禾","text":"记着。别又拿两个馒头糊弄我。"}],"seconds":23},{"visual":"傍晚回到山腰。陆寻的工分牌终于满一百。丹房柜台尚无凝气散，值事给他盖上足额登记印，在开山礼医师补盖的优先凭条上登记足额，注明下一批可按原顺序领取。周野把自己的新报酬留作炼器入门材料。","dialogue":[{"speaker":"周野","text":"这回钱够了。谁再抢？"},{"speaker":"陆寻","text":"先把凭条收好。药没炼出来，还得等。"},{"speaker":"周野","text":"你练功，我帮你盯着丹房。"}],"seconds":22}],"next":"m02.before.herb"},{"id":"m02.before.herb","type":"scene","act":2,"title":"等药的七天","setting":"开山礼后第五日至第十二日，杂役院、山腰药房。","beats":[{"visual":"一周里，陆寻照常做工，夜间练习两息吐纳，把足额兑换凭条压在讲义下。每次练到第三息，他指间的灵光便散去。周野在院角修理旧牵引轮，陆寻把晚饭搁到他旁边。丹房木牌一直写着：缺赤纹芝，暂不开炉。","dialogue":[{"speaker":"周野","text":"你这练一次得歇半天。"},{"speaker":"陆寻","text":"没药也得练。等秋选可没人等我。"}],"seconds":23},{"visual":"一日傍晚，陆寻送货经过药房，苏禾正核对赤纹芝用量。前批已制成安抚药，丹房新一批凝气散仍缺药，镇山堂正在复查东侧药坡。","dialogue":[{"speaker":"苏禾","text":"你们上次采的那批先拿去制安抚药了。"},{"speaker":"陆寻","text":"凝气散还缺药？"},{"speaker":"苏禾","text":"东药坡那批补上就能开炉。别急，等巡守确认。"}],"seconds":24},{"visual":"第十二日清晨。山腰告示上新增镇山堂盖印的开放路线：青崖外谷东药坡，内谷继续封闭；巡守值勤，采药差事两名工役合计四十工分。陆寻看着告示，回头招呼周野。","dialogue":[{"speaker":"陆寻","text":"东药坡开放了。采到赤纹芝，丹房就能开炉。"},{"speaker":"周野","text":"走，先看看领队是谁。"}],"seconds":15}],"next":"m02.depart.herb"},{"id":"m02.depart.herb","type":"scene","act":2,"title":"外谷的第三个人","setting":"开山礼后第十三日，清晨，青崖谷东药坡。","beats":[{"visual":"庶务堂窗口。值事将新差事的分工牌放到陆寻面前，旁边一张牌写着临时领队严承。陆寻没有立即签，先展开镇山堂盖印的安全路线图，确认路线只在开放药坡。周野指着入口巡守标记。画面切至山路，三人背着采药篓下山，半个时辰后抵达青崖登记亭。","dialogue":[{"speaker":"周野","text":"怎么又是他？"},{"speaker":"陆寻","text":"丹房还缺这一批药。镇山堂盖了印，只走开放药坡，交药给百草峰。他不能再把我们的东西拿走。"},{"speaker":"周野","text":"他要带咱俩往里面走，咱俩就回头。"},{"speaker":"陆寻","text":"好。"}],"seconds":28},{"visual":"三人过登记亭。绳桥连接山门端与药坡；北侧旧药棚旁是备用牵引索和安全岩台，药棚后为镇山堂巡检门，门内封着尚未拆解的古物。巡守正在检查入口附近的异常回响。严承趁两人走在前面，从行囊取出一枚灰纹符；闪回早晨严家送货人递给他符纸，说可驱开小兽，严承付了一块灵石。送货人袖口有同样灰纹，严承并不知道其真实身份。","dialogue":[],"seconds":22},{"visual":"苏禾上次采药时教过如何辨认成熟赤纹芝。周野先发现三纹叶背，陆寻找到岩缝中完整的一株。陆寻同时看到兽道的新鲜足迹，提醒严承尽快离开。","dialogue":[{"speaker":"陆寻","text":"采完这株就走。"},{"speaker":"严承","text":"怕什么？你们难道还想白领工钱？"}],"seconds":16},{"visual":"严承把刚割下的灵芝塞进药篓，见二人要撤，取出早晨买来的灰符。他想先驱开近处妖兽、独自留下采更好的药，便将符激发。灰光沿岩缝散开，远处兽群躁动起来，连着撞响外围警示阵。严承脸色骤变。","dialogue":[{"speaker":"严承","text":"你们先回去！剩下的我采。"},{"speaker":"周野","text":"你手里什么东西？"},{"speaker":"严承","text":"驱兽符！……不对，快走！回桥！"}],"seconds":24}],"next":"m02.crisis.herb"},{"id":"m02.crisis.herb","type":"scene","act":2,"title":"他割断了桥","setting":"青崖谷绳桥与北侧岩台。","beats":[{"visual":"岩猞冲出兽道，三人奔向绳桥。严承抢先过桥，回头看见陆寻和周野还差数步。他看一眼追来的妖兽，又望一眼药篓，拔刀割断承重索。桥面坠下，周野伸手将陆寻拽离断口，自己右臂撞岩。陆寻急忙引气击出一道浅白灵光，第三息散掉，灵光在兽爪前溃散。他拽着周野翻入岩侧，前臂被岩石划破。","dialogue":[{"speaker":"陆寻","text":"别割！"},{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊！"},{"speaker":"周野","text":"陆寻，北边！"},{"speaker":"陆寻","text":"走！我挡不住它！"}],"seconds":26},{"visual":"兄弟沿北侧旧路往药棚退。高处，两个蒙面人听见警示阵钟声，等巡守赶往兽道，一人取出灰纹令牌打开巡检门的外层通路，另一人掩护。巡守闻警赶来，裴照雪一剑封住兽道，转身看见巡检门被人闯开。","dialogue":[],"seconds":21},{"visual":"药棚旁，受损门阵的反冲堵住撤离口。周野右手无法抓绳，陆寻将他扶上石台。陆寻认出随队药工带来的安抚粉，按苏禾教过的标记请巡守取出使用；低阶岩猞暂缓扑势，药工撤入岩台。裴照雪以白剑截断袭向巡守的暗光，敌人退进巡检门。她留下两人保护伤员，自己带队追入。","dialogue":[{"speaker":"裴照雪","text":"伤者先走！别碰那扇门！"},{"speaker":"陆寻","text":"这边的牵引索卡住了！"}],"seconds":23},{"visual":"蒙面人从巡检门内冲出，怀里是一件破损的封物外壳。他试图以灰纹令牌打开外层撤路，却被裴照雪一剑逼退。外壳撞在岩壁上裂开，一枚带瞳纹的内芯从缺口滑落到药棚石台。蒙面人见空壳脱手，转身逃向北侧旧路。裴照雪不得不先挡住他反击巡守的暗光。","dialogue":[],"seconds":22},{"visual":"石台下的低阶牵引阵反冲加剧，周野与另一名受伤药工困在石台，绳索只要受力就被阵力猛拽。陆寻曾见过测阵石，发现瞳纹内芯与残阵明灭同频，误以为能帮助判断牵引阵；拾起没有反应，他试送一丝自身灵力。内芯瞳纹亮起，随后失光。陆寻捂住眼睛跪倒。","dialogue":[{"speaker":"周野","text":"别管我，先叫人！"},{"speaker":"陆寻","text":"等一下……这是测阵的？"}],"seconds":24},{"visual":"再睁眼，陆寻看见牵引阵的两层实际回流。表面暗下，深处仍在反冲。他试拉一次，绳索猛震，立即松手。第二次，他等两层退去，喊巡守拉绳；自己扶住周野和药工。两名巡守共同拉起绳索，将两人转移至安全岩台。下一次回力击碎空绳轮。","dialogue":[{"speaker":"陆寻","text":"先别拉！里面还有力……现在！"},{"speaker":"巡守","text":"上来了！两个都上来了！"},{"speaker":"周野","text":"你……怎么看出来的？"},{"speaker":"陆寻","text":"我也不知道。"}],"seconds":30},{"visual":"伤者已被巡守转移到安全岩台。北侧旧路上一枚被逃敌丢下的低阶符片仍亮着，陆寻看见符中灵流与敌人令牌刚才的明灭相同。另一侧，门阵外泄的力量正沿石槽向药棚逼近，仍有两名药工和一车救护药材未完全撤出。巡守人手不足，裴照雪需要决定先追哪条岔路；陆寻若留在这儿，能凭搬运经验协助撤出药车。","dialogue":[{"speaker":"裴照雪","text":"北路有两条岔道，谁看清他走哪边了？"},{"speaker":"巡守","text":"师姐，药棚那边还有人！"},{"speaker":"陆寻","text":"……"}],"seconds":25}],"next":"m02.choice.herb"},{"id":"m02.choice.herb","type":"choice","act":2,"prompt":"周野已被救出。追敌的关键线索就在眼前，但说明异常视野会留下记录；药棚仍需人手。你要先向裴照雪提供线索，还是留下协助药工撤离？","choices":[{"id":"pursue","text":"告诉裴照雪异常所见，请她追查灰符来源。","next":"m02.pursue.herb"},{"id":"seal","text":"留在封门外协助巡守撤离与封住泄口，暂不说明眼睛。","next":"m02.seal.herb"}]},{"id":"m02.pursue.herb","type":"scene","act":2,"title":"她回头等我说完","setting":"青崖谷安全岩台与封阵外门。","beats":[{"visual":"陆寻将实际看到的符片灵流方向指给裴照雪，说明自己刚才看见了残阵内部回力。裴以巡守检测石核对符片响应，确认它与逃敌使用的灰纹令牌相符；她让陆寻留在安全岩台，不带低阶伤员追敌，自己带一名巡守沿线追去。","dialogue":[{"speaker":"陆寻","text":"那片符还在动。和刚才他手上的令牌一样。"},{"speaker":"裴照雪","text":"你能看见？"},{"speaker":"陆寻","text":"能。刚刚才开始。"},{"speaker":"裴照雪","text":"好。你留在这，剩下的我来。"}],"seconds":25},{"visual":"画面切至北侧旧路：裴照雪截住受伤逃敌，剑尖击落其灰纹令牌，敌人以暗光掩护撤走；她没有贸然追入未知禁区。她带回实际令牌及符片，陆寻被登记为异常所见的线索提供者。","dialogue":[{"speaker":"裴照雪","text":"人走了，东西留下了。"},{"speaker":"陆寻","text":"能查到是谁吗？"},{"speaker":"裴照雪","text":"不能现在保证。但至少有东西可查。"}],"seconds":26},{"visual":"夕阳落到青崖谷口。巡守封存失活内芯，登记陆寻接触碎片、眼痛及救援经过。裴照雪与同行巡守另记下他所述异常视觉，暂不对外公开。担架队沿山路返回宗门，苏禾提着药箱在济生院门口等伤者。她看见周野苍白的脸，马上叫来医师，抓住陆寻的左手查看伤口。","dialogue":[{"speaker":"苏禾","text":"陆寻！你们怎么又把自己弄成这样？"},{"speaker":"陆寻","text":"他的手先治。"},{"speaker":"苏禾","text":"我知道。你也坐下。"}],"seconds":23},{"visual":"当夜，严承交验药材时已被巡守带走。次日下午，镇山堂在济生院偏厅听取伤者证词。陆寻坐在椅子上，手臂仍缠着药布；严承站在另一侧，承认买来并使用灰符，却说自己不知道会引来兽群。药工出示百草峰登记的采药路线并作证。镇山堂当场没收严承此次药功，暂停领队，先核定一部分治疗赔付；灰符卖家另查。","dialogue":[{"speaker":"严承","text":"我买的是驱兽符！我哪知道会引来这么多！"},{"speaker":"陆寻","text":"你不知道符会引兽。可你知道我们还没过桥。"},{"speaker":"巡守","text":"药功取消，领队牌交出来。伤者的药费先由你赔。"},{"speaker":"严承","text":"……"}],"seconds":25},{"visual":"事故第三日，苏禾为陆寻换药。周野仍在病床上睡着。陆寻翻出足额兑换凝气散的凭条，想起岩猞扑来时自己聚不起第三息，将凭条重新折好。窗外正式弟子持剑走过，他久久看着。","dialogue":[{"speaker":"苏禾","text":"今天眼睛还疼吗？"},{"speaker":"陆寻","text":"偶尔会。"},{"speaker":"苏禾","text":"别瞒我。医师说先歇几天。"},{"speaker":"陆寻","text":"知道了。"}],"seconds":18}],"next":"m02.recover.herb.pursue"},{"id":"m02.recover.herb.pursue","type":"scene","act":2,"title":"一只拿不稳的手","setting":"事故后第七日至第二十一日，济生院与杂役院。","beats":[{"visual":"一周后。周野终于能靠在床头，陆寻帮他把器坊练习册拿过来。他用左手翻页，右手去拿一只小木销，木销掉在被子上。他笑着换左手，又把那一页翻了过去。陆寻看在眼里，没有说话。","dialogue":[{"speaker":"周野","text":"等我好了，这东西我闭着眼都能装回去。"},{"speaker":"陆寻","text":"那就先别急。"}],"seconds":22},{"visual":"两周后，陆寻经医师许可恢复普通轻役。夜里他第一次主动尝试那只眼睛：灯下，自己指尖引起的微弱灵力有了清楚的前后流向；稍看久些，眼睛便发酸。他赶紧闭眼。次日他去济生院看周野，周野仍无法稳稳控制那枚小木销。 丹房贴出新告示：因青崖事故原定药材未交齐，凝气散开炉延期，已足额登记者继续保留兑换权。陆寻仍未取得药。他将预留凭条与吐纳诀一起夹好。","dialogue":[],"seconds":26},{"visual":"第三周复诊，医师让周野尝试一件低阶练习器件。右手灵力忽明忽暗，器件滑落。医师说明日常用手会逐渐恢复，精细控灵则可能长期受影响。周野沉默了一会儿，把原本准备报器坊见习的申请收进衣袋。","dialogue":[{"speaker":"周野","text":"那我以后还能炼器吗？"},{"speaker":"医师","text":"不是不能做器作。但要像从前那样精细控灵，普通药散不够。"},{"speaker":"陆寻","text":"有什么药能治？"},{"speaker":"医师","text":"养脉藤的成熟藤髓。先前在青崖旧药窟采过，如今那里还封着。"}],"seconds":27},{"visual":"苏禾把药籍翻到养脉藤一页，给陆寻看画着三层青叶的药图。她说药房里只剩别的伤药，旧药窟要等封阵修好才可开放。周野先开口，叫陆寻别冲动。","dialogue":[{"speaker":"苏禾","text":"我去问师父，有没有别处能找到。"},{"speaker":"周野","text":"先别惦记我。你这眼睛自己还没弄明白。"},{"speaker":"陆寻","text":"我不会现在去。等消息。"}],"seconds":23}],"next":"m03.wait.herb.pursue"},{"id":"m03.wait.herb.pursue","type":"scene","act":3,"title":"等一扇门打开","setting":"事故后第四周，山腰药房及训练坪。","beats":[{"visual":"七日后，镇山堂的封谷钟不再每日响起。告示上写着：外层药窟修缮完成，先由正式弟子与医修检查，随后开放有资格的低阶协作人员。苏禾在药房门口找到陆寻，拿出医师批准的采药名单。","dialogue":[{"speaker":"苏禾","text":"旧药窟能进了，不过要等下一批清查。医师说你若想跟去，得先会基本防身术。"},{"speaker":"陆寻","text":"多久开始？"},{"speaker":"苏禾","text":"约一个月。我们还有时间准备。"}],"seconds":24},{"visual":"陆寻站在公开练习坪外，看一名同境弟子将三道灵力稳稳送入剑身，想起自己在岩猞面前第三息溃散。丹药尚未到手，但新眼睛已经让他看见自身灵力运行的前后。他决定不能只等待药材，走进练习坪，向教习递上药窟协作报名牌。","dialogue":[{"speaker":"陆寻","text":"我想先把第三息练稳，再学一门能自保的剑术。"},{"speaker":"教习","text":"先说好，你会吐纳不代表会用剑。"},{"speaker":"陆寻","text":"我从头练。"}],"seconds":22}],"next":"m03.learn.herb.pursue"},{"id":"m03.learn.herb.pursue","type":"scene","act":3,"title":"一门功法，两种修法","setting":"清查开放前约一个月，杂役院与公开练习坪。","beats":[{"visual":"第一日，教习让陆寻翻开宗门公开的《引气诀》，在石靶前演示同一修法。陆寻炼气已有数年，能聚起一股灵力，却在第三息散掉；旁边同为炼气中段的外门弟子按教习口令完成三息，石靶长亮。教习示范：第一息纳气，第二息归拢，第三息将已炼成的灵力送入自身经脉循环。陆寻照做仍失败。","dialogue":[{"speaker":"教习","text":"你不是没灵力，是每次到第三息就散。先练这本，别贪别的。"},{"speaker":"陆寻","text":"我以前就卡在这儿。"}],"seconds":28},{"visual":"夜里，陆寻摊开旧《引气诀》，引动自己的灵力。灵目视野中，第二息的余流还未退尽，第三息一接便在经脉交汇处冲散。他对照诀文：原法只写「息定而进」，没有写每个人到底何时息定。陆寻第一次试着放慢，余力全散；第二次提早，又乱。连练三个夜晚，他终于在自己的余流刚退时接入第三息，掌心灵光稳住。他闭眼复现，继而完成原本三息闭合的一轮吐纳。丹药尚未开炉。","dialogue":[{"speaker":"陆寻","text":"原来书上说的息定，不是数到第三息。"},{"speaker":"陆寻","text":"是我自己的气，真的走完了。"}],"seconds":32},{"visual":"次日试坪，同一位外门弟子做完三轮后停下换气，陆寻用相同基础功法完成三轮，靶光终于长亮。教习让他闭眼复现，确认是实际掌握，不是外物助力。陆寻仍在炼气中段，但能将已有灵力用于持续训练。随后练基础引气剑，对手已经收剑，他却还在重新聚气；秦晚值勤经过，见他连续输了几次。","dialogue":[{"speaker":"教习","text":"这回三息都走完了。药拿到了？"},{"speaker":"陆寻","text":"还没。"},{"speaker":"秦晚","text":"你不是刚才赢了石靶吗？怎么一跟人打就输了？"},{"speaker":"陆寻","text":"我一剑出完，下一剑得从头引气。"}],"seconds":29},{"visual":"秦晚用公开的低阶火线演示：一股力尚未从体内退尽，另一股已准备好，火焰不断。陆寻看见这是真实的两次体内运转，而非凭空增加灵力。他将《引气诀》中三息运行与火线前后衔接画在纸上，尝试把体内余力退尽的时机与第二次引气协调。木剑猛震，第一次失败。他停手休息。","dialogue":[{"speaker":"秦晚","text":"剑和火不一样，你别拿自己的经脉试运气。"},{"speaker":"陆寻","text":"我不照搬火。只是想弄明白，两次出力之间为什么非得停。"},{"speaker":"秦晚","text":"好。那你先在木剑上试，我看着。"}],"seconds":29},{"visual":"十余日间，陆寻白日搬货，夜间将练习结果记在旧诀页边。周野用左手修整木剑柄。秦晚值勤时来试接：陆寻终于闭眼打出前后两道相连的剑势，第二道第一次绕开她的低阶火幕，下一回却被她提前挡住。他尝试调整第二次发力间隔，过早便冲散，过晚便接不上。又过数日，他将第二股力保留在体内，成功延后一瞬，击中后方石靶；闭眼连续验证两次，第三次力竭停手。","dialogue":[{"speaker":"秦晚","text":"第一回能打中不稀奇。第二回、第三回呢？"},{"speaker":"陆寻","text":"再试。"},{"speaker":"秦晚","text":"这回你倒比我还舍不得收剑。"},{"speaker":"陆寻","text":"我以前学不会。现在知道哪里错了，就不想停。"}],"seconds":38},{"visual":"月底。教习考查陆寻的基础引气剑和防身步法，准许加入药窟协作。秦晚将陆寻那张写满失败记号的旧纸翻过来，指着他自己改写的衔接方法。裴照雪按先前异常视野记录来复核，亲眼看见他闭眼复现剑式，确认他没有依赖外物；她仍不知古仙来源。","dialogue":[{"speaker":"秦晚","text":"你这不是师父教的第二剑。叫什么？"},{"speaker":"陆寻","text":"还没取名。先叫回息剑吧。"},{"speaker":"秦晚","text":"等你能把这两剑连成三剑，再来找我。"},{"speaker":"陆寻","text":"好。"}],"seconds":28}],"next":"m03.depart.herb.pursue"},{"id":"m03.depart.herb.pursue","type":"scene","act":3,"title":"这次带剑出门","setting":"次日清晨，山门至青崖药窟。","beats":[{"visual":"周野将修好的轻型采具交给陆寻，将修好的普通练习剑递给他，又看了眼页边写着「回息剑」的旧诀。医师只允许周野做轻役，他留在山门帮器坊整理材料。苏禾背着药囊与辨药图册赶来。","dialogue":[{"speaker":"周野","text":"采具我都检查过了。你俩别跟上回一样。"},{"speaker":"陆寻","text":"这回有人带路，我也练过了。"},{"speaker":"苏禾","text":"先回来再说。"}],"seconds":23},{"visual":"三人告别。陆寻和苏禾随外门弟子韩峥及巡守下山。路过昔日断桥处，新架的临时木桥上有镇山堂封检牌；旧药坡仍封闭。他们沿新开放的内侧药窟通路前行，远处可见修好的封门，入口有医师驻守。韩峥走在前面，途中以一剑逼退一只低阶岩猞，陆寻看得出自己剑术还不如他熟练。","dialogue":[{"speaker":"韩峥","text":"采药归采药，遇见兽先喊我。"},{"speaker":"陆寻","text":"知道。"},{"speaker":"苏禾","text":"前面就是药窟了。"}],"seconds":25}],"next":"m03.cave.herb.pursue"},{"id":"m03.cave.herb.pursue","type":"scene","act":3,"title":"药窟里的人","setting":"清查当天，青崖内侧旧药窟外层。","beats":[{"visual":"药窟入口，医师核对采药名单。洞内青色藤蔓沿石壁攀生，部分已经枯萎。韩峥指明今日只开放到石台，苏禾取出药图，陆寻紧跟在她身旁。医师提醒成熟藤髓用于伤者救治，若发现额外罕见结晶，先报告、清除危险，再按实际参与者事前协议分配。 入口木牌写明：额外稀有药材经医师核验、按约采回者，另有四石采掘报酬；玉髓可作个人修炼资源，不可直接承诺突破境界；普通救治药材不计入这笔报酬。","dialogue":[{"speaker":"韩峥","text":"藤髓够就出来。别碰深处。"},{"speaker":"苏禾","text":"我只取成熟的，伤了根明年就没药。"},{"speaker":"医师","text":"若真遇上稀有结晶，先报位置。采回另有四石，你们先说好怎么分。"}],"seconds":31},{"visual":"苏禾先采足周野所需的普通成熟藤髓。陆寻借灵目观察活藤运行，看见灵力反复进入被枯叶遮挡的石缝，却很少回到根部。苏禾顺着他所指扒开枯叶，在医师允许的采区露出一枚拇指长的青白结晶。她查药籍确认：养脉玉髓是老藤多年凝成的稀有灵材，可在医师监督下温养炼气修士反复承受灵力运行的经脉，尤其适合陆寻如今练成的连续施法；整枚可供一个人完整疗程，半枚只能完成较短疗程。两人先将周野的普通藤髓送洞口验收封存。","dialogue":[{"speaker":"苏禾","text":"养脉玉髓……去年百草峰找遍几处药圃，也没收上来一枚。"},{"speaker":"陆寻","text":"我现在每次连出两剑就得歇。这个能帮我继续练？"},{"speaker":"苏禾","text":"能让经脉更经得住反复施法。不过吃下去可不会直接筑基。"},{"speaker":"苏禾","text":"周野那份藤髓已经够了。先交回去，再说这枚。"}],"seconds":34},{"visual":"两人返回石台附近向巡守报告玉髓位置，低阶岩猞从侧缝冲出。韩峥举剑挡住首爪，受岩壁限制无法继续挥剑。陆寻先以已练成的引气剑挡住兽爪的侧向力量，随即停半息，让第二股体内灵力接续，从岩壁另一侧击落松动石片，逼岩猞抬头。韩峥借机以剑气击中兽肩，将其逼回侧缝。苏禾护着药囊退至洞口，陆寻虎口发痛但仍能收剑。","dialogue":[{"speaker":"韩峥","text":"你刚才明明收了剑，怎么又出一道？"},{"speaker":"陆寻","text":"没重新聚气。第二股力还在体内。"},{"speaker":"韩峥","text":"……你练的什么剑？"},{"speaker":"陆寻","text":"自己试出来的。先出去。"}],"seconds":28},{"visual":"洞口，巡守检查两人均无重伤，说明一刻后会封住侧缝，玉髓只能在本次开放内采出。韩峥认可陆寻发现玉髓的贡献，也认为自己守通道有份。两人提出先约定分配，再决定取玉方式。韩峥愿意用自己的外门护阵符协作驱兽，平分玉髓；若陆寻想独得，可以接受三式试剑决定优先采掘权，但胜者独得玉髓、全部四石额外采掘报酬归守路者，且独取路线由巡守封侧缝后单人采出。","dialogue":[{"speaker":"韩峥","text":"合作的话，我出护阵符，你我各一半。以后历练也可以一起。"},{"speaker":"韩峥","text":"若你想独拿，就比三式。赢了你先采，我守这条路，额外的四块灵石都归我。"},{"speaker":"苏禾","text":"周野的药已经验过。这份是额外机缘，别急着答应。"}],"seconds":30}],"next":"m03.choice.herb.pursue"},{"id":"m03.choice.herb.pursue","type":"choice","act":3,"prompt":"周野的药已经取得。你可与韩峥约定平分玉髓，获得真实同行关系；也可公开比试争取整份，独自承担采掘与守路报酬。两种取法都须经巡守确认安全。","choices":[{"id":"duel","text":"接受比试，争取独取玉髓，承担守路报酬。","next":"m03.duel.herb.pursue"},{"id":"join","text":"与韩峥合作，合力取玉髓，各得一半。","next":"m03.join.herb.pursue"}]},{"id":"m03.duel.herb.pursue","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"两人在洞口安全试坪依约比三式，使用统一低阶练习剑与护具。第一式韩峥将陆寻逼退，第二式他提前封住固定第二剑的间隔，陆寻虎口发麻。陆寻想起秦晚破解自己时的练习，重新稳住脚步。","dialogue":[{"speaker":"韩峥","text":"刚才在洞里我就看见了。你第二剑只快那么一点。"},{"speaker":"陆寻","text":"再来。"}],"seconds":25},{"visual":"第三式，韩峥按固定间隔抢先截剑。陆寻先用第一剑护住身前，将第二股灵力留在体内，等韩峥提前压剑落空才接出第二剑。剑势击亮肩前判定护具。韩峥收剑，巡守确认陆寻取得优先采掘权。","dialogue":[{"speaker":"韩峥","text":"你什么时候把第二剑变慢了？"},{"speaker":"陆寻","text":"你挡得太早。"},{"speaker":"韩峥","text":"好。你先采。"}],"seconds":28},{"visual":"巡守封住侧缝后，医师监督陆寻取出整枚玉髓。陆寻依先前协议，将本次额外采掘报酬中的全部四块灵石交给韩峥，作为独取时由他承担的守路报酬；宗门救治药材不参与分配。韩峥接过灵石，没有再争玉髓。","dialogue":[{"speaker":"韩峥","text":"我输了，玉归你。"},{"speaker":"陆寻","text":"守路的四块，按说好的给你。"},{"speaker":"韩峥","text":"好。下次外门见。"}],"seconds":25},{"visual":"当天傍晚回宗。苏禾将普通藤髓交正式医师配药。三日后周野开始用药，随后数周复诊，右手颤抖逐渐减轻。第一次能稳住轻型器件时，周野主动把陆寻叫到器坊外场，亲手将一只练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。今天别再练了。"}],"seconds":28},{"visual":"数周后，医师按疗程为陆寻用完整玉髓。他每日以《引气诀》温养经脉，不凭丹药强行冲境。恢复训练后，他在试坪连续施展三轮回息剑，第三轮仍能稳稳收剑。教习请此前练习中压制他的同境弟子与他对练；对方按旧间隔提前封剑，陆寻将第二股灵力延后一瞬，击中肩前护具。教习宣布点到为止。秦晚看完，主动拿来自己的练习剑，站到陆寻对面。","dialogue":[{"speaker":"教习","text":"上月你还练不完三息。今天这第二剑，倒是他先接不住了。"},{"speaker":"秦晚","text":"来。现在换我跟你练。"},{"speaker":"陆寻","text":"师姐不怕我赢？"},{"speaker":"秦晚","text":"你先追上我再说。"}],"seconds":38},{"visual":"再过数日，青崖药圃恢复常规供药，百草峰终于开炉。苏禾在丹房外叫住陆寻，将他带到原先那个窗口。医师核对开山礼补盖的优先凭条，扣除陆寻足额预留的一百工分，递出一只凝气散青瓷瓶。陆寻接过药，翻开自己写满批注的《引气诀》。远处严承来交剩余赔付，见陆寻领药，又见他背着练习剑，转身离去。陆寻没有立即吞药，把药瓶妥善收好，准备按实际修炼所需使用。","dialogue":[{"speaker":"苏禾","text":"你的药，终于轮到了。"},{"speaker":"陆寻","text":"我等了几个月。现在倒知道该怎么用了。"},{"speaker":"苏禾","text":"这回可别让人抢了。"},{"speaker":"陆寻","text":"不会了。"}],"seconds":26},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上有裴照雪追回的灰纹令牌与异常视觉记录。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.pursue.duel"},{"id":"end.herb.pursue.duel","type":"end","title":"独得玉髓·灰纹令牌","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"整份养脉玉髓已按疗程使用，连续三轮回息剑稳定并战胜此前压制自己的同境弟子；额外四石付韩峥，未获同行约定。周野普通藤髓治疗后逐步恢复精细控灵。原预留凝气散已领取，一百工分已扣除，药瓶尚未使用。","mid":"M04/M05须继承：苏禾采药、安抚粉救援及药工证词；裴与巡守知情及追回灰纹令牌；独自养脉形成更强持续施法能力；回息剑是真正学成的低阶术式，不等于完整高阶功法。凝气散已兑领未服，玉髓已使用，不重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.join.herb.pursue","type":"scene","act":3,"title":"这一次，剑不是一个人的","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"陆寻与韩峥先在入口医师处约定平分玉髓及额外采掘报酬。韩峥取出自有低阶护阵符，在巡守指定位置布置临时防护。两人进入已标定区域；苏禾守在洞口。韩峥引开岩猞，陆寻观察它真实蓄力与扑击后的短暂停顿。","dialogue":[{"speaker":"韩峥","text":"你那第二剑能不能慢半息？"},{"speaker":"陆寻","text":"练过。你先退。"}],"seconds":25},{"visual":"岩猞扑向韩峥。陆寻第一剑截住其侧向扑势，韩峥后撤，陆寻没有立刻释放第二剑，待岩猞实际转向后才将体内准备好的第二股灵力送出，击落岩侧浮石，封住兽道。韩峥趁窗口将玉髓从经医师确认的可采位置完整取出，二人及时撤出；不是陆寻越级击杀妖兽。","dialogue":[{"speaker":"韩峥","text":"现在！"},{"speaker":"陆寻","text":"退！"},{"speaker":"韩峥","text":"拿到了！走！"}],"seconds":28},{"visual":"医师核验玉髓完整且可等分，两人各取一半；额外采掘报酬四石也各取两石。韩峥收起已经耗尽的护阵符，主动将传信牌递给陆寻。","dialogue":[{"speaker":"韩峥","text":"以后低阶同行试炼，缺人就来找我。"},{"speaker":"陆寻","text":"这次的账，五五。"},{"speaker":"韩峥","text":"说到做到。"}],"seconds":24},{"visual":"当天傍晚回宗。苏禾将普通藤髓交正式医师配药。三日后周野开始用药，随后数周复诊，右手颤抖逐渐减轻。第一次能稳住轻型器件时，周野主动把陆寻叫到器坊外场，亲手将一只练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。今天别再练了。"}],"seconds":28},{"visual":"数周后，医师为陆寻用半份玉髓，经脉承载改善，但三轮仍需停歇。韩峥按约来练习坪，教陆寻自己的公开低阶守剑法。陆寻也将回息剑的发力间隔与失败记号讲给韩峥，韩峥尝试数次，发现他原本修法不同，不能直接照搬，陆寻调整讲解，让他自己验证体内余力退去的时机。数日后韩峥终于以普通练习剑独立接出第二道低阶剑势，两人交换攻守，陆寻第一次靠改过的守势挡下韩峥的连续剑招。秦晚看到两人对练，笑着走来。","dialogue":[{"speaker":"韩峥","text":"还真能练出来。原来我不是非得从头聚气。"},{"speaker":"陆寻","text":"你那套守剑也不差。"},{"speaker":"秦晚","text":"你俩背着我练成了什么？"},{"speaker":"韩峥","text":"陆寻教我的。"},{"speaker":"秦晚","text":"那我是不是也得来请教陆师兄？"}],"seconds":38},{"visual":"再过数日，青崖药圃恢复常规供药，百草峰终于开炉。苏禾在丹房外叫住陆寻，将他带到原先那个窗口。医师核对开山礼补盖的优先凭条，扣除陆寻足额预留的一百工分，递出一只凝气散青瓷瓶。陆寻接过药，翻开自己写满批注的《引气诀》。远处严承来交剩余赔付，见陆寻领药，又见他背着练习剑，转身离去。陆寻没有立即吞药，把药瓶妥善收好，准备按实际修炼所需使用。","dialogue":[{"speaker":"苏禾","text":"你的药，终于轮到了。"},{"speaker":"陆寻","text":"我等了几个月。现在倒知道该怎么用了。"},{"speaker":"苏禾","text":"这回可别让人抢了。"},{"speaker":"陆寻","text":"不会了。"}],"seconds":26},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上有裴照雪追回的灰纹令牌与异常视觉记录。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.pursue.join"},{"id":"end.herb.pursue.join","type":"end","title":"并肩取玉·灰纹令牌","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助裴追查，追回灰纹令牌，异常视觉被记录。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"半份养脉玉髓已按疗程使用，两轮回息剑稳定；获得韩峥真实陪练、低阶守剑与两石额外报酬；韩峥在陆寻指导下亲自练成适配自身的衔接第二剑。周野普通藤髓治疗后逐步恢复精细控灵。原预留凝气散已领取，一百工分已扣除，药瓶尚未使用。","mid":"M04/M05须继承：苏禾采药、安抚粉救援及药工证词；裴与巡守知情及追回灰纹令牌；韩峥独立学成衔接第二剑，陆寻实际掌握低阶守剑，同行关系；回息剑是真正学成的低阶术式，不等于完整高阶功法。凝气散已兑领未服，玉髓已使用，不重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m02.seal.herb","type":"scene","act":2,"title":"留下来的那个人","setting":"青崖谷安全岩台与封阵外门。","beats":[{"visual":"陆寻不主动说眼睛，只向巡守指出自己刚才实际观察到绳索震动的规律，协助撤离最后一批药工。巡守按正常程序关闭低阶泄口；陆寻负责将备用挡板移到指定位置，不操纵高阶封阵。裴照雪则独立追向北侧旧路。","dialogue":[{"speaker":"巡守","text":"挡板送过来！别越线！"},{"speaker":"陆寻","text":"周野，你别动，等我。"}],"seconds":25},{"visual":"陆寻与巡守搬动挡板，在退力窗口合上外侧低阶护闸。余震停止，药棚旁一具被冲歪的普通采药柜完好保住，柜内有当日救护药材。裴照雪追至岔路时失去敌人踪迹，只带回普通破损符片，未取得令牌。","dialogue":[{"speaker":"巡守","text":"关上了！药材还能用。"},{"speaker":"周野","text":"你还真是闲不住。"},{"speaker":"陆寻","text":"都到这了，总得把人送回去。"}],"seconds":26},{"visual":"夕阳落到青崖谷口。巡守封存失活内芯，登记陆寻接触碎片、眼痛及救援经过。陆寻如实登记接触与伤势，没有主动说明异常视觉。担架队沿山路返回宗门，苏禾提着药箱在济生院门口等伤者。她看见周野苍白的脸，马上叫来医师，抓住陆寻的左手查看伤口。","dialogue":[{"speaker":"苏禾","text":"陆寻！你们怎么又把自己弄成这样？"},{"speaker":"陆寻","text":"他的手先治。"},{"speaker":"苏禾","text":"我知道。你也坐下。"}],"seconds":23},{"visual":"当夜，严承交验药材时已被巡守带走。次日下午，镇山堂在济生院偏厅听取伤者证词。陆寻坐在椅子上，手臂仍缠着药布；严承站在另一侧，承认买来并使用灰符，却说自己不知道会引来兽群。药工出示百草峰登记的采药路线并作证。镇山堂当场没收严承此次药功，暂停领队，先核定一部分治疗赔付；灰符卖家另查。","dialogue":[{"speaker":"严承","text":"我买的是驱兽符！我哪知道会引来这么多！"},{"speaker":"陆寻","text":"你不知道符会引兽。可你知道我们还没过桥。"},{"speaker":"巡守","text":"药功取消，领队牌交出来。伤者的药费先由你赔。"},{"speaker":"严承","text":"……"}],"seconds":25},{"visual":"事故第三日，苏禾为陆寻换药。周野仍在病床上睡着。陆寻翻出足额兑换凝气散的凭条，想起岩猞扑来时自己聚不起第三息，将凭条重新折好。窗外正式弟子持剑走过，他久久看着。","dialogue":[{"speaker":"苏禾","text":"今天眼睛还疼吗？"},{"speaker":"陆寻","text":"偶尔会。"},{"speaker":"苏禾","text":"别瞒我。医师说先歇几天。"},{"speaker":"陆寻","text":"知道了。"}],"seconds":18}],"next":"m02.recover.herb.seal"},{"id":"m02.recover.herb.seal","type":"scene","act":2,"title":"一只拿不稳的手","setting":"事故后第七日至第二十一日，济生院与杂役院。","beats":[{"visual":"一周后。周野终于能靠在床头，陆寻帮他把器坊练习册拿过来。他用左手翻页，右手去拿一只小木销，木销掉在被子上。他笑着换左手，又把那一页翻了过去。陆寻看在眼里，没有说话。","dialogue":[{"speaker":"周野","text":"等我好了，这东西我闭着眼都能装回去。"},{"speaker":"陆寻","text":"那就先别急。"}],"seconds":22},{"visual":"两周后，陆寻经医师许可恢复普通轻役。夜里他第一次主动尝试那只眼睛：灯下，自己指尖引起的微弱灵力有了清楚的前后流向；稍看久些，眼睛便发酸。他赶紧闭眼。次日他去济生院看周野，周野仍无法稳稳控制那枚小木销。 丹房贴出新告示：因青崖事故原定药材未交齐，凝气散开炉延期，已足额登记者继续保留兑换权。陆寻仍未取得药。他将预留凭条与吐纳诀一起夹好。","dialogue":[],"seconds":26},{"visual":"第三周复诊，医师让周野尝试一件低阶练习器件。右手灵力忽明忽暗，器件滑落。医师说明日常用手会逐渐恢复，精细控灵则可能长期受影响。周野沉默了一会儿，把原本准备报器坊见习的申请收进衣袋。","dialogue":[{"speaker":"周野","text":"那我以后还能炼器吗？"},{"speaker":"医师","text":"不是不能做器作。但要像从前那样精细控灵，普通药散不够。"},{"speaker":"陆寻","text":"有什么药能治？"},{"speaker":"医师","text":"养脉藤的成熟藤髓。先前在青崖旧药窟采过，如今那里还封着。"}],"seconds":27},{"visual":"苏禾把药籍翻到养脉藤一页，给陆寻看画着三层青叶的药图。她说药房里只剩别的伤药，旧药窟要等封阵修好才可开放。周野先开口，叫陆寻别冲动。","dialogue":[{"speaker":"苏禾","text":"我去问师父，有没有别处能找到。"},{"speaker":"周野","text":"先别惦记我。你这眼睛自己还没弄明白。"},{"speaker":"陆寻","text":"我不会现在去。等消息。"}],"seconds":23}],"next":"m03.wait.herb.seal"},{"id":"m03.wait.herb.seal","type":"scene","act":3,"title":"等一扇门打开","setting":"事故后第四周，山腰药房及训练坪。","beats":[{"visual":"七日后，镇山堂的封谷钟不再每日响起。告示上写着：外层药窟修缮完成，先由正式弟子与医修检查，随后开放有资格的低阶协作人员。苏禾在药房门口找到陆寻，拿出医师批准的采药名单。","dialogue":[{"speaker":"苏禾","text":"旧药窟能进了，不过要等下一批清查。医师说你若想跟去，得先会基本防身术。"},{"speaker":"陆寻","text":"多久开始？"},{"speaker":"苏禾","text":"约一个月。我们还有时间准备。"}],"seconds":24},{"visual":"陆寻站在公开练习坪外，看一名同境弟子将三道灵力稳稳送入剑身，想起自己在岩猞面前第三息溃散。丹药尚未到手，但新眼睛已经让他看见自身灵力运行的前后。他决定不能只等待药材，走进练习坪，向教习递上药窟协作报名牌。","dialogue":[{"speaker":"陆寻","text":"我想先把第三息练稳，再学一门能自保的剑术。"},{"speaker":"教习","text":"先说好，你会吐纳不代表会用剑。"},{"speaker":"陆寻","text":"我从头练。"}],"seconds":22}],"next":"m03.learn.herb.seal"},{"id":"m03.learn.herb.seal","type":"scene","act":3,"title":"一门功法，两种修法","setting":"清查开放前约一个月，杂役院与公开练习坪。","beats":[{"visual":"第一日，教习让陆寻翻开宗门公开的《引气诀》，在石靶前演示同一修法。陆寻炼气已有数年，能聚起一股灵力，却在第三息散掉；旁边同为炼气中段的外门弟子按教习口令完成三息，石靶长亮。教习示范：第一息纳气，第二息归拢，第三息将已炼成的灵力送入自身经脉循环。陆寻照做仍失败。","dialogue":[{"speaker":"教习","text":"你不是没灵力，是每次到第三息就散。先练这本，别贪别的。"},{"speaker":"陆寻","text":"我以前就卡在这儿。"}],"seconds":28},{"visual":"夜里，陆寻摊开旧《引气诀》，引动自己的灵力。灵目视野中，第二息的余流还未退尽，第三息一接便在经脉交汇处冲散。他对照诀文：原法只写「息定而进」，没有写每个人到底何时息定。陆寻第一次试着放慢，余力全散；第二次提早，又乱。连练三个夜晚，他终于在自己的余流刚退时接入第三息，掌心灵光稳住。他闭眼复现，继而完成原本三息闭合的一轮吐纳。丹药尚未开炉。","dialogue":[{"speaker":"陆寻","text":"原来书上说的息定，不是数到第三息。"},{"speaker":"陆寻","text":"是我自己的气，真的走完了。"}],"seconds":32},{"visual":"次日试坪，同一位外门弟子做完三轮后停下换气，陆寻用相同基础功法完成三轮，靶光终于长亮。教习让他闭眼复现，确认是实际掌握，不是外物助力。陆寻仍在炼气中段，但能将已有灵力用于持续训练。随后练基础引气剑，对手已经收剑，他却还在重新聚气；秦晚值勤经过，见他连续输了几次。","dialogue":[{"speaker":"教习","text":"这回三息都走完了。药拿到了？"},{"speaker":"陆寻","text":"还没。"},{"speaker":"秦晚","text":"你不是刚才赢了石靶吗？怎么一跟人打就输了？"},{"speaker":"陆寻","text":"我一剑出完，下一剑得从头引气。"}],"seconds":29},{"visual":"秦晚用公开的低阶火线演示：一股力尚未从体内退尽，另一股已准备好，火焰不断。陆寻看见这是真实的两次体内运转，而非凭空增加灵力。他将《引气诀》中三息运行与火线前后衔接画在纸上，尝试把体内余力退尽的时机与第二次引气协调。木剑猛震，第一次失败。他停手休息。","dialogue":[{"speaker":"秦晚","text":"剑和火不一样，你别拿自己的经脉试运气。"},{"speaker":"陆寻","text":"我不照搬火。只是想弄明白，两次出力之间为什么非得停。"},{"speaker":"秦晚","text":"好。那你先在木剑上试，我看着。"}],"seconds":29},{"visual":"十余日间，陆寻白日搬货，夜间将练习结果记在旧诀页边。周野用左手修整木剑柄。秦晚值勤时来试接：陆寻终于闭眼打出前后两道相连的剑势，第二道第一次绕开她的低阶火幕，下一回却被她提前挡住。他尝试调整第二次发力间隔，过早便冲散，过晚便接不上。又过数日，他将第二股力保留在体内，成功延后一瞬，击中后方石靶；闭眼连续验证两次，第三次力竭停手。","dialogue":[{"speaker":"秦晚","text":"第一回能打中不稀奇。第二回、第三回呢？"},{"speaker":"陆寻","text":"再试。"},{"speaker":"秦晚","text":"这回你倒比我还舍不得收剑。"},{"speaker":"陆寻","text":"我以前学不会。现在知道哪里错了，就不想停。"}],"seconds":38},{"visual":"月底。教习考查陆寻的基础引气剑和防身步法，准许加入药窟协作。秦晚将陆寻那张写满失败记号的旧纸翻过来，指着他自己改写的衔接方法。教习核对实际学成的剑式，陆寻没有主动告知裴照雪异常视觉。","dialogue":[{"speaker":"秦晚","text":"你这不是师父教的第二剑。叫什么？"},{"speaker":"陆寻","text":"还没取名。先叫回息剑吧。"},{"speaker":"秦晚","text":"等你能把这两剑连成三剑，再来找我。"},{"speaker":"陆寻","text":"好。"}],"seconds":28}],"next":"m03.depart.herb.seal"},{"id":"m03.depart.herb.seal","type":"scene","act":3,"title":"这次带剑出门","setting":"次日清晨，山门至青崖药窟。","beats":[{"visual":"周野将修好的轻型采具交给陆寻，将修好的普通练习剑递给他，又看了眼页边写着「回息剑」的旧诀。医师只允许周野做轻役，他留在山门帮器坊整理材料。苏禾背着药囊与辨药图册赶来。","dialogue":[{"speaker":"周野","text":"采具我都检查过了。你俩别跟上回一样。"},{"speaker":"陆寻","text":"这回有人带路，我也练过了。"},{"speaker":"苏禾","text":"先回来再说。"}],"seconds":23},{"visual":"三人告别。陆寻和苏禾随外门弟子韩峥及巡守下山。路过昔日断桥处，新架的临时木桥上有镇山堂封检牌；旧药坡仍封闭。他们沿新开放的内侧药窟通路前行，远处可见修好的封门，入口有医师驻守。韩峥走在前面，途中以一剑逼退一只低阶岩猞，陆寻看得出自己剑术还不如他熟练。","dialogue":[{"speaker":"韩峥","text":"采药归采药，遇见兽先喊我。"},{"speaker":"陆寻","text":"知道。"},{"speaker":"苏禾","text":"前面就是药窟了。"}],"seconds":25}],"next":"m03.cave.herb.seal"},{"id":"m03.cave.herb.seal","type":"scene","act":3,"title":"药窟里的人","setting":"清查当天，青崖内侧旧药窟外层。","beats":[{"visual":"药窟入口，医师核对采药名单。洞内青色藤蔓沿石壁攀生，部分已经枯萎。韩峥指明今日只开放到石台，苏禾取出药图，陆寻紧跟在她身旁。医师提醒成熟藤髓用于伤者救治，若发现额外罕见结晶，先报告、清除危险，再按实际参与者事前协议分配。 入口木牌写明：额外稀有药材经医师核验、按约采回者，另有四石采掘报酬；玉髓可作个人修炼资源，不可直接承诺突破境界；普通救治药材不计入这笔报酬。","dialogue":[{"speaker":"韩峥","text":"藤髓够就出来。别碰深处。"},{"speaker":"苏禾","text":"我只取成熟的，伤了根明年就没药。"},{"speaker":"医师","text":"若真遇上稀有结晶，先报位置。采回另有四石，你们先说好怎么分。"}],"seconds":31},{"visual":"苏禾先采足周野所需的普通成熟藤髓。陆寻借灵目观察活藤运行，看见灵力反复进入被枯叶遮挡的石缝，却很少回到根部。苏禾顺着他所指扒开枯叶，在医师允许的采区露出一枚拇指长的青白结晶。她查药籍确认：养脉玉髓是老藤多年凝成的稀有灵材，可在医师监督下温养炼气修士反复承受灵力运行的经脉，尤其适合陆寻如今练成的连续施法；整枚可供一个人完整疗程，半枚只能完成较短疗程。两人先将周野的普通藤髓送洞口验收封存。","dialogue":[{"speaker":"苏禾","text":"养脉玉髓……去年百草峰找遍几处药圃，也没收上来一枚。"},{"speaker":"陆寻","text":"我现在每次连出两剑就得歇。这个能帮我继续练？"},{"speaker":"苏禾","text":"能让经脉更经得住反复施法。不过吃下去可不会直接筑基。"},{"speaker":"苏禾","text":"周野那份藤髓已经够了。先交回去，再说这枚。"}],"seconds":34},{"visual":"两人返回石台附近向巡守报告玉髓位置，低阶岩猞从侧缝冲出。韩峥举剑挡住首爪，受岩壁限制无法继续挥剑。陆寻先以已练成的引气剑挡住兽爪的侧向力量，随即停半息，让第二股体内灵力接续，从岩壁另一侧击落松动石片，逼岩猞抬头。韩峥借机以剑气击中兽肩，将其逼回侧缝。苏禾护着药囊退至洞口，陆寻虎口发痛但仍能收剑。","dialogue":[{"speaker":"韩峥","text":"你刚才明明收了剑，怎么又出一道？"},{"speaker":"陆寻","text":"没重新聚气。第二股力还在体内。"},{"speaker":"韩峥","text":"……你练的什么剑？"},{"speaker":"陆寻","text":"自己试出来的。先出去。"}],"seconds":28},{"visual":"洞口，巡守检查两人均无重伤，说明一刻后会封住侧缝，玉髓只能在本次开放内采出。韩峥认可陆寻发现玉髓的贡献，也认为自己守通道有份。两人提出先约定分配，再决定取玉方式。韩峥愿意用自己的外门护阵符协作驱兽，平分玉髓；若陆寻想独得，可以接受三式试剑决定优先采掘权，但胜者独得玉髓、全部四石额外采掘报酬归守路者，且独取路线由巡守封侧缝后单人采出。","dialogue":[{"speaker":"韩峥","text":"合作的话，我出护阵符，你我各一半。以后历练也可以一起。"},{"speaker":"韩峥","text":"若你想独拿，就比三式。赢了你先采，我守这条路，额外的四块灵石都归我。"},{"speaker":"苏禾","text":"周野的药已经验过。这份是额外机缘，别急着答应。"}],"seconds":30}],"next":"m03.choice.herb.seal"},{"id":"m03.choice.herb.seal","type":"choice","act":3,"prompt":"周野的药已经取得。你可与韩峥约定平分玉髓，获得真实同行关系；也可公开比试争取整份，独自承担采掘与守路报酬。两种取法都须经巡守确认安全。","choices":[{"id":"duel","text":"接受比试，争取独取玉髓，承担守路报酬。","next":"m03.duel.herb.seal"},{"id":"join","text":"与韩峥合作，合力取玉髓，各得一半。","next":"m03.join.herb.seal"}]},{"id":"m03.duel.herb.seal","type":"scene","act":3,"title":"第二剑没有出","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"两人在洞口安全试坪依约比三式，使用统一低阶练习剑与护具。第一式韩峥将陆寻逼退，第二式他提前封住固定第二剑的间隔，陆寻虎口发麻。陆寻想起秦晚破解自己时的练习，重新稳住脚步。","dialogue":[{"speaker":"韩峥","text":"刚才在洞里我就看见了。你第二剑只快那么一点。"},{"speaker":"陆寻","text":"再来。"}],"seconds":25},{"visual":"第三式，韩峥按固定间隔抢先截剑。陆寻先用第一剑护住身前，将第二股灵力留在体内，等韩峥提前压剑落空才接出第二剑。剑势击亮肩前判定护具。韩峥收剑，巡守确认陆寻取得优先采掘权。","dialogue":[{"speaker":"韩峥","text":"你什么时候把第二剑变慢了？"},{"speaker":"陆寻","text":"你挡得太早。"},{"speaker":"韩峥","text":"好。你先采。"}],"seconds":28},{"visual":"巡守封住侧缝后，医师监督陆寻取出整枚玉髓。陆寻依先前协议，将本次额外采掘报酬中的全部四块灵石交给韩峥，作为独取时由他承担的守路报酬；宗门救治药材不参与分配。韩峥接过灵石，没有再争玉髓。","dialogue":[{"speaker":"韩峥","text":"我输了，玉归你。"},{"speaker":"陆寻","text":"守路的四块，按说好的给你。"},{"speaker":"韩峥","text":"好。下次外门见。"}],"seconds":25},{"visual":"当天傍晚回宗。苏禾将普通藤髓交正式医师配药。三日后周野开始用药，随后数周复诊，右手颤抖逐渐减轻。第一次能稳住轻型器件时，周野主动把陆寻叫到器坊外场，亲手将一只练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。今天别再练了。"}],"seconds":28},{"visual":"数周后，医师按疗程为陆寻用完整玉髓。他每日以《引气诀》温养经脉，不凭丹药强行冲境。恢复训练后，他在试坪连续施展三轮回息剑，第三轮仍能稳稳收剑。教习请此前练习中压制他的同境弟子与他对练；对方按旧间隔提前封剑，陆寻将第二股灵力延后一瞬，击中肩前护具。教习宣布点到为止。秦晚看完，主动拿来自己的练习剑，站到陆寻对面。","dialogue":[{"speaker":"教习","text":"上月你还练不完三息。今天这第二剑，倒是他先接不住了。"},{"speaker":"秦晚","text":"来。现在换我跟你练。"},{"speaker":"陆寻","text":"师姐不怕我赢？"},{"speaker":"秦晚","text":"你先追上我再说。"}],"seconds":38},{"visual":"再过数日，青崖药圃恢复常规供药，百草峰终于开炉。苏禾在丹房外叫住陆寻，将他带到原先那个窗口。医师核对开山礼补盖的优先凭条，扣除陆寻足额预留的一百工分，递出一只凝气散青瓷瓶。陆寻接过药，翻开自己写满批注的《引气诀》。远处严承来交剩余赔付，见陆寻领药，又见他背着练习剑，转身离去。陆寻没有立即吞药，把药瓶妥善收好，准备按实际修炼所需使用。","dialogue":[{"speaker":"苏禾","text":"你的药，终于轮到了。"},{"speaker":"陆寻","text":"我等了几个月。现在倒知道该怎么用了。"},{"speaker":"苏禾","text":"这回可别让人抢了。"},{"speaker":"陆寻","text":"不会了。"}],"seconds":26},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上只有破损灰符与接触者记录，尚无异常视觉的直接报告。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.seal.duel"},{"id":"end.herb.seal.duel","type":"end","title":"独得玉髓·守住外门","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"整份养脉玉髓已按疗程使用，连续三轮回息剑稳定并战胜此前压制自己的同境弟子；额外四石付韩峥，未获同行约定。周野普通藤髓治疗后逐步恢复精细控灵。原预留凝气散已领取，一百工分已扣除，药瓶尚未使用。","mid":"M04/M05须继承：苏禾采药、安抚粉救援及药工证词；未追回令牌及无裴共同秘密；独自养脉形成更强持续施法能力；回息剑是真正学成的低阶术式，不等于完整高阶功法。凝气散已兑领未服，玉髓已使用，不重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}},{"id":"m03.join.herb.seal","type":"scene","act":3,"title":"这一次，剑不是一个人的","setting":"药窟外侧安全试坪与采玉石台。","beats":[{"visual":"陆寻与韩峥先在入口医师处约定平分玉髓及额外采掘报酬。韩峥取出自有低阶护阵符，在巡守指定位置布置临时防护。两人进入已标定区域；苏禾守在洞口。韩峥引开岩猞，陆寻观察它真实蓄力与扑击后的短暂停顿。","dialogue":[{"speaker":"韩峥","text":"你那第二剑能不能慢半息？"},{"speaker":"陆寻","text":"练过。你先退。"}],"seconds":25},{"visual":"岩猞扑向韩峥。陆寻第一剑截住其侧向扑势，韩峥后撤，陆寻没有立刻释放第二剑，待岩猞实际转向后才将体内准备好的第二股灵力送出，击落岩侧浮石，封住兽道。韩峥趁窗口将玉髓从经医师确认的可采位置完整取出，二人及时撤出；不是陆寻越级击杀妖兽。","dialogue":[{"speaker":"韩峥","text":"现在！"},{"speaker":"陆寻","text":"退！"},{"speaker":"韩峥","text":"拿到了！走！"}],"seconds":28},{"visual":"医师核验玉髓完整且可等分，两人各取一半；额外采掘报酬四石也各取两石。韩峥收起已经耗尽的护阵符，主动将传信牌递给陆寻。","dialogue":[{"speaker":"韩峥","text":"以后低阶同行试炼，缺人就来找我。"},{"speaker":"陆寻","text":"这次的账，五五。"},{"speaker":"韩峥","text":"说到做到。"}],"seconds":24},{"visual":"当天傍晚回宗。苏禾将普通藤髓交正式医师配药。三日后周野开始用药，随后数周复诊，右手颤抖逐渐减轻。第一次能稳住轻型器件时，周野主动把陆寻叫到器坊外场，亲手将一只练习剑柄递给他。","dialogue":[{"speaker":"周野","text":"手稳了。你看！"},{"speaker":"陆寻","text":"以后我的剑，还算数？"},{"speaker":"周野","text":"算。你别嫌我现在只能打剑柄。"},{"speaker":"苏禾","text":"慢慢来。今天别再练了。"}],"seconds":28},{"visual":"数周后，医师为陆寻用半份玉髓，经脉承载改善，但三轮仍需停歇。韩峥按约来练习坪，教陆寻自己的公开低阶守剑法。陆寻也将回息剑的发力间隔与失败记号讲给韩峥，韩峥尝试数次，发现他原本修法不同，不能直接照搬，陆寻调整讲解，让他自己验证体内余力退去的时机。数日后韩峥终于以普通练习剑独立接出第二道低阶剑势，两人交换攻守，陆寻第一次靠改过的守势挡下韩峥的连续剑招。秦晚看到两人对练，笑着走来。","dialogue":[{"speaker":"韩峥","text":"还真能练出来。原来我不是非得从头聚气。"},{"speaker":"陆寻","text":"你那套守剑也不差。"},{"speaker":"秦晚","text":"你俩背着我练成了什么？"},{"speaker":"韩峥","text":"陆寻教我的。"},{"speaker":"秦晚","text":"那我是不是也得来请教陆师兄？"}],"seconds":38},{"visual":"再过数日，青崖药圃恢复常规供药，百草峰终于开炉。苏禾在丹房外叫住陆寻，将他带到原先那个窗口。医师核对开山礼补盖的优先凭条，扣除陆寻足额预留的一百工分，递出一只凝气散青瓷瓶。陆寻接过药，翻开自己写满批注的《引气诀》。远处严承来交剩余赔付，见陆寻领药，又见他背着练习剑，转身离去。陆寻没有立即吞药，把药瓶妥善收好，准备按实际修炼所需使用。","dialogue":[{"speaker":"苏禾","text":"你的药，终于轮到了。"},{"speaker":"陆寻","text":"我等了几个月。现在倒知道该怎么用了。"},{"speaker":"苏禾","text":"这回可别让人抢了。"},{"speaker":"陆寻","text":"不会了。"}],"seconds":26},{"visual":"镇山堂复核室。失活内芯放在检测盘上，长老翻看青崖记录。桌上只有破损灰符与接触者记录，尚无异常视觉的直接报告。长老将药窟清查的记录翻到陆寻姓名，停住。","dialogue":[{"speaker":"长老","text":"封物还在。"},{"speaker":"长老","text":"它里面的东西，去了哪里？"}],"seconds":15}],"next":"end.herb.seal.join"},{"id":"end.herb.seal.join","type":"end","title":"并肩取玉·守住外门","summary":"前三幕阶段结果：周野已得到普通藤髓治疗，陆寻凭独立练成的第二剑取得额外机缘。后续M04–M06尚未写，不冒充全剧终局。","outcomes":{"immediate":"曾随苏禾采药，得知医修申请和辨药经验。协助封外门并保住药材，未主动披露异常视觉，未追回令牌。严承本次药功被没收并承担已核定部分治疗费，完整责任待查。","short":"半份养脉玉髓已按疗程使用，两轮回息剑稳定；获得韩峥真实陪练、低阶守剑与两石额外报酬；韩峥在陆寻指导下亲自练成适配自身的衔接第二剑。周野普通藤髓治疗后逐步恢复精细控灵。原预留凝气散已领取，一百工分已扣除，药瓶尚未使用。","mid":"M04/M05须继承：苏禾采药、安抚粉救援及药工证词；未追回令牌及无裴共同秘密；韩峥独立学成衔接第二剑，陆寻实际掌握低阶守剑，同行关系；回息剑是真正学成的低阶术式，不等于完整高阶功法。凝气散已兑领未服，玉髓已使用，不重复发放。","long":"本部终局待M04–M06创作；必须回收严承责任、三女主各自前途、周野器修道路、所得机缘及遗目追查。"}}]};const nodes=Object.fromEntries(story.nodes.map(n=>[n.id,n]));let id=story.start,beat=0,trail=[],seen=new Set();const el=x=>document.getElementById(x);function add(parent,tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;parent.append(n);return n}function advance(next,nextBeat=0){trail.push({id,beat});id=next;beat=nextBeat;render()}function btn(text,fn){const n=add(el("options"),"button",text);n.onclick=fn;return n}function render(){const n=nodes[id],body=el("body");body.replaceChildren();el("options").replaceChildren();el("progress").textContent="已发现阶段结果 "+seen.size+"/"+story.nodes.filter(n=>n.type==="end").length;el("back").disabled=trail.length===0;el("title").textContent=n.type==="end"?n.title:"第"+n.act+"幕 · "+story.acts.find(a=>a.id===n.act).title;if(n.type==="scene"){add(body,"h2",n.title);add(body,"div",n.setting,"setting");const b=n.beats[beat];add(body,"div",b.visual,"visual");for(const d of b.dialogue){const line=add(body,"div","","line");add(line,"span",d.speaker+"：","speaker");add(line,"span",d.text)}add(body,"small","场内段落 "+(beat+1)+"/"+n.beats.length);btn("继续",()=>beat+1<n.beats.length?advance(id,beat+1):advance(n.next));}else if(n.type==="choice"){add(body,"h2","你的决定");add(body,"p",n.prompt);for(const x of n.choices)btn(x.text,()=>advance(x.next))}else{seen.add(id);el("progress").textContent="已发现阶段结果 "+seen.size+"/"+story.nodes.filter(n=>n.type==="end").length;add(body,"p",n.summary);const dl=add(body,"dl","");for(const [k,t] of [["immediate","当下"],["short","短期"],["mid","后续回收"],["long","全剧终局（未完成）"]]){add(dl,"dt",t);add(dl,"dd",n.outcomes[k])}btn("从头体验另一条路线",reset)}}function reset(){id=story.start;beat=0;trail=[];render()}el("restart").onclick=reset;el("back").onclick=()=>{if(trail.length){const p=trail.pop();id=p.id;beat=p.beat;render()}};render();</script></html>
