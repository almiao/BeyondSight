<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>见仙 · 山门·一夜开灵脉</title><style>body{background:#171a20;color:#e9e5db;font:17px/1.8 system-ui,sans-serif;margin:0}main{max-width:800px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;color:#b6aea1;font-size:14px}h1{font-size:30px}h2{font-size:23px;margin:16px 0}.setting{color:#b6aea1}.visual{color:#d7cebb;background:#242932;border-left:3px solid #b79c6d;padding:14px;margin:18px 0;white-space:pre-wrap}.line{margin:12px 0}.speaker{color:#e5bf83;font-weight:bold}button{font:inherit;color:#e9e5db;background:#323a46;border:1px solid #697484;border-radius:8px;padding:10px 15px;cursor:pointer;margin:6px 0;text-align:left}button:hover{background:#414c5c}button:disabled{opacity:.45;cursor:default}.options button{display:block;width:100%}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}small{color:#b6aea1}dt{color:#e5bf83;margin-top:12px}dd{margin-left:0}#progress{font-size:13px;color:#b6aea1}</style><main><header><span>见仙 · 文字样片</span><span id="progress"></span></header><h1 id="title"></h1><div id="body"></div><div class="options" id="options"></div><nav><button id="back">上一段</button><button id="restart">重新开始</button></nav><small>独立非正典文字原型 · 无视频生成 · 手动推进</small></main><script>const story={"format":"beyondsight.text-story","version":1,"id":"mountain.m01_m03","title":"山门·一夜开灵脉","status":"draft_text_prototype","start":"m01.auction","acts":[{"id":1,"title":"山门之下"},{"id":2,"title":"断桥与开目"},{"id":3,"title":"一夜开灵脉"}],"nodes":[{"id":"m01.auction","type":"scene","act":1,"title":"六十工分换不来一个名字","setting":"重明宗云阶坪下，开山礼清晨。","beats":[{"visual":"一张写着陆寻名字的入门公开课候补牌，被严承按在柜台上。另一只手丢下两块灵石。值事把陆寻的牌翻到背面，换成严承的名字。陆寻手里的旧工分牌被攥得发白。","dialogue":[],"seconds":12},{"visual":"陆寻昨夜以五十六工分积蓄证明自己有资格候补，并排在第一；候补本不保证席位，值事却接受严承以家中额外捐赠换取本应按候补顺序分配的空席。正式席位仍未交割。周野挡住严承的手。","dialogue":[{"speaker":"周野","text":"他等了三个月！"},{"speaker":"严承","text":"那就再等三个月。两块灵石，买你俩一个月的工钱。"},{"speaker":"陆寻","text":"我不卖。"},{"speaker":"严承","text":"我问你卖不卖了吗？"}],"seconds":25},{"visual":"旁边外门弟子领走十二石月例，内门弟子的份额由弟子自己签领。柜台一副低阶护臂标价五石，陆寻看了一眼，没有钱买。值事要两人赶去开山货道加运，完成可得四工分。陆寻最终带周野离开，保留候补牌的原始凭条。","dialogue":[{"speaker":"周野","text":"你以后也穿那种衣服。"},{"speaker":"陆寻","text":"我先要一张自己的牌。"}],"seconds":17}],"next":"m01.fire"},{"id":"m01.fire","type":"scene","act":1,"title":"她把火收了回来","setting":"云阶坪开山礼，高台与下层货道。","beats":[{"visual":"七峰悬于云海。秦晚红衣登台，火焰化作长虹，穿过七座浮空铜环。台下同龄弟子惊叹；陆寻和周野仍在搬最后一个箱子。严承已经站在候补席旁看演示。","dialogue":[],"seconds":17},{"visual":"角兽冲破外围低阶兽栏，撞翻货车。秦晚最后一轮大范围火术本可完成七环奇观，但火线下方有工役。她瞬间收火，赤焰变成细长火幕，隔开角兽与工役；最后一环熄灭。","dialogue":[{"speaker":"秦晚","text":"下层的人，走侧闸！"}],"seconds":16},{"visual":"侧闸被箱车堵死。陆寻和周野把载货板搭过低栏，借绳轮移开货箱，陆续拉出困工。陆寻掌背被木刺划开。严承挤向安全台阶，却被周野推回去让最后一个受困者先走。巡守接手，与秦晚制服角兽。","dialogue":[],"seconds":24},{"visual":"秦晚走下高台，身上仍有余火。她在陆寻面前蹲下，接过周野递来的布条，按住陆寻掌背伤口。值事只记二人普通工役。秦晚抬头。","dialogue":[{"speaker":"秦晚","text":"台下还有几个人？"},{"speaker":"陆寻","text":"都出来了。"},{"speaker":"秦晚","text":"那就好。"},{"speaker":"值事","text":"工役本来就该清道……"},{"speaker":"秦晚","text":"那你刚才怎么没在下面？"}],"seconds":24},{"visual":"巡守确认救援贡献，允许二人领取一次公开训练名额和二十工分救援奖励的候选补偿制度。陆寻看见曾改写候补牌的值事正准备拿新奖励名额补偿自己，并要求不要提旧候补被挤掉之事；周野从袖中拿出保留的原始凭条。严承站在台阶上冷笑。","dialogue":[{"speaker":"严承","text":"你不就是想进去听课吗？给你了。还想怎样？"},{"speaker":"秦晚","text":"陆寻，这张旧牌，是怎么回事？"}],"seconds":20}],"next":"m01.choice"},{"id":"m01.choice","type":"choice","act":1,"prompt":"救援功劳已经获得承认。你可以追究旧候补被侵占，也可以先保住新的机会、暂不公开冲突。","choices":[{"id":"challenge","text":"把旧候补凭条交出来，当众要求查清。","next":"m01.challenge"},{"id":"keep","text":"先领合法救援奖励，保存旧凭条，暂不公开。","next":"m01.keep"}]},{"id":"m01.challenge","type":"scene","act":1,"title":"我不要你赏的","setting":"开山礼登记台。","beats":[{"visual":"陆寻把旧凭条放在众人面前。值事试图解释，严承说捐赠是替宗门办事。秦晚请负责名额的另一位教习当场核对候补顺序，确认旧空席还未正式交割，撤销不合规替换。值事不在此刻被主角任意处罚，原记录转交庶务复查。","dialogue":[{"speaker":"陆寻","text":"救人的奖励是救人的。那堂课，本来就该轮到我。"},{"speaker":"秦晚","text":"听见了吗？把两件事分开记。"}],"seconds":22},{"visual":"陆寻拿回原候补空席，并取得真实救援二十工分；周野也取得二十工分。公开纠正后严承失去该席位，不能把自己当成施舍者。秦晚把写有陆寻姓名的牌递回去。","dialogue":[{"speaker":"秦晚","text":"陆寻。不是谁赏你的。"},{"speaker":"严承","text":"你给我记着。"},{"speaker":"陆寻","text":"我记着呢。"}],"seconds":19},{"visual":"数日内，陆寻以原席位补完整课，借公开练习掌握基础引气与简单卸力；账牌由完成加运后的六十增为八十，护臂仍需一百。周野不借钱给他，保留自己的二十作器坊志愿准备。严承仍在合法外围采药队里，但对陆寻怀恨。","dialogue":[],"seconds":18}],"next":"m02.bridge.challenge"},{"id":"m01.keep","type":"scene","act":1,"title":"我不欠你人情","setting":"开山礼登记台。","beats":[{"visual":"陆寻收回旧凭条，拒绝销毁它；只登记两人的真实救援奖励。秦晚要求写清该奖励不等于撤回旧异议，值事签字。严承保留原本被他挤来的候补席位，庶务后续仍可核查。","dialogue":[{"speaker":"陆寻","text":"救人的那一份，我领。别的账，以后再算。"},{"speaker":"秦晚","text":"好。我替你证明今天发生的事。"},{"speaker":"严承","text":"这才识相。"}],"seconds":22},{"visual":"数日内，陆寻用新救援训练名额补课，练成基础引气与简单卸力；二十工分救援奖励也按规定入账，现有八十工分。周野将自己的二十借给陆寻，凑足一百购得五石护臂，欠款二十工分记在账纸。该路线没有追回旧席，因此只使用新名额；严承仍有被冒领的原课席位。","dialogue":[{"speaker":"周野","text":"欠我一块。等你真成仙再还也行。"},{"speaker":"陆寻","text":"不会让你等那么久。"}],"seconds":19},{"visual":"陆寻把原始候补凭条藏进衣袋。秦晚在远处对他扬了扬手中的救援登记副本，示意她确实保留证据。严承从正式教室走出来，看见二人新护臂，笑着离开。","dialogue":[],"seconds":16}],"next":"m02.bridge.keep"},{"id":"m02.bridge.challenge","type":"scene","act":2,"title":"你们不是挺能干吗","setting":"数日后，青崖谷开放采区。","beats":[{"visual":"告示：赤纹芝采收差事，两人完成可得四十工分；严承为临时领队。陆寻和周野已核对普通外围路线，仍接任务，因为药材报酬足以填补生活缺口。严承在岩缝割下赤纹芝，抢进自己的药篓。","dialogue":[{"speaker":"周野","text":"三个人找到的，凭什么只记你？"},{"speaker":"严承","text":"四十工分就值得你们这么计较？"}],"seconds":18},{"visual":"异常气味引来岩猞。严承先过桥，回头看见兄弟尚在谷内。他直接割断桥索，带药离开。周野拽住差点跌下去的陆寻，肩背撞岩。","dialogue":[{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊。"}],"seconds":18},{"visual":"陆寻用已练卸力避开兽爪，前臂被碎岩擦伤；周野只能靠他拖行。","dialogue":[],"seconds":15},{"visual":"一道冷白剑光沿已有裂缝封住兽道。裴照雪站在谷口，白衣染雨，右腕收剑时短暂颤动。巡守接走伤员。","dialogue":[{"speaker":"裴照雪","text":"先活着出去。谁割的桥，我会问。"},{"speaker":"陆寻","text":"严承。"}],"seconds":18},{"visual":"济生院。苏禾协助医修留下真实伤情，严承递来擅离队伍的认责单。她将单子退回。数日后严承因可核实的断桥及擅离被停领队、限制危险差事；引兽来源另查，未验收的四十工分没有发给兄弟。","dialogue":[{"speaker":"严承","text":"他们不是都活着回来了吗？"},{"speaker":"苏禾","text":"活着，不等于没受伤。"},{"speaker":"陆寻","text":"你记住这句话。"}],"seconds":23},{"visual":"时间字幕：数周后。医修允许周野轻役登记、陆寻普通搬运。周野指着器坊招募纸，决定先去申请轻役协助；陆寻接封苑外仓材料交接。他们此行不是已知危险差事。","dialogue":[{"speaker":"周野","text":"别去找他拼命。咱俩先活得比他好。"}],"seconds":13}],"next":"m02.awake.challenge"},{"id":"m02.awake.challenge","type":"scene","act":2,"title":"眼睛里有另一片天地","setting":"封苑外仓，夜。","beats":[{"visual":"空间全景：内苑封物室在隔墙后，外仓为合法卸货区，固定绳轮、木墩、撤离口已入镜。周野登记轻物，陆寻推车。警铃突响，巡守命撤离，内苑暗光与护阵相撞。","dialogue":[],"seconds":16},{"visual":"隔墙局部破裂，阵力使旧梁偏移。周野在登记桌旁高喊，陆寻避开第一根梁；周野自己被落下的横梁压住腿部与胸侧。陆寻赶来，绳轮受残阵反推而无法安全拉动。","dialogue":[{"speaker":"周野","text":"走……"},{"speaker":"陆寻","text":"闭嘴。"}],"seconds":18},{"visual":"封物室靠外仓一角坍塌，一枚带瞳纹的内芯从实际破口滚出，与残阵同步闪烁。陆寻误认为它是测阵器具，送入极少灵力试探。内芯脱离供能后可迁移状态中的原感知结构沿主动接触一次性转入他体内，实体失光。他捂眼跪倒。","dialogue":[],"seconds":22},{"visual":"主观视角：原本只有明暗的残阵变成两层流动的细线，表面熄灭之后，深处仍猛烈回流。陆寻先误判一次，梁动，立即让巡守停下。第二次他确认两层同时退去，指挥巡守拉绳，自己推入木墩。","dialogue":[{"speaker":"陆寻","text":"等一下！里面还在走……现在！"}],"seconds":23},{"visual":"周野被拖离，另一段梁在下一轮回流坠落到原位。救援巡守面面相觑。陆寻抱住周野，医修立即接管。秦晚并不在这里突然救场；裴照雪作为巡守随后抵达。","dialogue":[{"speaker":"陆寻","text":"这次换我。"}],"seconds":18},{"visual":"裴照雪看见陆寻在外仓地面画出的残阵明暗间隔，问他如何知道。失活内芯已由巡守收集，伤情与接触事实必须真实登记。","dialogue":[{"speaker":"裴照雪","text":"你看见了什么？"},{"speaker":"陆寻","text":"……"},{"speaker":"裴照雪","text":"不用告诉我你不知道的。"}],"seconds":13}],"next":"m02.choice.challenge"},{"id":"m02.choice.challenge","type":"choice","act":2,"prompt":"你不清楚眼睛的变化是什么。接触碎片和眼痛须如实登记；是否主动告诉裴照雪你看到了两层灵流？","choices":[{"id":"tell","text":"告诉她异常视野，请她帮我核验。","next":"m02.tell.challenge"},{"id":"private","text":"如实登记接触和伤情，暂不主动透露异常视野。","next":"m02.private.challenge"}]},{"id":"m02.tell.challenge","type":"scene","act":2,"title":"我信刚才那根梁","setting":"外仓至济生院，随后数周。","beats":[{"visual":"陆寻画出两层流向。裴照雪将异常所见写入受限补充记录，先不对外宣称神通；她以巡守身份约定正式复核。","dialogue":[{"speaker":"陆寻","text":"我能看见它们。"},{"speaker":"裴照雪","text":"先治眼。"},{"speaker":"陆寻","text":"师姐信我？"},{"speaker":"裴照雪","text":"我信刚才那根梁。"}],"seconds":20},{"visual":"苏禾守在济生院。周野暂时脱险，仍需康复。她发现陆寻眼角出血，挡住他。陆寻终于不再隐瞒疼痛。数周后经医修许可恢复训练；他按原课所学观察自己的浅层运行，发现第三息前回流尚未散尽，几次验证后闭眼完成完整吐纳和基础引气。","dialogue":[{"speaker":"苏禾","text":"你们俩每次都说没事。我不想只会等你们回来。"},{"speaker":"陆寻","text":"眼睛疼。还有重影。"},{"speaker":"苏禾","text":"那就治。"}],"seconds":24},{"visual":"陆寻原本须以多年工役换取修炼资源。画面转向封苑失活内芯：阵修检测失败，留下接触者登记。随后一张新告示贴在山腰：修复后的废弃末梢灵脉将开放最后一次低阶试采，所得可按规则归个人；有异常立即撤离，不得擅改高阶供能。周野把告示拿给陆寻。","dialogue":[{"speaker":"阵修","text":"东西还在。里面原来的东西呢？"},{"speaker":"周野","text":"这个我能帮你看旧工图。别再一个人瞎闯。"}],"seconds":20}],"next":"m03.mine.challenge.tell"},{"id":"m03.mine.challenge.tell","type":"scene","act":3,"title":"一块灵石都没有","setting":"山腰废脉试采区，白昼。","beats":[{"visual":"高处正式弟子从主脉领走一匣匣灵石。山下废脉只剩稀薄雾气。公开试采告示：交回采具，正常试采所得归个人，若发现危险或主脉异常须停工报告；大宗超额所得须现场鉴别归属。此处不是禁库。严承因危险差事受限，不得参加；他在外面看见陆寻报名，嘲笑废脉早被挖空。","dialogue":[{"speaker":"严承","text":"还去？里面连老鼠都养不活。"}],"seconds":20},{"visual":"裴照雪按此前约定与负责低阶试采的教习核验异常感知，获准在安全区见证陆寻的普通试采；不是凭关系给额外采掘权。","dialogue":[],"seconds":13},{"visual":"陆寻以灵目看到旧导流石上残存的真实灵力脉动：并非废脉彻底枯竭，而是低阶支渠堵塞后，一小段末端反复蓄放。周野的旧工图证实该处原有两条支路，教习用检测器核验没有连到主脉。陆寻提出只更换普通可拆卸导流片，不干预高阶阵基。教习批准监督试采。","dialogue":[{"speaker":"周野","text":"我就说这图上还有一条路！"},{"speaker":"教习","text":"只动这块片。别碰里头的封石。"}],"seconds":24},{"visual":"周野从外侧按旧工图标示的方向调整普通导流片，陆寻用学会的基础引气维持低阶测试，教习开启既有测试阀。最初什么也没发生。严承在栏外笑了。下一瞬间，原本灰白的支渠由内向外亮起一串赤金纹路。灵雾沿石槽流出，在底部凝成一簇天然下品灵石。","dialogue":[],"seconds":24},{"visual":"教习关闭阀，取出实际凝晶核验。不是凭空造灵石；这是原支渠中被堵塞积蓄的有限灵力与灵晶矿沉积。先取得三十块下品灵石，另有一枚尚含灵力的聚灵晶核。晶核可在合规器具内作为有限期修炼源，或交由宗门用于持续开通该低阶支渠。三十石按陆寻与周野等份登记，各十五，晶核共同取得。","dialogue":[{"speaker":"教习","text":"三十块。还有一枚聚灵晶核。"},{"speaker":"周野","text":"多少？"},{"speaker":"陆寻","text":"三十。"},{"speaker":"严承","text":"那地方我家的人都查过！"},{"speaker":"陆寻","text":"那你们怎么没拿走？"}],"seconds":23},{"visual":"陆寻从十五石中拿五块买下曾经买不起的护臂；周野保留自己的十五块准备器坊考评，两人不再欠护臂钱。","dialogue":[{"speaker":"周野","text":"以前十天一块。今天……"},{"speaker":"陆寻","text":"别数了。先去给苏禾交药钱。"}],"seconds":15},{"visual":"秦晚闻讯来到合法试采外场。她认出救援时的两人，望着晶核，又望向陆寻。她提出可用五灵峰获准的稳定器具试验晶核，自己愿承担实际试验；教习同时说明晶核可由陆寻周野共同持有、经批准装入私用低阶聚灵器，也可交回宗门恢复支渠，换取正式修炼资源与贡献。二者互斥，周野对两种安排均有同意权，他说愿听陆寻提议但须保留真实份额。","dialogue":[{"speaker":"秦晚","text":"上次我记住的是两个救人的杂役。"},{"speaker":"秦晚","text":"这次，我得问问你们到底还藏着什么。"},{"speaker":"周野","text":"师姐，先问他。我负责算账。"}],"seconds":23}],"next":"m03.choice.challenge.tell"},{"id":"m03.choice.challenge.tell","type":"choice","act":3,"prompt":"晶核是两人共同发现的。周野同意两种方案，但要求保留自己的实际贡献。如何使用这份机缘？","choices":[{"id":"keep","text":"保留晶核，与周野共同使用；请秦晚协助稳定器具。","next":"m03.keep.challenge.tell"},{"id":"offer","text":"交回晶核，恢复废脉，争取正式修炼与器坊机会。","next":"m03.offer.challenge.tell"}]},{"id":"m03.keep.challenge.tell","type":"scene","act":3,"title":"我们自己的灵脉","setting":"试采区至山腰，数日后。","beats":[{"visual":"三人共同在获准低阶聚灵器中装入晶核，周野按器具规则完成安装，秦晚以标准火源检测稳定性，教习确认安全。晶核有限期供能，陆寻周野共同使用，不是无限灵气。","dialogue":[{"speaker":"陆寻","text":"以前我们只能等别人发灵石。"},{"speaker":"周野","text":"以后这一炉灵气，先归咱们俩。"},{"speaker":"秦晚","text":"还有我这个负责看火的，记得请饭。"}],"seconds":25},{"visual":"夜，陆寻和周野在同一座低阶聚灵器两侧坐下，灵气形成稳定细流。陆寻以已经学会的吐纳观察实际运行，数日后首次稳定完成多轮基础练习。周野也能使用普通修炼源，但不复制灵目。二人获得真实的修炼时间与资源优势；没有正式传习推荐。","dialogue":[],"seconds":22},{"visual":"陆寻将两块自己的灵石交济生院支付一份已核定的普通药散费用，其他旧药费另核；周野说以后自己也要有足够能力付得起药钱。苏禾收下正式凭据，看到陆寻这次是自己拿来的灵石，认真地看了他一眼。","dialogue":[{"speaker":"苏禾","text":"终于不用我追着问你药钱了？"},{"speaker":"陆寻","text":"这次我有。"},{"speaker":"苏禾","text":"那下次别受伤。"}],"seconds":15},{"visual":"裴照雪完成正式复核记录，认定陆寻能观察某些实际灵流，尚不知古仙来源；提醒他有人正在查封苑内芯。秦晚只知道三人真实试采成果，没有被默认告知眼睛秘密。","dialogue":[],"seconds":15}],"next":"end.challenge.tell.keep"},{"id":"end.challenge.tell.keep","type":"end","title":"独掌聚灵·可信见证","summary":"前三幕阶段结局：真实机缘已经取得，后续M04–M06尚未完成。","outcomes":{"immediate":"周野脱险，陆寻觉醒灵目；两人试采得30石，各15。陆寻追回旧课席，未欠护臂款，后购护臂5石。裴照雪知异常视野并有正式记录。","short":"保留共同晶核，取得有限期私人修炼源，无特别传习推荐。 陆寻另支付2石药散，余8石。","mid":"M04–M05必须继承的事实（未写成正式场景）：私人晶核及有限供能、共同使用约定。裴照雪的真实知情及记录。","long":"M06尚未创作。最终身份、严承责任、三位女主与周野命运必须在全剧中明确回收；本阶段不冒充全剧结局。"}},{"id":"m03.offer.challenge.tell","type":"scene","act":3,"title":"让山门重新亮起来","setting":"试采区至山腰，数日后。","beats":[{"visual":"陆寻周野共同签署交回晶核，保留三十石不退。教习在宗门阵修监督下将晶核装回支渠既有位置，恢复原有低阶灵流；此后晶核属于宗门，不会再发回个人。","dialogue":[{"speaker":"陆寻","text":"我想让这条脉重新开。"},{"speaker":"周野","text":"那得把咱俩的名字记在最前面。"},{"speaker":"秦晚","text":"我作证。"}],"seconds":25},{"visual":"恢复后的试采坪重新亮起一排低阶导流石。负责教习正式确认贡献，宗门给予陆寻一次进入外门预备传习考核的特别机会，周野获器坊正式学徒考评受理；二人尚未晋升。陆寻亲眼看见此前只能隔门看的修炼区向自己打开，但失去私人晶核。","dialogue":[],"seconds":22},{"visual":"陆寻将两块自己的灵石交济生院支付一份已核定的普通药散费用，其他旧药费另核；周野说以后自己也要有足够能力付得起药钱。苏禾收下正式凭据，看到陆寻这次是自己拿来的灵石，认真地看了他一眼。","dialogue":[{"speaker":"苏禾","text":"终于不用我追着问你药钱了？"},{"speaker":"陆寻","text":"这次我有。"},{"speaker":"苏禾","text":"那下次别受伤。"}],"seconds":15},{"visual":"裴照雪完成正式复核记录，认定陆寻能观察某些实际灵流，尚不知古仙来源；提醒他有人正在查封苑内芯。秦晚只知道三人真实试采成果，没有被默认告知眼睛秘密。","dialogue":[],"seconds":15}],"next":"end.challenge.tell.offer"},{"id":"end.challenge.tell.offer","type":"end","title":"重开废脉·可信见证","summary":"前三幕阶段结局：真实机缘已经取得，后续M04–M06尚未完成。","outcomes":{"immediate":"周野脱险，陆寻觉醒灵目；两人试采得30石，各15。陆寻追回旧课席，未欠护臂款，后购护臂5石。裴照雪知异常视野并有正式记录。","short":"交回晶核，恢复低阶支渠，陆寻获特别传习考核机会，周野获器坊考评受理；不再拥有晶核。 陆寻另支付2石药散，余8石。","mid":"M04–M05必须继承的事实（未写成正式场景）：晶核已交出、正式考核及器坊机会。裴照雪的真实知情及记录。","long":"M06尚未创作。最终身份、严承责任、三位女主与周野命运必须在全剧中明确回收；本阶段不冒充全剧结局。"}},{"id":"m02.private.challenge","type":"scene","act":2,"title":"有些事先留给自己","setting":"外仓至济生院，随后数周。","beats":[{"visual":"陆寻报告接触碎片、眼痛和等待梁震间隔；未主动描述异常视觉。裴照雪登记客观救援过程，不知道灵目所见。若后续正式询问，陆寻仍必须如实回答。","dialogue":[{"speaker":"裴照雪","text":"先治伤。想起什么，再来找镇山堂。"}],"seconds":20},{"visual":"苏禾守在济生院。周野暂时脱险，仍需康复。她发现陆寻眼角出血，挡住他。陆寻终于不再隐瞒疼痛。数周后经医修许可恢复训练；他按原课所学观察自己的浅层运行，发现第三息前回流尚未散尽，几次验证后闭眼完成完整吐纳和基础引气。","dialogue":[{"speaker":"苏禾","text":"你们俩每次都说没事。我不想只会等你们回来。"},{"speaker":"陆寻","text":"眼睛疼。还有重影。"},{"speaker":"苏禾","text":"那就治。"}],"seconds":24},{"visual":"陆寻原本须以多年工役换取修炼资源。画面转向封苑失活内芯：阵修检测失败，留下接触者登记。随后一张新告示贴在山腰：修复后的废弃末梢灵脉将开放最后一次低阶试采，所得可按规则归个人；有异常立即撤离，不得擅改高阶供能。周野把告示拿给陆寻。","dialogue":[{"speaker":"阵修","text":"东西还在。里面原来的东西呢？"},{"speaker":"周野","text":"这个我能帮你看旧工图。别再一个人瞎闯。"}],"seconds":20}],"next":"m03.mine.challenge.private"},{"id":"m03.mine.challenge.private","type":"scene","act":3,"title":"一块灵石都没有","setting":"山腰废脉试采区，白昼。","beats":[{"visual":"高处正式弟子从主脉领走一匣匣灵石。山下废脉只剩稀薄雾气。公开试采告示：交回采具，正常试采所得归个人，若发现危险或主脉异常须停工报告；大宗超额所得须现场鉴别归属。此处不是禁库。严承因危险差事受限，不得参加；他在外面看见陆寻报名，嘲笑废脉早被挖空。","dialogue":[{"speaker":"严承","text":"还去？里面连老鼠都养不活。"}],"seconds":20},{"visual":"陆寻和周野依公开试采规则登记；周野只在安全区负责旧工图及绳轮登记，陆寻进低阶采区。裴照雪不在现场，无共同秘密。","dialogue":[],"seconds":13},{"visual":"陆寻以灵目看到旧导流石上残存的真实灵力脉动：并非废脉彻底枯竭，而是低阶支渠堵塞后，一小段末端反复蓄放。周野的旧工图证实该处原有两条支路，教习用检测器核验没有连到主脉。陆寻提出只更换普 以后自己也要有足够能力付得起药钱。苏禾收下正式凭据，看到陆寻这次是自己拿来的灵石，认真地看了他一眼。","dialogue":[{"speaker":"苏禾","text":"终于不用我追着问你药钱了？"},{"speaker":"陆寻","text":"这次我有。"},{"speaker":"苏禾","text":"那下次别受伤。"}],"seconds":15},{"visual":"试采成功的记录传回镇山堂，裴照雪只知道普通成果及封苑救援记录，不知道异常视野。陆寻在回程看到一名陌生修士询问废脉为何重新出晶；调查风险从公开成果产生。","dialogue":[],"seconds":15}],"next":"end.challenge.private.keep"},{"id":"end.challenge.private.keep","type":"end","title":"独掌聚灵·秘密自持","summary":"前三幕阶段结局：真实机缘已经取得，后续M04–M06尚未完成。","outcomes":{"immediate":"周野脱险，陆寻觉醒灵目；两人试采得30石，各15。陆寻追回旧课席，未欠护臂款，后购护臂5石。裴照雪未知异常视野。","short":"保留共同晶核，取得有限期私人修炼源，无特别传习推荐。 陆寻另支付2石药散，余8石。","mid":"M04–M05必须继承的事实（未写成正式场景）：私人晶核及有限供能、共同使用约定。裴照雪不知异常视觉，不可写共同秘密。","long":"M06尚未创作。最终身份、严承责任、三位女主与周野命运必须在全剧中明确回收；本阶段不冒充全剧结局。"}},{"id":"m03.offer.challenge.private","type":"scene","act":3,"title":"让山门重新亮起来","setting":"试采区至山腰，数日后。","beats":[{"visual":"陆寻周野共同签署交回晶核，保留三十石不退。教习在宗门阵修监督下将晶核装回支渠既有位置，恢复原有低阶灵流；此后晶核属于宗门，不会再发回个人。","dialogue":[{"speaker":"陆寻","text":"我想让这条脉重新开。"},{"speaker":"周野","text":"那得把咱俩的名字记在最前面。"},{"speaker":"秦晚","text":"我作证。"}],"seconds":25},{"visual":"恢复后的试采坪重新亮起一排低阶导流石。负责教习正式确认贡献，宗门给予陆寻一次进入外门预备传习考核的特别机会，周野获器坊正式学徒考评受理；二人尚未晋升。陆寻亲眼看见此前只能隔门看的修炼区向自己打开，但失去私人晶核。","dialogue":[],"seconds":22},{"visual":"陆寻将两块自己的灵石交济生院支付一份已核定的普通药散费用，其他旧药费另核；周野说以后自己也要有足够能力付得起药钱。苏禾收下正式凭据，看到陆寻这次是自己拿来的灵石，认真地看了他一眼。","dialogue":[{"speaker":"苏禾","text":"终于不用我追着问你药钱了？"},{"speaker":"陆寻","text":"这次我有。"},{"speaker":"苏禾","text":"那下次别受伤。"}],"seconds":15},{"visual":"试采成功的记录传回镇山堂，裴照雪只知道普通成果及封苑救援记录，不知道异常视野。陆寻在回程看到一名陌生修士询问废脉为何重新出晶；调查风险从公开成果产生。","dialogue":[],"seconds":15}],"next":"end.challenge.private.offer"},{"id":"end.challenge.private.offer","type":"end","title":"重开废脉·秘密自持","summary":"前三幕阶段结局：真实机缘已经取得，后续M04–M06尚未完成。","outcomes":{"immediate":"周野脱险，陆寻觉醒灵目；两人试采得30石，各15。陆寻追回旧课席，未欠护臂款，后购护臂5石。裴照雪未知异常视野。","short":"交回晶核，恢复低阶支渠，陆寻获特别传习考核机会，周野获器坊考评受理；不再拥有晶核。 陆寻另支付2石药散，余8石。","mid":"M04–M05必须继承的事实（未写成正式场景）：晶核已交出、正式考核及器坊机会。裴照雪不知异常视觉，不可写共同秘密。","long":"M06尚未创作。最终身份、严承责任、三位女主与周野命运必须在全剧中明确回收；本阶段不冒充全剧结局。"}},{"id":"m02.bridge.keep","type":"scene","act":2,"title":"你们不是挺能干吗","setting":"数日后，青崖谷开放采区。","beats":[{"visual":"告示：赤纹芝采收差事，两人完成可得四十工分；严承为临时领队。陆寻和周野已核对普通外围路线，仍接任务，因为药材报酬足以填补生活缺口。严承在岩缝割下赤纹芝，抢进自己的药篓。","dialogue":[{"speaker":"周野","text":"三个人找到的，凭什么只记你？"},{"speaker":"严承","text":"四十工分就值得你们这么计较？"}],"seconds":18},{"visual":"异常气味引来岩猞。严承先过桥，回头看见兄弟尚在谷内。他直接割断桥索，带药离开。周野拽住差点跌下去的陆寻，肩背撞岩。","dialogue":[{"speaker":"严承","text":"你们不是挺能干吗？走旧路啊。"}],"seconds":18},{"visual":"陆寻以新护臂挡下兽爪，护臂裂开，手臂幸免重伤；随后用已练卸力扶住周野。","dialogue":[],"seconds":15},{"visual":"一道冷白剑光沿已有裂缝封住兽道。裴照雪站在谷口，白衣染雨，右腕收剑时短暂颤动。巡守接走伤员。","dialogue":[{"speaker":"裴照雪","text":"先活着出去。谁割的桥，我会问。"},{"speaker":"陆寻","text":"严承。"}],"seconds":18},{"visual":"济生院。苏禾协助医修留下真实伤情，严承递来擅离队伍的认责单。她将单子退回。数日后严承因可核实的断桥及擅离被停领队、限制危险差事；引兽来源另查，未验收的四十工分没有发给兄弟。","dialogue":[{"speaker":"严承","text":"他们不是都活着回来了吗？"},{"speaker":"苏禾","text":"活着，不等于没受伤。"},{"speaker":"陆寻","text":"你记住这句话。"}],"seconds":23},{"visual":"时间字幕：数周后。医修允许周野轻役登记、陆寻普通搬运。周野指着器坊招募纸，决定先去申请轻役协助；陆寻接封苑外仓材料交接。他们此行不是已知危险差事。","dialogue":[{"speaker":"周野","text":"别去找他拼命。咱俩先活得比他好。"}],"seconds":13}],"next":"m02.awake.keep"},{"id":"m02.awake.keep","type":"scene","act":2,"title":"眼睛里有另一片天地","setting":"封苑外仓，夜。","beats":[{"visual":"空间全景：内苑封物室在隔墙后，外仓为合法卸货区，固定绳轮、木墩、撤离口已入镜。周野登记轻物，陆寻推车。警铃突响，巡守命撤离，内苑暗光与护阵相撞。","dialogue":[],"seconds":16},{"visual":"隔墙局部破裂，阵力使旧梁偏移。周野在登记桌旁高喊，陆寻避开第一根梁；周野自己被落下的横梁压住腿部与胸侧。陆寻赶来，绳轮受残阵反推而无法安全拉动。","dialogue":[{"speaker":"周野","text":"走……"},{"speaker":"陆寻","text":"闭嘴。"}],"seconds":18},{"visual":"封物室靠外仓一角坍塌，一枚带瞳纹的内芯从实际破口滚出，与残阵同步闪烁。陆寻误认为它是测阵器具，送入极少灵力试探。内芯脱离供能后可迁移状态中的原感知结构沿主动接触一次性转入他体内，实体失光。他捂眼跪倒。","dialogue":[],"seconds":22},{"visual":"主观视角：原本只有明暗的残阵变成两层流动的细线，表面熄灭之后，深处仍猛烈回流。陆寻先误判一次，梁动，立即让巡守停下。第二次他确认两层同时退去，指挥巡守拉绳，自己推入木墩。","dialogue":[{"speaker":"陆寻","text":"等一下！里面还在走……现在！"}],"seconds":23},{"visual":"周野被拖离，另一段梁在下一轮回流坠落到原位。救援巡守面面相觑。陆寻抱住周野，医修立即接管。秦晚并不在这里突然救场；裴照雪作为巡守随后抵达。","dialogue":[{"speaker":"陆寻","text":"这次换我。"}],"seconds":18},{"visual":"裴照雪看见陆寻在外仓地面画出的残阵明暗间隔，问他如何知道。失活内芯已由巡守收集，伤情与接触事实必须真实登记。","dialogue":[{"speaker":"裴照雪","text":"你看见了什么？"},{"speaker":"陆寻","text":"……"},{"speaker":"裴照雪","text":"不用告诉我你不知道的。"}],"seconds":13}],"next":"m02.choice.keep"},{"id":"m02.choice.keep","type":"choice","act":2,"prompt":"你不清楚眼睛的变化是什么。接触碎片和眼痛须如实登记；是否主动告诉裴照雪你看到了两层灵流？","choices":[{"id":"tell","text":"告诉她异常视野，请她帮我核验。","next":"m02.tell.keep"},{"id":"private","text":"如实登记接触和伤情，暂不主动透露异常视野。","next":"m02.private.keep"}]},{"id":"m02.tell.keep","type":"scene","act":2,"title":"我信刚才那根梁","setting":"外仓至济生院，随后数周。","beats":[{"visual":"陆寻画出两层流向。裴照雪将异常所见写入受限补充记录，先不对外宣称神通；她以巡守身份约定正式复核。","dialogue":[{"speaker":"陆寻","text":"我能看见它们。"},{"speaker":"裴照雪","text":"先治眼。"},{"speaker":"陆寻","text":"师姐信我？"},{"speaker":"裴照雪","text":"我信刚才那根梁。"}],"seconds":20},{"visual":"苏禾守在济生院。周野暂时脱险，仍需康复。她发现陆寻眼角出血，挡住他。陆寻终于不再隐瞒疼痛。数周后经医修许可恢复训练；他按原课所学观察自己的浅层运行，发现第三息前回流尚未散尽，几次验证后闭眼完成完整吐纳和基础引气。","dialogue":[{"speaker":"苏禾","text":"你们俩每次都说没事。我不想只会等你们回来。"},{"speaker":"陆寻","text":"眼睛疼。还有重影。"},{"speaker":"苏禾","text":"那就治。"}],"seconds":24},{"visual":"陆寻原本须以多年工役换取修炼资源。画面转向封苑失活内芯：阵修检测失败，留下接触者登记。随后一张新告示贴在山腰：修复后的废弃末梢灵脉将开放最后一次低阶试采，所得可按规则归个人；有异常立即撤离，不得擅改高阶供能。周野把告示拿给陆寻。","dialogue":[{"speaker":"阵修","text":"东西还在。里面原来的东西呢？"},{"speaker":"周野","text":"这个我能帮你看旧工图。别再一个人瞎闯。"}],"seconds":20}],"next":"m03.mine.keep.tell"},{"id":"m03.mine.keep.tell","type":"scene","act":3,"title":"一块灵石都没有","setting":"山腰废脉试采区，白昼。","beats":[{"visual":"高处正式弟子从主脉领走一匣匣灵石。山下废脉只剩稀薄雾气。公开试采告示：交回采具，正常试采所得归个人，若发现危险或主脉异常须停工报告；大宗超额所得须现场鉴别归属。此处不是禁库。严承因危险差事受限，不得参加；他在外面看见陆寻报名，嘲笑废脉早被挖空。","dialogue":[{"speaker":"严承","text":"还去？里面连老鼠都养不活。"}],"seconds":20},{"visual":"裴照雪按此前约定与负责低阶试采的教习核验异常感知，获准在安全区见证陆寻的普通试采；不是凭关系给额外采掘权。","dialogue":[],"seconds":13},{"visual":"陆寻以灵目看到旧导流石上残存的真实灵力脉动：并非废脉彻底枯竭，而是低阶支渠堵塞后，一小段末端反复蓄放。周野的旧工图证实该处原有两条支路，教习用检测器核验没有连到主脉。陆寻提出只更换普通可拆卸导流片，不干预高阶阵基。教习批准监督试采。","dialogue":[{"speaker":"周野","text":"我就说这图上还有一条路！"},{"speaker":"教习","text":"只动这块片。别碰里头的封石。"}],"seconds":24},{"visual":"周野从外侧按旧工图标示的方向调整普通导流片，陆寻用学会的基础引气维持低阶测试，教习开启既有测试阀。最初什么也没发生。严承在栏外笑了。下一瞬间，原本灰白的支渠由内向外亮起一串赤金纹路。灵雾沿石槽流出，在底部凝成一簇天然下品灵石。","dialogue":[],"seconds":24},{"visual":"教习关闭阀，取出实际凝晶核验。不是凭空造灵石；这是原支渠中被堵塞积蓄的有限灵力与灵晶矿沉积。先取得三十块下品灵石，另有一枚尚含灵力的聚灵晶核。晶核可在合规器具内作为有限期修炼源，或交由宗门用于持续开通该低阶支渠。三十石按陆寻与周野等份登记，各十五，晶核共同取得。","dialogue":[{"speaker":"教习","text":"三十块。还有一枚聚灵晶核。"},{"speaker":"周野","text":"多少？"},{"speaker":"陆寻","text":"三十。"},{"speaker":"严承","text":"那地方我家的人都查过！"},{"speaker":"陆寻","text":"那你们怎么没拿走？"}],"seconds":23},{"visual":"陆寻从十五石中还周野一块旧借款，再用五块换下开裂护臂，余九石；周野共得十六石（含还款）。","dialogue":[{"speaker":"周野","text":"以前十天一块。今天……"},{"speaker":"陆寻","text":"别数了。先去给苏禾交药钱。"}],"seconds":15},{"visual":"秦晚闻讯来到合法试采外场。她认出救援时的两人，望着晶核，又望向陆寻。她提出可用五灵峰获准的稳定器具试验晶核，自己愿承担实际试验；教习同时说明晶核可由陆寻周野共同持有、经批准装入私用低阶聚灵器，也可交回宗门恢复支渠，换取正式修炼资源与贡献。二者互斥，周野对两种安排均有同意权，他说愿听陆寻提议但须保留真实份额。","dialogue":[{"speaker":"秦晚","text":"上次我记住的是两个救人的杂役。"},{"speaker":"秦晚","text":"这次，我得问问你们到底还藏着什么。"},{"speaker":"周野","text":"师姐，先问他。我负责算账。"}],"seconds":23}],"next":"m03.choice.keep.tell"},{"id":"m03.choice.keep.tell","type":"choice","act":3,"prompt":"晶核是两人共同发现的。周野同意两种方案，但要求保留自己的实际贡献。如何使用这份机缘？","choices":[{"id":"keep","text":"保留晶核，与周野共同使用；请秦晚协助稳定器具。","next":"m03.keep.keep.tell"},{"id":"offer","text":"交回晶核，恢复废脉，争取正式修炼与器坊机会。","next":"m03.offer.keep.tell"}]},{"id":"m03.keep.keep.tell","type":"scene","act":3,"title":"我们自己的灵脉","setting":"试采区至山腰，数日后。","beats":[{"visual":"三人共同在获准低阶聚灵器中装入晶核，周野按器具规则完成安装，秦晚以标准火源检测稳定性，教习确认安全。晶核有限期供能，陆寻周野共同使用，不是无限灵气。","dialogue":[{"speaker":"陆寻","text":"以前我们只能等别人发灵石。"},{"speaker":"周野","text":"以后这一炉灵气，先归咱们俩。"},{"speaker":"秦晚","text":"还有我这个负责看火的，记得请饭。"}],"seconds":25},{"visual":"夜，陆寻和周野在同一座低阶聚灵器两侧坐下，灵气形成稳定细流。陆寻以已经学会的吐纳观察实际运行，数日后首次稳定完成多轮基础练习。周野也能使用普通修炼源，但不复制灵目。二人获得真实的修炼时间与资源优势；没有正式传习推荐。","dialogue":[],"seconds":22},{"visual":"陆寻将两块自己的灵石交济生院支付一份已核定的普通药散费用，其他旧药费另核；周野说以后自己也要有足够能力付得起药钱。苏禾收下正式凭据，看到陆寻这次是自己拿来的灵石，认真地看了他一眼。","dialogue":[{"speaker":"苏禾","text":"终于不用我追着问你药钱了？"},{"speaker":"陆寻","text":"这次我有。"},{"speaker":"苏禾","text":"那下次别受伤。"}],"seconds":15},{"visual":"裴照雪完成正式复核记录，认定陆寻能观察某些实际灵流，尚不知古仙来源；提醒他有人正在查封苑内芯。秦晚只知道三人真实试采成果，没有被默认告知眼睛秘密。","dialogue":[],"seconds":15}],"next":"end.keep.tell.keep"},{"id":"end.keep.tell.keep","type":"end","title":"独掌聚灵·可信见证","summary":"前三幕阶段结局：真实机缘已经取得，后续M04–M06尚未完成。","outcomes":{"immediate":"周野脱险，陆寻觉醒灵目；两人试采得30石，各15。陆寻保留旧候补证据，还周野1石，购新护臂5石。裴照雪知异常视野并有正式记录。","short":"保留共同晶核，取得有限期私人修炼源，无特别传习推荐。 陆寻另支付2石药散，余7石。","mid":"M04–M05必须继承的事实（未写成正式场景）：私人晶核及有限供能、共同使用约定。裴照雪的真实知情及记录。","long":"M06尚未创作。最终身份、严承责任、三位女主与周野命运必须在全剧中明确回收；本阶段不冒充全剧结局。"}},{"id":"m03.offer.keep.tell","type":"scene","act":3,"title":"让山门重新亮起来","setting":"试采区至山腰，数日后。","beats":[{"visual":"陆寻周野共同签署交回晶核，保留三十石不退。教习在宗门阵修监督下将晶核装回支渠既有位置，恢复原有低阶灵流；此后晶核属于宗门，不会再发回个人。","dialogue":[{"speaker":"陆寻","text":"我想让这条脉重新开。"},{"speaker":"周野","text":"那得把咱俩的名字记在最前面。"},{"speaker":"秦晚","text":"我作证。"}],"seconds":25},{"visual":"恢复后的试采坪重新亮起一排低阶导流石。负责教习正式确认贡献，宗门给予陆寻一次进入外门预备传习考核的特别机会，周野获器坊正式学徒考评受理；二人尚未晋升。陆寻亲眼看见此前只能隔门看的修炼区向自己打开，但失去私人晶核。","dialogue":[],"seconds":22},{"visual":"陆寻将两块自己的灵石交济生院支付一份已核定的普通药散费用，其他旧药费另核；周野说以后自己也要有足够能力付得起药钱。苏禾收下正式凭据，看到陆寻这次是自己拿来的灵石，认真地看了他一眼。","dialogue":[{"speaker":"苏禾","text":"终于不用我追着问你药钱了？"},{"speaker":"陆寻","text":"这次我有。"},{"speaker":"苏禾","text":"那下次别受伤。"}],"seconds":15},{"visual":"裴照雪完成正式复核记录，认定陆寻能观察某些实际灵流，尚不知古仙来源；提醒他有人正在查封苑内芯。秦晚只知道三人真实试采成果，没有被默认告知眼睛秘密。","dialogue":[],"seconds":15}],"next":"end.keep.tell.offer"},{"id":"end.keep.tell.offer","type":"end","title":"重开废脉·可信见证","summary":"前三幕阶段结局：真实机缘已经取得，后续M04–M06尚未完成。","outcomes":{"immediate":"周野脱险，陆寻觉醒灵目；两人试采得30石，各15。陆寻保留旧候补证据，还周野1石，购新护臂5石。裴照雪知异常视野并有正式记录。","short":"交回晶核，恢复低阶支渠，陆寻获特别传习考核机会，周野获器坊考评受理；不再拥有晶核。 陆寻另支付2石药散，余7石。","mid":"M04–M05必须继承的事实（未写成正式场景）：晶核已交出、正式考核及器坊机会。裴照雪的真实知情及记录。","long":"M06尚未创作。最终身份、严承责任、三位女主与周野命运必须在全剧中明确回收；本阶段不冒充全剧结局。"}},{"id":"m02.private.keep","type":"scene","act":2,"title":"有些事先留给自己","setting":"外仓至济生院，随后数周。","beats":[{"visual":"陆寻报告接触碎片、眼痛和等待梁震间隔；未主动描述异常视觉。裴照雪登记客观救援过程，不知道灵目所见。若后续正式询问，陆寻仍必须如实回答。","dialogue":[{"speaker":"裴照雪","text":"先治伤。想起什么，再来找镇山堂。"}],"seconds":20},{"visual":"苏禾守在济生院。周野暂时脱险，仍需康复。她发现陆寻眼角出血，挡住他。陆寻终于不再隐瞒疼痛。数周后经医修许可恢复训练；他按原课所学观察自己的浅层运行，发现第三息前回流尚未散尽，几次验证后闭眼完成完整吐纳和基础引气。","dialogue":[{"sp 。"}],"seconds":23}],"next":"m03.choice.keep.private"},{"id":"m03.choice.keep.private","type":"choice","act":3,"prompt":"晶核是两人共同发现的。周野同意两种方案，但要求保留自己的实际贡献。如何使用这份机缘？","choices":[{"id":"keep","text":"保留晶核，与周野共同使用；请秦晚协助稳定器具。","next":"m03.keep.keep.private"},{"id":"offer","text":"交回晶核，恢复废脉，争取正式修炼与器坊机会。","next":"m03.offer.keep.private"}]},{"id":"m03.keep.keep.private","type":"scene","act":3,"title":"我们自己的灵脉","setting":"试采区至山腰，数日后。","beats":[{"visual":"三人共同在获准低阶聚灵器中装入晶核，周野按器具规则完成安装，秦晚以标准火源检测稳定性，教习确认安全。晶核有限期供能，陆寻周野共同使用，不是无限灵气。","dialogue":[{"speaker":"陆寻","text":"以前我们只能等别人发灵石。"},{"speaker":"周野","text":"以后这一炉灵气，先归咱们俩。"},{"speaker":"秦晚","text":"还有我这个负责看火的，记得请饭。"}],"seconds":25},{"visual":"夜，陆寻和周野在同一座低阶聚灵器两侧坐下，灵气形成稳定细流。陆寻以已经学会的吐纳观察实际运行，数日后首次稳定完成多轮基础练习。周野也能使用普通修炼源，但不复制灵目。二人获得真实的修炼时间与资源优势；没有正式传习推荐。","dialogue":[],"seconds":22},{"visual":"陆寻将两块自己的灵石交济生院支付一份已核定的普通药散费用，其他旧药费另核；周野说以后自己也要有足够能力付得起药钱。苏禾收下正式凭据，看到陆寻这次是自己拿来的灵石，认真地看了他一眼。","dialogue":[{"speaker":"苏禾","text":"终于不用我追着问你药钱了？"},{"speaker":"陆寻","text":"这次我有。"},{"speaker":"苏禾","text":"那下次别受伤。"}],"seconds":15},{"visual":"试采成功的记录传回镇山堂，裴照雪只知道普通成果及封苑救援记录，不知道异常视野。陆寻在回程看到一名陌生修士询问废脉为何重新出晶；调查风险从公开成果产生。","dialogue":[],"seconds":15}],"next":"end.keep.private.keep"},{"id":"end.keep.private.keep","type":"end","title":"独掌聚灵·秘密自持","summary":"前三幕阶段结局：真实机缘已经取得，后续M04–M06尚未完成。","outcomes":{"immediate":"周野脱险，陆寻觉醒灵目；两人试采得30石，各15。陆寻保留旧候补证据，还周野1石，购新护臂5石。裴照雪未知异常视野。","short":"保留共同晶核，取得有限期私人修炼源，无特别传习推荐。 陆寻另支付2石药散，余7石。","mid":"M04–M05必须继承的事实（未写成正式场景）：私人晶核及有限供能、共同使用约定。裴照雪不知异常视觉，不可写共同秘密。","long":"M06尚未创作。最终身份、严承责任、三位女主与周野命运必须在全剧中明确回收；本阶段不冒充全剧结局。"}},{"id":"m03.offer.keep.private","type":"scene","act":3,"title":"让山门重新亮起来","setting":"试采区至山腰，数日后。","beats":[{"visual":"陆寻周野共同签署交回晶核，保留三十石不退。教习在宗门阵修监督下将晶核装回支渠既有位置，恢复原有低阶灵流；此后晶核属于宗门，不会再发回个人。","dialogue":[{"speaker":"陆寻","text":"我想让这条脉重新开。"},{"speaker":"周野","text":"那得把咱俩的名字记在最前面。"},{"speaker":"秦晚","text":"我作证。"}],"seconds":25},{"visual":"恢复后的试采坪重新亮起一排低阶导流石。负责教习正式确认贡献，宗门给予陆寻一次进入外门预备传习考核的特别机会，周野获器坊正式学徒考评受理；二人尚未晋升。陆寻亲眼看见此 eat+1):advance(n.next));}else if(n.type==="choice"){add(body,"h2","你的决定");add(body,"p",n.prompt);for(const x of n.choices)btn(x.text,()=>advance(x.next))}else{seen.add(id);el("progress").textContent="已发现阶段结果 "+seen.size+"/"+story.nodes.filter(n=>n.type==="end").length;add(body,"p",n.summary);const dl=add(body,"dl","");for(const [k,t] of [["immediate","当下"],["short","短期"],["mid","一个月后"],["long","一年后"]]){add(dl,"dt",t);add(dl,"dd",n.outcomes[k])}btn("从头体验另一条路线",reset)}}function reset(){id=story.start;beat=0;trail=[];render()}el("restart").onclick=reset;el("back").onclick=()=>{if(trail.length){const p=trail.pop();id=p.id;beat=p.beat;render()}};render();</script></html>
